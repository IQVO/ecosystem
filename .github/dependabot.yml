version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (repo_lint R6).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # No npm entry on purpose: @eventcatalog/core and @eventcatalog/linter are pinned to exact versions
  # (the offline license targets core 5.x); bump them deliberately, not by bot.
