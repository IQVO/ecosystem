operations:
  publishCustomerOrderingEvents:
    action: send
    title: Publish customer-ordering events
    summary: >-
      Publish CustomerOrderPlaced, CustomerOrderCancelled and
      ShopperNoticeDecided through the transactional outbox.
    description: >-
      The service sends the two events of the CustomerOrder aggregate and the
      decided notice facts of the notification policy (ADR 0017) to
      `retailnetwork.customer-ordering.events`. Consumers route on the full
      `type`.
    tags:
      - name: customer-ordering
    channel:
      address: retailnetwork.customer-ordering.events
      title: customer-ordering integration topic
      description: >-
        This service's integration topic. Written by the outbox relay; key =
        subject (the orderId). Every message carries the CloudEvents
        content-type header.
      messages:
        customer-ordering-CustomerOrderPlaced:
          name: CustomerOrderPlaced
          title: CustomerOrderPlaced
          summary: A customer order was placed (every group promised and confirmed).
          description: >-
            `type` =
            `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced`;
            subject and key = the orderId. Raised by PlaceOrder when the order
            is saved in state PLACED, in the same transaction as the outbox row.
            Consumed by order-sourcing (creates one assignment per group) and
            delivery-promise (a repeated confirm is a no-op, ADR 0003). Carries
            the destination postal prefix only: the ship-to address never leaves
            customer-ordering except through GET /orders/\{orderId\}/ship-to.
            Also carries the optional consolidationKey (ADR 0012): an opaque
            keyed hash of shopper and ship-to that lets order-sourcing merge the
            groups of one shopper and one address; an absent consolidationKey
            means the order never merges. Each group carries its REAL tier,
            which may be CONSOLIDATED (ADR 0013), with the optional
            chosenDeliveryDay and consolidationEligible of that choice.
          contentType: application/cloudevents+json
          tags:
            - name: customerorder
          payload:
            type: object
            required:
              - specversion
              - id
              - source
              - type
              - subject
              - time
              - datacontenttype
              - dataschema
              - data
            properties:
              specversion:
                type: string
                const: '1.0'
                x-parser-schema-id: <anonymous-schema-1>
              id:
                type: string
                description: >-
                  CloudEvents id (UUID); stable across relay retries. Consumers
                  dedupe on it (inbox).
                x-parser-schema-id: <anonymous-schema-2>
              source:
                type: string
                const: /retailnetwork/customer-ordering
                x-parser-schema-id: <anonymous-schema-3>
              type:
                type: string
                const: >-
                  com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
                x-parser-schema-id: <anonymous-schema-4>
              subject:
                type: string
                description: Aggregate root id; also the Kafka message key.
                x-parser-schema-id: <anonymous-schema-5>
              time:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-6>
              datacontenttype:
                type: string
                const: application/json
                x-parser-schema-id: <anonymous-schema-7>
              dataschema:
                type: string
                const: >-
                  urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
                x-parser-schema-id: <anonymous-schema-8>
              data:
                type: object
                required:
                  - orderId
                  - shopperId
                  - destinationPostalPrefix
                  - placedAt
                  - groups
                properties:
                  orderId:
                    type: string
                    x-parser-schema-id: <anonymous-schema-9>
                  shopperId:
                    type: string
                    x-parser-schema-id: <anonymous-schema-10>
                  pickupPointId:
                    type: string
                    description: >-
                      The pickup point of a pickup order (ADR 0016); omitted for
                      a ship-to order. The address never leaves
                      customer-ordering.
                    x-parser-schema-id: <anonymous-schema-11>
                  destinationPostalPrefix:
                    type: string
                    description: >-
                      Postal prefix only (first 3 characters of the normalised
                      ship-to postal code; the pickup point's own prefix for a
                      pickup order, ADR 0016); never the address.
                    x-parser-schema-id: <anonymous-schema-12>
                  placedAt:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-13>
                  consolidationKey:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                    description: >-
                      Opaque consolidation key (ADR 0012):
                      hex(HMAC-SHA-256(secret, "consolidation-key/v1" || 0x00 ||
                      shopperId || 0x00 || normalised ship-to)), 64 lower-case
                      hex characters. It links the orders of ONE shopper to ONE
                      address without carrying either and is not reversible
                      without the secret. Optional and additive on v1; omitted
                      when customer-ordering has no secret configured. An absent
                      key means the order never merges (never read it as an
                      empty key). A pickup order keys shopper and
                      "point:<pickupPointId>" instead - the same shape in a
                      separate key space, so a pickup order and an address order
                      never merge (ADR 0016).
