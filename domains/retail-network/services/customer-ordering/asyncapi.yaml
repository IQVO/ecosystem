asyncapi: 3.0.0
info:
  title: customer-ordering Domain Events
  version: 1.0.0
  contact:
    name: customer-ordering maintainers
    url: https://github.com/IQVO/customer-ordering
    email: customer-ordering@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: customer-ordering
      description: The customer-ordering bounded context (retail network, commerce tier).
    - name: customerorder
      description: Events raised by the CustomerOrder aggregate.
    - name: consumed
      description: >-
        Events produced by sibling contexts that this service consumes (ADR
        0003).
  description: >-
    Event catalog for the **customer-ordering** bounded context of the retail
    network (commerce tier): it turns a shopper's cart into a customer order,
    promising and confirming every shipment group at checkout (ADR 0001, ADR
    0002).


    **Published.** Two integration events, `CustomerOrderPlaced` and
    `CustomerOrderCancelled`, on `retailnetwork.customer-ordering.events`
    through a **transactional outbox** (the order row and its already-encoded
    events are written in ONE database transaction; an always-on relay drains
    them to Kafka, at-least-once, the CloudEvents `id` is stored with the outbox
    row). Both types are catalogued in ADR 0004. Nothing is published on
    `retailnetwork.customer-ordering.analytics`: the model names no
    analytics-only event for this context. No event carries the ship-to address
    (PII); `CustomerOrderPlaced` carries the destination postal prefix only.


    **Consumed.** Fifteen events from delivery-promise, order-sourcing and
    shipping-and-tracking (see the `receive` operations and ADR 0003). The
    messages list only the fields this service relies on; the producers' own
    AsyncAPI files are authoritative and unknown fields are ignored. Each
    consumer group name comes from a mandatory environment variable.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/customer-ordering`), `type`,
    `subject` (the orderId), `time`, `datacontenttype` (`application/json`) and
    `dataschema` (`urn:retailnetwork:customer-ordering:events:<EventName>:v1`)
    are all required. Kafka key = the subject. Type =
    `com.retailnetwork.commerce.customer-ordering.customerorder.<EventName>`. A
    breaking payload change is a new `.v2` type, never a mutation. Dispatch on
    the full `type`, ignore unknown types, dedupe on `id`.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; enums are
    UPPER_SNAKE; optional fields are omitted when absent (never null); arrays
    are always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  customerOrderingEvents:
    address: retailnetwork.customer-ordering.events
    title: customer-ordering integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject (the orderId). Every message carries the CloudEvents content-type
      header.
    messages:
      CustomerOrderPlaced:
        name: CustomerOrderPlaced
        title: CustomerOrderPlaced
        summary: A customer order was placed (every group promised and confirmed).
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced`;
          subject and key = the orderId. Raised by PlaceOrder when the order is
          saved in state PLACED, in the same transaction as the outbox row.
          Consumed by order-sourcing (creates one assignment per group) and
          delivery-promise (a repeated confirm is a no-op, ADR 0003). Carries
          the destination postal prefix only: the ship-to address never leaves
          customer-ordering except through GET /orders/\{orderId\}/ship-to.
        contentType: application/cloudevents+json
        tags:
          - name: customerorder
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-1>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-2>
            source:
              type: string
              const: /retailnetwork/customer-ordering
              x-parser-schema-id: <anonymous-schema-3>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
              x-parser-schema-id: <anonymous-schema-4>
            subject:
              type: string
              description: Aggregate root id; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-5>
            time:
              type: string
              format: date-time
              x-parser-schema-id: <anonymous-schema-6>
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-7>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
              x-parser-schema-id: <anonymous-schema-8>
            data:
              type: object
              required:
                - orderId
                - shopperId
                - destinationPostalPrefix
                - placedAt
                - groups
              properties:
                orderId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-9>
                shopperId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-10>
                destinationPostalPrefix:
                  type: string
                  description: >-
                    Postal prefix only (first 3 characters of the normalised
                    ship-to postal code); never the address.
                  x-parser-schema-id: <anonymous-schema-11>
                placedAt:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-12>
                groups:
                  type: array
                  items:
                    type: object
                    required:
                      - groupNo
                      - promiseId
                      - tier
                      - witnessNodeId
                      - shipBy
                      - deliverByEarliest
                      - deliverByLatest
                      - lines
                    properties:
                      groupNo:
                        type: integer
                        minimum: 1
                        x-parser-schema-id: <anonymous-schema-15>
                      promiseId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-16>
                      tier:
                        type: string
                        enum:
                          - SAME_DAY
                          - NEXT_DAY
                          - TWO_DAY
                          - STANDARD
                        x-parser-schema-id: <anonymous-schema-17>
                      witnessNodeId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-18>
                      shipBy:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-19>
                      deliverByEarliest:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-20>
                      deliverByLatest:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-21>
                      lines:
                        type: array
                        items:
                          type: object
                          required:
                            - lineNo
                            - catalogItemId
                            - quantity
                          properties:
                            lineNo:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-24>
                            catalogItemId:
                              type: string
                              x-parser-schema-id: <anonymous-schema-25>
                            quantity:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: <anonymous-schema-23>
                        x-parser-schema-id: <anonymous-schema-22>
                    x-parser-schema-id: <anonymous-schema-14>
                  minItems: 1
                  x-parser-schema-id: <anonymous-schema-13>
              x-parser-schema-id: CustomerOrderPlacedData
          x-parser-schema-id: CustomerOrderPlacedEvent
        examples:
          - name: customerOrderPlaced
            summary: A customer order was placed (every group promised and confirmed).
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
              source: /retailnetwork/customer-ordering
              type: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
              subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
              time: '2026-10-23T10:15:30Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
              data:
                orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
                shopperId: 3b0c1f0e-6f0a-4a39-8a55-2b7f0d8c9e11
                destinationPostalPrefix: '787'
                placedAt: '2026-10-23T10:15:30Z'
                groups:
                  - groupNo: 1
                    promiseId: p-1001
                    tier: NEXT_DAY
                    witnessNodeId: fc-aus-1
                    shipBy: '2026-10-23T22:00:00Z'
                    deliverByEarliest: '2026-10-24T13:00:00Z'
                    deliverByLatest: '2026-10-24T22:00:00Z'
                    lines:
                      - lineNo: 1
                        catalogItemId: sku-100
                        quantity: 2
        x-parser-unique-object-id: CustomerOrderPlaced
      CustomerOrderCancelled:
        name: CustomerOrderCancelled
        title: CustomerOrderCancelled
        summary: >-
          The cancellation of one or more groups of a customer order was
          requested.
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled`;
          subject and key = the orderId. Raised by CancelOrder (shopper) and by
          the CancelOnUnfulfillable policy (PromiseUnkeepable). It is a REQUEST
          (G12): order-sourcing decides and answers FulfillmentCancelled or
          FulfillmentCancelRefused, delivery-promise cancels the promises of the
          groupNos.
        contentType: application/cloudevents+json
        tags:
          - name: customerorder
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-27>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-28>
            source:
              type: string
              const: /retailnetwork/customer-ordering
              x-parser-schema-id: <anonymous-schema-29>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled
              x-parser-schema-id: <anonymous-schema-30>
            subject:
              type: string
              description: Aggregate root id; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-31>
            time:
              type: string
              format: date-time
              x-parser-schema-id: <anonymous-schema-32>
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-33>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderCancelled:v1
              x-parser-schema-id: <anonymous-schema-34>
            data:
              type: object
              required:
                - orderId
                - reason
                - cancelledAt
                - groupNos
              properties:
                orderId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-35>
                reason:
                  type: string
                  description: >-
                    Free text (shopper reason, or PROMISE_UNKEEPABLE: <reason>
                    for the CancelOnUnfulfillable policy).
                  x-parser-schema-id: <anonymous-schema-36>
                cancelledAt:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-37>
                groupNos:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    x-parser-schema-id: <anonymous-schema-39>
                  description: >-
                    Groups whose cancellation is requested; a subset of the
                    order's groups when others are locked.
                  x-parser-schema-id: <anonymous-schema-38>
              x-parser-schema-id: CustomerOrderCancelledData
          x-parser-schema-id: CustomerOrderCancelledEvent
        examples:
          - name: customerOrderCancelled
            summary: >-
              The cancellation of one or more groups of a customer order was
              requested.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
              source: /retailnetwork/customer-ordering
              type: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled
              subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
              time: '2026-10-23T10:15:30Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderCancelled:v1
              data:
                orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
                reason: changed my mind
                cancelledAt: '2026-10-23T10:20:00Z'
                groupNos:
                  - 1
        x-parser-unique-object-id: CustomerOrderCancelled
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: customerOrderingEvents
