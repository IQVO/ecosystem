        placedAt:
          type: string
          format: date-time
          x-parser-schema-id: <anonymous-schema-13>
        consolidationKey:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: >-
            Opaque consolidation key (ADR 0012): hex(HMAC-SHA-256(secret,
            "consolidation-key/v1" || 0x00 || shopperId || 0x00 || normalised
            ship-to)), 64 lower-case hex characters. It links the orders of ONE
