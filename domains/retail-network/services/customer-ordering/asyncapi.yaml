    summary: >-
      Consume FulfillmentLocked, FulfillmentShipped, FulfillmentUnsourceable,
      FulfillmentCancelled, FulfillmentCancelRefused from order-sourcing.
    description: >-
      customer-ordering consumes FulfillmentLocked, FulfillmentShipped,
      FulfillmentUnsourceable, FulfillmentCancelled, FulfillmentCancelRefused
      from `retailnetwork.order-sourcing.events`. See ADR 0003 for what each
      event does to the order and the OrderTrackingView read model.
    tags:
      - name: consumed
