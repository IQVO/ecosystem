                            the network at least one local day to merge the
                            order with others; it never asserts that another
                            order exists. Optional and additive on v1; an absent
                            value means unknown or not a CONSOLIDATED option,
                            never false.
                          x-parser-schema-id: <anonymous-schema-26>
                        lines:
                          type: array
                          items:
                            type: object
                            required:
                              - lineNo
                              - catalogItemId
                              - quantity
                            properties:
                              lineNo:
