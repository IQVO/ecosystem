  receiveDeliveryPromiseEvents:
    action: receive
    title: Receive delivery-promise events
    summary: >-
      Consume PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken,
      PromiseUnkeepable from delivery-promise.
    description: >-
      customer-ordering consumes PromiseAtRisk, PromiseRevised, PromiseKept,
      PromiseBroken, PromiseUnkeepable from
      `retailnetwork.delivery-promise.events`. See ADR 0003 for what each event
      does to the order and the OrderTrackingView read model.
    tags:
      - name: consumed
    channel:
      address: retailnetwork.delivery-promise.events
      title: delivery-promise integration topic (consumed)
      description: >-
        This service's integration topic. Written by the outbox relay; key =
        subject. Every message carries the CloudEvents content-type header.
        Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
      messages:
        PromiseAtRisk:
          name: PromiseAtRisk
          title: PromiseAtRisk (consumed)
          summary: A promise is at risk.
          description: >-
            `type` =
            `com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk`
            produced by delivery-promise on
            `retailnetwork.delivery-promise.events`. A promise is at risk.
            Dispatch on the full type; unknown fields are ignored.
          contentType: application/cloudevents+json
          tags:
            - name: consumed
          payload:
            type: object
            required:
              - id
              - type
              - data
            properties:
              specversion:
                type: string
                const: '1.0'
                x-parser-schema-id: <anonymous-schema-40>
              id:
                type: string
