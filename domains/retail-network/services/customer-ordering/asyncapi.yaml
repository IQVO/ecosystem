                type: string
                x-parser-schema-id: <anonymous-schema-18>
              tier:
                type: string
                enum:
                  - SAME_DAY
                  - NEXT_DAY
                  - TWO_DAY
                  - STANDARD
                  - CONSOLIDATED
                description: >-
                  The REAL tier of the promise, never mapped. CONSOLIDATED (ADR
                  0013) is the opt-in later delivery day the network may merge;
                  a consumer must accept it before any shopper can choose it.
                x-parser-schema-id: <anonymous-schema-19>
              witnessNodeId:
                type: string
                x-parser-schema-id: <anonymous-schema-20>
              shipBy:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-21>
              deliverByEarliest:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-22>
              deliverByLatest:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-23>
              timeZone:
