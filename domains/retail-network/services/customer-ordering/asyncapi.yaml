    title: Publish customer-ordering events
    summary: >-
      Publish CustomerOrderPlaced and CustomerOrderCancelled through the
      transactional outbox.
    description: >-
      The service sends the two events of the CustomerOrder aggregate to
      `retailnetwork.customer-ordering.events`. Consumers route on the full
      `type`.
    tags:
      - name: customer-ordering
    channel:
      address: retailnetwork.customer-ordering.events
      title: customer-ordering integration topic
      description: >-
        This service's integration topic. Written by the outbox relay; key =
        subject (the orderId). Every message carries the CloudEvents
        content-type header.
      messages:
        CustomerOrderPlaced:
          name: CustomerOrderPlaced
          title: CustomerOrderPlaced
          summary: A customer order was placed (every group promised and confirmed).
          description: >-
            `type` =
            `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced`;
            subject and key = the orderId. Raised by PlaceOrder when the order
            is saved in state PLACED, in the same transaction as the outbox row.
            Consumed by order-sourcing (creates one assignment per group) and
            delivery-promise (a repeated confirm is a no-op, ADR 0003). Carries
            the destination postal prefix only: the ship-to address never leaves
            customer-ordering except through GET /orders/\{orderId\}/ship-to.
          contentType: application/cloudevents+json
          tags:
            - name: customerorder
          payload:
            type: object
            required:
              - specversion
              - id
              - source
              - type
              - subject
              - time
              - datacontenttype
              - dataschema
              - data
            properties:
              specversion:
                type: string
                const: '1.0'
                x-parser-schema-id: <anonymous-schema-1>
              id:
                type: string
                description: >-
                  CloudEvents id (UUID); stable across relay retries. Consumers
                  dedupe on it (inbox).
                x-parser-schema-id: <anonymous-schema-2>
              source:
                type: string
                const: /retailnetwork/customer-ordering
                x-parser-schema-id: <anonymous-schema-3>
              type:
                type: string
                const: >-
                  com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
                x-parser-schema-id: <anonymous-schema-4>
              subject:
                type: string
                description: Aggregate root id; also the Kafka message key.
                x-parser-schema-id: <anonymous-schema-5>
              time:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-6>
              datacontenttype:
                type: string
                const: application/json
                x-parser-schema-id: <anonymous-schema-7>
              dataschema:
                type: string
                const: >-
                  urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
                x-parser-schema-id: <anonymous-schema-8>
              data:
                type: object
                required:
                  - orderId
                  - shopperId
                  - destinationPostalPrefix
                  - placedAt
                  - groups
                properties:
                  orderId:
                    type: string
                    x-parser-schema-id: <anonymous-schema-9>
                  shopperId:
                    type: string
                    x-parser-schema-id: <anonymous-schema-10>
                  destinationPostalPrefix:
                    type: string
                    description: >-
                      Postal prefix only (first 3 characters of the normalised
                      ship-to postal code); never the address.
                    x-parser-schema-id: <anonymous-schema-11>
                  placedAt:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-12>
                  groups:
                    type: array
                    items:
                      type: object
                      required:
                        - groupNo
                        - promiseId
                        - tier
                        - witnessNodeId
                        - shipBy
                        - deliverByEarliest
                        - deliverByLatest
                        - lines
                      properties:
                        groupNo:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-15>
                        promiseId:
                          type: string
                          x-parser-schema-id: <anonymous-schema-16>
                        tier:
                          type: string
                          enum:
                            - SAME_DAY
                            - NEXT_DAY
                            - TWO_DAY
                            - STANDARD
                          x-parser-schema-id: <anonymous-schema-17>
                        witnessNodeId:
                          type: string
                          x-parser-schema-id: <anonymous-schema-18>
                        shipBy:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-19>
                        deliverByEarliest:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-20>
                        deliverByLatest:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-21>
                        lines:
                          type: array
                          items:
                            type: object
                            required:
                              - lineNo
                              - catalogItemId
                              - quantity
                            properties:
                              lineNo:
                                type: integer
                                minimum: 1
                                x-parser-schema-id: <anonymous-schema-24>
                              catalogItemId:
