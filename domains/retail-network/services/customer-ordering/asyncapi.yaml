                x-parser-schema-id: <anonymous-schema-42>
              type:
                type: string
                const: >-
                  com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk
                x-parser-schema-id: <anonymous-schema-43>
              subject:
                type: string
                description: Aggregate root id; also the Kafka message key.
                x-parser-schema-id: <anonymous-schema-44>
              time:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-45>
              datacontenttype:
                type: string
                const: application/json
                x-parser-schema-id: <anonymous-schema-46>
              dataschema:
                type: string
                x-parser-schema-id: <anonymous-schema-47>
              data:
                type: object
                description: >-
                  Only the fields customer-ordering relies on; unknown fields
                  are ignored (tolerant reader).
                required:
                  - promiseId
                  - orderId
                properties:
                  promiseId:
                    type: string
                    x-parser-schema-id: <anonymous-schema-48>
                  orderId:
                    type: string
                    x-parser-schema-id: <anonymous-schema-49>
                  reason:
                    type: string
                    x-parser-schema-id: <anonymous-schema-50>
