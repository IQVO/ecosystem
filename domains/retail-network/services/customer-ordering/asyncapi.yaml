asyncapi: 3.0.0
info:
  title: customer-ordering Domain Events
  version: 1.0.0
  contact:
    name: customer-ordering maintainers
    url: https://github.com/IQVO/customer-ordering
    email: customer-ordering@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: customer-ordering
      description: The customer-ordering bounded context (retail network, commerce tier).
    - name: customerorder
      description: Events raised by the CustomerOrder aggregate.
    - name: consumed
      description: >-
        Events produced by sibling contexts that this service consumes (ADR
        0003).
  description: >-
    Event catalog for the **customer-ordering** bounded context of the retail
    network (commerce tier): it turns a shopper's cart into a customer order,
    promising and confirming every shipment group at checkout (ADR 0001, ADR
    0002).


    **Published.** Two integration events, `CustomerOrderPlaced` and
    `CustomerOrderCancelled`, on `retailnetwork.customer-ordering.events`
    through a **transactional outbox** (the order row and its already-encoded
    events are written in ONE database transaction; an always-on relay drains
    them to Kafka, at-least-once, the CloudEvents `id` is stored with the outbox
    row). Both types are catalogued in ADR 0004. Nothing is published on
    `retailnetwork.customer-ordering.analytics`: the model names no
    analytics-only event for this context. No event carries the ship-to address
    (PII); `CustomerOrderPlaced` carries the destination postal prefix only,
    plus the optional `pickupPointId` of a pickup order (ADR 0016).


    **Consumed.** Twenty-one events from delivery-promise, order-sourcing and
    shipping-and-tracking (see the `receive` operations and ADR 0003). The
    messages describe the producers' payloads for reference; the code decodes
    only the fields it stores (every `required` field below is checked
    non-empty, and a `groupNo` below 1 is refused) and ignores the rest, so the
    producers' own AsyncAPI files are authoritative. Each consumer group name
    comes from a mandatory environment variable.


    **Own events, read back for analytics (ADR 0018).** The analytics projector
    (`cmd/co-projector`) reads this context's OWN integration topic in the fixed
    group `customer-ordering-analytics` and projects CustomerOrderPlaced,
    CustomerOrderCancelled and ShopperNoticeDecided into a separate analytical
    database (ids, codes, counts and instants only: no address, no postal
    prefix, no shopper, no consolidation key, no cancellation reason). It
    dedupes on the CloudEvents `id` in the same transaction as the projection,
    dead-letters only deterministic poison to
    `retailnetwork.customer-ordering.analytics.dlq` and retries transient
    failures without a bound. It reads no sibling's topic and publishes nothing.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/customer-ordering`), `type`,
    `subject` (the orderId), `time`, `datacontenttype` (`application/json`) and
    `dataschema` (`urn:retailnetwork:customer-ordering:events:<EventName>:v1`)
    are all required. Kafka key = the subject. Type =
    `com.retailnetwork.commerce.customer-ordering.customerorder.<EventName>`. A
    breaking payload change is a new `.v2` type, never a mutation. Dispatch on
    the full `type`, ignore unknown types, dedupe on `id`.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; enums are
    UPPER_SNAKE; optional fields are omitted when absent (never null); arrays
    are always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  customerOrderingEvents:
    address: retailnetwork.customer-ordering.events
    title: customer-ordering integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject (the orderId). Every message carries the CloudEvents content-type
      header.
    messages:
      customer-ordering-CustomerOrderPlaced:
        name: CustomerOrderPlaced
        title: CustomerOrderPlaced
        summary: A customer order was placed (every group promised and confirmed).
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced`;
          subject and key = the orderId. Raised by PlaceOrder when the order is
          saved in state PLACED, in the same transaction as the outbox row.
          Consumed by order-sourcing (creates one assignment per group) and
          delivery-promise (a repeated confirm is a no-op, ADR 0003). Carries
          the destination postal prefix only: the ship-to address never leaves
          customer-ordering except through GET /orders/\{orderId\}/ship-to. Also
          carries the optional consolidationKey (ADR 0012): an opaque keyed hash
          of shopper and ship-to that lets order-sourcing merge the groups of
          one shopper and one address; an absent consolidationKey means the
          order never merges. Each group carries its REAL tier, which may be
          CONSOLIDATED (ADR 0013), with the optional chosenDeliveryDay and
          consolidationEligible of that choice.
        contentType: application/cloudevents+json
        tags:
          - name: customerorder
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-1>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-2>
            source:
              type: string
              const: /retailnetwork/customer-ordering
              x-parser-schema-id: <anonymous-schema-3>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
              x-parser-schema-id: <anonymous-schema-4>
            subject:
              type: string
              description: Aggregate root id; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-5>
            time:
              type: string
              format: date-time
              x-parser-schema-id: <anonymous-schema-6>
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-7>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
              x-parser-schema-id: <anonymous-schema-8>
            data:
              type: object
              required:
                - orderId
                - shopperId
                - destinationPostalPrefix
                - placedAt
                - groups
              properties:
                orderId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-9>
                shopperId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-10>
                pickupPointId:
                  type: string
                  description: >-
                    The pickup point of a pickup order (ADR 0016); omitted for a
                    ship-to order. The address never leaves customer-ordering.
                  x-parser-schema-id: <anonymous-schema-11>
                destinationPostalPrefix:
                  type: string
                  description: >-
                    Postal prefix only (first 3 characters of the normalised
                    ship-to postal code; the pickup point's own prefix for a
                    pickup order, ADR 0016); never the address.
                  x-parser-schema-id: <anonymous-schema-12>
                placedAt:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-13>
                consolidationKey:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  description: >-
                    Opaque consolidation key (ADR 0012):
                    hex(HMAC-SHA-256(secret, "consolidation-key/v1" || 0x00 ||
                    shopperId || 0x00 || normalised ship-to)), 64 lower-case hex
                    characters. It links the orders of ONE shopper to ONE
                    address without carrying either and is not reversible
                    without the secret. Optional and additive on v1; omitted
                    when customer-ordering has no secret configured. An absent
                    key means the order never merges (never read it as an empty
                    key). A pickup order keys shopper and
                    "point:<pickupPointId>" instead - the same shape in a
                    separate key space, so a pickup order and an address order
                    never merge (ADR 0016).
                  x-parser-schema-id: <anonymous-schema-14>
                groups:
                  type: array
                  items:
                    type: object
                    required:
                      - groupNo
                      - promiseId
                      - tier
                      - witnessNodeId
                      - shipBy
                      - deliverByEarliest
                      - deliverByLatest
                      - lines
                    properties:
                      groupNo:
                        type: integer
                        minimum: 1
                        x-parser-schema-id: <anonymous-schema-17>
                      promiseId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-18>
                      tier:
                        type: string
                        enum:
                          - SAME_DAY
                          - NEXT_DAY
                          - TWO_DAY
                          - STANDARD
                          - CONSOLIDATED
                        description: >-
                          The REAL tier of the promise, never mapped.
                          CONSOLIDATED (ADR 0013) is the opt-in later delivery
                          day the network may merge; a consumer must accept it
                          before any shopper can choose it.
                        x-parser-schema-id: <anonymous-schema-19>
                      witnessNodeId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-20>
                      shipBy:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-21>
                      deliverByEarliest:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-22>
                      deliverByLatest:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-23>
                      timeZone:
                        type: string
                        maxLength: 64
                        description: >-
                          IANA time zone of the destination (e.g.
                          America/Chicago), the local calendar
                          deliverByEarliest/deliverByLatest belong to, copied
                          from the promise. Optional and additive on v1 (ADR
                          0009); omitted when unknown (a promise
                          delivery-promise stored before it carried the zone),
                          in which case read the window in UTC.
                        x-parser-schema-id: <anonymous-schema-24>
                      chosenDeliveryDay:
                        type: string
                        format: date
                        description: >-
                          Only on a CONSOLIDATED group (ADR 0013): the local
                          calendar date (YYYY-MM-DD) of deliverByLatest in
                          timeZone that the shopper chose at placement. Optional
                          and additive on v1; omitted for every other tier and
                          when the zone is unknown.
                        x-parser-schema-id: <anonymous-schema-25>
                      consolidationEligible:
                        type: boolean
                        description: >-
                          Only on a CONSOLIDATED group (ADR 0013):
                          delivery-promise's answer whether the option leaves
                          the network at least one local day to merge the order
                          with others; it never asserts that another order
                          exists. Optional and additive on v1; an absent value
                          means unknown or not a CONSOLIDATED option, never
                          false.
                        x-parser-schema-id: <anonymous-schema-26>
                      lines:
                        type: array
                        items:
                          type: object
                          required:
                            - lineNo
                            - catalogItemId
                            - quantity
                          properties:
                            lineNo:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-29>
                            catalogItemId:
                              type: string
                              x-parser-schema-id: <anonymous-schema-30>
                            quantity:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-31>
                          x-parser-schema-id: <anonymous-schema-28>
                        x-parser-schema-id: <anonymous-schema-27>
                    x-parser-schema-id: <anonymous-schema-16>
                  minItems: 1
                  x-parser-schema-id: <anonymous-schema-15>
              x-parser-schema-id: CustomerOrderPlacedData
          x-parser-schema-id: CustomerOrderPlacedEvent
        examples:
          - name: customerOrderPlaced
            summary: A customer order was placed (every group promised and confirmed).
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
              source: /retailnetwork/customer-ordering
              type: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
              subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
              time: '2026-10-23T10:15:30Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
              data:
                orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
                shopperId: 3b0c1f0e-6f0a-4a39-8a55-2b7f0d8c9e11
                destinationPostalPrefix: '787'
                placedAt: '2026-10-23T10:15:30Z'
                consolidationKey: >-
                  9f2c6d0b1a7e4c3d8b5a0e6f1d2c3b4a5968778695a4b3c2d1e0f9a8b7c6d5e4
                groups:
                  - groupNo: 1
                    promiseId: p-1001
                    tier: NEXT_DAY
                    witnessNodeId: fc-aus-1
                    shipBy: '2026-10-23T22:00:00Z'
                    deliverByEarliest: '2026-10-24T13:00:00Z'
                    deliverByLatest: '2026-10-24T22:00:00Z'
                    timeZone: America/Chicago
                    lines:
                      - lineNo: 1
                        catalogItemId: sku-100
                        quantity: 2
        x-parser-unique-object-id: customer-ordering-CustomerOrderPlaced
      customer-ordering-CustomerOrderCancelled:
        name: CustomerOrderCancelled
        title: CustomerOrderCancelled
        summary: >-
          The cancellation of one or more groups of a customer order was
          requested.
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled`;
          subject and key = the orderId. Raised by CancelOrder (shopper) and by
          the CancelOnUnfulfillable policy (PromiseUnkeepable). It is a REQUEST
          (G12): order-sourcing decides and answers FulfillmentCancelled or
          FulfillmentCancelRefused, delivery-promise cancels the promises of the
          groupNos.
        contentType: application/cloudevents+json
        tags:
          - name: customerorder
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-32>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-33>
            source:
              type: string
              const: /retailnetwork/customer-ordering
              x-parser-schema-id: <anonymous-schema-34>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled
              x-parser-schema-id: <anonymous-schema-35>
            subject:
              type: string
              description: Aggregate root id; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-36>
            time:
              type: string
              format: date-time
              x-parser-schema-id: <anonymous-schema-37>
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-38>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderCancelled:v1
              x-parser-schema-id: <anonymous-schema-39>
            data:
              type: object
              required:
                - orderId
                - reason
                - cancelledAt
                - groupNos
              properties:
                orderId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-40>
                reason:
                  type: string
                  description: >-
                    Free text (shopper reason, or PROMISE_UNKEEPABLE: <reason>
                    for the CancelOnUnfulfillable policy).
                  x-parser-schema-id: <anonymous-schema-41>
                cancelledAt:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-42>
                groupNos:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    x-parser-schema-id: <anonymous-schema-44>
                  description: >-
                    Groups whose cancellation is requested; a subset of the
                    order's groups when others are locked.
                  x-parser-schema-id: <anonymous-schema-43>
              x-parser-schema-id: CustomerOrderCancelledData
          x-parser-schema-id: CustomerOrderCancelledEvent
        examples:
          - name: customerOrderCancelled
            summary: >-
              The cancellation of one or more groups of a customer order was
              requested.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
              source: /retailnetwork/customer-ordering
              type: >-
                com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled
              subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
              time: '2026-10-23T10:15:30Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:customer-ordering:events:CustomerOrderCancelled:v1
              data:
                orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
                reason: changed my mind
                cancelledAt: '2026-10-23T10:20:00Z'
                groupNos:
                  - 1
        x-parser-unique-object-id: customer-ordering-CustomerOrderCancelled
      customer-ordering-ShopperNoticeDecided:
        name: ShopperNoticeDecided
        title: ShopperNoticeDecided
        summary: >-
          The notification policy decided a notice for one family occurrence
          (ADR 0017).
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-ordering.order.ShopperNoticeDecided`
          (the `order` entity, the shopper-facing view); subject and key = the
          orderId. Raised from the consumer use cases that already record the
          fact (promise revision, ETA window, delivery-point flag, the group
          status transitions), in the same transaction, one per family
          occurrence REGARDLESS of the notifier: `notifier` is the instruction
          to the marketplace side (MARKETPLACE: the storefront delivers; SELLER:
          deferred, no seller consumer exists; NOBODY: drop the notice). The
          notice itself is delivered outside the network; no context in the
          network consumes the event today. Consumers dedupe on `noticeKey` =
          sha256(orderId|groupNo|family|factDigest): a re-assigned window is a
          new fact, a replay is not.
        contentType: application/cloudevents+json
        tags:
          - name: order
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-45>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-46>
            source:
              type: string
              const: /retailnetwork/customer-ordering
              x-parser-schema-id: <anonymous-schema-47>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.customer-ordering.order.ShopperNoticeDecided
              x-parser-schema-id: <anonymous-schema-48>
            subject:
              type: string
              description: Aggregate root id; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-49>
            time:
              type: string
              format: date-time
              x-parser-schema-id: <anonymous-schema-50>
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-51>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:customer-ordering:events:ShopperNoticeDecided:v1
              x-parser-schema-id: <anonymous-schema-52>
            data:
              type: object
              description: The decided notice fact of one family occurrence (ADR 0017).
              required:
                - orderId
                - groupNo
                - family
                - notifier
                - policyVersion
                - noticeKey
                - decidedAt
                - fact
              properties:
                orderId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-53>
                groupNo:
                  type: integer
                  minimum: 1
                  x-parser-schema-id: <anonymous-schema-54>
                family:
                  type: string
                  enum:
                    - DELAY_EXPECTED
                    - ETA_WINDOW_ASSIGNED
                    - DELIVERY_POINT_ADVISORY
                    - GROUP_SHIPPED
                    - GROUP_DELIVERED
                    - GROUP_LOST
                    - GROUP_RETURNED
                  x-parser-schema-id: <anonymous-schema-55>
                notifier:
                  type: string
                  enum:
                    - MARKETPLACE
                    - SELLER
                    - NOBODY
                  description: >-
                    The policy's instruction to the marketplace side; NOBODY
                    means drop the notice (the fact still flows).
                  x-parser-schema-id: <anonymous-schema-56>
                policyVersion:
                  type: integer
                  minimum: 0
                  description: >-
                    The version of the policy that decided; 0 is the built-in
                    default (every family NOBODY).
                  x-parser-schema-id: <anonymous-schema-57>
                noticeKey:
                  type: string
                  description: >-
                    sha256(orderId|groupNo|family|factDigest), the consumer
                    dedupe key.
                  x-parser-schema-id: <anonymous-schema-58>
                decidedAt:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-59>
                fact:
                  type: object
                  description: >-
                    Only the codes of the family, already public on the
                    customer-ordering, delivery-promise and
                    shipping-and-tracking events (ADR 0017): every field is
                    optional and omitted when the family does not carry it.
                  properties:
                    deliverByLatest:
                      type: string
                      format: date-time
                      description: 'DELAY_EXPECTED: the revised deliverByLatest.'
                      x-parser-schema-id: <anonymous-schema-60>
                    etaStart:
                      type: string
                      format: date-time
                      description: 'ETA_WINDOW_ASSIGNED: the window start.'
                      x-parser-schema-id: <anonymous-schema-61>
                    etaEnd:
                      type: string
                      format: date-time
                      description: 'ETA_WINDOW_ASSIGNED: the window end.'
                      x-parser-schema-id: <anonymous-schema-62>
                    reason:
                      type: string
                      description: 'DELIVERY_POINT_ADVISORY: the flag reason.'
                      x-parser-schema-id: <anonymous-schema-63>
                    status:
                      type: string
                      description: 'The terminal families: the group status.'
                      x-parser-schema-id: <anonymous-schema-64>
                  x-parser-schema-id: ShopperNoticeFact
              x-parser-schema-id: ShopperNoticeDecidedData
          x-parser-schema-id: ShopperNoticeDecidedEvent
        examples:
          - name: shopperNoticeDecided
            summary: The day-of ETA window was assigned to the package of group 2.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
              source: /retailnetwork/customer-ordering
              type: >-
                com.retailnetwork.commerce.customer-ordering.order.ShopperNoticeDecided
              subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
              time: '2026-10-23T12:15:30Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:customer-ordering:events:ShopperNoticeDecided:v1
              data:
                orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
                groupNo: 2
                family: ETA_WINDOW_ASSIGNED
                notifier: NOBODY
                policyVersion: 0
                noticeKey: >-
                  e17a743b013e6726bd9b0dcb238ce8a8909bc9e18237878d103b54b7edba7e76
                decidedAt: '2026-10-23T12:15:30Z'
                fact:
                  etaStart: '2026-10-24T16:15:30Z'
                  etaEnd: '2026-10-24T17:15:30Z'
        x-parser-unique-object-id: customer-ordering-ShopperNoticeDecided
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: customerOrderingEvents
  deliveryPromiseEvents:
    address: retailnetwork.delivery-promise.events
    title: delivery-promise integration topic (consumed)
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject. Every message carries the CloudEvents content-type header.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      delivery-promise-PromiseAtRisk:
        name: PromiseAtRisk
        title: PromiseAtRisk (consumed)
        summary: A promise is at risk.
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk`
