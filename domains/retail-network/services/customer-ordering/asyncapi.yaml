      summary: >-
        The notification policy decided a notice for one family occurrence (ADR
        0017).
      description: >-
        `type` =
        `com.retailnetwork.commerce.customer-ordering.order.ShopperNoticeDecided`
        (the `order` entity, the shopper-facing view); subject and key = the
        orderId. Raised from the consumer use cases that already record the fact
        (promise revision, ETA window, delivery-point flag, the group status
        transitions), in the same transaction, one per family occurrence
        REGARDLESS of the notifier: `notifier` is the instruction to the
        marketplace side (MARKETPLACE: the storefront delivers; SELLER:
        deferred, no seller consumer exists; NOBODY: drop the notice). The
        notice itself is delivered outside the network; no context in the
        network consumes the event today. Consumers dedupe on `noticeKey` =
        sha256(orderId|groupNo|family|factDigest): a re-assigned window is a new
        fact, a replay is not.
