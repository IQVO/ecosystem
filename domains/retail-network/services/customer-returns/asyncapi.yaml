          description: >-
            `type` =
            `com.retailnetwork.logistics.node-topology.node.NodeRegistered`; the
            ONE node fact that carries the node's descriptive attributes.
            Consumed into the ReturnsNetworkView: a node never seen starts
            PENDING, a node already held keeps its lifecycle (a registration
            applied again never demotes an ACTIVE, SUSPENDED or RETIRED node).
            The node type is stored as published; only RETURNS_CENTER nodes ever
            influence a disposition.
          contentType: application/cloudevents+json
          tags:
            - name: customer-returns
