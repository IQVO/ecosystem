asyncapi: 3.0.0
info:
  title: customer-returns Domain Events
  version: 1.0.0
  contact:
    name: customer-returns maintainers
    url: https://github.com/IQVO/customer-returns
    email: customer-returns@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: customer-returns
      description: The customer-returns bounded context (retail network, commerce tier).
    - name: returnauthorization
      description: Events raised by the ReturnAuthorization aggregate.
  description: >
    Event catalog for the **customer-returns** bounded context of the retail
    network (commerce tier): the shopper-facing returns front door of the
    network.

    The REST contract is `apis/openapi.yaml`.


    **Published.** Four types, all on `retailnetwork.customer-returns.events`:
    `ReturnAuthorized` (raised for every disposition, KEEP included),
    `ReturnLabelIssued`

    (once per linked reverse label), `ReturnCompleted` (the graded outcome, the
    fact offer-availability consumes to raise availability) and
    `ReturnCancelled`

    (the shopper's cancellation or the lazy expiry). Every event leaves through
    a **transactional outbox**: the aggregate row and the already-encoded events
    are

    written in ONE database transaction and an always-on relay drains them to
    Kafka (at-least-once; the CloudEvents `id` is minted with the outbox row, so
    a

    retry republishes the same `id`).


    **Consumed.** Ten types from four producers (ADR 0003): customer-ordering
    `CustomerOrderPlaced` and the terminal `ShopperNoticeDecided` families
    (local

    OrderGroupView; only a SHIPPED or DELIVERED group is authorizable);
    node-topology `NodeRegistered`, `NodeActivated`, `NodeSuspended`,
    `NodeRetired` and

    `ServiceAreaAssigned` (local ReturnsNetworkView, the node and prefix
    halves); order-sourcing `FulfillmentReleasedToNode` (the per-item owners)
    and

    `FulfillmentLocked` (the fulfilling node, the origin half);
    vendor-connectivity `VendorReturnOutcomeSubmitted` (the returns centre's
    graded outcome). Each is

    deduplicated on the CloudEvents `id` in the `processed_events` inbox table
    and dispatched on the full `type`; a message that is not a valid CloudEvents
    1.0

    envelope is skipped with a WARN and a type this context does not act on is
    ignored (both are committed past). `data` is decoded tolerantly (unknown
    fields are

    ignored). Offsets are committed only after the handler succeeded; a
    transient failure retries the same message with capped exponential backoff,
    and a payload

    that can never be applied or an exhausted retry budget is dead-lettered to
    `<topic>.dlq` with the headers `x-dlq-source-topic`,
    `x-dlq-source-partition`,

    `x-dlq-source-offset`, `x-dlq-error` and `x-dlq-failed-at`. The consumed
    `data` below lists only the fields this context relies on. The ONE
    synchronous call

    is the shipping context's reverse-label route (ADR 0005); no other neighbour
    is called.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type` set to `application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/retailnetwork/customer-returns`), `type`,
    `subject` (the aggregate root id, the `authorizationId`), `time`,

    `datacontenttype` (`application/json`) and `dataschema`
    (`urn:retailnetwork:customer-returns:events:<EventName>:v<version>`) are all
    required. Kafka key =

    the subject, so one authorization's events stay ordered on one partition.
    Type =
    `com.retailnetwork.commerce.customer-returns.returnauthorization.<EventName>`.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC;
    quantities are ALWAYS eaches; optional fields are omitted when absent (never
    null);

    arrays are always present. No published event carries a unit price, an
    address, a person's name, a phone number or free text (the PII rule);
    `reason` is an

    enum. Lines beyond the authorization are never published on
    `ReturnCompleted` (they stay on the local outcome facts, flagged
    unexpected).
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  customerReturnsEvents:
    address: retailnetwork.customer-returns.events
    title: customer-returns integration topic
    description: >-
      This service's integration topic, written by the outbox relay; key =
      subject. Carries the four ReturnAuthorization events other contexts
      consume (vendor-connectivity's return advices, offer-availability's
      restock). Every message carries the CloudEvents content-type header.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      ReturnAuthorized:
        name: ReturnAuthorized
        title: A return was authorized
        summary: A return was authorized, KEEP included.
        x-no-consumer-reason: >-
          No consumer yet, by design - the authorization is a shopper-facing
          fact; the network's return flows (receipt, restock) begin from the
          outcome facts, never from the grant.
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnAuthorized`;
          subject and key = the `authorizationId`; raised by POST
          /return-authorizations for every disposition. `destinationNodeId` is
          omitted for KEEP (no destination); the pickup window is present only
          for PICKUP; no line carries a unit price (the price is the
          storefront's fact and never leaves the context). vendor-connectivity
          consumes it into its return advices.
        contentType: application/cloudevents+json
        tags:
          - name: returnauthorization
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (this context publishes the
                    authorizationId; consumed events carry the producer's own
                    root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - authorizationId
                    - orderId
                    - groupNo
                    - reason
                    - disposition
                    - method
                    - lines
                    - expiresAt
                    - authorizedAt
                  properties:
                    authorizationId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    groupNo:
                      type: integer
                      x-parser-schema-id: <anonymous-schema-13>
                    reason:
                      type: string
                      enum:
                        - DEFECTIVE
                        - NOT_AS_DESCRIBED
                        - WRONG_ITEM
                        - NOT_NEEDED
                        - OTHER
                      description: >-
                        The enum reason code; free text is never accepted (the
                        PII rule).
                      x-parser-schema-id: Reason
                    disposition:
                      type: string
                      enum:
                        - KEEP
                        - NEAREST_RETURNS_CENTER
                        - ORIGIN_NODE
                      x-parser-schema-id: <anonymous-schema-14>
                    method:
                      type: string
                      enum:
                        - DROP_OFF
                        - PICKUP
                      x-parser-schema-id: <anonymous-schema-15>
                    lines:
                      type: array
                      items:
                        type: object
                        required:
                          - lineNo
                          - catalogItemId
                          - quantity
                        properties:
                          lineNo:
                            type: integer
                            x-parser-schema-id: <anonymous-schema-18>
                          catalogItemId:
                            type: string
                            x-parser-schema-id: <anonymous-schema-19>
                          quantity:
                            type: integer
                            x-parser-schema-id: <anonymous-schema-20>
                          ownerRef:
                            type: string
                            description: >-
                              Optional; whose stock the line took, when the
                              sourcing release named it.
                            x-parser-schema-id: <anonymous-schema-21>
                        x-parser-schema-id: <anonymous-schema-17>
                      x-parser-schema-id: <anonymous-schema-16>
                    destinationNodeId:
                      type: string
                      description: Optional; omitted for KEEP and when no node is known.
                      x-parser-schema-id: <anonymous-schema-22>
                    originNodeId:
                      type: string
                      description: Optional; the node that fulfilled the group, when known.
                      x-parser-schema-id: <anonymous-schema-23>
                    pickupWindowStart:
                      type: string
                      format: date-time
                      description: Optional; present only for PICKUP.
                      x-parser-schema-id: <anonymous-schema-24>
                    pickupWindowEnd:
                      type: string
                      format: date-time
                      description: Optional; present only for PICKUP.
                      x-parser-schema-id: <anonymous-schema-25>
                    expiresAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-26>
                    authorizedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-27>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: ReturnAuthorizedEvent
        examples:
          - name: returnAuthorized
            summary: A defective return to the nearest returns centre.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1d01
              source: /retailnetwork/customer-returns
              type: >-
                com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnAuthorized
              subject: ret-0f3a91e2
              time: '2026-11-14T10:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:customer-returns:events:ReturnAuthorized:v1
              data:
                authorizationId: ret-0f3a91e2
                orderId: ord-51a0c9
                groupNo: 2
                reason: DEFECTIVE
                disposition: NEAREST_RETURNS_CENTER
                method: DROP_OFF
                lines:
                  - lineNo: 1
                    catalogItemId: sku-100
                    quantity: 2
                    ownerRef: sel-42
                  - lineNo: 2
                    catalogItemId: sku-200
                    quantity: 1
                destinationNodeId: node-rc-1
                originNodeId: node-fc-1
                expiresAt: '2026-12-14T10:00:00Z'
                authorizedAt: '2026-11-14T10:00:00Z'
        x-parser-unique-object-id: ReturnAuthorized
      ReturnLabelIssued:
        name: ReturnLabelIssued
        title: A reverse label was issued and linked
        summary: >-
          The shipping context issued the shopper's reverse label; it is linked
          here.
        x-no-consumer-reason: >-
          No consumer yet, by design - the label is read by the shopper through
          the storefront; the package's physical journey is
          shipping-and-tracking's own scans, never this fact.
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnLabelIssued`;
          subject and key = the `authorizationId`; raised once per package by
          POST /return-authorizations/\{id\}/labels after the shipping context
          answered. vendor-connectivity consumes it (the advice carries the
          tracking numbers).
        contentType: application/cloudevents+json
        tags:
          - name: returnauthorization
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (this context publishes the
                    authorizationId; consumed events carry the producer's own
                    root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - authorizationId
                    - trackingNumber
                    - destinationNodeId
                    - issuedAt
                  properties:
                    authorizationId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-30>
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-31>
                    destinationNodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-32>
                    issuedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-33>
                  x-parser-schema-id: <anonymous-schema-29>
              x-parser-schema-id: <anonymous-schema-28>
          x-parser-schema-id: ReturnLabelIssuedEvent
        examples:
          - name: returnLabelIssued
            summary: The first package's reverse label.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1d02
              source: /retailnetwork/customer-returns
              type: >-
                com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnLabelIssued
              subject: ret-0f3a91e2
              time: '2026-11-14T11:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:customer-returns:events:ReturnLabelIssued:v2
              data:
                authorizationId: ret-0f3a91e2
                trackingNumber: trk-rev-9
                destinationNodeId: node-rc-1
                issuedAt: '2026-11-14T11:00:00Z'
        x-parser-unique-object-id: ReturnLabelIssued
      ReturnCompleted:
        name: ReturnCompleted
        title: A return was received and graded
        summary: The restock fact of the network.
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnCompleted`;
          subject and key = the `authorizationId`; raised by the first graded
          outcome that fits an open authorization. Lines beyond the
          authorization are NEVER published (they stay on the local outcome
          facts, flagged unexpected). offer-availability consumes this to raise
          the owner listings' availability at the node by `qtyRestockable`;
          unsellable units never touch a listing.
        contentType: application/cloudevents+json
        tags:
          - name: returnauthorization
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (this context publishes the
                    authorizationId; consumed events carry the producer's own
                    root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - authorizationId
                    - outcome
                    - nodeId
                    - lines
                    - receivedAt
                  properties:
                    authorizationId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-36>
                    outcome:
                      type: string
                      enum:
                        - RECEIVED
                      x-parser-schema-id: <anonymous-schema-37>
                    nodeId:
                      type: string
                      description: The returns centre that graded the return.
                      x-parser-schema-id: <anonymous-schema-38>
                    lines:
                      type: array
                      description: >-
                        The authorized lines only; lines beyond the
                        authorization are never published.
                      items:
                        type: object
                        required:
                          - catalogItemId
                          - qtyRestockable
                          - qtyUnsellable
                        properties:
                          catalogItemId:
                            type: string
                            x-parser-schema-id: <anonymous-schema-41>
                          ownerRef:
                            type: string
                            description: Optional; whose stock comes back.
                            x-parser-schema-id: <anonymous-schema-42>
                          qtyRestockable:
                            type: integer
                            x-parser-schema-id: <anonymous-schema-43>
                          qtyUnsellable:
                            type: integer
                            x-parser-schema-id: <anonymous-schema-44>
                        x-parser-schema-id: <anonymous-schema-40>
                      x-parser-schema-id: <anonymous-schema-39>
                    receivedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-45>
                  x-parser-schema-id: <anonymous-schema-35>
              x-parser-schema-id: <anonymous-schema-34>
          x-parser-schema-id: ReturnCompletedEvent
        examples:
          - name: returnCompleted
            summary: One line restockable, one unsellable.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1d03
              source: /retailnetwork/customer-returns
              type: >-
                com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnCompleted
              subject: ret-0f3a91e2
              time: '2026-11-20T09:30:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:customer-returns:events:ReturnCompleted:v3
              data:
                authorizationId: ret-0f3a91e2
                outcome: RECEIVED
                nodeId: node-rc-1
                lines:
                  - catalogItemId: sku-100
                    ownerRef: sel-42
                    qtyRestockable: 2
                    qtyUnsellable: 0
                  - catalogItemId: sku-200
                    ownerRef: sel-42
                    qtyRestockable: 0
                    qtyUnsellable: 1
                receivedAt: '2026-11-20T09:30:00Z'
        x-parser-unique-object-id: ReturnCompleted
      ReturnCancelled:
        name: ReturnCancelled
        title: A return was cancelled
        summary: The shopper cancelled, or the authorization expired.
        x-no-consumer-reason: >-
          No consumer yet, by design - a cancellation ends the shopper's own
          return; nothing downstream executes on it.
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnCancelled`;
          subject and key = the `authorizationId`; raised by POST
          /return-authorizations/\{id\}/cancellations (reason SHOPPER_REQUESTED)
          and by the lazy expiry of an untouched authorization (reason EXPIRED).
          vendor-connectivity leaves the advice poll when it sees it.
        contentType: application/cloudevents+json
        tags:
          - name: returnauthorization
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (this context publishes the
                    authorizationId; consumed events carry the producer's own
                    root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - authorizationId
                    - reason
                    - cancelledAt
                  properties:
                    authorizationId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-48>
                    reason:
                      type: string
                      enum:
                        - SHOPPER_REQUESTED
                        - EXPIRED
                      x-parser-schema-id: <anonymous-schema-49>
                    cancelledAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-50>
                  x-parser-schema-id: <anonymous-schema-47>
              x-parser-schema-id: <anonymous-schema-46>
          x-parser-schema-id: ReturnCancelledEvent
        examples:
          - name: returnCancelled
            summary: The shopper changed their mind before shipping.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1d04
              source: /retailnetwork/customer-returns
              type: >-
                com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnCancelled
              subject: ret-0f3a91e2
              time: '2026-11-15T08:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:customer-returns:events:ReturnCancelled:v2
              data:
                authorizationId: ret-0f3a91e2
                reason: SHOPPER_REQUESTED
                cancelledAt: '2026-11-15T08:00:00Z'
        x-parser-unique-object-id: ReturnCancelled
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: customerReturnsEvents
  customerOrderingEvents:
    address: retailnetwork.customer-ordering.events
    title: customer-ordering integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject (the orderId). Every message carries the CloudEvents content-type
      header.
    messages:
      CustomerOrderPlaced:
        name: CustomerOrderPlaced
        title: A customer order was placed
        summary: >-
          The order's destination postal prefix and its placed groups with their
          lines (published by customer-ordering).
        description: >-
          `type` =
          `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced`;
          consumed into the OrderGroupView with status PROMISED per group (the
          terminal families arrive as notice facts). This context reads the
          order's `destinationPostalPrefix` (never the ship-to;
          customer-ordering publishes ONE prefix per order, at the top of
          `data`, and none on a group, so every group row of the order gets the
          order's prefix), and per group the witness node and the placed lines.
        contentType: application/cloudevents+json
        tags:
          - name: customer-returns
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (this context publishes the
                    authorizationId; consumed events carry the producer's own
                    root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
