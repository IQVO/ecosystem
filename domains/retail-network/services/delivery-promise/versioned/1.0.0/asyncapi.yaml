asyncapi: 3.0.0
info:
  title: delivery-promise Domain Events
  version: 1.0.0
  description: >-
    Event catalog for the **delivery-promise** bounded context of the retail
    network (commerce tier, Core): it quotes delivery offers from a feasible
    witness path, holds capacity in PromiseBooks, makes and judges promises (ADR
    0002, ADR 0003).


    **Published.** Twelve events through a **transactional outbox** (the
    aggregate rows and the already-encoded events are written in ONE database
    transaction and an always-on relay drains them to Kafka, at-least-once, the
    CloudEvents `id` is stored with the outbox row). Six integration events go
    to `retailnetwork.delivery-promise.events` (PromiseAtRisk, PromiseRevised,
    PromiseKept, PromiseBroken, PromiseUnkeepable, PromiseBookExhausted); six
    analytics-only events go ONLY to `retailnetwork.delivery-promise.analytics`
    (PromiseMade, PromiseConfirmed, PromiseReleased, PromiseCancelled,
    DeliveryOfferQuoted, PromisePolicyPublished). The types are catalogued in
    ADR 0004.


    **Consumed.** Events of nine producers, kept as event-fed local read models
    or driving RepromiseOnRisk, JudgeOnDelivery and CancelPromise (ADR 0003).
    The consumed messages below are a tolerant local copy of the fields this
    service relies on; the producer's own AsyncAPI is authoritative. Every
    consumer is idempotent on the CloudEvents `id` (inbox table) and dispatches
    on the full `type`.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/delivery-promise`), `type`,
    `subject` (the aggregate root id), `time`, `datacontenttype`
    (`application/json`) and `dataschema`
    (`urn:retailnetwork:delivery-promise:<stream>:<EventName>:v1`) are all
    required. Kafka key = the subject. Type =
    `com.retailnetwork.commerce.delivery-promise.<entity>.<EventName>` with
    entity `promise`, `promisebook`, `deliveryoffer` or `promisepolicy`. A
    breaking payload change is a new `.v2` type, never a mutation.


    **Conventions.** `data` is camelCase; ids are strings; instants are RFC 3339
    UTC; optional fields are omitted when unset (never null); arrays are always
    present.
  contact:
    name: delivery-promise maintainers
    url: https://github.com/IQVO/delivery-promise
    email: delivery-promise@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: delivery-promise
      description: The delivery-promise bounded context (retail network, commerce tier).
    - name: promise
      description: Events raised by the promise aggregate.
    - name: promisebook
      description: Events raised by the promisebook aggregate.
    - name: deliveryoffer
      description: Events raised by the deliveryoffer aggregate.
    - name: promisepolicy
      description: Events raised by the promisepolicy aggregate.
    - name: consumed-customer-ordering
      description: Events consumed from customer-ordering.
    - name: consumed-last-mile-delivery
      description: Events consumed from last-mile-delivery.
    - name: consumed-linehaul-transportation
      description: Events consumed from linehaul-transportation.
    - name: consumed-node-performance
      description: Events consumed from node-performance.
    - name: consumed-node-topology
      description: Events consumed from node-topology.
    - name: consumed-offer-availability
      description: Events consumed from offer-availability.
    - name: consumed-order-sourcing
      description: Events consumed from order-sourcing.
    - name: consumed-shipping-and-tracking
      description: Events consumed from shipping-and-tracking.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  deliveryPromiseEvents:
    address: retailnetwork.delivery-promise.events
    title: delivery-promise integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject. Every message carries the CloudEvents content-type header.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      PromiseAtRisk:
        name: PromiseAtRisk
        title: Promise at risk
        summary: A confirmed promise's witness path stopped being feasible.
        contentType: application/cloudevents+json
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk`;
          `dataschema` =
          `urn:retailnetwork:delivery-promise:events:PromiseAtRisk:v1`; subject
          and key = the promiseId. Topic: retailnetwork.delivery-promise.events.
          Raised by FlagPromiseAtRisk (RepromiseOnRisk) on
          FulfillmentUnsourceable, PackageExceptionRaised,
          PackageInductionDeferred, DepartureCancelled, DeliveryWaveCancelled,
          BookingFailed or BookingMoved affecting the witness path. Consumed by
          customer-ordering. `reason` is one of NODE_UNSOURCEABLE,
          PACKAGE_EXCEPTION, INDUCTION_DEFERRED, DEPARTURE_CANCELLED,
          WAVE_CANCELLED, BOOKING_FAILED, BOOKING_MOVED.
        tags:
          - name: promise
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/delivery-promise
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (promiseId, bookId, offerId or
                    policyVersion).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - promiseId
                    - orderId
                    - reason
                    - detectedAt
                  properties:
                    promiseId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    reason:
                      type: string
                      x-parser-schema-id: <anonymous-schema-13>
                    detectedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-14>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: PromiseAtRiskEvent
        examples:
          - name: promiseAtRisk
            summary: A confirmed promise's witness path stopped being feasible.
            payload:
              specversion: '1.0'
              id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0003
              source: /retailnetwork/delivery-promise
              type: >-
                com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk
              subject: prm-7f3a21
              time: '2026-10-22T21:40:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:delivery-promise:events:PromiseAtRisk:v1
              data:
                promiseId: prm-7f3a21
                orderId: ord-55a901
                reason: DEPARTURE_CANCELLED
                detectedAt: '2026-10-22T21:40:00Z'
        x-parser-unique-object-id: PromiseAtRisk
      PromiseRevised:
        name: PromiseRevised
        title: Promise revised
        summary: A promise moved to a later window (re-promise), never earlier.
        contentType: application/cloudevents+json
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promise.PromiseRevised`;
          `dataschema` =
          `urn:retailnetwork:delivery-promise:events:PromiseRevised:v1`; subject
          and key = the promiseId. Topic: retailnetwork.delivery-promise.events.
          Raised by RevisePromise (RepromiseOnRisk). `revisionNo` strictly
          increases per promise from 1. Consumed by customer-ordering (shows the
          new window) and order-sourcing (FulfillmentConstraintRevised).
          `deliverByLatest` is never earlier than `previousDeliverByLatest`.
          `nodeId` is the new witness node; when it changed the book hold moved
          in the same transaction.
        tags:
          - name: promise
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/delivery-promise
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (promiseId, bookId, offerId or
                    policyVersion).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - promiseId
                    - orderId
                    - revisionNo
                    - previousDeliverByLatest
                    - deliverByEarliest
                    - deliverByLatest
                    - shipBy
                    - nodeId
                    - reason
                  properties:
                    promiseId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-17>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-18>
                    revisionNo:
                      type: integer
                      minimum: 1
                      description: Strictly increasing per promise.
                      x-parser-schema-id: <anonymous-schema-19>
                    previousDeliverByLatest:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-20>
                    deliverByEarliest:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-21>
                    deliverByLatest:
                      type: string
                      format: date-time
