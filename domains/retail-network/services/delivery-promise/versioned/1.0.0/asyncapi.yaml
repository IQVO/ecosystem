                      x-parser-schema-id: <anonymous-schema-38>
                    deliverByLatest:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-39>
                    lateByMinutes:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-40>
                    cause:
                      type: string
                      enum:
                        - LATE
                        - LOST
                        - RETURNED
                      x-parser-schema-id: <anonymous-schema-41>
                  x-parser-schema-id: <anonymous-schema-34>
              x-parser-schema-id: <anonymous-schema-33>
          x-parser-schema-id: PromiseBrokenEvent
        examples:
          - name: promiseBroken
            summary: The group was delivered late, lost or returned.
            payload:
              specversion: '1.0'
              id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0006
              source: /retailnetwork/delivery-promise
              type: >-
                com.retailnetwork.commerce.delivery-promise.promise.PromiseBroken
              subject: prm-7f3a21
              time: '2026-10-24T03:00:05Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:delivery-promise:events:PromiseBroken:v1
              data:
                promiseId: prm-7f3a21
                orderId: ord-55a901
                nodeId: N-VWS-AUS3
                deliveredAt: '2026-10-24T03:00:00Z'
                deliverByLatest: '2026-10-24T02:00:00Z'
                lateByMinutes: 60
                cause: LATE
        x-parser-unique-object-id: PromiseBroken
      PromiseUnkeepable:
        name: PromiseUnkeepable
        title: Promise unkeepable
        summary: Re-promising found no feasible path at any tier.
        contentType: application/cloudevents+json
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promise.PromiseUnkeepable`;
          `dataschema` =
          `urn:retailnetwork:delivery-promise:events:PromiseUnkeepable:v1`;
          subject and key = the promiseId. Topic:
          retailnetwork.delivery-promise.events. Raised by RevisePromise when
          RepromiseOnRisk finds no path even at STANDARD (E9, G10). The promise
          stays AT_RISK. customer-ordering consumes it and cancels the group;
          its CustomerOrderCancelled then cancels the promise. At most once per
          promise (a repeated trigger raises nothing). `reason` repeats the risk
          reason that started the re-promise.
        tags:
          - name: promise
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/delivery-promise
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (promiseId, bookId, offerId or
                    policyVersion).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - promiseId
                    - orderId
                    - groupNo
                    - reason
                  properties:
                    promiseId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-44>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-45>
                    groupNo:
                      type: integer
                      description: Shipment group number within the order, from 1.
                      x-parser-schema-id: <anonymous-schema-46>
                    reason:
                      type: string
                      x-parser-schema-id: <anonymous-schema-47>
                  x-parser-schema-id: <anonymous-schema-43>
              x-parser-schema-id: <anonymous-schema-42>
          x-parser-schema-id: PromiseUnkeepableEvent
        examples:
          - name: promiseUnkeepable
            summary: Re-promising found no feasible path at any tier.
            payload:
              specversion: '1.0'
              id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0009
              source: /retailnetwork/delivery-promise
              type: >-
                com.retailnetwork.commerce.delivery-promise.promise.PromiseUnkeepable
              subject: prm-7f3a21
              time: '2026-10-22T21:42:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:delivery-promise:events:PromiseUnkeepable:v1
              data:
                promiseId: prm-7f3a21
                orderId: ord-55a901
                groupNo: 1
                reason: NODE_UNSOURCEABLE
        x-parser-unique-object-id: PromiseUnkeepable
      PromiseBookExhausted:
        name: PromiseBookExhausted
        title: Promise book exhausted
        summary: A node pickup cutoff has no promise capacity left.
        contentType: application/cloudevents+json
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promisebook.PromiseBookExhausted`;
          `dataschema` =
          `urn:retailnetwork:delivery-promise:events:PromiseBookExhausted:v1`;
          subject and key = the bookId. Topic:
