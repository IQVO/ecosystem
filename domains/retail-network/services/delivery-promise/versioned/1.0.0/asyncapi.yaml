                      x-parser-schema-id: <anonymous-schema-23>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-24>
                    reason:
                      type: string
                      x-parser-schema-id: <anonymous-schema-25>
                  x-parser-schema-id: <anonymous-schema-16>
              x-parser-schema-id: <anonymous-schema-15>
          x-parser-schema-id: PromiseRevisedEvent
        examples:
          - name: promiseRevised
            summary: A promise moved to a later window (re-promise), never earlier.
            payload:
              specversion: '1.0'
              id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0004
              source: /retailnetwork/delivery-promise
              type: >-
                com.retailnetwork.commerce.delivery-promise.promise.PromiseRevised
              subject: prm-7f3a21
              time: '2026-10-22T21:41:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:delivery-promise:events:PromiseRevised:v1
              data:
                promiseId: prm-7f3a21
                orderId: ord-55a901
                revisionNo: 1
                previousDeliverByLatest: '2026-10-24T02:00:00Z'
                deliverByEarliest: '2026-10-24T14:00:00Z'
                deliverByLatest: '2026-10-25T02:00:00Z'
                shipBy: '2026-10-23T23:00:00Z'
                nodeId: N-VWS-AUS3
                reason: DEPARTURE_CANCELLED
        x-parser-unique-object-id: PromiseRevised
      PromiseKept:
        name: PromiseKept
        title: Promise kept
        summary: The group was delivered on or before deliverByLatest.
        contentType: application/cloudevents+json
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promise.PromiseKept`;
          `dataschema` =
          `urn:retailnetwork:delivery-promise:events:PromiseKept:v1`; subject
          and key = the promiseId. Topic: retailnetwork.delivery-promise.events.
          Raised by JudgePromise when the LAST package of the group is delivered
          (G1). Consumed by node-performance and customer-ordering.
        tags:
          - name: promise
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/delivery-promise
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (promiseId, bookId, offerId or
                    policyVersion).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - promiseId
                    - orderId
                    - nodeId
                    - deliveredAt
                    - deliverByLatest
                  properties:
                    promiseId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-28>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-29>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-30>
                    deliveredAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-31>
                    deliverByLatest:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-32>
                  x-parser-schema-id: <anonymous-schema-27>
              x-parser-schema-id: <anonymous-schema-26>
          x-parser-schema-id: PromiseKeptEvent
        examples:
          - name: promiseKept
            summary: The group was delivered on or before deliverByLatest.
            payload:
              specversion: '1.0'
              id: 7c1d3e52-0b6a-4f0e-9a41-5d2e8f3a0005
              source: /retailnetwork/delivery-promise
              type: com.retailnetwork.commerce.delivery-promise.promise.PromiseKept
              subject: prm-7f3a21
              time: '2026-10-23T18:30:05Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:delivery-promise:events:PromiseKept:v1
              data:
                promiseId: prm-7f3a21
                orderId: ord-55a901
                nodeId: N-VWS-AUS3
                deliveredAt: '2026-10-23T18:30:00Z'
                deliverByLatest: '2026-10-24T02:00:00Z'
        x-parser-unique-object-id: PromiseKept
      PromiseBroken:
        name: PromiseBroken
        title: Promise broken
        summary: The group was delivered late, lost or returned.
        contentType: application/cloudevents+json
        description: >-
          `type` =
          `com.retailnetwork.commerce.delivery-promise.promise.PromiseBroken`;
          `dataschema` =
          `urn:retailnetwork:delivery-promise:events:PromiseBroken:v1`; subject
          and key = the promiseId. Topic: retailnetwork.delivery-promise.events.
          Raised by JudgePromise. `cause` is LATE (delivered after
          deliverByLatest), LOST (first package lost, E6) or RETURNED (first
          package returned before delivery, E6). For LOST and RETURNED
          `deliveredAt` is omitted and `lateByMinutes` is the whole minutes from
          deliverByLatest to the loss/return instant, 0 when that instant is not
          later. Consumed by node-performance and customer-ordering.
        tags:
          - name: promise
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/delivery-promise
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (promiseId, bookId, offerId or
                    policyVersion).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - promiseId
                    - orderId
                    - nodeId
                    - deliverByLatest
                    - lateByMinutes
                    - cause
                  properties:
                    promiseId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-35>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-36>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-37>
                    deliveredAt:
                      type: string
                      format: date-time
