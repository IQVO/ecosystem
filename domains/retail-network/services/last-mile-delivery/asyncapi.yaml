asyncapi: 3.0.0
info:
  title: last-mile-delivery Domain Events
  version: 1.0.0
  contact:
    name: last-mile-delivery maintainers
    url: https://github.com/IQVO/last-mile-delivery
    email: last-mile-delivery@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: last-mile-delivery
      description: The last-mile-delivery bounded context (retail network, logistics tier).
    - name: wave
      description: Events raised by the DeliveryWave aggregate.
    - name: route
      description: Events raised by the Route aggregate.
    - name: packageattempthistory
      description: Events raised by the PackageAttemptHistory aggregate.
  description: |
    Event catalog for the **last-mile-delivery** bounded context of the retail
    network (logistics tier): the delivery stations' waves (induct cutoff,
    delivery window, stop capacity), the routes of delivery service partners
    and every delivery attempt (ADR 0001, ADR 0002).

    **Published.** Eight events. Seven go to the integration topic
    `retailnetwork.last-mile-delivery.events`; `RoutePlanned` is analytics only
    and goes ONLY to `retailnetwork.last-mile-delivery.analytics`. Every event
    leaves through a **transactional outbox**: the aggregates and their
    already-encoded events are written in ONE database transaction and an
    always-on relay drains them to Kafka (at-least-once; the CloudEvents `id` is
    stored with the outbox row, so a retry republishes the same `id`). The eight
    types are catalogued in ADR 0004.

    **Consumed.** Four events (ADR 0003): `LoadArrived` from
    linehaul-transportation, `NodeRegistered` and `ServiceAreaAssigned` from
    node-topology, `LabelIssued` from shipping-and-tracking. Each consumer
    dedupes on the CloudEvents `id` (inbox table `processed_events`), dispatches
    on the full `type`, ignores unknown types and unknown fields. The consumed
    messages below list only the fields this service relies on; the producers'
    own AsyncAPI files are the authority.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/last-mile-delivery`), `type`,
    `subject` (the aggregate root id), `time`, `datacontenttype`
    (`application/json`) and `dataschema`
    (`urn:retailnetwork:last-mile-delivery:<stream>:<EventName>:v1`, stream
    `events` or `analytics`) are all required. Kafka key = the subject, so one
    aggregate's events stay ordered on one partition. Type =
    `com.retailnetwork.logistics.last-mile-delivery.<entity>.<EventName>` with
    entity `wave`, `route` or `packageattempthistory`. A breaking payload change
    is a new `.v2` type, never a mutation.

    **Conventions.** `data` is camelCase; ids are strings; instants are RFC 3339
    UTC strings; the service date is `YYYY-MM-DD`; counts are integers;
    optional fields are omitted when absent (never null); evolution is additive
    only. No address and no other PII appears in any event.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  lastMileEvents:
    address: retailnetwork.last-mile-delivery.events
    title: last-mile-delivery integration topic
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (waveId, routeId or trackingNumber). Every message carries the
      CloudEvents content-type header. Dispatch on the full `type`, ignore
      unknown types, dedupe on `id`.
    messages:
      DeliveryWaveScheduled:
        name: DeliveryWaveScheduled
        title: Delivery wave scheduled
        summary: A delivery wave was scheduled in state OPEN.
        description: >-
          `type` =
          `com.retailnetwork.logistics.last-mile-delivery.wave.DeliveryWaveScheduled`;
          subject and key = the waveId. Raised by ScheduleWave. delivery-promise
          and order-sourcing plan the last leg on it.
        contentType: application/cloudevents+json
        tags:
          - name: wave
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: >-
                    UUID minted once per occurrence and stored with the outbox
                    row.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/last-mile-delivery
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id; also the Kafka key.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - waveId
                    - stationNodeId
                    - serviceDate
                    - inductCutoffAt
                    - windowStart
                    - windowEnd
                    - stopCapacity
                  properties:
                    waveId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    stationNodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    serviceDate:
                      type: string
                      format: date
                      description: The station's local service date.
                      x-parser-schema-id: <anonymous-schema-13>
                    inductCutoffAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-14>
                    windowStart:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-15>
                    windowEnd:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-16>
                    stopCapacity:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-17>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: DeliveryWaveScheduledEvent
        examples:
          - name: deliveryWaveScheduled
            summary: A morning wave of station node-ds-01.
            payload:
              specversion: '1.0'
              id: 5d3a8c1e-0a63-4f0b-9d54-7a1a6b0c2e11
              source: /retailnetwork/last-mile-delivery
              type: >-
                com.retailnetwork.logistics.last-mile-delivery.wave.DeliveryWaveScheduled
              subject: wave-3b9f
              time: '2026-10-23T11:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:last-mile-delivery:events:DeliveryWaveScheduled:v1
              data:
                waveId: wave-3b9f
                stationNodeId: node-ds-01
                serviceDate: '2026-10-24'
                inductCutoffAt: '2026-10-24T08:00:00Z'
                windowStart: '2026-10-24T12:00:00Z'
                windowEnd: '2026-10-24T20:00:00Z'
                stopCapacity: 120
        x-parser-unique-object-id: DeliveryWaveScheduled
      DeliveryWaveCapacityChanged:
        name: DeliveryWaveCapacityChanged
        title: Delivery wave capacity changed
        summary: The assigned stops of a wave changed.
        description: >-
          `type` =
          `com.retailnetwork.logistics.last-mile-delivery.wave.DeliveryWaveCapacityChanged`;
          subject and key = the waveId. Raised when an induction adds a NEW stop
          to the wave (a package joining a stop already in the wave changes no
          count and raises nothing). `remainingStops` = `stopCapacity` -
          `assignedStops`. A wave with no remaining stops is no longer a
          candidate.
        contentType: application/cloudevents+json
        tags:
          - name: wave
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: >-
                    UUID minted once per occurrence and stored with the outbox
                    row.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/last-mile-delivery
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id; also the Kafka key.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - waveId
                    - stopCapacity
                    - assignedStops
                    - remainingStops
                  properties:
                    waveId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-20>
                    stopCapacity:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-21>
                    assignedStops:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-22>
                    remainingStops:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-23>
                  x-parser-schema-id: <anonymous-schema-19>
              x-parser-schema-id: <anonymous-schema-18>
          x-parser-schema-id: DeliveryWaveCapacityChangedEvent
        examples:
          - name: deliveryWaveCapacityChanged
            summary: One more stop assigned.
            payload:
              specversion: '1.0'
              id: 0e7c2f6a-31b4-4c8e-8f0d-9a5f1d2b7c33
              source: /retailnetwork/last-mile-delivery
              type: >-
                com.retailnetwork.logistics.last-mile-delivery.wave.DeliveryWaveCapacityChanged
              subject: wave-3b9f
              time: '2026-10-24T06:15:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:last-mile-delivery:events:DeliveryWaveCapacityChanged:v1
              data:
                waveId: wave-3b9f
                stopCapacity: 120
                assignedStops: 41
                remainingStops: 79
        x-parser-unique-object-id: DeliveryWaveCapacityChanged
      DeliveryWaveCancelled:
        name: DeliveryWaveCancelled
        title: Delivery wave cancelled
        summary: An OPEN wave was cancelled; its packages moved to the next wave.
        description: >-
          `type` =
          `com.retailnetwork.logistics.last-mile-delivery.wave.DeliveryWaveCancelled`;
          subject and key = the waveId. Raised by CancelWave. An INTEGRATION
          event on the events topic (Gap Register G5, contracts-delta E5):
          delivery-promise (view and RepromiseOnRisk) and order-sourcing
          (NetworkGraphView) consume it.
        contentType: application/cloudevents+json
        tags:
          - name: wave
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: >-
                    UUID minted once per occurrence and stored with the outbox
                    row.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/last-mile-delivery
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id; also the Kafka key.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - waveId
                    - reason
                  properties:
                    waveId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-26>
                    reason:
                      type: string
                      x-parser-schema-id: <anonymous-schema-27>
                  x-parser-schema-id: <anonymous-schema-25>
              x-parser-schema-id: <anonymous-schema-24>
          x-parser-schema-id: DeliveryWaveCancelledEvent
        examples:
          - name: deliveryWaveCancelled
            summary: A wave cancelled by the station planner.
            payload:
              specversion: '1.0'
              id: 7a1d9b24-5c70-4e0a-b3d1-2f6e8c0a9d55
              source: /retailnetwork/last-mile-delivery
              type: >-
                com.retailnetwork.logistics.last-mile-delivery.wave.DeliveryWaveCancelled
              subject: wave-3b9f
              time: '2026-10-24T05:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:last-mile-delivery:events:DeliveryWaveCancelled:v1
              data:
                waveId: wave-3b9f
                reason: station closed for maintenance
        x-parser-unique-object-id: DeliveryWaveCancelled
      PackageOutForDelivery:
        name: PackageOutForDelivery
        title: Package out for delivery
        summary: A package left the station on a started route.
        description: >-
          `type` =
          `com.retailnetwork.logistics.last-mile-delivery.route.PackageOutForDelivery`;
          subject = the routeId, key = the routeId. Raised by StartRoute, one
          event per tracking number on the route. shipping-and-tracking records
          the AT_STATION to OUT_FOR_DELIVERY scan.
        contentType: application/cloudevents+json
        tags:
          - name: route
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: >-
                    UUID minted once per occurrence and stored with the outbox
                    row.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/last-mile-delivery
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id; also the Kafka key.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - routeId
                    - trackingNumber
                    - stationNodeId
                    - at
                  properties:
                    routeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-30>
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-31>
                    stationNodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-32>
                    at:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-33>
                  x-parser-schema-id: <anonymous-schema-29>
              x-parser-schema-id: <anonymous-schema-28>
          x-parser-schema-id: PackageOutForDeliveryEvent
        examples:
          - name: packageOutForDelivery
            summary: One package of a started route.
            payload:
              specversion: '1.0'
              id: a91f3d77-2b0c-4d1e-8a6f-3c5e7b9d1f77
              source: /retailnetwork/last-mile-delivery
              type: >-
                com.retailnetwork.logistics.last-mile-delivery.route.PackageOutForDelivery
              subject: route-81c2
              time: '2026-10-24T12:02:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:last-mile-delivery:events:PackageOutForDelivery:v1
              data:
                routeId: route-81c2
                trackingNumber: TRK-000123
                stationNodeId: node-ds-01
                at: '2026-10-24T12:02:00Z'
        x-parser-unique-object-id: PackageOutForDelivery
      DeliveryAttempted:
        name: DeliveryAttempted
        title: Delivery attempted
        summary: One delivery attempt of one package was recorded.
        description: >-
          `type` =
          `com.retailnetwork.logistics.last-mile-delivery.route.DeliveryAttempted`;
          subject = the routeId, key = the routeId. Raised by RecordAttempt, per
          package (Gap Register G17: outcomes are per package, the stop outcome
          is derived). `outcome` is DELIVERED or FAILED; `failureReason` is
          present only when FAILED. A FAILED attempt re-inducts the package onto
          the next wave, or after the third failure raises
          PackageReturnInitiated.
        contentType: application/cloudevents+json
        tags:
          - name: route
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: >-
                    UUID minted once per occurrence and stored with the outbox
                    row.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/last-mile-delivery
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id; also the Kafka key.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - routeId
                    - trackingNumber
                    - outcome
                    - at
                  properties:
                    routeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-36>
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-37>
                    outcome:
                      type: string
                      enum:
                        - DELIVERED
                        - FAILED
                      x-parser-schema-id: Outcome
                    failureReason:
                      type: string
                      description: Present only when outcome is FAILED.
                      x-parser-schema-id: <anonymous-schema-38>
                    at:
                      type: string
                      format: date-time
                      description: >-
                        The instant of the attempt as reported by the driver
                        app.
                      x-parser-schema-id: <anonymous-schema-39>
                  x-parser-schema-id: <anonymous-schema-35>
              x-parser-schema-id: <anonymous-schema-34>
          x-parser-schema-id: DeliveryAttemptedEvent
        examples:
          - name: deliveryAttemptedFailed
            summary: A failed attempt.
            payload:
              specversion: '1.0'
              id: 3e8b5a90-6d12-4f7c-a0e3-1b9c4d6f8a88
              source: /retailnetwork/last-mile-delivery
              type: >-
                com.retailnetwork.logistics.last-mile-delivery.route.DeliveryAttempted
              subject: route-81c2
              time: '2026-10-24T14:20:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:last-mile-delivery:events:DeliveryAttempted:v1
              data:
                routeId: route-81c2
                trackingNumber: TRK-000123
                outcome: FAILED
                failureReason: recipient absent
                at: '2026-10-24T14:19:30Z'
        x-parser-unique-object-id: DeliveryAttempted
      PackageInductionDeferred:
        name: PackageInductionDeferred
        title: Package induction deferred
        summary: A package at the station could not be inducted into any wave.
        description: >-
          `type` =
          `com.retailnetwork.logistics.last-mile-delivery.packageattempthistory.PackageInductionDeferred`;
          subject and key = the trackingNumber. Raised when no OPEN wave of the
          station with stop capacity accepts the package (LoadArrived, a failed
          attempt, a cancelled wave or a dispatch leftover; Gap Register G16,
          contracts-delta E15). delivery-promise treats it as a risk. The
          package is inducted later when a wave is scheduled. `assignmentId`
          comes from the package's LabelIssued and is omitted only when no label
          data was received.
        contentType: application/cloudevents+json
        tags:
          - name: packageattempthistory
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: >-
                    UUID minted once per occurrence and stored with the outbox
                    row.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/last-mile-delivery
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id; also the Kafka key.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - trackingNumber
                  properties:
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-42>
                    assignmentId:
                      type: string
                      description: >-
                        From LabelIssued; omitted only when no label data was
                        received.
                      x-parser-schema-id: <anonymous-schema-43>
                  x-parser-schema-id: <anonymous-schema-41>
              x-parser-schema-id: <anonymous-schema-40>
          x-parser-schema-id: PackageInductionDeferredEvent
        examples:
          - name: packageInductionDeferred
            summary: No wave had capacity.
            payload:
              specversion: '1.0'
              id: d2f4a6c8-1e3b-45d7-9f0a-8b6c4e2d0a99
              source: /retailnetwork/last-mile-delivery
              type: >-
                com.retailnetwork.logistics.last-mile-delivery.packageattempthistory.PackageInductionDeferred
              subject: TRK-000123
              time: '2026-10-24T09:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:last-mile-delivery:events:PackageInductionDeferred:v1
              data:
                trackingNumber: TRK-000123
                assignmentId: asg-5531
        x-parser-unique-object-id: PackageInductionDeferred
      PackageReturnInitiated:
        name: PackageReturnInitiated
        title: Package return initiated
        summary: The third delivery attempt of a package failed; return it to sender.
