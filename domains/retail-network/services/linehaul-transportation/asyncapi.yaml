                    x-parser-schema-id: <anonymous-schema-21>
                x-parser-schema-id: <anonymous-schema-20>
            x-parser-schema-id: DepartureCapacityChangedEvent
          examples:
            - name: departureCapacityChanged
              summary: The booked or total capacity of a departure changed.
