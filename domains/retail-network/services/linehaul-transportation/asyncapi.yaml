              dataschema: >-
                urn:retailnetwork:linehaul-transportation:events:DepartureCapacityChanged:v1
              data:
                departureId: dep-5b1c0e7a
                capacityPackages: 400
                bookedPackages: 17
                remainingPackages: 383
        x-parser-unique-object-id: DepartureCapacityChanged
      DepartureCancelled:
        name: DepartureCancelled
        title: A scheduled departure was cancelled
        summary: A scheduled departure was cancelled.
        description: >-
          `type` =
          `com.retailnetwork.logistics.linehaul-transportation.departure.DepartureCancelled`;
