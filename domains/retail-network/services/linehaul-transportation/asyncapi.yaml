    action: receive
    title: >-
      Receive the assignment events that feed ExpectedVolumeView and book pickup
      capacity
    summary: >-
      Receive the assignment events that feed ExpectedVolumeView and book pickup
      capacity.
    description: >-
      Reads `FulfillmentReleasedToNode`, `FulfillmentReassigned`,
      `FulfillmentLocked` and `FulfillmentCancelled` (key and subject:
      assignmentId) under the consumer group read from
      `ORDER_SOURCING_CONSUMER_GROUP`. Dispatch is on the full `type`; every
      other type is ignored. `FulfillmentLocked` books one package on the pickup
      departure (policy BookOnLock) or, when it cannot, rebooks onto the next
      departure from the same origin and publishes BookingMoved or
      BookingFailed. The other three only update ExpectedVolumeView: assignments
      are reassigned and cancelled before LOCKED, so there is nothing to release
      (gap G15).
