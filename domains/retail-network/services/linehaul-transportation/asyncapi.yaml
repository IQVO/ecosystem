asyncapi: 3.0.0
info:
  title: linehaul-transportation Domain Events
  version: 1.0.0
  contact:
    name: linehaul-transportation maintainers
    url: https://github.com/IQVO/linehaul-transportation
    email: linehaul-transportation@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: linehaul-transportation
      description: >-
        The linehaul-transportation bounded context (retail network, logistics
        tier).
    - name: departure
      description: Events raised by the Departure aggregate.
    - name: load
      description: Events raised by the Load aggregate.
    - name: consumed
      description: >-
        Events this context consumes from node-topology, order-sourcing and
        shipping-and-tracking.
  description: >-
    Event catalog for the **linehaul-transportation** bounded context of the
    retail network (logistics tier): the middle mile. It turns lane schedules
    and the declared cutoffs of vendor nodes into scheduled departures, keeps
    each departure's remaining capacity, builds loads of packages onto
    departures and reports when loads depart and arrive (ADR 0001, ADR 0002).


    **Published.** Ten events through a **transactional outbox** (the aggregate
    rows and the already-encoded events are written in ONE database transaction;
    an always-on relay drains them to Kafka, at-least-once, the CloudEvents `id`
    is stored with the outbox row). Seven are integration events on
    `retailnetwork.linehaul-transportation.events`; DepartureDeparted,
    DepartureArrived and LoadClosed are analytics-only and go ONLY to
    `retailnetwork.linehaul-transportation.analytics`. BookingMoved and
    BookingFailed are the events of gap G14 (contracts-delta E13);
    `departureKind` and `nodeType` on LoadDeparted and LoadArrived are gap G3
    (E3). The types are catalogued in ADR 0004.


    **Consumed.** Thirteen events from three topics, each under its own
    mandatory consumer group, idempotent on the CloudEvents `id` (inbox),
    dispatched on the full `type`, decoded tolerantly (ADR 0003).


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/linehaul-transportation`),
    `type`, `subject` (the aggregate root id), `time`, `datacontenttype`
    (`application/json`) and `dataschema`
    (`urn:retailnetwork:linehaul-transportation:<events|analytics>:<EventName>:v1`)
    are all required. Kafka key = the subject, so one aggregate's events stay
    ordered on one partition. Type =
    `com.retailnetwork.logistics.linehaul-transportation.<entity>.<EventName>`
    with entity `departure` or `load`. A breaking payload change is a new `.v2`
    type, never a mutation.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; ids are
    strings; optional fields are omitted when absent (never null); arrays are
    always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  linehaulEvents:
    address: retailnetwork.linehaul-transportation.events
    title: linehaul-transportation integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject (departureId or loadId). Every message carries the CloudEvents
      content-type header. Dispatch on the full `type`, ignore unknown types,
      dedupe on `id`.
    messages:
      DepartureScheduled:
        name: DepartureScheduled
        title: A departure was scheduled on a lane
        summary: A departure was scheduled on a lane.
        description: >-
          `type` =
          `com.retailnetwork.logistics.linehaul-transportation.departure.DepartureScheduled`;
          stream `events`; subject and key = departureId. Raised by
          ScheduleDeparture (lane schedule slot or vendor-node cutoff). `kind`
          PICKUP starts at a vendor fulfillment node, LINEHAUL and AIR follow
          the lane mode. `cutoffAt <= departsAt < arrivesAt`; no booking after
          `cutoffAt`. Consumers: delivery-promise, order-sourcing.
        contentType: application/cloudevents+json
        tags:
          - name: departure
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id: departureId or loadId (published),
                    the producer's root id (consumed).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    departureId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    laneId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    kind:
                      type: string
                      enum:
                        - PICKUP
                        - LINEHAUL
                        - AIR
                      x-parser-schema-id: <anonymous-schema-13>
                    originNodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-14>
                    destinationNodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-15>
                    cutoffAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-16>
                    departsAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-17>
                    arrivesAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-18>
                    capacityPackages:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-19>
                  required:
                    - departureId
                    - laneId
                    - kind
                    - originNodeId
                    - destinationNodeId
                    - cutoffAt
                    - departsAt
                    - arrivesAt
                    - capacityPackages
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: DepartureScheduledEvent
        examples:
          - name: departureScheduled
            summary: A departure was scheduled on a lane.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c01
              source: /retailnetwork/linehaul-transportation
              type: >-
                com.retailnetwork.logistics.linehaul-transportation.departure.DepartureScheduled
              subject: dep-5b1c0e7a
              time: '2026-10-23T15:20:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:linehaul-transportation:events:DepartureScheduled:v1
              data:
                departureId: dep-5b1c0e7a
                laneId: lane-31
                kind: PICKUP
                originNodeId: node-0f3a91
                destinationNodeId: node-sc-02
                cutoffAt: '2026-10-23T21:00:00Z'
                departsAt: '2026-10-23T21:00:00Z'
                arrivesAt: '2026-10-23T23:30:00Z'
                capacityPackages: 400
        x-parser-unique-object-id: DepartureScheduled
      DepartureCapacityChanged:
        name: DepartureCapacityChanged
        title: The booked or total capacity of a departure changed
        summary: The booked or total capacity of a departure changed.
        description: >-
          `type` =
          `com.retailnetwork.logistics.linehaul-transportation.departure.DepartureCapacityChanged`;
          stream `events`; subject and key = departureId. Raised by
          BookCapacity, ReleaseCapacity and ChangeDepartureCapacity.
          `remainingPackages = capacityPackages - bookedPackages`. Full state,
          not a delta: consumers keep the latest by the aggregate version order
          of the Kafka key. Consumers: delivery-promise, order-sourcing.
