      BookingMoved:
        name: BookingMoved
        title: A booked assignment moved to the next departure from the same origin
        summary: A booked assignment moved to the next departure from the same origin.
        description: >-
          `type` =
          `com.retailnetwork.logistics.linehaul-transportation.departure.BookingMoved`;
          stream `events`; subject and key = toDepartureId. Gap G14
          (contracts-delta E13). Raised when the pickup departure named by
          FulfillmentLocked cannot hold the booking (cancelled, closed, full or
          unknown) or a booked departure is cancelled, and the next SCHEDULED
          departure from the same origin takes it. The node never changes after
          lock. Subject and key: `toDepartureId`. Consumers: delivery-promise,
          order-sourcing (re-promise).
        contentType: application/cloudevents+json
        tags:
          - name: departure
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
