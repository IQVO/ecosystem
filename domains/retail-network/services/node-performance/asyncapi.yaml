          subject and key = the scorecardId (`nodeId:window`). Raised by
          Recompute once the scorecard is saved, and not while a scorecard stays
          PROVISIONAL. `grade` is `PROVISIONAL` below minObservations (50) and
          also when a GRADED scorecard falls back below it. Consumers use the
          30d window; PROVISIONAL adds no handicap (G20, E18). Metric
