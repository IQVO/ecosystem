components:
  messages:
    NodeScorecardUpdated:
      name: NodeScorecardUpdated
      title: Node scorecard updated
      summary: A node scorecard was recomputed and its grade, state or metrics changed.
      description: >-
        `type` =
        `com.retailnetwork.partner.node-performance.scorecard.NodeScorecardUpdated`;
        subject and key = the scorecardId (`nodeId:window`). Raised by Recompute
        once the scorecard is saved, and not while a scorecard stays
        PROVISIONAL. `grade` is `PROVISIONAL` below minObservations (50) and
