operations:
  publishNodePerformanceEvents:
    action: send
    title: Publish node-performance integration events
    summary: Publish NodeScorecardUpdated through the transactional outbox.
    description: >
      After a Recompute is saved with a changed grade, state or metrics (and

      not while the scorecard stays PROVISIONAL), the service sends one

      NodeScorecardUpdated per scorecard to
      `retailnetwork.node-performance.events`.

      delivery-promise and order-sourcing consume it; only the 30d window feeds

      their decisions, the 7d window feeds alerts only (E18).
    tags:
      - name: node-performance
    channel:
      address: retailnetwork.node-performance.events
      title: node-performance integration topic
      description: |
        This service's integration topic. Written by the outbox relay; key =
        subject (the scorecardId). Every message carries the CloudEvents
        content-type header. Dispatch on the full `type`, ignore unknown types,
        dedupe on `id`.
      messages:
        NodeScorecardUpdated:
          name: NodeScorecardUpdated
          title: Node scorecard updated
          summary: >-
            A node scorecard was recomputed and its grade, state or metrics
            changed.
          description: >-
            `type` =
            `com.retailnetwork.partner.node-performance.scorecard.NodeScorecardUpdated`;
            subject and key = the scorecardId (`nodeId:window`). Raised by
            Recompute once the scorecard is saved, and not while a scorecard
            stays PROVISIONAL. `grade` is `PROVISIONAL` below minObservations
            (50) and also when a GRADED scorecard falls back below it. Consumers
            use the 30d window; PROVISIONAL adds no handicap (G20, E18). Metric
            definitions are in ADR 0002 (A5-A10).
          contentType: application/cloudevents+json
          tags:
            - name: scorecard
          payload:
            allOf:
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - type
                  - subject
                  - time
                  - datacontenttype
                  - dataschema
                  - data
                properties:
                  specversion:
                    type: string
                    const: '1.0'
                    x-parser-schema-id: <anonymous-schema-1>
                  id:
                    type: string
                    description: The CloudEvents id; the idempotency key of every consumer.
                    x-parser-schema-id: <anonymous-schema-2>
                  source:
                    type: string
                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    description: The aggregate root id of the producer.
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  source:
                    const: /retailnetwork/node-performance
                    x-parser-schema-id: <anonymous-schema-10>
                  data:
                    type: object
                    required:
                      - nodeId
                      - window
                      - grade
                      - onTimeHandoverRate
                      - lateAckRate
                      - rejectRate
                      - expiryRate
                      - promiseKeptRate
                      - feedFreshnessP95Minutes
                      - observations
                      - computedAt
                    properties:
                      nodeId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-12>
                      window:
                        type: string
                        enum:
                          - 7d
                          - 30d
                        x-parser-schema-id: ScorecardWindow
                      grade:
                        type: string
                        enum:
                          - A
                          - B
                          - C
                          - D
                          - PROVISIONAL
                        x-parser-schema-id: ScorecardGrade
                      onTimeHandoverRate:
                        type: number
                        minimum: 0
                        maximum: 1
                        x-parser-schema-id: <anonymous-schema-13>
                      lateAckRate:
                        type: number
                        minimum: 0
                        maximum: 1
                        x-parser-schema-id: <anonymous-schema-14>
                      rejectRate:
                        type: number
                        minimum: 0
                        maximum: 1
                        x-parser-schema-id: <anonymous-schema-15>
                      expiryRate:
                        type: number
                        minimum: 0
                        maximum: 1
                        x-parser-schema-id: <anonymous-schema-16>
                      promiseKeptRate:
                        type: number
                        minimum: 0
                        maximum: 1
                        x-parser-schema-id: <anonymous-schema-17>
                      feedFreshnessP95Minutes:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-18>
                      observations:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-19>
                      computedAt:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-20>
                    x-parser-schema-id: <anonymous-schema-11>
                x-parser-schema-id: <anonymous-schema-9>
            x-parser-schema-id: NodeScorecardUpdatedEvent
          examples:
            - name: nodeScorecardUpdated
              summary: >-
                A node scorecard was recomputed and its grade, state or metrics
                changed.
              payload:
                specversion: '1.0'
                id: 7d0c6a52-3f7e-4b8e-9a51-2a8f0c1d9e44
                source: /retailnetwork/node-performance
                type: >-
                  com.retailnetwork.partner.node-performance.scorecard.NodeScorecardUpdated
                subject: node-0f3a91:30d
                time: '2026-10-22T14:03:00Z'
                datacontenttype: application/json
                dataschema: >-
                  urn:retailnetwork:node-performance:events:NodeScorecardUpdated:v1
                data:
                  nodeId: node-0f3a91
                  window: 30d
                  grade: B
                  onTimeHandoverRate: 0.962
                  lateAckRate: 0.021
                  rejectRate: 0.012
                  expiryRate: 0.004
                  promiseKeptRate: 0.951
                  feedFreshnessP95Minutes: 38
                  observations: 1874
                  computedAt: '2026-10-22T14:03:00Z'
          x-parser-unique-object-id: NodeScorecardUpdated
