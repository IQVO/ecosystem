asyncapi: 3.0.0
info:
  title: node-performance Domain Events
  version: 1.0.0
  contact:
    name: node-performance maintainers
    url: https://github.com/IQVO/node-performance
    email: node-performance@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: node-performance
      description: The node-performance bounded context (retail network, partner tier).
    - name: scorecard
      description: Events raised by the NodeScorecard aggregate.
    - name: consumed
      description: Tolerant local copies of the events this service consumes.
  description: >
    Event catalog for the **node-performance** bounded context of the retail

    network (partner tier): it measures every node against what it declared and

    what was asked of it (acknowledgement latency, rejections, on-time handover

    against requiredShipBy, promise-kept rate, inventory feed freshness) over

    7-day and 30-day rolling windows and grades the node (ADR 0001, ADR 0002).


    **Published.** Two events through a **transactional outbox**: the scorecard

    row and its already-encoded events are written in ONE database transaction

    and an always-on relay drains them to Kafka (at-least-once; the CloudEvents

    `id` is stored with the outbox row, so a retry republishes the same `id`).

    `NodeScorecardUpdated` is an integration event on

    `retailnetwork.node-performance.events` (consumers: delivery-promise,

    order-sourcing). `NodeThresholdBreached` is analytics-only and goes ONLY to

    `retailnetwork.node-performance.analytics`. Both types are catalogued in

    ADR 0004.


    **Consumed.** Thirteen events from five producers, each topic under its own
    stable

    consumer group named by a mandatory environment variable (ADR 0003); every
    message is

    deduplicated on the CloudEvents `id` in the `processed_events` inbox, in the

    same transaction as its effect. The consumed messages below are tolerant

    local copies: only the fields this service relies on are required, unknown

    fields and unknown types are ignored, dispatch is on the full `type`.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/retailnetwork/node-performance`), `type`,

    `subject` (the scorecardId, `nodeId:window`), `time`, `datacontenttype`

    (`application/json`) and `dataschema`

    (`urn:retailnetwork:node-performance:<stream>:<EventName>:v1`) are all

    required. Kafka key = the subject, so one scorecard's events stay ordered on

    one partition. Type =
    `com.retailnetwork.partner.node-performance.scorecard.<EventName>`.

    A breaking payload change is a new `.v2` type, never a mutation.


    **Conventions.** `data` is camelCase; ids are strings; instants are RFC 3339

    UTC; durations are integers named `...Minutes`; optional fields are omitted

    when absent (never null); evolution is additive only.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  nodePerformanceEvents:
    address: retailnetwork.node-performance.events
    title: node-performance integration topic
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (the scorecardId). Every message carries the CloudEvents
      content-type header. Dispatch on the full `type`, ignore unknown types,
      dedupe on `id`.
    messages:
      NodeScorecardUpdated:
        name: NodeScorecardUpdated
        title: Node scorecard updated
        summary: >-
          A node scorecard was recomputed and its grade, state or metrics
          changed.
        description: >-
          `type` =
          `com.retailnetwork.partner.node-performance.scorecard.NodeScorecardUpdated`;
          subject and key = the scorecardId (`nodeId:window`). Raised by
          Recompute once the scorecard is saved, and not while a scorecard stays
          PROVISIONAL. `grade` is `PROVISIONAL` below minObservations (50) and
          also when a GRADED scorecard falls back below it. Consumers use the
          30d window; PROVISIONAL adds no handicap (G20, E18). Metric
          definitions are in ADR 0002 (A5-A10).
        contentType: application/cloudevents+json
        tags:
          - name: scorecard
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: The CloudEvents id; the idempotency key of every consumer.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id of the producer.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                source:
                  const: /retailnetwork/node-performance
                  x-parser-schema-id: <anonymous-schema-10>
                data:
                  type: object
                  required:
                    - nodeId
                    - window
                    - grade
                    - onTimeHandoverRate
                    - lateAckRate
                    - rejectRate
                    - expiryRate
                    - promiseKeptRate
                    - feedFreshnessP95Minutes
                    - observations
                    - computedAt
                  properties:
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    window:
                      type: string
                      enum:
                        - 7d
                        - 30d
                      x-parser-schema-id: ScorecardWindow
                    grade:
                      type: string
                      enum:
                        - A
                        - B
                        - C
                        - D
                        - PROVISIONAL
                      x-parser-schema-id: ScorecardGrade
                    onTimeHandoverRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      x-parser-schema-id: <anonymous-schema-13>
                    lateAckRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      x-parser-schema-id: <anonymous-schema-14>
                    rejectRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      x-parser-schema-id: <anonymous-schema-15>
                    expiryRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      x-parser-schema-id: <anonymous-schema-16>
                    promiseKeptRate:
                      type: number
                      minimum: 0
                      maximum: 1
                      x-parser-schema-id: <anonymous-schema-17>
                    feedFreshnessP95Minutes:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-18>
                    observations:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-19>
                    computedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-20>
                  x-parser-schema-id: <anonymous-schema-11>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: NodeScorecardUpdatedEvent
        examples:
          - name: nodeScorecardUpdated
            summary: >-
              A node scorecard was recomputed and its grade, state or metrics
              changed.
            payload:
              specversion: '1.0'
              id: 7d0c6a52-3f7e-4b8e-9a51-2a8f0c1d9e44
              source: /retailnetwork/node-performance
              type: >-
                com.retailnetwork.partner.node-performance.scorecard.NodeScorecardUpdated
              subject: node-0f3a91:30d
              time: '2026-10-22T14:03:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:node-performance:events:NodeScorecardUpdated:v1
              data:
                nodeId: node-0f3a91
                window: 30d
                grade: B
                onTimeHandoverRate: 0.962
                lateAckRate: 0.021
                rejectRate: 0.012
                expiryRate: 0.004
                promiseKeptRate: 0.951
                feedFreshnessP95Minutes: 38
                observations: 1874
                computedAt: '2026-10-22T14:03:00Z'
        x-parser-unique-object-id: NodeScorecardUpdated
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: nodePerformanceEvents
  nodePerformanceAnalytics:
    address: retailnetwork.node-performance.analytics
    title: node-performance analytics topic
    description: |
      Analytics-only events (conventions.analytics_rule): written ONLY here,
      never to the integration topic. No in-organization consumer.
    messages:
      NodeThresholdBreached:
        name: NodeThresholdBreached
        title: Node threshold breached
        summary: A metric of a graded scorecard crossed its alert threshold downward.
        description: >-
          `type` =
          `com.retailnetwork.partner.node-performance.scorecard.NodeThresholdBreached`;
          subject and key = the scorecardId. Analytics only: published ONLY to
          `retailnetwork.node-performance.analytics`, dataschema stream
          `analytics`. Raised by Recompute (policy ThresholdAlert), one event
          per metric that moved from the healthy side of its threshold to the
          unhealthy side between two GRADED recomputes. `value` is the metric's
          new value, `threshold` the bound it crossed (ADR 0002, A11).
        contentType: application/cloudevents+json
        tags:
          - name: scorecard
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: The CloudEvents id; the idempotency key of every consumer.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id of the producer.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                source:
                  const: /retailnetwork/node-performance
                  x-parser-schema-id: <anonymous-schema-22>
                data:
                  type: object
                  required:
                    - nodeId
                    - metric
                    - value
                    - threshold
                    - window
                  properties:
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-24>
                    metric:
                      type: string
                      enum:
                        - onTimeHandoverRate
                        - lateAckRate
                        - rejectRate
                        - expiryRate
                        - promiseKeptRate
                        - feedFreshnessP95Minutes
                      x-parser-schema-id: <anonymous-schema-25>
                    value:
                      type: number
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-26>
                    threshold:
                      type: number
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-27>
                    window:
                      type: string
                      enum:
                        - 7d
                        - 30d
                      x-parser-schema-id: ScorecardWindow
                  x-parser-schema-id: <anonymous-schema-23>
              x-parser-schema-id: <anonymous-schema-21>
          x-parser-schema-id: NodeThresholdBreachedEvent
        examples:
          - name: nodeThresholdBreached
            summary: >-
              A metric of a graded scorecard crossed its alert threshold
              downward.
            payload:
              specversion: '1.0'
              id: 7d0c6a52-3f7e-4b8e-9a51-2a8f0c1d9e45
              source: /retailnetwork/node-performance
              type: >-
                com.retailnetwork.partner.node-performance.scorecard.NodeThresholdBreached
              subject: node-0f3a91:7d
              time: '2026-10-22T14:03:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:node-performance:analytics:NodeThresholdBreached:v1
              data:
                nodeId: node-0f3a91
                metric: onTimeHandoverRate
                value: 0.88
                threshold: 0.9
                window: 7d
        x-parser-unique-object-id: NodeThresholdBreached
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: nodePerformanceAnalytics
  vendorConnectivityEvents:
    address: retailnetwork.vendor-connectivity.events
    title: vendor-connectivity integration topic (consumed)
    description: >-
