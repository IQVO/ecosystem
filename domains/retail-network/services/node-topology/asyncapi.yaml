operations:
  publishNodeTopologyEvents:
    action: send
    title: Publish node-topology events
    summary: Publish the nine node-topology events through the transactional outbox.
    description: |
      The service sends every event of its four aggregates (Node, Lane,
      ServiceArea, Region) to `retailnetwork.node-topology.events`. Consumers
      route on the full `type`.
    tags:
      - name: node-topology
    channel:
      address: retailnetwork.node-topology.events
      title: node-topology integration topic
      description: >
        This service's integration topic. Written by the outbox relay; key =

        subject (nodeId, laneId, postalPrefix or regionId). Every message
        carries

        the CloudEvents content-type header. Dispatch on the full `type`, ignore

        unknown types, dedupe on `id`.
      messages:
        NodeRegistered:
          name: NodeRegistered
          title: Node registered
          summary: A node was registered in state PROPOSED.
          description: >-
            `type` =
            `com.retailnetwork.logistics.node-topology.node.NodeRegistered`;
            subject and key = the nodeId. Raised by RegisterNode. Capabilities
            are not on the wire: derive them from `nodeType` (policy
            DefaultCapabilitiesByType). `subtype`, `vendorId` and
            `vendorNodeCode` are null when not applicable (network-operated
            nodes have no vendor).
          contentType: application/cloudevents+json
          tags:
            - name: node
          payload:
            allOf:
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - type
                  - subject
                  - time
                  - datacontenttype
                  - dataschema
                  - data
                properties:
                  specversion:
                    type: string
                    const: '1.0'
                    x-parser-schema-id: <anonymous-schema-1>
                  id:
                    type: string
                    format: uuid
                    x-parser-schema-id: <anonymous-schema-2>
                  source:
                    type: string
                    const: /retailnetwork/node-topology
                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    description: The aggregate root id (nodeId
                    laneId: null
                    postalPrefix or regionId).: null
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    required:
                      - nodeId
                      - nodeType
                      - subtype
                      - operator
                      - vendorId
                      - vendorNodeCode
                      - regionId
                      - timezone
                      - postalCode
                      - countryCode
                    properties:
                      nodeId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-11>
                      nodeType:
                        type: string
                        enum:
                          - FULFILLMENT_CENTER
                          - INBOUND_CROSS_DOCK
                          - RETURNS_CENTER
                          - SORTATION_CENTER
                          - DELIVERY_STATION
                          - AIR_HUB
                        x-parser-schema-id: NodeType
                      subtype:
                        description: >-
                          A FULFILLMENT_CENTER subtype; null for every other
                          node type.
                        oneOf:
                          - type: string
                            enum:
                              - SORTABLE
                              - NON_SORTABLE
                              - XL
                              - SOFT_LINES
                              - SUB_SAME_DAY
                              - FRESH
                              - MICRO
                            x-parser-schema-id: NodeSubtype
                          - type: 'null'
                            x-parser-schema-id: <anonymous-schema-13>
                        x-parser-schema-id: <anonymous-schema-12>
                      operator:
                        type: string
                        enum:
                          - NETWORK
                          - VENDOR
                        x-parser-schema-id: NodeOperator
                      vendorId:
                        type:
                          - string
                          - 'null'
                        description: Set when operator is VENDOR; null otherwise.
                        x-parser-schema-id: <anonymous-schema-14>
                      vendorNodeCode:
                        type:
                          - string
                          - 'null'
                        description: >-
                          The vendor's own code of the node; set when operator
                          is VENDOR; null otherwise.
                        x-parser-schema-id: <anonymous-schema-15>
                      regionId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-16>
                      timezone:
