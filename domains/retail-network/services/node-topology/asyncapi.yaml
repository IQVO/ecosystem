        x-parser-unique-object-id: NodeOperationalProfileDeclared
      NodeActivated:
        name: NodeActivated
        title: Node activated
        summary: A node became ACTIVE (from PROPOSED or SUSPENDED).
        description: >-
          `type` =
          `com.retailnetwork.logistics.node-topology.node.NodeActivated`;
          subject and key = the nodeId. Raised by ActivateNode. From now on the
          node may take customer demand if it has the OUTBOUND capability.
        contentType: application/cloudevents+json
        tags:
          - name: node
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
