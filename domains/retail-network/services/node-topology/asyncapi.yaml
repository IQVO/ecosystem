asyncapi: 3.0.0
info:
  title: node-topology Domain Events
  version: 1.0.0
  contact:
    name: node-topology maintainers
    url: https://github.com/IQVO/node-topology
    email: node-topology@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: node-topology
      description: The node-topology bounded context (retail network, logistics tier).
    - name: node
      description: Events raised by the Node aggregate.
    - name: lane
      description: Events raised by the Lane aggregate.
    - name: servicearea
      description: Events raised by the ServiceArea aggregate.
    - name: region
      description: Events raised by the Region aggregate.
  description: >
    Event catalog for the **node-topology** bounded context of the retail

    network (logistics tier): the authoritative registry of nodes, their

    declared operational profiles, the directed lanes between them, the regions

    and which delivery station serves which postal prefix (ADR 0001, ADR 0002).


    **Published.** Nine events, all on the topic
    `retailnetwork.node-topology.events`,

    through a **transactional outbox**: the aggregate row and its
    already-encoded

    events are written in ONE database transaction and an always-on relay drains

    them to Kafka (at-least-once; the CloudEvents `id` is stored with the outbox

    row, so a retry republishes the same `id`). The nine types are catalogued in

    ADR 0004.


    **Consumed.** None (ADR 0003). The context consumes no Kafka topic and calls

    no sibling context.


    **Analytics.** The model names no analytics-only event for this context, so

    nothing is published on `retailnetwork.node-topology.analytics`.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/retailnetwork/node-topology`), `type`,

    `subject` (the aggregate root id), `time`, `datacontenttype`

    (`application/json`) and `dataschema`

    (`urn:retailnetwork:node-topology:events:<EventName>:v1`) are all required.

    Kafka key = the subject, so one aggregate's events stay ordered on one

    partition. Type =
    `com.retailnetwork.logistics.node-topology.<entity>.<EventName>`

    with entity `node`, `lane`, `servicearea` or `region`. A breaking payload

    change is a new `.v2` type, never a mutation. Dispatch on the full `type`,

    ignore unknown types, dedupe on `id`.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC; local

    times are `HH:mm` in the declared `timezone`; optional fields are omitted

    when unset except where a message says a field is `null`.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  nodeTopologyEvents:
    address: retailnetwork.node-topology.events
    title: node-topology integration topic
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (nodeId, laneId, postalPrefix or regionId). Every message carries
      the CloudEvents content-type header. Dispatch on the full `type`, ignore
      unknown types, dedupe on `id`.
    messages:
      NodeRegistered:
        name: NodeRegistered
        title: Node registered
        summary: A node was registered in state PROPOSED.
        description: >-
          `type` =
          `com.retailnetwork.logistics.node-topology.node.NodeRegistered`;
          subject and key = the nodeId. Raised by RegisterNode. Capabilities are
          not on the wire: derive them from `nodeType` (policy
          DefaultCapabilitiesByType). `subtype`, `vendorId` and `vendorNodeCode`
          are null when not applicable (network-operated nodes have no vendor).
        contentType: application/cloudevents+json
        tags:
          - name: node
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/node-topology
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (nodeId
                  laneId: null
                  postalPrefix or regionId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - nodeId
                    - nodeType
                    - subtype
                    - operator
                    - vendorId
                    - vendorNodeCode
                    - regionId
                    - timezone
                    - postalCode
                    - countryCode
                  properties:
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    nodeType:
                      type: string
                      enum:
                        - FULFILLMENT_CENTER
                        - INBOUND_CROSS_DOCK
                        - RETURNS_CENTER
                        - SORTATION_CENTER
                        - DELIVERY_STATION
                        - AIR_HUB
                      x-parser-schema-id: NodeType
                    subtype:
                      description: >-
                        A FULFILLMENT_CENTER subtype; null for every other node
                        type.
                      oneOf:
                        - type: string
                          enum:
                            - SORTABLE
                            - NON_SORTABLE
                            - XL
                            - SOFT_LINES
                            - SUB_SAME_DAY
                            - FRESH
                            - MICRO
                          x-parser-schema-id: NodeSubtype
                        - type: 'null'
                          x-parser-schema-id: <anonymous-schema-13>
                      x-parser-schema-id: <anonymous-schema-12>
                    operator:
                      type: string
                      enum:
                        - NETWORK
                        - VENDOR
                      x-parser-schema-id: NodeOperator
                    vendorId:
                      type:
                        - string
                        - 'null'
                      description: Set when operator is VENDOR; null otherwise.
                      x-parser-schema-id: <anonymous-schema-14>
                    vendorNodeCode:
                      type:
                        - string
                        - 'null'
                      description: >-
                        The vendor's own code of the node; set when operator is
                        VENDOR; null otherwise.
                      x-parser-schema-id: <anonymous-schema-15>
                    regionId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-16>
                    timezone:
                      type: string
                      description: IANA time zone of the building.
                      x-parser-schema-id: <anonymous-schema-17>
                    postalCode:
                      type: string
                      x-parser-schema-id: <anonymous-schema-18>
                    countryCode:
                      type: string
                      description: ISO 3166-1 alpha-2.
                      x-parser-schema-id: <anonymous-schema-19>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: NodeRegisteredEvent
        examples:
          - name: nodeRegistered
            summary: A node was registered in state PROPOSED.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
              source: /retailnetwork/node-topology
              type: com.retailnetwork.logistics.node-topology.node.NodeRegistered
              subject: node-0f3a91
              time: '2026-10-22T13:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:node-topology:events:NodeRegistered:v1
              data:
                nodeId: node-0f3a91
                nodeType: FULFILLMENT_CENTER
                subtype: SORTABLE
                operator: VENDOR
                vendorId: vendor-77
                vendorNodeCode: SP-CAJAMAR-01
                regionId: region-se
                timezone: America/Sao_Paulo
                postalCode: 07750-000
                countryCode: BR
        x-parser-unique-object-id: NodeRegistered
      NodeOperationalProfileDeclared:
        name: NodeOperationalProfileDeclared
        title: Node operational profile declared
        summary: A new operational profile revision was stored for a node.
        description: >-
          `type` =
          `com.retailnetwork.logistics.node-topology.node.NodeOperationalProfileDeclared`;
          subject and key = the nodeId. Raised by DeclareOperationalProfile.
          `profileRevision` strictly increases per node; consumers keep the
          highest. Local times are `HH:mm` in `timezone`; a weekday missing from
          `operatingHoursByDay` is closed; `holidays` are ISO dates closed all
          day. A cutoff without `days` applies to every operating day.
          `sortDwellMinutes` is present only for SORTATION_CENTER and AIR_HUB
          nodes. `inbound` is present only when the revision declares inbound
          limits (absent = none declared, consumers treat them as unchecked);
          every limit inside it is optional, weight is in grams and dimensions
          in millimetres.
        contentType: application/cloudevents+json
        tags:
          - name: node
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/node-topology
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (nodeId
                  laneId: null
                  postalPrefix or regionId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - nodeId
                    - profileRevision
                    - timezone
                    - operatingHoursByDay
                    - holidays
                    - handlingTimeMinutes
                    - cutoffs
                    - throughputCap
                    - declaredBy
                  properties:
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-22>
                    profileRevision:
                      type: integer
                      minimum: 1
                      description: Strictly increasing per node.
                      x-parser-schema-id: <anonymous-schema-23>
                    timezone:
                      type: string
                      description: IANA time zone the local times are in.
                      x-parser-schema-id: <anonymous-schema-24>
                    operatingHoursByDay:
                      type: object
                      description: >-
                        Per weekday, the local opening hours. A missing weekday
                        is closed.
                      additionalProperties: false
                      properties:
                        monday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                        tuesday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                        wednesday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                        thursday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                        friday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                        saturday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                        sunday:
                          type: object
                          required:
                            - start
                            - end
                          properties:
                            start:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local opening time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-25>
                            end:
                              type: string
                              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                              description: Local closing time
                              HH:mm.: null
                              x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: DayHours
                      x-parser-schema-id: OperatingHoursByDay
                    holidays:
                      type: array
                      description: ISO dates on which the node is closed all day.
                      items:
                        type: string
                        format: date
                        x-parser-schema-id: <anonymous-schema-28>
                      x-parser-schema-id: <anonymous-schema-27>
                    handlingTimeMinutes:
                      type: integer
                      minimum: 0
                      description: >-
                        Declared time from order release to a package ready for
                        handover.
                      x-parser-schema-id: <anonymous-schema-29>
                    cutoffs:
                      type: array
                      items:
                        type: object
                        required:
                          - localTime
                        properties:
                          localTime:
                            type: string
                            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                            description: >-
                              Local time HH:mm by which packages are ready for
                              handover.
                            x-parser-schema-id: <anonymous-schema-31>
                          days:
                            type: array
                            description: >-
                              The weekdays the cutoff applies to. Absent means
                              every operating day.
                            minItems: 1
                            uniqueItems: true
                            items:
                              type: string
                              enum:
                                - monday
                                - tuesday
                                - wednesday
                                - thursday
                                - friday
                                - saturday
                                - sunday
                              x-parser-schema-id: Weekday
                            x-parser-schema-id: <anonymous-schema-32>
                          maxOrders:
                            type: integer
                            minimum: 1
                            x-parser-schema-id: <anonymous-schema-33>
                        x-parser-schema-id: CutoffSlot
                      x-parser-schema-id: <anonymous-schema-30>
                    throughputCap:
                      type: object
                      required:
                        - value
                        - timeUnit
                        - unit
                      properties:
                        value:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-34>
                        timeUnit:
                          type: string
                          enum:
                            - HOUR
                            - DAY
                          x-parser-schema-id: <anonymous-schema-35>
                        unit:
                          type: string
                          const: ORDER
                          x-parser-schema-id: <anonymous-schema-36>
                      x-parser-schema-id: ThroughputCap
                    sortDwellMinutes:
                      type: integer
                      minimum: 0
                      description: >-
                        Omitted unless the node is a SORTATION_CENTER or an
                        AIR_HUB.
                      x-parser-schema-id: <anonymous-schema-37>
                    inbound:
                      type: object
                      description: >-
                        Optional inbound limits of the node. Present only when
                        declared; every field is optional, at least one is set.
                      minProperties: 1
                      properties:
                        maxCartonWeightG:
                          type: integer
                          minimum: 1
                          description: The heaviest carton the node accepts
                          in grams.: null
                          x-parser-schema-id: <anonymous-schema-38>
                        maxCartonDimsMm:
                          type: object
                          description: >-
                            The largest carton the node accepts, in millimetres;
                            the three edges are always together.
                          required:
                            - l
                            - w
                            - h
                          properties:
                            l:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-40>
                            w:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-41>
                            h:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-42>
                          x-parser-schema-id: <anonymous-schema-39>
                        acceptsPallets:
                          type: boolean
                          description: Whether the node receives pallets.
                          x-parser-schema-id: <anonymous-schema-43>
                        requiresSscc:
                          type: boolean
                          description: Whether every inbound carton must carry an SSCC.
                          x-parser-schema-id: <anonymous-schema-44>
                      x-parser-schema-id: InboundLimits
                    declaredBy:
                      type: string
                      enum:
                        - VENDOR
                        - NETWORK_OPS
                      x-parser-schema-id: <anonymous-schema-45>
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: <anonymous-schema-20>
          x-parser-schema-id: NodeOperationalProfileDeclaredEvent
        examples:
          - name: nodeOperationalProfileDeclared
            summary: A new operational profile revision was stored for a node.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c44
              source: /retailnetwork/node-topology
              type: >-
                com.retailnetwork.logistics.node-topology.node.NodeOperationalProfileDeclared
              subject: node-0f3a91
              time: '2026-10-22T13:05:12Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:node-topology:events:NodeOperationalProfileDeclared:v1
              data:
                nodeId: node-0f3a91
                profileRevision: 3
                timezone: America/Sao_Paulo
                operatingHoursByDay:
                  monday:
                    start: '06:00'
                    end: '22:00'
                  tuesday:
                    start: '06:00'
                    end: '22:00'
                  wednesday:
                    start: '06:00'
                    end: '22:00'
                  thursday:
                    start: '06:00'
                    end: '22:00'
                  friday:
                    start: '06:00'
                    end: '22:00'
                  saturday:
                    start: '08:00'
                    end: '14:00'
                holidays:
                  - '2026-12-25'
                handlingTimeMinutes: 240
                cutoffs:
                  - localTime: '11:00'
                  - localTime: '18:00'
                    days:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                    maxOrders: 1200
                throughputCap:
                  value: 400
                  timeUnit: HOUR
                  unit: ORDER
                declaredBy: VENDOR
          - name: nodeOperationalProfileDeclaredWithInbound
            summary: >-
              A revision that declares inbound limits; seller-side consumers
              keep them as a local view.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c46
              source: /retailnetwork/node-topology
              type: >-
                com.retailnetwork.logistics.node-topology.node.NodeOperationalProfileDeclared
              subject: node-0f3a91
              time: '2026-10-22T14:20:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:node-topology:events:NodeOperationalProfileDeclared:v1
              data:
                nodeId: node-0f3a91
                profileRevision: 4
                timezone: America/Sao_Paulo
                operatingHoursByDay:
