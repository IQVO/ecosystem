asyncapi: 3.0.0
info:
  title: offer-availability Domain Events
  version: 1.0.0
  contact:
    name: offer-availability maintainers
    url: https://github.com/IQVO/offer-availability
    email: offer-availability@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: offer-availability
      description: The offer-availability bounded context (retail network, commerce tier).
    - name: catalogitem
      description: Events raised by the CatalogItem aggregate.
    - name: listing
      description: Events raised by the Listing aggregate.
    - name: inventoryfeed
      description: Events raised by the InventoryFeed aggregate.
    - name: node-topology
      description: Events consumed from the node-topology bounded context.
  description: >
    Event catalog for the **offer-availability** bounded context of the retail

    network (commerce tier): the network's catalogue items, one listing per

    (catalogue item, node) and the quantity each node claims it can ship, with

    the basis the vendor gave (ADR 0001, ADR 0002).


    **Published.** Nine events, all integration events on the topic

    `retailnetwork.offer-availability.events`, through a **transactional

    outbox**: the aggregates and their already-encoded events are written in ONE

    database transaction and an always-on relay drains them to Kafka

    (at-least-once; the CloudEvents `id` is stored with the outbox row, so a

    retry republishes the same `id`). The nine types are catalogued in ADR 0004.

    A listing created on a node that is not sellable raises ListingCreated and,

    in the same transaction, ListingSuppressed (ADR 0002, A6), so a consumer

    never has to guess the initial state.


    **Consumed.** Four node-topology events (`NodeRegistered`, `NodeActivated`,

    `NodeSuspended`, `NodeRetired`) from `retailnetwork.node-topology.events`,

    in the consumer group given by `NODE_STATUS_CONSUMER_GROUP` (proposed value

    `offer-availability-node-status`). They feed the local NodeStatusView and

    drive the SuppressOnNodeUnavailable policy (ADR 0003). The consumer

    dispatches on the full `type`, ignores every other type, tolerates unknown

    fields, and dedupes on the CloudEvents `id` (inbox table
    `processed_events`).


    **Analytics.** The model names no analytics-only event for this context, so

    nothing is published on `retailnetwork.offer-availability.analytics`.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/retailnetwork/offer-availability`), `type`,

    `subject` (the aggregate root id), `time`, `datacontenttype`

    (`application/json`) and `dataschema`

    (`urn:retailnetwork:offer-availability:events:<EventName>:v1`) are all

    required. Kafka key = the subject, so one aggregate's events stay ordered on

    one partition. Type =

    `com.retailnetwork.commerce.offer-availability.<entity>.<EventName>` with

    entity `catalogitem`, `listing` or `inventoryfeed`. A breaking payload

    change is a new `.v2` type, never a mutation. Dispatch on the full `type`,

    ignore unknown types, dedupe on `id`.


    **Conventions.** `data` is camelCase; ids are strings; timestamps are RFC

    3339 UTC; counts are integers; enums are UPPER_SNAKE; optional fields are

    omitted when unset (never null).
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  offerAvailabilityEvents:
    address: retailnetwork.offer-availability.events
    title: offer-availability integration topic
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (catalogItemId, listingId or feedId). Every message carries the
      CloudEvents content-type header. Dispatch on the full `type`, ignore
      unknown types, dedupe on `id`.
    messages:
      CatalogItemCreated:
        name: CatalogItemCreated
        title: Catalogue item created
        summary: A catalogue item was created in state ACTIVE.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated`;
          subject and key = the catalogItemId. Raised by CreateCatalogItem.
          Dimensions are in millimetres and the weight in grams, all positive.
          `gtin` is the optional identifiers.gtin (14 digits, GS1 check digit
          validated) and is omitted when the item has none.
        contentType: application/cloudevents+json
        tags:
          - name: catalogitem
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/offer-availability
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (catalogItemId
                  listingId or feedId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - catalogItemId
                    - title
                    - lengthMm
                    - widthMm
                    - heightMm
                    - weightG
                    - hazmat
                    - fragile
                  properties:
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    title:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    lengthMm:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-13>
                    widthMm:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-14>
                    heightMm:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-15>
                    weightG:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-16>
                    hazmat:
                      type: boolean
                      x-parser-schema-id: <anonymous-schema-17>
                    fragile:
                      type: boolean
                      x-parser-schema-id: <anonymous-schema-18>
                    gtin:
                      type: string
                      pattern: ^[0-9]{14}$
                      description: The optional identifiers.gtin
                      normalised to 14 digits; omitted when the item has none.: null
                      x-parser-schema-id: <anonymous-schema-19>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: CatalogItemCreatedEvent
        examples:
          - name: catalogItemCreated
            summary: A catalogue item was created.
            payload:
              specversion: '1.0'
              id: 7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a10
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated
              subject: item-004512
              time: '2026-10-23T09:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemCreated:v1
              data:
                catalogItemId: item-004512
                title: Stainless steel water bottle 750 ml
                lengthMm: 270
                widthMm: 75
                heightMm: 75
                weightG: 340
                hazmat: false
                fragile: false
                gtin: '06141410000120'
        x-parser-unique-object-id: CatalogItemCreated
      CatalogItemDiscontinued:
        name: CatalogItemDiscontinued
        title: Catalogue item discontinued
        summary: A catalogue item moved from ACTIVE to DISCONTINUED.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued`;
          subject and key = the catalogItemId. Raised by DiscontinueItem. Every
          listing of the item is suppressed in the same transaction (reason
          DISCONTINUED), each with its own ListingSuppressed.
        contentType: application/cloudevents+json
        tags:
          - name: catalogitem
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/offer-availability
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (catalogItemId
                  listingId or feedId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - catalogItemId
                  properties:
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-22>
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: <anonymous-schema-20>
          x-parser-schema-id: CatalogItemDiscontinuedEvent
        examples:
          - name: catalogItemDiscontinued
            summary: A catalogue item was discontinued.
            payload:
              specversion: '1.0'
              id: 7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a11
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued
              subject: item-004512
              time: '2026-10-23T09:30:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemDiscontinued:v1
              data:
                catalogItemId: item-004512
        x-parser-unique-object-id: CatalogItemDiscontinued
      CatalogItemPackagingDeclared:
        name: CatalogItemPackagingDeclared
        title: Catalogue item pack level declared
        summary: >-
          A pack level of a catalogue item was declared (or its dimensions
          changed in place).
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackagingDeclared`;
          subject and key = the catalogItemId. Raised by DeclarePackLevel (ADR
          0006). `unitsPerPack` is in eaches (1 for EACH); `childGtin` names the
          active lower level and is omitted for EACH. The unitsPerPack of a GTIN
          never changes: a new count arrives as a new `gtin` at the level,
          preceded in the same transaction by CatalogItemPackLevelRetired for
          the old one.
        contentType: application/cloudevents+json
        tags:
          - name: catalogitem
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/offer-availability
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (catalogItemId
                  listingId or feedId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - catalogItemId
                    - level
                    - gtin
                    - unitsPerPack
                    - declaredAt
                  properties:
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-25>
                    level:
                      type: string
                      enum:
                        - EACH
                        - INNER
                        - CASE
                        - PALLET
                      description: Packaging level, lowest first.
                      x-parser-schema-id: PackLevel
                    gtin:
                      type: string
                      pattern: ^[0-9]{14}$
                      x-parser-schema-id: <anonymous-schema-26>
                    childGtin:
                      type: string
                      pattern: ^[0-9]{14}$
                      description: The GTIN of the active lower level; omitted for EACH.
                      x-parser-schema-id: <anonymous-schema-27>
                    unitsPerPack:
                      type: integer
                      minimum: 1
                      maximum: 1000000
                      description: Eaches in one pack; 1 for EACH.
                      x-parser-schema-id: <anonymous-schema-28>
                    declaredAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-29>
                  x-parser-schema-id: <anonymous-schema-24>
              x-parser-schema-id: <anonymous-schema-23>
          x-parser-schema-id: CatalogItemPackagingDeclaredEvent
        examples:
          - name: catalogItemPackagingDeclared
            summary: An inner pack of six eaches was declared.
            payload:
              specversion: '1.0'
              id: 7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a20
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackagingDeclared
              subject: item-004512
              time: '2026-10-24T09:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemPackagingDeclared:v1
              data:
                catalogItemId: item-004512
                level: INNER
                gtin: '06141410000298'
                childGtin: '06141410000120'
                unitsPerPack: 6
                declaredAt: '2026-10-24T09:00:00Z'
        x-parser-unique-object-id: CatalogItemPackagingDeclared
      CatalogItemPackLevelRetired:
        name: CatalogItemPackLevelRetired
        title: Catalogue item pack level retired
        summary: The active pack level of a catalogue item was retired.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackLevelRetired`;
          subject and key = the catalogItemId. Raised by RetirePackLevel, or by
          DeclarePackLevel when a new GTIN supersedes the level (then it
          precedes the CatalogItemPackagingDeclared of the new GTIN). The
          retired GTIN stays resolvable and is never reused.
        contentType: application/cloudevents+json
        tags:
          - name: catalogitem
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/offer-availability
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (catalogItemId
                  listingId or feedId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - catalogItemId
                    - level
                    - gtin
                    - retiredAt
                  properties:
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-32>
                    level:
                      type: string
                      enum:
                        - EACH
                        - INNER
                        - CASE
                        - PALLET
                      description: Packaging level, lowest first.
                      x-parser-schema-id: PackLevel
                    gtin:
                      type: string
                      pattern: ^[0-9]{14}$
                      x-parser-schema-id: <anonymous-schema-33>
                    retiredAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-34>
                  x-parser-schema-id: <anonymous-schema-31>
              x-parser-schema-id: <anonymous-schema-30>
          x-parser-schema-id: CatalogItemPackLevelRetiredEvent
        examples:
          - name: catalogItemPackLevelRetired
            summary: The case level was retired.
            payload:
              specversion: '1.0'
              id: 7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a21
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackLevelRetired
              subject: item-004512
              time: '2026-10-24T10:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemPackLevelRetired:v1
              data:
                catalogItemId: item-004512
                level: CASE
                gtin: '06141410000366'
                retiredAt: '2026-10-24T10:00:00Z'
        x-parser-unique-object-id: CatalogItemPackLevelRetired
      ListingCreated:
        name: ListingCreated
        title: Listing created
        summary: A catalogue item is now offered from a node.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.listing.ListingCreated`;
          subject and key = the listingId. Raised by CreateListing. The event
          does not say whether the listing starts LIVE: a listing created on a
          node that is not sellable, or for a discontinued item, is followed in
          the same transaction by a ListingSuppressed. Availability starts at 0
          with basis UNKNOWN until the first feed.
        contentType: application/cloudevents+json
        tags:
          - name: listing
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/offer-availability
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (catalogItemId
                  listingId or feedId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - listingId
                    - catalogItemId
                    - nodeId
                  properties:
                    listingId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-37>
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-38>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-39>
                    ownerRef:
                      type: string
                      description: >-
                        The owning seller (sellerId); omitted for an
                        operator-owned listing.
                      x-parser-schema-id: <anonymous-schema-40>
                  x-parser-schema-id: <anonymous-schema-36>
              x-parser-schema-id: <anonymous-schema-35>
          x-parser-schema-id: ListingCreatedEvent
        examples:
          - name: listingCreated
            summary: A listing was created.
            payload:
              specversion: '1.0'
              id: 7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a12
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.listing.ListingCreated
              subject: lst-000184
              time: '2026-10-23T09:05:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:offer-availability:events:ListingCreated:v1
              data:
                listingId: lst-000184
                catalogItemId: item-004512
                nodeId: node-0f3a91
        x-parser-unique-object-id: ListingCreated
      ListingAvailabilityChanged:
        name: ListingAvailabilityChanged
        title: Listing availability changed
        summary: A feed replaced the available quantity of a listing.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.listing.ListingAvailabilityChanged`;
          subject and key = the listingId. Raised once per feed line that was
          applied and once per listing zeroed by FullFeedZeroing (a zeroed
          listing keeps its basis and gets the feed's asOf). `asOf` is strictly
          increasing per listing, so a consumer keeps the highest. Raised for a
          SUPPRESSED listing too: the state is carried by
          ListingSuppressed/ListingRestored, not here.
        contentType: application/cloudevents+json
        tags:
          - name: listing
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/offer-availability
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (catalogItemId
                  listingId or feedId).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - listingId
                    - catalogItemId
                    - nodeId
                    - availableQty
                    - basis
                    - asOf
                    - feedId
                  properties:
                    listingId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-43>
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-44>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-45>
                    ownerRef:
                      type: string
                      description: >-
                        The owning seller (sellerId); omitted for an
                        operator-owned listing.
                      x-parser-schema-id: <anonymous-schema-46>
                    availableQty:
                      type: integer
                      minimum: 0
                      x-parser-schema-id: <anonymous-schema-47>
                    basis:
                      type: string
                      description: >-
                        Why the node gave the number; kept as the vendor
                        declared it, never re-derived.
                      enum:
                        - PHYSICAL
                        - THROUGHPUT_CONSTRAINED
                        - UNKNOWN
                      x-parser-schema-id: Basis
                    asOf:
                      type: string
                      format: date-time
                      description: >-
