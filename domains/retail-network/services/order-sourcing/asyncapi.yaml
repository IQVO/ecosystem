asyncapi: 3.0.0
info:
  title: order-sourcing Domain Events
  version: 1.0.0
  contact:
    name: order-sourcing maintainers
    url: https://github.com/IQVO/order-sourcing
    email: order-sourcing@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: order-sourcing
      description: >-
        The order-sourcing bounded context (retail network, commerce tier,
        Core).
    - name: assignment
      description: Events raised by the FulfillmentAssignment aggregate.
    - name: consumed
      description: >-
        Events of sibling contexts this service consumes into its local read
        models or as commands.
  description: >-
    Event catalog for the **order-sourcing** bounded context of the retail
    network (commerce tier): it decides which vendor node and path fulfil each
    shipment group (ADR 0001, ADR 0002).


    **Published.** Ten events of the FulfillmentAssignment aggregate (entity
    `assignment`): eight on `retailnetwork.order-sourcing.events` and the two
    analytics-only ones (FulfillmentQueued, FulfillmentDelivered) ONLY on
    `retailnetwork.order-sourcing.analytics`, through a **transactional
    outbox**: the aggregate row and its already-encoded events are written in
    ONE database transaction and an always-on relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is stored with the outbox row, so a
    retry republishes the same `id`). The ten types are catalogued in ADR 0004.


    **Consumed.** Thirty-two event types from nine producers (ADR 0003):
    commands that drive the aggregate (CustomerOrderPlaced,
    CustomerOrderCancelled, PromiseRevised, the purchase-order outcomes,
    VendorShipmentConfirmed, PackageDelivered, BookingMoved) and the events that
    feed the five local read models (NodeProfileView, NetworkGraphView,
    AvailabilityView, ScorecardView, PromiseBookPressureView). Every consumer is
    idempotent on the CloudEvents `id` and dispatches on the full `type`;
    unknown types and fields are ignored.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/order-sourcing`), `type`,
    `subject` (the assignmentId), `time`, `datacontenttype` (`application/json`)
    and `dataschema`
    (`urn:retailnetwork:order-sourcing:<stream>:<EventName>:v1`) are all
    required. Kafka key = the subject. Type =
    `com.retailnetwork.commerce.order-sourcing.assignment.<EventName>`. A
    breaking payload change is a new `.v2` type, never a mutation.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC; optional
    fields are omitted when unset; arrays are always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  orderSourcingEvents:
    address: retailnetwork.order-sourcing.events
    title: order-sourcing integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject = assignmentId, so one assignment's events stay ordered on one
      partition. Every message carries the CloudEvents content-type header.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      FulfillmentReleasedToNode:
        name: FulfillmentReleasedToNode
        title: A group was released to one vendor node (a purchase order follows)
        summary: A group was released to one vendor node (a purchase order follows).
        description: >-
          `type` =
          `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentReleasedToNode`;
          subject and key = the assignmentId; stream `events` (topic
          `retailnetwork.order-sourcing.events`). Raised by ReleaseToNode
          (QUEUED to RELEASED). `releaseNo` is 1 for the first release and +1
          for each later one; with `assignmentId` it is the purchase order's
          idempotency key. `lines` is the whole group (fill-or-kill) with this
          node's listingId. No ship-to data: the release carries no PII.
          Consumers: vendor-connectivity, linehaul-transportation.
        contentType: application/cloudevents+json
        tags:
          - name: assignment
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/order-sourcing
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id (assignmentId for published events).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              description: >-
                The CloudEvents 1.0 structured-mode attributes of every event
                this service publishes.
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - assignmentId
                    - releaseNo
                    - orderId
                    - groupNo
                    - nodeId
                    - pickupDepartureId
                    - requiredShipBy
                    - promisedDeliverByLatest
                    - tier
                    - lines
                  properties:
                    assignmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    releaseNo:
                      type: integer
                      x-parser-schema-id: <anonymous-schema-12>
                    orderId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-13>
                    groupNo:
                      type: integer
                      x-parser-schema-id: <anonymous-schema-14>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-15>
                    pickupDepartureId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-16>
                    requiredShipBy:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-17>
                    promisedDeliverByLatest:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-18>
                    tier:
                      type: string
                      enum:
                        - SAME_DAY
                        - NEXT_DAY
                        - TWO_DAY
                        - STANDARD
                      x-parser-schema-id: <anonymous-schema-19>
                    lines:
                      type: array
                      items:
                        type: object
                        required:
                          - catalogItemId
                          - listingId
                          - quantity
