                            parentSscc:
                              type: string
                              pattern: ^[0-9]{18}$
                              x-parser-schema-id: <anonymous-schema-17>
                            kind:
                              type: string
                              enum:
                                - HOMOGENEOUS_CASE
                                - MIXED
