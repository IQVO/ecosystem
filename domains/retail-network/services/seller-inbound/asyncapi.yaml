    action: receive
    title: Receive order-sourcing events
    summary: Receive order-sourcing events this context relies on.
    description: >-
      Consumes FulfillmentReleasedToNode and FulfillmentCancelled into
      DemandHeatView (ADR 0012, Conformist): the released lines of an assignment
      group are the item-granular demand the placement advisory sums per region;
      a re-release replaces the group's lines (a reassignment moves the demand)
      and a cancel removes them.
    tags:
      - name: seller-inbound
    channel:
      address: retailnetwork.order-sourcing.events
      title: order-sourcing integration topic
      description: >-
        This service's integration topic. Written by the outbox relay; key =
        subject = assignmentId, so one assignment's events stay ordered on one
        partition. Every message carries the CloudEvents content-type header.
