                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - shipmentId
                    - sellerId
                    - nodeId
                    - status
                    - cartons
                    - receivedAt
                  properties:
                    shipmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-40>
                    sellerId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-41>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-42>
                    status:
                      type: string
                      enum:
                        - CLOSED
                        - CLOSED_WITH_DISCREPANCY
                      x-parser-schema-id: <anonymous-schema-43>
                    cartons:
                      type: array
                      items:
                        type: object
                        required:
