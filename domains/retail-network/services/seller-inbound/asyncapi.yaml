        `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived`;
        subject and key = the aggregate root id; stream `events`. Raised when
        every manifest carton has a final status (policy
        ReceiveOnVendorReceipt). `status` is CLOSED when nothing differed from
        the manifest, CLOSED_WITH_DISCREPANCY otherwise; `cartons` lists the
        manifest cartons and any UNEXPECTED ones. `receivedAt` is the vendor's
