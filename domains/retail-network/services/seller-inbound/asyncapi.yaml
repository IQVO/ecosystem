asyncapi: 3.0.0
info:
  title: seller-inbound Domain Events
  version: 1.0.0
  contact:
    name: seller-inbound maintainers
    url: https://github.com/IQVO/seller-inbound
    email: seller-inbound@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: seller-inbound
      description: The seller-inbound bounded context (retail network, partner tier).
    - name: seller
      description: 'Events about a seller: the SellerAccount aggregate and compliance facts.'
    - name: inboundplan
      description: Events raised by the InboundPlan aggregate.
    - name: inboundshipment
      description: Events raised by the InboundShipment aggregate.
  description: >
    Event catalog for the **seller-inbound** bounded context of the retail
    network (partner tier): the seller-facing front door for stock coming into
    the network.

    The REST contract is `apis/openapi.yaml`.


    **Published.** Ten types. `InboundShipmentLabelled`,
    `InboundShipmentShipped`, `InboundShipmentReceived`,
    `PlacementPlanSuggested`, `SellerSuspended` and `SellerReinstated` go ONLY
    to `retailnetwork.seller-inbound.events` (the seller status events are
    integration facts since ADR 0013); the other four (`SellerOnboarded`,
    `InboundPlanConfirmed`, `InboundDiscrepancyRecorded`,
    `SellerComplianceViolationRecorded`) go ONLY to
    `retailnetwork.seller-inbound.analytics` (the model marks them analytics
    only). Every event leaves through a **transactional outbox**: the aggregate
    row and the already-encoded events are written in ONE database transaction
    and an always-on relay drains them to Kafka (at-least-once; the CloudEvents
    `id` is stored with the outbox row, so a retry republishes the same `id`).


    **Consumed.** Eleven types from four producers (ADR 0003, ADR 0012):
    node-topology `NodeRegistered`, `NodeOperationalProfileDeclared`,
    `NodeActivated`, `NodeSuspended`, `NodeRetired` (local NodeInboundView);
    offer-availability `CatalogItemPackagingDeclared`,
    `CatalogItemPackLevelRetired` (local CatalogPackagingView),
    `ListingAvailabilityChanged` (DemandHeatView, the declared-availability
    half); order-sourcing `FulfillmentReleasedToNode`, `FulfillmentCancelled`
    (DemandHeatView, the demand half); vendor-connectivity
    `InboundReceiptSubmitted`. Each is deduplicated on the CloudEvents `id` in
    the `processed_events` inbox table and dispatched on the full `type`; a
    message that is not a valid CloudEvents 1.0 envelope is skipped with a WARN
    and a type this context does not act on is ignored (both are committed
    past). `data` is decoded tolerantly (unknown fields are ignored). Offsets
    are committed only after the handler succeeded; a transient failure retries
    the same message with capped exponential backoff, and a payload that can
    never be applied (a value the domain refuses, a forbidden transition, an
    unknown shipment) or an exhausted retry budget is dead-lettered to
    `<topic>.dlq` with the headers `x-dlq-source-topic`,
    `x-dlq-source-partition`, `x-dlq-source-offset`, `x-dlq-error` and
    `x-dlq-failed-at`. The consumed `data` below lists only the fields this
    context relies on. There are no synchronous calls to any neighbour.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/seller-inbound`), `type`,
    `subject` (the aggregate root id: `sellerId`, `planId` or `shipmentId`),
    `time`, `datacontenttype` (`application/json`) and `dataschema`
    (`urn:retailnetwork:seller-inbound:<stream>:<EventName>:v1`, stream `events`
    or `analytics`) are all required. Kafka key = the subject, so one shipment's
    events stay ordered on one partition. Type =
    `com.retailnetwork.partner.seller-inbound.<entity>.<EventName>` with entity
    `seller`, `inboundplan`, `inboundshipment` or `placementplan`.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC;
    quantities are ALWAYS eaches (`qtyEaches`); optional fields are omitted when
    absent (never null); arrays are always present. GTINs are 14 digits, SSCCs
    18 digits, both with a GS1 mod-10 check digit.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  sellerInboundEvents:
    address: retailnetwork.seller-inbound.events
    title: seller-inbound integration topic
    description: >-
      This service's integration topic, written by the outbox relay; key =
      subject. Carries the three shipment events other contexts consume, the
      seller status events SellerSuspended and SellerReinstated (consumed by
      offer-availability, ADR 0013) plus PlacementPlanSuggested (analytics only
      in v1, ADR 0012). Every message carries the CloudEvents content-type
      header. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      InboundShipmentLabelled:
        name: InboundShipmentLabelled
        title: Every carton of a shipment has a label; the manifest is frozen
        summary: Every carton of a shipment has a label; the manifest is frozen.
        description: >-
          `type` =
          `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentLabelled`;
          subject and key = the aggregate root id; stream `events`. Raised by
          LabelShipment. `cartons` is the full manifest: vendor-connectivity
          serves it on the Vendor API once the shipment ships. `parentSscc` is
          present only for a palletised carton; `lot` and `expiry` only when
          declared.
        contentType: application/cloudevents+json
        tags:
          - name: inboundshipment
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (sellerId, planId, shipmentId or the
                    producer's own root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - shipmentId
                    - planId
                    - sellerId
                    - nodeId
                    - cartons
                    - labelledAt
                  properties:
                    shipmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    planId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    sellerId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-13>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-14>
                    cartons:
                      type: array
                      items:
                        type: object
                        required:
                          - sscc
                          - kind
                          - contents
                          - grossWeightG
                          - dimsMm
                        properties:
                          sscc:
                            type: string
                            pattern: ^[0-9]{18}$
                            x-parser-schema-id: <anonymous-schema-16>
                          parentSscc:
                            type: string
                            pattern: ^[0-9]{18}$
                            x-parser-schema-id: <anonymous-schema-17>
                          kind:
                            type: string
                            enum:
                              - HOMOGENEOUS_CASE
                              - MIXED
                            x-parser-schema-id: <anonymous-schema-18>
                          contents:
                            type: array
                            items:
                              type: object
                              required:
                                - catalogItemId
                                - gtin
                                - qtyEaches
                              properties:
                                catalogItemId:
                                  type: string
                                  x-parser-schema-id: <anonymous-schema-20>
                                gtin:
                                  type: string
                                  pattern: ^[0-9]{14}$
                                  x-parser-schema-id: <anonymous-schema-21>
                                qtyEaches:
                                  type: integer
                                  minimum: 1
                                  x-parser-schema-id: <anonymous-schema-22>
                                lot:
                                  type: string
                                  maxLength: 20
                                  x-parser-schema-id: <anonymous-schema-23>
                                expiry:
                                  type: string
                                  format: date
                                  x-parser-schema-id: <anonymous-schema-24>
                              x-parser-schema-id: CartonContent
                            x-parser-schema-id: <anonymous-schema-19>
                          grossWeightG:
                            type: integer
                            minimum: 1
                            x-parser-schema-id: <anonymous-schema-25>
                          dimsMm:
                            type: object
                            required:
                              - l
                              - w
                              - h
                            properties:
                              l:
                                type: integer
                                x-parser-schema-id: <anonymous-schema-27>
                              w:
                                type: integer
                                x-parser-schema-id: <anonymous-schema-28>
                              h:
                                type: integer
                                x-parser-schema-id: <anonymous-schema-29>
                            x-parser-schema-id: <anonymous-schema-26>
                        x-parser-schema-id: Carton
                      x-parser-schema-id: <anonymous-schema-15>
                    labelledAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-30>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: InboundShipmentLabelledEvent
        examples:
          - name: inboundShipmentLabelled
            summary: Every carton of a shipment has a label; the manifest is frozen.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1cc1
              source: /retailnetwork/seller-inbound
              type: >-
                com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentLabelled
              subject: shp-0f3a91
              time: '2026-10-24T13:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:seller-inbound:events:InboundShipmentLabelled:v1
              data:
                shipmentId: shp-0f3a91
                planId: pln-0f3a91
                sellerId: seller-77
                nodeId: node-0f3a91
                cartons:
                  - sscc: '006141410000000012'
                    kind: HOMOGENEOUS_CASE
                    contents:
                      - catalogItemId: item-004512
                        gtin: '00614141000036'
                        qtyEaches: 12
                        lot: L7
                        expiry: '2027-10-24'
                    grossWeightG: 5200
                    dimsMm:
                      l: 400
                      w: 300
                      h: 200
                  - sscc: '006141410000000029'
                    kind: HOMOGENEOUS_CASE
                    contents:
                      - catalogItemId: item-004512
                        gtin: '00614141000036'
                        qtyEaches: 12
                    grossWeightG: 5100
                    dimsMm:
                      l: 400
                      w: 300
                      h: 200
                labelledAt: '2026-10-24T13:00:00Z'
        x-parser-unique-object-id: InboundShipmentLabelled
      InboundShipmentShipped:
        name: InboundShipmentShipped
        title: A labelled shipment left the seller
        summary: A labelled shipment left the seller.
        description: >-
          `type` =
          `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentShipped`;
          subject and key = the aggregate root id; stream `events`. Raised by
          ShipInboundShipment. Consumers: vendor-connectivity (offers the
          shipment to the vendor), node-performance (inbound timeliness).
        contentType: application/cloudevents+json
        tags:
          - name: inboundshipment
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (sellerId, planId, shipmentId or the
                    producer's own root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - shipmentId
                    - planId
                    - sellerId
                    - nodeId
                    - shippedAt
                  properties:
                    shipmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-33>
                    planId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-34>
                    sellerId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-35>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-36>
                    shippedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-37>
                  x-parser-schema-id: <anonymous-schema-32>
              x-parser-schema-id: <anonymous-schema-31>
          x-parser-schema-id: InboundShipmentShippedEvent
        examples:
          - name: inboundShipmentShipped
            summary: A labelled shipment left the seller.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1cc2
              source: /retailnetwork/seller-inbound
              type: >-
                com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentShipped
              subject: shp-0f3a91
              time: '2026-10-24T13:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:seller-inbound:events:InboundShipmentShipped:v1
              data:
                shipmentId: shp-0f3a91
                planId: pln-0f3a91
                sellerId: seller-77
                nodeId: node-0f3a91
                shippedAt: '2026-10-24T13:00:00Z'
        x-parser-unique-object-id: InboundShipmentShipped
      InboundShipmentReceived:
        name: InboundShipmentReceived
        title: The vendor's receipt closed the shipment
        summary: The vendor's receipt closed the shipment.
        description: >-
          `type` =
          `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived`;
          subject and key = the aggregate root id; stream `events`. Raised when
          every manifest carton has a final status (policy
          ReceiveOnVendorReceipt). `status` is CLOSED when nothing differed from
          the manifest, CLOSED_WITH_DISCREPANCY otherwise; `cartons` lists the
          manifest cartons and any UNEXPECTED ones. `receivedAt` is the vendor's
          instant. `received` (ADR 0014) is the stock received per item, in
          eaches: summed per `gtin` over the manifest cartons answered RECEIVED
          (MISSING, DAMAGED and UNEXPECTED cartons do not count), from the
          vendor's counted quantities where the receipt reported them and from
          the manifest otherwise. `gtin` is the EACH-level GTIN when the local
          CatalogPackagingView resolves the carton GTIN to it, otherwise the
          carton GTIN; `catalogItemId` is present when the view resolves it.
          Lines of zero eaches are omitted, lines are sorted by `gtin`, and the
          array is always present (empty when nothing counts). Consumers:
          offer-availability uses `received` to create owner-scoped listings,
          gap G51.
        contentType: application/cloudevents+json
        tags:
          - name: inboundshipment
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (sellerId, planId, shipmentId or the
                    producer's own root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - shipmentId
                    - sellerId
                    - nodeId
                    - status
                    - cartons
                    - receivedAt
                  properties:
                    shipmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-40>
                    sellerId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-41>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-42>
                    status:
                      type: string
                      enum:
                        - CLOSED
                        - CLOSED_WITH_DISCREPANCY
                      x-parser-schema-id: <anonymous-schema-43>
                    cartons:
                      type: array
                      items:
                        type: object
                        required:
                          - sscc
                          - status
                        properties:
                          sscc:
                            type: string
                            x-parser-schema-id: <anonymous-schema-46>
                          status:
                            type: string
                            enum:
                              - RECEIVED
                              - MISSING
                              - UNEXPECTED
                              - DAMAGED
                            x-parser-schema-id: CartonReceiptStatus
                        x-parser-schema-id: <anonymous-schema-45>
                      x-parser-schema-id: <anonymous-schema-44>
                    receivedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-47>
                    received:
                      type: array
                      description: >-
                        The stock received per item (ADR 0014), sorted by gtin;
                        always present on new events, empty when no carton
                        counts. Events published before ADR 0014 omit it.
                      items:
                        type: object
                        required:
                          - gtin
                          - qtyEaches
                        properties:
                          catalogItemId:
                            type: string
                            description: >-
                              Present when the CatalogPackagingView resolves the
                              carton GTIN to a catalogue item; omitted
                              otherwise.
                            x-parser-schema-id: <anonymous-schema-50>
                          gtin:
                            type: string
                            pattern: ^[0-9]{14}$
                            description: >-
                              The EACH-level GTIN when the CatalogPackagingView
                              resolves the carton GTIN to its child each;
                              otherwise the carton GTIN.
                            x-parser-schema-id: <anonymous-schema-51>
                          qtyEaches:
                            type: integer
                            minimum: 1
                            description: >-
                              Eaches received, from the vendor's counted
                              quantities where the receipt reported them, from
                              the manifest otherwise.
                            x-parser-schema-id: <anonymous-schema-52>
                        x-parser-schema-id: <anonymous-schema-49>
                      x-parser-schema-id: <anonymous-schema-48>
                  x-parser-schema-id: <anonymous-schema-39>
              x-parser-schema-id: <anonymous-schema-38>
          x-parser-schema-id: InboundShipmentReceivedEvent
        examples:
          - name: inboundShipmentReceived
            summary: The vendor's receipt closed the shipment.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1cc3
              source: /retailnetwork/seller-inbound
              type: >-
                com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived
              subject: shp-0f3a91
              time: '2026-10-24T13:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:seller-inbound:events:InboundShipmentReceived:v1
              data:
                shipmentId: shp-0f3a91
                sellerId: seller-77
                nodeId: node-0f3a91
                status: CLOSED_WITH_DISCREPANCY
                cartons:
                  - sscc: '006141410000000012'
                    status: RECEIVED
                  - sscc: '006141410000000029'
                    status: DAMAGED
                receivedAt: '2026-10-25T09:30:00Z'
                received:
                  - catalogItemId: item-1
                    gtin: '00614141000012'
                    qtyEaches: 12
        x-parser-unique-object-id: InboundShipmentReceived
      PlacementPlanSuggested:
        name: PlacementPlanSuggested
        x-no-consumer-reason: >-
          Analytics only in v1 (ADR 0012); no context consumes it yet. Published
          to the events topic so an agreed consumer can subscribe without a
          breaking change.
        title: The network recorded a placement advisory plan
        summary: The network recorded a placement advisory plan.
        description: >-
          `type` =
          `com.retailnetwork.partner.seller-inbound.placementplan.PlacementPlanSuggested`;
          subject and key = the aggregate root id; stream `events`. Raised by
          ComputePlacementPlan. An empty `suggestions` array is legal: the item
          had no demand to place. The event is the record of the advisory, not
          an instruction.
        contentType: application/cloudevents+json
        tags:
          - name: placementplan
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (sellerId, planId, shipmentId or the
                    producer's own root id).
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - planId
                    - sellerId
                    - catalogItemId
                    - basis
                    - suggestions
                    - createdAt
                  properties:
                    planId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-55>
                    sellerId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-56>
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-57>
                    basis:
                      type: string
                      description: >-
                        The formula version the suggestions were computed under
                        (ADR 0012).
                      x-parser-schema-id: <anonymous-schema-58>
                    suggestions:
                      type: array
                      description: >-
                        Legal and possibly empty; the advisory never suggests
                        zero units.
                      items:
                        type: object
                        required:
                          - nodeId
                          - regionId
                          - suggestedUnits
                          - regionDemandUnits
                          - nodeAvailabilityUnits
                        properties:
                          nodeId:
                            type: string
                            x-parser-schema-id: <anonymous-schema-60>
