        vendor's counted quantities where the receipt reported them and from the
        manifest otherwise. `gtin` is the EACH-level GTIN when the local
        CatalogPackagingView resolves the carton GTIN to it, otherwise the
        carton GTIN; `catalogItemId` is present when the view resolves it. Lines
        of zero eaches are omitted, lines are sorted by `gtin`, and the array is
        always present (empty when nothing counts). Consumers:
        offer-availability uses `received` to create owner-scoped listings, gap
        G51.
