                data:
                  type: object
                  required:
                    - shipmentId
                    - planId
                    - sellerId
                    - nodeId
                    - shippedAt
                  properties:
                    shipmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-33>
                    planId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-34>
                    sellerId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-35>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-36>
                    shippedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-37>
                  x-parser-schema-id: <anonymous-schema-32>
              x-parser-schema-id: <anonymous-schema-31>
          x-parser-schema-id: InboundShipmentShippedEvent
        examples:
          - name: inboundShipmentShipped
            summary: A labelled shipment left the seller.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1cc2
              source: /retailnetwork/seller-inbound
              type: >-
                com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentShipped
              subject: shp-0f3a91
              time: '2026-10-24T13:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:seller-inbound:events:InboundShipmentShipped:v1
              data:
                shipmentId: shp-0f3a91
                planId: pln-0f3a91
                sellerId: seller-77
                nodeId: node-0f3a91
                shippedAt: '2026-10-24T13:00:00Z'
        x-parser-unique-object-id: InboundShipmentShipped
      InboundShipmentReceived:
        name: InboundShipmentReceived
        title: The vendor's receipt closed the shipment
        summary: The vendor's receipt closed the shipment.
        description: >-
          `type` =
          `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived`;
          subject and key = the aggregate root id; stream `events`. Raised when
          every manifest carton has a final status (policy
          ReceiveOnVendorReceipt). `status` is CLOSED when nothing differed from
          the manifest, CLOSED_WITH_DISCREPANCY otherwise; `cartons` lists the
          manifest cartons and any UNEXPECTED ones. `receivedAt` is the vendor's
          instant.
        contentType: application/cloudevents+json
        tags:
          - name: inboundshipment
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: >-
                    The aggregate root id (sellerId, planId, shipmentId or the
