operations:
  publishSellerInboundEvents:
    action: send
    title: Publish seller-inbound integration events
    summary: >-
      Publish the shipment and seller status events other contexts consume plus
      the placement advisory.
    description: >-
      The service sends InboundShipmentLabelled, InboundShipmentShipped,
      InboundShipmentReceived, SellerSuspended and SellerReinstated (ADR 0013)
      to `retailnetwork.seller-inbound.events` through the transactional outbox,
      plus PlacementPlanSuggested (analytics only in v1, ADR 0012). Consumers
      route on the full `type`.
    tags:
      - name: inboundshipment
      - name: seller
    channel:
      address: retailnetwork.seller-inbound.events
      title: seller-inbound integration topic
      description: >-
        This service's integration topic, written by the outbox relay; key =
        subject. Carries the three shipment events other contexts consume, the
        seller status events SellerSuspended and SellerReinstated (consumed by
        offer-availability, ADR 0013) plus PlacementPlanSuggested (analytics
        only in v1, ADR 0012). Every message carries the CloudEvents
        content-type header. Dispatch on the full `type`, ignore unknown types,
        dedupe on `id`.
      messages:
        InboundShipmentLabelled:
          name: InboundShipmentLabelled
          title: Every carton of a shipment has a label; the manifest is frozen
          summary: Every carton of a shipment has a label; the manifest is frozen.
          description: >-
            `type` =
            `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentLabelled`;
            subject and key = the aggregate root id; stream `events`. Raised by
            LabelShipment. `cartons` is the full manifest: vendor-connectivity
            serves it on the Vendor API once the shipment ships. `parentSscc` is
            present only for a palletised carton; `lot` and `expiry` only when
            declared.
          contentType: application/cloudevents+json
          tags:
            - name: inboundshipment
          payload:
            allOf:
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - type
                  - subject
                  - time
                  - datacontenttype
                  - dataschema
                  - data
                properties:
                  specversion:
                    type: string
                    const: '1.0'
                    x-parser-schema-id: <anonymous-schema-1>
                  id:
                    type: string
                    format: uuid
                    x-parser-schema-id: <anonymous-schema-2>
                  source:
                    type: string
                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    description: >-
                      The aggregate root id (sellerId, planId, shipmentId or the
                      producer's own root id).
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    required:
                      - shipmentId
                      - planId
                      - sellerId
                      - nodeId
                      - cartons
                      - labelledAt
                    properties:
                      shipmentId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-11>
                      planId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-12>
                      sellerId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-13>
                      nodeId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-14>
                      cartons:
                        type: array
                        items:
                          type: object
                          required:
                            - sscc
                            - kind
                            - contents
                            - grossWeightG
                            - dimsMm
                          properties:
                            sscc:
                              type: string
                              pattern: ^[0-9]{18}$
