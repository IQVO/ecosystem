                            type: string
                            x-parser-schema-id: <anonymous-schema-46>
                          status:
                            type: string
                            enum:
                              - RECEIVED
                              - MISSING
                              - UNEXPECTED
                              - DAMAGED
                            x-parser-schema-id: CartonReceiptStatus
                        x-parser-schema-id: <anonymous-schema-45>
                      x-parser-schema-id: <anonymous-schema-44>
                    receivedAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-47>
                  x-parser-schema-id: <anonymous-schema-39>
              x-parser-schema-id: <anonymous-schema-38>
          x-parser-schema-id: InboundShipmentReceivedEvent
        examples:
          - name: inboundShipmentReceived
            summary: The vendor's receipt closed the shipment.
            payload:
