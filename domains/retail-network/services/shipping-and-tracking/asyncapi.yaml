  publishShippingAndTrackingEvents:
    action: send
    title: Publish shipping-and-tracking events
    summary: >-
      Publish the eight shipping-and-tracking events through the transactional
      outbox.
    description: >
      The service sends every event of its two aggregates (ShippingLabel,

      PackageJourney) to `retailnetwork.shipping-and-tracking.events`. Consumers
      route

      on the full `type`.
    tags:
      - name: shipping-and-tracking
    channel:
      address: retailnetwork.shipping-and-tracking.events
      title: shipping-and-tracking integration topic
      description: >
        This service's integration topic. Written by the outbox relay; key =
        subject

        (labelRef for label events, trackingNumber for journey events). Every
        message

        carries the CloudEvents content-type header. Dispatch on the full
        `type`,

        ignore unknown types, dedupe on `id`.
      messages:
        LabelIssued:
          name: LabelIssued
          title: A shipping label was issued for one package
          summary: A shipping label was issued for one package.
          description: >-
            `type` =
            `com.retailnetwork.logistics.shipping-and-tracking.label.LabelIssued`;
            Raised by IssueLabel. Subject and key = the labelRef. Consumers:
            linehaul-transportation (ExpectedVolumeView), customer-ordering
            (OrderTrackingView), last-mile-delivery (groups stops by `stopKey`,
            contracts-delta E10). `stopKey` is an opaque keyed hash of the
            normalized ship-to address and `destinationPostalPrefix` its postal
            prefix: no address ever appears on the wire. `orderId` is an
            additive field (ADR 0002 A12).
          contentType: application/cloudevents+json
          tags:
            - name: label
          payload:
            allOf:
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - type
                  - subject
                  - time
                  - datacontenttype
                  - dataschema
                  - data
                properties:
                  specversion:
                    type: string
                    const: '1.0'
                    x-parser-schema-id: <anonymous-schema-1>
                  id:
                    type: string
                    format: uuid
                    x-parser-schema-id: <anonymous-schema-2>
                  source:
                    type: string
                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    description: The aggregate root id.
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    required:
                      - labelRef
                      - trackingNumber
                      - poNumber
                      - assignmentId
                      - orderId
                      - packageNo
                      - tier
                      - carrier
                      - stopKey
                      - destinationPostalPrefix
                    properties:
                      labelRef:
                        type: string
                        x-parser-schema-id: <anonymous-schema-11>
                      trackingNumber:
                        type: string
                        x-parser-schema-id: <anonymous-schema-12>
                      poNumber:
                        type: string
                        x-parser-schema-id: <anonymous-schema-13>
                      assignmentId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-14>
                      orderId:
                        type: string
