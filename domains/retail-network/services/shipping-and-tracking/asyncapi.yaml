      PackageDelivered:
        name: PackageDelivered
        title: A package was delivered
        summary: A package was delivered.
        description: >-
          `type` =
          `com.retailnetwork.logistics.shipping-and-tracking.journey.PackageDelivered`;
          Raised on OUT_FOR_DELIVERY to DELIVERED. Consumers: delivery-promise
          (JudgeOnDelivery; the group is judged on its LAST delivered package,
          contracts-delta E1), order-sourcing (MarkDelivered),
          customer-ordering.
        contentType: application/cloudevents+json
        tags:
          - name: journey
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
