asyncapi: 3.0.0
info:
  title: shipping-and-tracking Domain Events
  version: 1.0.0
  contact:
    name: shipping-and-tracking maintainers
    url: https://github.com/IQVO/shipping-and-tracking
    email: shipping-and-tracking@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: shipping-and-tracking
      description: >-
        The shipping-and-tracking bounded context (retail network, logistics
        tier).
    - name: label
      description: Events raised by the ShippingLabel aggregate.
    - name: journey
      description: Events raised by the PackageJourney aggregate.
  description: >
    Event catalog for the **shipping-and-tracking** bounded context of the
    retail

    network (logistics tier): it issues shipping labels and owns each package's

    journey, the one customer-visible timeline consolidated from vendor
    handover,

    load and delivery facts (ADR 0001, ADR 0002).


    **Published.** Eight events, all on
    `retailnetwork.shipping-and-tracking.events`,

    through a **transactional outbox**: the aggregate rows and their
    already-encoded

    events are written in ONE database transaction and an always-on relay drains

    them to Kafka (at-least-once; the CloudEvents `id` is stored with the outbox
    row,

    so a retry republishes the same `id`). The eight types are catalogued in ADR
    0004.

    Every one is an integration event: the model's analytics-only events

    (LabelVoided, PackageReturned, PackageLost) were promoted by contracts-delta

    E6 and E16, so nothing is published on
    `retailnetwork.shipping-and-tracking.analytics`.

    No event carries a ship-to address or any part of it (the opaque `stopKey`
    and the

    postal prefix on LabelIssued are the only derived values; ADR 0002 A9, A10).


    **Consumed.** Seven types from four topics (ADR 0003): vendor-connectivity

    VendorShipmentConfirmed, linehaul-transportation LoadDeparted and
    LoadArrived,

    last-mile-delivery PackageOutForDelivery, DeliveryAttempted and

    PackageReturnInitiated, offer-availability CatalogItemCreated. Each consumer

    group dedupes on the CloudEvents `id` (inbox table `processed_events`),

    dispatches on the full `type`, ignores unknown types and fields, and parks a

    poison message on a dead-letter topic.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/retailnetwork/shipping-and-tracking`),
    `type`,

    `subject` (the aggregate root id), `time`, `datacontenttype`
    (`application/json`)

    and `dataschema`
    (`urn:retailnetwork:shipping-and-tracking:events:<EventName>:v1`)

    are all required. Kafka key = the subject, so one aggregate's events stay
    ordered

    on one partition. Type =
    `com.retailnetwork.logistics.shipping-and-tracking.<entity>.<EventName>`

    with entity `label` or `journey`. A breaking payload change is a new `.v2`
    type,

    never a mutation.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC; optional
    fields

    are omitted when unset; arrays are always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  shippingAndTrackingEvents:
    address: retailnetwork.shipping-and-tracking.events
    title: shipping-and-tracking integration topic
    description: >
      This service's integration topic. Written by the outbox relay; key =
      subject

      (labelRef for label events, trackingNumber for journey events). Every
      message

      carries the CloudEvents content-type header. Dispatch on the full `type`,

      ignore unknown types, dedupe on `id`.
    messages:
      LabelIssued:
        name: LabelIssued
        title: A shipping label was issued for one package
        summary: A shipping label was issued for one package.
        description: >-
          `type` =
          `com.retailnetwork.logistics.shipping-and-tracking.label.LabelIssued`;
          Raised by IssueLabel. Subject and key = the labelRef. Consumers:
          linehaul-transportation (ExpectedVolumeView), customer-ordering
          (OrderTrackingView), last-mile-delivery (groups stops by `stopKey`,
          contracts-delta E10). `stopKey` is an opaque keyed hash of the
          normalized ship-to address and `destinationPostalPrefix` its postal
          prefix: no address ever appears on the wire. `orderId` is an additive
          field (ADR 0002 A12).
        contentType: application/cloudevents+json
        tags:
          - name: label
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - labelRef
                    - trackingNumber
                    - poNumber
                    - assignmentId
                    - orderId
                    - packageNo
                    - tier
                    - carrier
                    - stopKey
                    - destinationPostalPrefix
                  properties:
                    labelRef:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    poNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-13>
                    assignmentId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-14>
                    orderId:
                      type: string
                      description: Additive over the model (ADR 0002 A12).
                      x-parser-schema-id: <anonymous-schema-15>
                    packageNo:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-16>
                    tier:
                      type: string
                      enum:
                        - SAME_DAY
                        - NEXT_DAY
                        - TWO_DAY
                        - STANDARD
                      x-parser-schema-id: ServiceTier
                    carrier:
                      type: string
                      x-parser-schema-id: <anonymous-schema-17>
                    stopKey:
                      type: string
                      description: >-
                        Opaque keyed hash (HMAC-SHA-256, hex) of the normalized
                        address; equal addresses give equal keys.
                      x-parser-schema-id: <anonymous-schema-18>
                    destinationPostalPrefix:
                      type: string
                      description: >-
                        Leading characters of the ship-to postal code (ADR 0002
                        A10).
                      x-parser-schema-id: <anonymous-schema-19>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: LabelIssuedEvent
        examples:
          - name: labelIssued
            summary: A shipping label was issued for one package.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c01
              source: /retailnetwork/shipping-and-tracking
              type: >-
                com.retailnetwork.logistics.shipping-and-tracking.label.LabelIssued
              subject: lbl-7c1f
              time: '2026-10-23T12:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:shipping-and-tracking:events:LabelIssued:v1
              data:
                labelRef: lbl-7c1f
                trackingNumber: STT00000000000042
                poNumber: PO-1001
                assignmentId: asg-001
                orderId: ord-001
                packageNo: 1
                tier: NEXT_DAY
                carrier: RN-EXPRESS
                stopKey: >-
                  9f2a6c0d4b7e11aa5c3d8e90b1f47a62c8d0e3f15a9b7c24d6e8f0a1b3c5d7e9
                destinationPostalPrefix: '01310'
        x-parser-unique-object-id: LabelIssued
      LabelVoided:
        name: LabelVoided
        title: A shipping label was voided
        summary: A shipping label was voided.
        description: >-
          `type` =
          `com.retailnetwork.logistics.shipping-and-tracking.label.LabelVoided`;
          Raised by VoidLabel when the label moves ISSUED to VOIDED (the
          LABELLED journey closes as VOIDED in the same transaction). Subject
          and key = the labelRef. Integration event (contracts-delta E16):
          consumed by customer-ordering and linehaul-transportation
          (ExpectedVolumeView).
        contentType: application/cloudevents+json
        tags:
          - name: label
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - labelRef
                    - trackingNumber
                    - reason
                  properties:
                    labelRef:
                      type: string
                      x-parser-schema-id: <anonymous-schema-22>
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-23>
                    reason:
                      type: string
                      x-parser-schema-id: <anonymous-schema-24>
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: <anonymous-schema-20>
          x-parser-schema-id: LabelVoidedEvent
        examples:
          - name: labelVoided
            summary: A shipping label was voided.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c02
              source: /retailnetwork/shipping-and-tracking
              type: >-
                com.retailnetwork.logistics.shipping-and-tracking.label.LabelVoided
              subject: lbl-7c1f
              time: '2026-10-23T12:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:shipping-and-tracking:events:LabelVoided:v1
              data:
                labelRef: lbl-7c1f
                trackingNumber: STT00000000000042
                reason: order cancelled before pickup
        x-parser-unique-object-id: LabelVoided
      PackageScanned:
        name: PackageScanned
        title: A scan was applied to a package journey
        summary: A scan was applied to a package journey.
        description: >-
          `type` =
          `com.retailnetwork.logistics.shipping-and-tracking.journey.PackageScanned`;
          Raised by RecordScan for every APPLIED scan (a scan stored out of
          order or without an edge raises nothing). Subject and key = the
          trackingNumber. `state` is the journey state after the scan. A
          handover or delivery raises two events in one transaction: this one
          and the milestone event.
        contentType: application/cloudevents+json
        tags:
          - name: journey
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - trackingNumber
                    - scanId
                    - nodeId
                    - scanType
                    - at
                    - state
                  properties:
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-27>
                    scanId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-28>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-29>
                    scanType:
                      type: string
                      enum:
                        - SHIPMENT_CONFIRMED
                        - PICKUP_DEPARTURE
                        - DEPARTURE
                        - TRANSIT_ARRIVAL
                        - STATION_ARRIVAL
                        - OUT_FOR_DELIVERY
                        - DELIVERED
                        - DELIVERY_FAILED
                      x-parser-schema-id: ScanType
                    at:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-30>
                    state:
                      type: string
                      enum:
                        - LABELLED
                        - HANDED_OVER
                        - IN_TRANSIT
                        - AT_STATION
                        - OUT_FOR_DELIVERY
                        - DELIVERED
                        - RETURNED
                        - LOST
                        - VOIDED
                      x-parser-schema-id: JourneyState
                  x-parser-schema-id: <anonymous-schema-26>
              x-parser-schema-id: <anonymous-schema-25>
          x-parser-schema-id: PackageScannedEvent
        examples:
          - name: packageScanned
            summary: A scan was applied to a package journey.
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c03
              source: /retailnetwork/shipping-and-tracking
              type: >-
                com.retailnetwork.logistics.shipping-and-tracking.journey.PackageScanned
              subject: STT00000000000042
              time: '2026-10-23T12:00:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:shipping-and-tracking:events:PackageScanned:v1
              data:
                trackingNumber: STT00000000000042
                scanId: 9b1d2c3e-0000-4000-8000-000000000001:STT00000000000042
                nodeId: node-fc-01
                scanType: PICKUP_DEPARTURE
                at: '2026-10-23T11:30:00Z'
                state: HANDED_OVER
        x-parser-unique-object-id: PackageScanned
      PackageHandedOver:
        name: PackageHandedOver
        title: A package entered the network (handover)
        summary: A package entered the network (handover).
        description: >-
          `type` =
          `com.retailnetwork.logistics.shipping-and-tracking.journey.PackageHandedOver`;
          Raised on LABELLED to HANDED_OVER (policy HandoverOnFirstScan): the
          first PICKUP-kind LoadDeparted at the vendor node. `handedOverAt` is
          the instant node-performance measures the vendor against.
        contentType: application/cloudevents+json
        tags:
          - name: journey
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - trackingNumber
                    - poNumber
                    - nodeId
                    - handedOverAt
                  properties:
                    trackingNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-33>
                    poNumber:
                      type: string
                      x-parser-schema-id: <anonymous-schema-34>
                    nodeId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-35>
                    handedOverAt:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-36>
                  x-parser-schema-id: <anonymous-schema-32>
              x-parser-schema-id: <anonymous-schema-31>
          x-parser-schema-id: PackageHandedOverEvent
        examples:
          - name: packageHandedOver
            summary: A package entered the network (handover).
            payload:
              specversion: '1.0'
              id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c04
              source: /retailnetwork/shipping-and-tracking
              type: >-
                com.retailnetwork.logistics.shipping-and-tracking.journey.PackageHandedOver
              subject: STT00000000000042
              time: '2026-10-23T12:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:shipping-and-tracking:events:PackageHandedOver:v1
              data:
