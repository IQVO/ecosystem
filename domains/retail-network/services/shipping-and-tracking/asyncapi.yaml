                    type: string
                    description: >-
                      Leading characters of the ship-to postal code (ADR 0002
                      A10); a pickup label carries the point's own prefix (ADR
                      0016); a reverse label carries the RETURN DESTINATION's
                      prefix (ADR 0017).
                    x-parser-schema-id: <anonymous-schema-19>
                  pickupPointId:
                    type: string
                    description: >-
                      The pickup point of a pickup label; omitted on a ship-to
                      label (ADR 0016).
                    x-parser-schema-id: <anonymous-schema-20>
                  destinationStationNodeId:
                    type: string
                    description: >-
