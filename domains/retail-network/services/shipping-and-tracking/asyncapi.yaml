                  stopKey:
                    type: string
                    description: >-
                      Opaque keyed hash (HMAC-SHA-256, hex) of the normalized
                      address; equal addresses give equal keys. A pickup label
                      keys the point id, so every package of one point shares
                      one stop (ADR 0016). A reverse label keys the same ship-to
                      as the outbound label of the same order, so its key EQUALS
                      the outbound key (ADR 0017).
                    x-parser-schema-id: <anonymous-schema-18>
