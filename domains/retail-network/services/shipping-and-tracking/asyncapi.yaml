            prefix (ADR 0019) and published as `destinationStationNodeId` on
            LabelIssued; `regionId` is read and dropped. `deliveryMode` and
            `carriers` are additive v1 fields (ADR 0016 there); their absence
            means NETWORK_ROUTE with no options, so a pre-C4 replay keeps the
            old meaning. Upserted into `area_modes` only when
            `assignmentVersion` beats the stored row; an equal
            `assignmentVersion` still fills a station the stored row lacks (ADR
            0019), so a replay or re-emit backfills rows stored before the
            station was kept.
