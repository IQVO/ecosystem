operations:
  publishShippingAndTrackingEvents:
    action: send
    title: Publish shipping-and-tracking events
    summary: Publish the shipping-and-tracking events through the transactional outbox.
    description: >
      The service sends every event of its two aggregates (ShippingLabel,

      PackageJourney) to `retailnetwork.shipping-and-tracking.events`. Consumers
      route

      on the full `type`.
    tags:
      - name: shipping-and-tracking
    channel:
      address: retailnetwork.shipping-and-tracking.events
      title: shipping-and-tracking integration topic
      description: >
        This service's integration topic. Written by the outbox relay; key =
        subject

        (labelRef for label events, trackingNumber for journey events). Every
        message

        carries the CloudEvents content-type header. Dispatch on the full
        `type`,

        ignore unknown types, dedupe on `id`.
      messages:
        LabelIssued:
          name: LabelIssued
          title: A shipping label was issued for one package
          summary: A shipping label was issued for one package.
          description: >-
            `type` =
            `com.retailnetwork.logistics.shipping-and-tracking.label.LabelIssued`;
            Raised by IssueLabel. Subject and key = the labelRef. Consumers:
            linehaul-transportation (ExpectedVolumeView), customer-ordering
            (OrderTrackingView), last-mile-delivery (groups stops by `stopKey`,
            contracts-delta E10). `stopKey` is an opaque keyed hash of the
            normalized ship-to address and `destinationPostalPrefix` its postal
            prefix: no address ever appears on the wire. `orderId` is an
            additive field (ADR 0002 A12). `destinationStationNodeId` is an
            additive optional field (ADR 0019): the delivery station of the area
            covering `destinationPostalPrefix`, a node id only, omitted when no
            station is known for the prefix.
          contentType: application/cloudevents+json
          tags:
            - name: label
          payload:
            allOf:
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - type
                  - subject
                  - time
                  - datacontenttype
                  - dataschema
                  - data
                properties:
                  specversion:
                    type: string
                    const: '1.0'
                    x-parser-schema-id: <anonymous-schema-1>
                  id:
                    type: string
                    format: uuid
                    x-parser-schema-id: <anonymous-schema-2>
                  source:
                    type: string
                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    description: The aggregate root id.
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    required:
                      - labelRef
                      - trackingNumber
                      - poNumber
                      - assignmentId
                      - orderId
                      - packageNo
                      - tier
                      - carrier
                      - stopKey
                      - destinationPostalPrefix
                    properties:
                      labelRef:
                        type: string
                        x-parser-schema-id: <anonymous-schema-11>
                      trackingNumber:
                        type: string
                        x-parser-schema-id: <anonymous-schema-12>
                      poNumber:
                        type: string
                        x-parser-schema-id: <anonymous-schema-13>
                      assignmentId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-14>
                      orderId:
                        type: string
                        description: Additive over the model (ADR 0002 A12).
                        x-parser-schema-id: <anonymous-schema-15>
                      packageNo:
                        type: integer
                        minimum: 1
                        x-parser-schema-id: <anonymous-schema-16>
                      tier:
                        type: string
                        enum:
                          - SAME_DAY
                          - NEXT_DAY
                          - TWO_DAY
                          - STANDARD
                        x-parser-schema-id: ServiceTier
                      carrier:
                        type: string
                        x-parser-schema-id: <anonymous-schema-17>
                      stopKey:
                        type: string
                        description: >-
                          Opaque keyed hash (HMAC-SHA-256, hex) of the
                          normalized address; equal addresses give equal keys. A
                          pickup label keys the point id, so every package of
                          one point shares one stop (ADR 0016). A reverse label
                          keys the same ship-to as the outbound label of the
                          same order, so its key EQUALS the outbound key (ADR
                          0017).
                        x-parser-schema-id: <anonymous-schema-18>
                      destinationPostalPrefix:
                        type: string
                        description: >-
                          Leading characters of the ship-to postal code (ADR
                          0002 A10); a pickup label carries the point's own
                          prefix (ADR 0016); a reverse label carries the RETURN
                          DESTINATION's prefix (ADR 0017).
                        x-parser-schema-id: <anonymous-schema-19>
                      pickupPointId:
                        type: string
                        description: >-
                          The pickup point of a pickup label; omitted on a
                          ship-to label (ADR 0016).
                        x-parser-schema-id: <anonymous-schema-20>
                      destinationStationNodeId:
                        type: string
                        description: >-
                          Optional (ADR 0019). The delivery station of the area
                          covering destinationPostalPrefix, as node-topology's
                          ServiceAreaAssigned last assigned it (the area's
                          station, also for a pickup label; ADR 0019 records the
                          open question). A node id only, never an address.
                          Omitted when no station is known for the prefix and on
                          a reverse label. Tolerant consumers ignore it.
                        x-parser-schema-id: <anonymous-schema-21>
                      purpose:
                        type: string
                        enum:
                          - RETURN
                        description: >-
                          Present only on a reverse label of a customer return
                          (ADR 0017); omitted on an outbound label. Tolerant
                          consumers ignore it.
                        x-parser-schema-id: <anonymous-schema-22>
                      returnAuthorizationId:
                        type: string
                        description: >-
                          The return authorization a reverse label belongs to
                          (ADR 0017); omitted on an outbound label.
                        x-parser-schema-id: <anonymous-schema-23>
                    x-parser-schema-id: <anonymous-schema-10>
                x-parser-schema-id: <anonymous-schema-9>
            x-parser-schema-id: LabelIssuedEvent
          examples:
            - name: labelIssued
              summary: A shipping label was issued for one package.
