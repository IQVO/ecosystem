        x-parser-unique-object-id: PackageDelivered
      PackageExceptionRaised:
        name: PackageExceptionRaised
        title: A package journey raised an exception
        summary: A package journey raised an exception.
        description: >-
          `type` =
          `com.retailnetwork.logistics.shipping-and-tracking.journey.PackageExceptionRaised`;
          Raised by the ExceptionOnSilence sweep with reason NO_SCAN: no scan
          arrived within the expected window of the journey's state and tier
          (ADR 0002 A7). The state does not change. At most one per silence.
          Consumers: delivery-promise (RepromiseOnRisk), customer-ordering.
        contentType: application/cloudevents+json
        tags:
          - name: journey
        payload:
