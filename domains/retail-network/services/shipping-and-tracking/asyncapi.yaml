      Receive ServiceAreaAssigned and the node lifecycle events from
      node-topology (ADR 0015, ADR 0016).
    description: >
      Inbound adapter under internal/adapters/inbound/kafka. Reads
      `retailnetwork.node-topology.events` in the

      consumer group named by ST_AREAS_CONSUMER_GROUP (mandatory), records the
      CloudEvents

      `id` in `processed_events` in the same transaction as the effect, and
      dead-letters

      a message it cannot decode. An assignment version older than the stored
      row is

      acknowledged and dropped (an equal one only fills a missing delivery
      station, ADR 0019);

      that fold claims the CloudEvents `id` under its own inbox identity

      (`node-topology.area-modes`). The node lifecycle events keep the
      pickup-point rows of

      the local PickupPointView (ADR 0016). NodeRegistered also keeps, for a
      node of ANY

      type, its row of the local NodeDestinationView (ADR 0018): the node id and
      the

      destination prefix derived from the registered postal code. That fold
      claims the

      CloudEvents `id` under its own inbox identity
      (`node-topology.node-destinations`),

      and the three status events never reach it.
