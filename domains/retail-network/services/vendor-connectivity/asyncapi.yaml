  receiveCustomerReturnsEvents:
    action: receive
    title: Receive customer-returns events
    summary: Receive the customer-returns events this context relies on.
    description: >-
      Consumes ReturnAuthorized, ReturnLabelIssued and ReturnCancelled into the
      local ReturnAdviceView (Conformist); the advice is attributed to the
      operator vendor of the destination node from VendorNodeView, never from
      the event. The topic does not exist yet while the producer repo is being
      created; the reader construction does not dial and a consumer group is
      handed an empty assignment for a missing topic, so boot and readiness are
      unaffected (ADR 0014).
    tags:
      - name: vendor-connectivity
    channel:
      address: retailnetwork.customer-returns.events
      title: customer-returns integration topic
      description: >-
        This service's integration topic, written by the outbox relay; key =
        subject. Carries the four ReturnAuthorization events other contexts
        consume (vendor-connectivity's return advices, offer-availability's
        restock). Every message carries the CloudEvents content-type header.
        Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
      messages:
        ReturnAuthorized:
          name: ReturnAuthorized
          title: ReturnAuthorized
          summary: >-
            The network authorized a shopper return; creates ReturnAdviceView
            attributed to the operator vendor of the destination node.
          description: >-
            Consumed from customer-returns. `type` =
            `com.retailnetwork.commerce.customer-returns.returnauthorization.ReturnAuthorized`;
            subject = `authorizationId`. Only the listed `data` fields are
            relied on; unknown fields are ignored. The advice's node is
            `destinationNodeId`, else `originNodeId` (the ORIGIN_NODE
            disposition ships there); a node the view cannot attribute to a
            vendor is counted and skipped (WARN).
          contentType: application/cloudevents+json
          tags:
            - name: vendor-connectivity
