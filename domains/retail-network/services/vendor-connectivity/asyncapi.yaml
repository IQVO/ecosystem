asyncapi: 3.0.0
info:
  title: vendor-connectivity Domain Events
  version: 1.0.0
  contact:
    name: vendor-connectivity maintainers
    url: https://github.com/IQVO/vendor-connectivity
    email: vendor-connectivity@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: vendor-connectivity
      description: The vendor-connectivity bounded context (retail network, partner tier).
    - name: vendoraccount
      description: Events raised by the VendorAccount aggregate.
    - name: purchaseorder
      description: Events raised by the PurchaseOrder aggregate.
    - name: submission
      description: Events raised by the Submission aggregate.
    - name: inboundreceipt
      description: >-
        The InboundReceiptSubmitted event, raised when an inbound receipt is
        accepted.
    - name: returnoutcome
      description: >-
        The VendorReturnOutcomeSubmitted event, raised when a return outcome is
        accepted.
  description: >
    Event catalog for the **vendor-connectivity** bounded context of the retail
    network (partner tier):

    the Open Host Service for vendors that operate fulfillment nodes. The Vendor
    API itself is `apis/openapi.yaml`;

    vendors never see these events, the in-organization contexts do.


    **Published.** Twelve types. Eleven go to
    `retailnetwork.vendor-connectivity.events` and `PurchaseOrderCancelled` goes
    ONLY to

    `retailnetwork.vendor-connectivity.analytics` (the model marks it analytics
    only). Every event leaves through a

    **transactional outbox**: the aggregate row, the submission row and the
    already-encoded events are written in ONE database

    transaction and an always-on relay drains them to Kafka (at-least-once; the
    CloudEvents `id` is stored with the outbox row, so a retry

    republishes the same `id`). The types are catalogued in ADR 0004.


    **Consumed.** Seventeen types from five producers (ADR 0003, ADR 0005, ADR
    0014): seller-inbound `InboundShipmentLabelled`, `InboundShipmentShipped`,
    `InboundShipmentReceived`; offer-availability
    `CatalogItemPackagingDeclared`, `CatalogItemPackLevelRetired`; node-topology
    `NodeRegistered`, `NodeOperationalProfileDeclared`,

    `NodeActivated`, `NodeSuspended`, `NodeRetired`; offer-availability
    `ListingCreated`; order-sourcing `FulfillmentReleasedToNode`,

    `FulfillmentCancelled`, `FulfillmentReleaseWithdrawn`; customer-returns
    `ReturnAuthorized`, `ReturnLabelIssued`, `ReturnCancelled`. Each is
    deduplicated on the CloudEvents `id` in the `processed_events` inbox table,
    dispatched on the full

    `type`, decoded tolerantly (unknown fields are ignored) and dead-lettered to
    `<topic>.dlq` (with `x-dlq-source-topic`, `x-dlq-source-partition`,
    `x-dlq-source-offset`, `x-dlq-error` and `x-dlq-failed-at` headers) after a
    bounded number of failed attempts, or at once when the `data` cannot be
    decoded. A message that is not a valid CloudEvents 1.0 event, or whose
    `type` is not handled, is skipped (logged, offset committed).

    The consumed `data` below lists only the fields this context relies on.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/retailnetwork/vendor-connectivity`),
    `type`, `subject` (the aggregate root id: `vendorId`, `poNumber`,

    `transactionId`, `shipmentId` or `authorizationId`), `time`,
    `datacontenttype` (`application/json`) and `dataschema`

    (`urn:retailnetwork:vendor-connectivity:<stream>:<EventName>:v1`, stream
    `events` or `analytics`) are all required. Kafka key = the subject,

    so one purchase order's events stay ordered on one partition. Type =
    `com.retailnetwork.partner.vendor-connectivity.<entity>.<EventName>`

    with entity `vendoraccount`, `purchaseorder`, `submission`, `inboundreceipt`
    or `returnoutcome`. The subject of `InboundReceiptSubmitted` is the
    `shipmentId`,

    the subject of `VendorReturnOutcomeSubmitted` is the `authorizationId`, and
    the subject of `SubmissionProcessed` is the `transactionId`.


    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC; optional
    fields are omitted when absent (never null); arrays are always

    present. No event carries a ship-to address, name or phone.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  vendorConnectivityEvents:
    address: retailnetwork.vendor-connectivity.events
    title: vendor-connectivity integration topic
    description: >-
      This service's integration topic, written by the outbox relay; key =
      subject. Every message carries the CloudEvents content-type header.
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      VendorOnboarded:
        name: VendorOnboarded
        title: VendorOnboarded
        summary: A vendor account was onboarded (ACTIVE).
        description: >-
          `type` =
          `com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorOnboarded`;
          subject and key = `vendorId`; stream `events`. Raised by
          OnboardVendor. Consumers: node-performance (acknowledged without
          effect).
        contentType: application/cloudevents+json
        tags:
          - name: vendoraccount
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /retailnetwork/vendor-connectivity
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate root id.
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              description: >-
                Published envelope. Consumed envelopes have the same attributes
                with the producer's `source`.
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - vendorId
                    - name
                    - ackWindowMinutes
                  properties:
                    vendorId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    name:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    ackWindowMinutes:
                      type: integer
                      minimum: 60
                      maximum: 1440
                      x-parser-schema-id: <anonymous-schema-13>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: VendorOnboardedEvent
        examples:
          - name: vendorOnboarded
            summary: A vendor account was onboarded (ACTIVE).
            payload:
              specversion: '1.0'
              id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
              source: /retailnetwork/vendor-connectivity
              type: >-
                com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorOnboarded
              subject: V-WS
              time: '2026-10-22T13:05:41Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:vendor-connectivity:events:VendorOnboarded:v1
              data:
                vendorId: V-WS
                name: Warehouse Systems
                ackWindowMinutes: 240
        x-parser-unique-object-id: VendorOnboarded
