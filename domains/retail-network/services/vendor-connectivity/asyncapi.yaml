  publishVendorConnectivityEvents:
    action: send
    title: Publish vendor-connectivity integration events
    summary: Publish the ten integration events through the transactional outbox.
    description: >-
      The service sends every integration event of its three aggregates
      (VendorAccount, PurchaseOrder, Submission) and the InboundReceiptSubmitted
      fact to `retailnetwork.vendor-connectivity.events`. Consumers route on the
      full `type`.
    tags:
      - name: vendor-connectivity
    channel:
      address: retailnetwork.vendor-connectivity.events
      title: vendor-connectivity integration topic
      description: >-
        This service's integration topic, written by the outbox relay; key =
        subject. Every message carries the CloudEvents content-type header.
        Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
      messages:
        VendorOnboarded:
          name: VendorOnboarded
          title: VendorOnboarded
          summary: A vendor account was onboarded (ACTIVE).
          description: >-
            `type` =
            `com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorOnboarded`;
            subject and key = `vendorId`; stream `events`. Raised by
            OnboardVendor. Consumers: node-performance.
          contentType: application/cloudevents+json
          tags:
            - name: vendoraccount
          payload:
            allOf:
              - type: object
                required:
                  - specversion
                  - id
                  - source
                  - type
                  - subject
                  - time
                  - datacontenttype
                  - dataschema
                  - data
                properties:
                  specversion:
                    type: string
                    const: '1.0'
                    x-parser-schema-id: <anonymous-schema-1>
                  id:
                    type: string
                    format: uuid
                    x-parser-schema-id: <anonymous-schema-2>
                  source:
                    type: string
                    const: /retailnetwork/vendor-connectivity
                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    description: The aggregate root id.
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                description: >-
                  Published envelope. Consumed envelopes have the same
                  attributes with the producer's `source`.
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    required:
                      - vendorId
                      - name
                      - ackWindowMinutes
                    properties:
