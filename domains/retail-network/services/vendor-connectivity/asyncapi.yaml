                Published envelope. Consumed envelopes have the same attributes
                with the producer's `source`.
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - vendorId
                    - name
                    - ackWindowMinutes
                  properties:
                    vendorId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
