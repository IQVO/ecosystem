asyncapi: 3.0.0
info:
  title: checkout Domain Events
  version: 1.0.0
  contact:
    name: checkout maintainers
    url: https://github.com/IQVO/checkout
    email: checkout@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: checkout
      description: The checkout bounded context (retail network, storefront tier).
    - name: checkoutsession
      description: Events raised by the CheckoutSession aggregate.
  description: >-
    Event catalog for the **checkout** bounded context of the storefront
    (Supporting subdomain): the purchase saga from review to placed order (ADR
    0001, ADR 0002).


    **Published.** Seven events. `CheckoutCompleted` is the one integration
    event: it goes to `retailnetwork.checkout.events` and is consumed by
    shopping-cart (CloseOnCheckoutCompleted) and customer-payments
    (BindOrderOnCheckoutCompleted). `CheckoutOpened`, `CheckoutDeclined`,
    `CheckoutRequoteRequired`, `CheckoutFailed`, `CheckoutSessionExpired` and
    `CheckoutPlacementInDoubt` are analytics-only and go to
    `retailnetwork.checkout.analytics` (decision H7). ConfirmSession and
    RecordAuthorization raise nothing. Every event goes through a
    **transactional outbox**; an always-on relay drains them to Kafka,
    at-least-once. The types are catalogued in ADR 0004.


    **Consumed.** Nothing: the saga is driven by REST calls and policies;
    sibling data is read synchronously (ADR 0003).


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/checkout`), `type`, `subject`
    (the sessionId), `time`, `datacontenttype` (`application/json`) and
    `dataschema`
    (`urn:retailnetwork:checkout:<events|analytics>:<EventName>:v1`) are all
    required. Kafka key = the subject. Type =
    `com.retailnetwork.storefront.checkout.checkoutsession.<EventName>`. A
    breaking payload change is a new `.v2` type, never a mutation.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; money is
    integer minor units; enums are UPPER_SNAKE.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  checkoutEvents:
    address: retailnetwork.checkout.events
    title: checkout integration topic
    description: >-
      Integration topic: CheckoutCompleted, consumed by shopping-cart and
      customer-payments. Written by the outbox relay; key = the sessionId. Every
      message carries the CloudEvents content-type header.
    messages:
      CheckoutCompleted:
        name: CheckoutCompleted
        title: A checkout session was completed and its order placed.
        summary: A checkout session was completed and its order placed.
        description: >-
          `type` =
          `com.retailnetwork.storefront.checkout.checkoutsession.CheckoutCompleted`;
          subject and key = the sessionId. Raised by RecordPlaced
          (ConfirmSession or ResolveInDoubtPlacements) in the same transaction
          as the outbox row. Integration event: consumed by shopping-cart
          (closes the cart) and customer-payments (binds the order to the
          authorization and the allocations per group).
        contentType: application/cloudevents+json
        tags:
          - name: checkoutsession
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-1>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it.
              x-parser-schema-id: <anonymous-schema-2>
            source:
              type: string
              const: /retailnetwork/checkout
              x-parser-schema-id: <anonymous-schema-3>
            type:
              type: string
              const: >-
                com.retailnetwork.storefront.checkout.checkoutsession.CheckoutCompleted
              x-parser-schema-id: <anonymous-schema-4>
            subject:
              type: string
              description: The sessionId; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-5>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-6>
            dataschema:
              type: string
              const: urn:retailnetwork:checkout:events:CheckoutCompleted:v1
              x-parser-schema-id: <anonymous-schema-7>
            data:
              type: object
              required:
                - sessionId
                - orderId
                - shopperId
                - cartId
                - authorizationId
                - currency
                - totalMinor
                - groups
                - completedAt
              properties:
                sessionId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                orderId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-9>
                shopperId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-10>
                cartId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-11>
                authorizationId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-12>
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  x-parser-schema-id: <anonymous-schema-13>
                totalMinor:
                  type: integer
                  format: int64
                  minimum: 0
                  x-parser-schema-id: <anonymous-schema-14>
                groups:
                  type: array
                  description: The allocation of the authorization per shipment group.
                  items:
                    type: object
                    required:
                      - groupNo
                      - tier
                      - amountMinor
                    properties:
                      groupNo:
                        type: integer
                        minimum: 1
                        x-parser-schema-id: <anonymous-schema-17>
                      tier:
                        type: string
                        enum:
                          - SAME_DAY
                          - NEXT_DAY
                          - TWO_DAY
                          - STANDARD
                        x-parser-schema-id: Tier
                      amountMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-18>
                    x-parser-schema-id: <anonymous-schema-16>
                  x-parser-schema-id: <anonymous-schema-15>
                completedAt:
                  type: string
                  format: date-time
                  description: RFC 3339 instant in UTC.
                  x-parser-schema-id: Instant
              x-parser-schema-id: CheckoutCompletedData
          x-parser-schema-id: CheckoutCompletedEvent
        examples:
          - name: checkoutCompleted
            summary: A two-group purchase of 21.00 placed as order-77.
            payload:
              specversion: '1.0'
              id: 7d2e9c41-5f6b-4a3e-9c2d-1e8f0a5b6c7d
              source: /retailnetwork/checkout
              type: >-
                com.retailnetwork.storefront.checkout.checkoutsession.CheckoutCompleted
              subject: sess-9001
              time: '2026-10-25T14:20:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:checkout:events:CheckoutCompleted:v1
              data:
                sessionId: sess-9001
                orderId: order-77
                shopperId: shopper-1
                cartId: cart-100234
                authorizationId: auth-55
                currency: USD
                totalMinor: 2100
                groups:
                  - groupNo: 1
                    tier: NEXT_DAY
                    amountMinor: 1365
                  - groupNo: 2
                    tier: STANDARD
                    amountMinor: 735
                completedAt: '2026-10-25T14:20:00Z'
        x-parser-unique-object-id: CheckoutCompleted
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: checkoutEvents
