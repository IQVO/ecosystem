asyncapi: 3.0.0
info:
  title: customer-payments Domain Events
  version: 1.0.0
  contact:
    name: customer-payments maintainers
    url: https://github.com/IQVO/customer-payments
    email: customer-payments@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: customer-payments
      description: >-
        The customer-payments bounded context (storefront domain, Generic
        subdomain).
    - name: consumed
      description: Events produced by sibling contexts that this service consumes.
  description: >-
    Event catalog for the **customer-payments** bounded context of the
    storefront domain: it authorizes a checkout session's payment at the
    provider, captures or releases each shipment group's allocation as
    fulfilment facts arrive, and refunds lost or returned packages. The service
    stores PSP tokens only, never a card number.


    **Published.** Eight events on `retailnetwork.customer-payments.events`
    through a **transactional outbox** (state and already-encoded events are
    written in ONE database transaction; an always-on relay drains them to
    Kafka, at-least-once, the CloudEvents `id` is stored with the outbox row).
    Every published event is analytics-only by design for its consumers (no
    sibling reacts to them).


    **Consumed.** CheckoutCompleted from checkout, FulfillmentShipped,
    FulfillmentCancelled and FulfillmentUnsourceable from order-sourcing,
    PackageLost and PackageReturned from shipping-and-tracking. Facts for an
    order that is not yet bound are parked and applied when CheckoutCompleted
    binds the order; facts still unknown after 24 hours are dead-lettered with
    an alert. Messages list only the fields this service relies on; unknown
    fields are ignored. Each consumer group name comes from a mandatory
    environment variable.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/customer-payments`), `type`,
    `subject` (authorizationId, or refundId for refund events), `time`,
    `datacontenttype` (`application/json`) and `dataschema`
    (`urn:retailnetwork:customer-payments:events:<EventName>:v1`) are all
    required. Kafka key = the subject. Type =
    `com.retailnetwork.storefront.customer-payments.<entity>.<EventName>`. A
    breaking payload change is a new `.v2` type, never a mutation. Dispatch on
    the full `type`, ignore unknown types, dedupe on `id`.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; amounts are
    integer minor units; enums are UPPER_SNAKE; optional fields are omitted when
    absent (never null).
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  customerPaymentsEvents:
    address: retailnetwork.customer-payments.events
    title: customer-payments integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject. Every message carries the CloudEvents content-type header.
