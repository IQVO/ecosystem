            SetListPrice, a sale window starting or ending
            (PublishEffectivePriceOnWindowBoundary), ScheduleSale of an already
            open window and CancelSale of a live sale (CancelSale has no event
            of its own). Subject and key = the catalogItemId. `saleEndsAt` is
            present only while a sale is live.
          contentType: application/cloudevents+json
          tags:
            - name: itemprice
          payload:
            type: object
