            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-22>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it.
              x-parser-schema-id: <anonymous-schema-23>
            source:
              type: string
              const: /retailnetwork/pricing
              x-parser-schema-id: <anonymous-schema-24>
            type:
              type: string
              const: >-
                com.retailnetwork.storefront.pricing.deliverychargeschedule.DeliveryChargeScheduleChanged
              x-parser-schema-id: <anonymous-schema-25>
            subject:
              type: string
              x-parser-schema-id: <anonymous-schema-26>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-27>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:pricing:events:DeliveryChargeScheduleChanged:v1
              x-parser-schema-id: <anonymous-schema-28>
            data:
              type: object
              required:
                - scheduleId
                - version
                - tiers
              properties:
                scheduleId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-29>
                version:
                  type: integer
                  minimum: 1
                  x-parser-schema-id: <anonymous-schema-30>
                tiers:
                  type: array
                  items:
                    type: object
                    required:
                      - tier
                      - chargeMinor
                    properties:
                      tier:
                        type: string
                        enum:
                          - SAME_DAY
                          - NEXT_DAY
                          - TWO_DAY
                          - STANDARD
                        x-parser-schema-id: <anonymous-schema-33>
                      chargeMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: The delivery charge of the tier.
                        x-parser-schema-id: <anonymous-schema-34>
                      freeOverMinor:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          Order subtotal from which the tier is free; omitted
                          when there is no threshold.
                        x-parser-schema-id: <anonymous-schema-35>
                    x-parser-schema-id: <anonymous-schema-32>
                  x-parser-schema-id: <anonymous-schema-31>
              x-parser-schema-id: DeliveryChargeScheduleChangedData
          x-parser-schema-id: DeliveryChargeScheduleChangedEvent
        examples:
          - name: deliveryChargeScheduleChanged
            summary: A new delivery charge schedule became CURRENT.
            payload:
              specversion: '1.0'
              id: 7a2c9e41-5f0b-4c3d-9e6a-1b8d4f0c2a55
              source: /retailnetwork/pricing
              type: >-
                com.retailnetwork.storefront.pricing.deliverychargeschedule.DeliveryChargeScheduleChanged
              subject: sched-1
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:pricing:events:DeliveryChargeScheduleChanged:v1
              time: '2026-10-24T09:00:00.123456Z'
              data:
                scheduleId: sched-1
                version: 3
                tiers:
                  - tier: SAME_DAY
                    chargeMinor: 2490
                  - tier: NEXT_DAY
                    chargeMinor: 1490
                    freeOverMinor: 20000
                  - tier: TWO_DAY
                    chargeMinor: 990
                  - tier: STANDARD
                    chargeMinor: 0
                    freeOverMinor: 9900
        x-parser-unique-object-id: DeliveryChargeScheduleChanged
      TaxTableChanged:
        name: TaxTableChanged
        title: TaxTableChanged
        summary: A new tax table became CURRENT.
        description: >-
          `type` =
          `com.retailnetwork.storefront.pricing.taxtable.TaxTableChanged`.
          Raised by PublishTaxTable; the previous table is SUPERSEDED in the
          same transaction. Subject and key = the taxTableId.
        contentType: application/cloudevents+json
        tags:
          - name: taxtable
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-36>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it.
              x-parser-schema-id: <anonymous-schema-37>
            source:
              type: string
              const: /retailnetwork/pricing
              x-parser-schema-id: <anonymous-schema-38>
            type:
              type: string
              const: com.retailnetwork.storefront.pricing.taxtable.TaxTableChanged
              x-parser-schema-id: <anonymous-schema-39>
            subject:
              type: string
              x-parser-schema-id: <anonymous-schema-40>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-41>
            dataschema:
              type: string
              const: urn:retailnetwork:pricing:events:TaxTableChanged:v1
              x-parser-schema-id: <anonymous-schema-42>
            data:
              type: object
              required:
                - taxTableId
                - version
                - bands
              properties:
                taxTableId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-43>
                version:
                  type: integer
                  minimum: 1
                  x-parser-schema-id: <anonymous-schema-44>
                bands:
                  type: array
                  items:
                    type: object
                    required:
                      - postalPrefixFrom
                      - postalPrefixTo
                      - rateBasisPoints
                    properties:
                      postalPrefixFrom:
                        type: string
                        x-parser-schema-id: <anonymous-schema-47>
                      postalPrefixTo:
                        type: string
                        x-parser-schema-id: <anonymous-schema-48>
                      rateBasisPoints:
                        type: integer
