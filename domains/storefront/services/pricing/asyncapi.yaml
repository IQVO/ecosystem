    action: send
    title: Publish pricing events
    summary: >-
      Publish ItemPriceChanged, ItemPriceWithdrawn,
      DeliveryChargeScheduleChanged and TaxTableChanged through the
      transactional outbox.
    description: >-
      The service sends the integration events of the ItemPrice,
      DeliveryChargeSchedule and TaxTable aggregates to
      `retailnetwork.pricing.events`. Consumers route on the full `type`.
    tags:
      - name: pricing
    channel:
      address: retailnetwork.pricing.events
      title: pricing integration topic
      description: >-
        This service's integration topic. Written by the outbox relay; key =
        subject. Every message carries the CloudEvents content-type header.
      messages:
        ItemPriceChanged:
          name: ItemPriceChanged
          title: ItemPriceChanged
          summary: The effective price of an item changed.
          description: >-
