asyncapi: 3.0.0
info:
  title: pricing Domain Events
  version: 1.0.0
  contact:
    name: pricing maintainers
    url: https://github.com/IQVO/pricing
    email: pricing@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: pricing
      description: The pricing bounded context (retail network, storefront tier).
    - name: itemprice
      description: Events raised by the ItemPrice aggregate.
    - name: deliverychargeschedule
      description: Events raised by the DeliveryChargeSchedule aggregate.
    - name: taxtable
      description: Events raised by the TaxTable aggregate.
    - name: pricequote
      description: Events raised by the PriceQuote aggregate (analytics only).
    - name: consumed
      description: Events produced by offer-availability that this service consumes.
  description: >-
    Event catalog for the **pricing** bounded context of the storefront (Core
    subdomain): list prices and sale windows per catalogue item, the delivery
    charge per service tier, a synthetic tax table and the binding PriceQuote.


    **Published.** Five integration events through a **transactional outbox**
    (the aggregate row and its already-encoded events are written in ONE
    database transaction; an always-on relay drains them to Kafka,
    at-least-once). `ItemPriceChanged`, `ItemPriceWithdrawn`,
    `DeliveryChargeScheduleChanged` and `TaxTableChanged` go to
    `retailnetwork.pricing.events`; `PriceQuoteIssued` is analytics only and
    goes to `retailnetwork.pricing.analytics`. `ItemPriceChanged` is raised
    whenever the effective price moves: a list-price change, a sale window
    starting or ending (clock-driven policy
    PublishEffectivePriceOnWindowBoundary) or a CancelSale of a live sale
    (CancelSale has no event of its own). There is no PriceQuoteExpired event:
    quote expiry is checkout-internal TTL state.


    **Consumed.** `CatalogItemCreated` and `CatalogItemDiscontinued` from
    offer-availability feed the local CatalogItemView; a discontinued item also
    runs the WithdrawOnDiscontinue policy (its ACTIVE price is withdrawn and
    `ItemPriceWithdrawn` published). Only the fields the service relies on are
    listed; unknown fields are ignored. The consumer group name comes from the
    mandatory variable OFFER_AVAILABILITY_CONSUMER_GROUP.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/pricing`), `type`, `subject`,
    `time`, `datacontenttype` (`application/json`) and `dataschema`
    (`urn:retailnetwork:pricing:events:<EventName>:v1`) are all required. Kafka
    key = the subject. Type =
    `com.retailnetwork.storefront.pricing.<entity>.<EventName>`. A breaking
    payload change is a new `.v2` type. Dispatch on the full `type`, ignore
    unknown types, dedupe on `id`.


    **Ordering.** Item events share the catalogItemId as key and carry a
    monotonically increasing `version`: a consumer applies a version only above
    the last one it applied. Schedule and tax-table events carry the published
    `version`.


    **Conventions.** `data` is camelCase; amounts are integer minor units of the
    single configured `currency`; instants are RFC 3339 UTC; enums are
    UPPER_SNAKE; optional fields are omitted when absent (never null).
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  pricingEvents:
    address: retailnetwork.pricing.events
    title: pricing integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject. Every message carries the CloudEvents content-type header.
    messages:
      ItemPriceChanged:
        name: ItemPriceChanged
        title: ItemPriceChanged
        summary: The effective price of an item changed.
        description: >-
          `type` =
          `com.retailnetwork.storefront.pricing.itemprice.ItemPriceChanged`.
          Raised on item creation and whenever the effective price moves:
          SetListPrice, a sale window starting or ending
          (PublishEffectivePriceOnWindowBoundary), ScheduleSale of an already
          open window and CancelSale of a live sale (CancelSale has no event of
          its own). Subject and key = the catalogItemId. `saleEndsAt` is present
          only while a sale is live.
        contentType: application/cloudevents+json
        tags:
          - name: itemprice
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-1>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it.
              x-parser-schema-id: <anonymous-schema-2>
            source:
              type: string
              const: /retailnetwork/pricing
              x-parser-schema-id: <anonymous-schema-3>
            type:
              type: string
              const: com.retailnetwork.storefront.pricing.itemprice.ItemPriceChanged
              x-parser-schema-id: <anonymous-schema-4>
            subject:
              type: string
              x-parser-schema-id: <anonymous-schema-5>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-6>
            dataschema:
              type: string
              const: urn:retailnetwork:pricing:events:ItemPriceChanged:v1
              x-parser-schema-id: <anonymous-schema-7>
            data:
              type: object
              required:
                - catalogItemId
                - currency
                - listPriceMinor
                - effectivePriceMinor
                - version
              properties:
                catalogItemId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  x-parser-schema-id: <anonymous-schema-9>
                listPriceMinor:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The list price.
                  x-parser-schema-id: <anonymous-schema-10>
                effectivePriceMinor:
                  type: integer
                  format: int64
                  minimum: 0
                  description: >-
                    The price a shopper pays now (the list price or the live
                    sale price).
                  x-parser-schema-id: <anonymous-schema-11>
                saleEndsAt:
                  type: string
                  format: date-time
                  description: RFC 3339 instant in UTC.
                  x-parser-schema-id: Instant
                version:
                  type: integer
                  minimum: 1
                  description: >-
                    ItemPrice version; apply only above the last applied
                    version.
                  x-parser-schema-id: <anonymous-schema-12>
              x-parser-schema-id: ItemPriceChangedData
          x-parser-schema-id: ItemPriceChangedEvent
        examples:
          - name: itemPriceChanged
            summary: The effective price of an item changed.
            payload:
              specversion: '1.0'
              id: 7a2c9e41-5f0b-4c3d-9e6a-1b8d4f0c2a55
              source: /retailnetwork/pricing
              type: com.retailnetwork.storefront.pricing.itemprice.ItemPriceChanged
              subject: cat-100234
              datacontenttype: application/json
              dataschema: urn:retailnetwork:pricing:events:ItemPriceChanged:v1
              time: '2026-10-24T09:00:00.123456Z'
              data:
                catalogItemId: cat-100234
                currency: BRL
                listPriceMinor: 12990
                effectivePriceMinor: 9990
                saleEndsAt: '2026-10-31T23:59:59Z'
                version: 7
        x-parser-unique-object-id: ItemPriceChanged
      ItemPriceWithdrawn:
        name: ItemPriceWithdrawn
        title: ItemPriceWithdrawn
        summary: An item's price was withdrawn.
        description: >-
          `type` =
          `com.retailnetwork.storefront.pricing.itemprice.ItemPriceWithdrawn`.
          Raised by WithdrawPrice (POST
          /item-prices/\{catalogItemId\}/withdrawals) and by the
          WithdrawOnDiscontinue policy. A withdrawn item is no longer
          purchasable. Subject and key = the catalogItemId.
        contentType: application/cloudevents+json
        tags:
          - name: itemprice
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-13>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it.
              x-parser-schema-id: <anonymous-schema-14>
            source:
              type: string
              const: /retailnetwork/pricing
              x-parser-schema-id: <anonymous-schema-15>
            type:
              type: string
              const: >-
                com.retailnetwork.storefront.pricing.itemprice.ItemPriceWithdrawn
              x-parser-schema-id: <anonymous-schema-16>
            subject:
              type: string
              x-parser-schema-id: <anonymous-schema-17>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-18>
            dataschema:
              type: string
              const: urn:retailnetwork:pricing:events:ItemPriceWithdrawn:v1
              x-parser-schema-id: <anonymous-schema-19>
            data:
              type: object
              required:
                - catalogItemId
                - version
              properties:
                catalogItemId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-20>
                version:
                  type: integer
                  minimum: 1
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: ItemPriceWithdrawnData
          x-parser-schema-id: ItemPriceWithdrawnEvent
        examples:
          - name: itemPriceWithdrawn
            summary: An item's price was withdrawn.
            payload:
              specversion: '1.0'
              id: 7a2c9e41-5f0b-4c3d-9e6a-1b8d4f0c2a55
              source: /retailnetwork/pricing
              type: >-
                com.retailnetwork.storefront.pricing.itemprice.ItemPriceWithdrawn
              subject: cat-100234
              datacontenttype: application/json
              dataschema: urn:retailnetwork:pricing:events:ItemPriceWithdrawn:v1
              time: '2026-10-24T09:00:00.123456Z'
              data:
                catalogItemId: cat-100234
                version: 8
        x-parser-unique-object-id: ItemPriceWithdrawn
      DeliveryChargeScheduleChanged:
        name: DeliveryChargeScheduleChanged
        title: DeliveryChargeScheduleChanged
        summary: A new delivery charge schedule became CURRENT.
        description: >-
          `type` =
          `com.retailnetwork.storefront.pricing.deliverychargeschedule.DeliveryChargeScheduleChanged`.
          Raised by PublishChargeSchedule; the previous schedule is SUPERSEDED
          in the same transaction. Subject and key = the scheduleId.
        contentType: application/cloudevents+json
        tags:
          - name: deliverychargeschedule
        payload:
