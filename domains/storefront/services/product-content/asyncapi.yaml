asyncapi: 3.0.0
info:
  title: product-content Domain Events
  version: 1.0.0
  contact:
    name: product-content maintainers
    url: https://github.com/IQVO/product-content
    email: product-content@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: product-content
      description: The product-content bounded context (retail network, storefront tier).
    - name: productcontent
      description: Events raised by the ProductContent aggregate.
    - name: categorytree
      description: Events raised by the CategoryTree aggregate.
    - name: consumed
      description: >-
        Events produced by offer-availability that this service consumes (ADR
        0003).
  description: >-
    Event catalog for the **product-content** bounded context of the storefront
    (Generic subdomain): the description, bullets, attributes and media of a
    catalogue item and the category tree (ADR 0001, ADR 0002).


    **Published.** Three integration events, `ProductContentPublished`,
    `ProductContentRetired` and `CategoryTreePublished`, on
    `retailnetwork.product-content.events` through a **transactional outbox**
    (the aggregate row and its already-encoded events are written in ONE
    database transaction; an always-on relay drains them to Kafka,
    at-least-once, the CloudEvents `id` is stored with the outbox row). The
    three types are catalogued in ADR 0004. Nothing is published on
    `retailnetwork.product-content.analytics`: the model names no analytics-only
    event for this context. No event carries a title, a price, stock or PII.


    **Consumed.** `CatalogItemCreated` and `CatalogItemDiscontinued` from
    offer-availability (see the `receive` operation and ADR 0003). They feed the
    local CatalogItemView; a discontinued item also runs the RetireOnDiscontinue
    policy. The messages list only the fields this service relies on; the
    producer's own AsyncAPI file is authoritative and unknown fields are
    ignored. The consumer group name comes from a mandatory environment
    variable.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/product-content`), `type`,
    `subject` (the catalogItemId for content events, the categoryTreeId for tree
    events), `time`, `datacontenttype` (`application/json`) and `dataschema`
    (`urn:retailnetwork:product-content:events:<EventName>:v1`) are all
    required. Kafka key = the subject. Type =
    `com.retailnetwork.storefront.product-content.<entity>.<EventName>`. A
    breaking payload change is a new `.v2` type, never a mutation. Dispatch on
    the full `type`, ignore unknown types, dedupe on `id`.


    **Ordering.** `ProductContentPublished` and `ProductContentRetired` of one
    item share a Kafka key (the catalogItemId) and carry a monotonically
    increasing `revision`: a consumer applies a revision only above the last one
    it applied. `CategoryTreePublished` carries the tree `version` and the WHOLE
    tree, so a consumer replaces its tree when the version is above the last one
    it applied.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; enums are
    UPPER_SNAKE; optional fields are omitted when absent (never null); arrays
    are always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  productContentEvents:
    address: retailnetwork.product-content.events
    title: product-content integration topic
    description: >-
      This service's integration topic. Written by the outbox relay; key =
      subject (the catalogItemId or the categoryTreeId; Hash balancer, so one
      aggregate stays on one partition). Every message carries the Kafka header
      `content-type: application/cloudevents+json; charset=UTF-8` and, when the
      writing request or consumer span is sampled, the W3C
      `traceparent`/`tracestate` headers stored with the outbox row.
    messages:
      ProductContentPublished:
        name: ProductContentPublished
        title: ProductContentPublished
        summary: A revision of an item's content was published.
        description: >-
          `type` =
          `com.retailnetwork.storefront.product-content.productcontent.ProductContentPublished`;
          subject and key = the catalogItemId. Raised by PublishContent (DRAFT
          to PUBLISHED, or PUBLISHED to PUBLISHED when a revision is waiting) in
          the same transaction as the outbox row. Carries the full content, so
          product-discovery never calls back; `revision` orders it (apply only
          above the last applied revision). No title, price or stock: those
          belong to other contexts.
        contentType: application/cloudevents+json
        tags:
          - name: productcontent
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-1>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-2>
            source:
              type: string
              const: /retailnetwork/product-content
              x-parser-schema-id: <anonymous-schema-3>
            type:
              type: string
              const: >-
                com.retailnetwork.storefront.product-content.productcontent.ProductContentPublished
              x-parser-schema-id: <anonymous-schema-4>
            subject:
              type: string
              description: The catalogItemId; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-5>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-6>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:product-content:events:ProductContentPublished:v1
              x-parser-schema-id: <anonymous-schema-7>
            data:
              type: object
              required:
                - catalogItemId
                - revision
                - description
                - bullets
                - attributes
                - media
                - primaryCategoryId
              properties:
                catalogItemId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                revision:
                  type: integer
                  minimum: 1
                  description: >-
                    The published revision; a consumer applies it only above the
                    last applied revision.
                  x-parser-schema-id: <anonymous-schema-9>
                description:
                  type: string
                  x-parser-schema-id: <anonymous-schema-10>
                bullets:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    x-parser-schema-id: <anonymous-schema-12>
                  x-parser-schema-id: <anonymous-schema-11>
                attributes:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                        x-parser-schema-id: <anonymous-schema-15>
                      value:
                        type: string
                        x-parser-schema-id: <anonymous-schema-16>
                      unit:
                        type: string
                        description: Omitted when the attribute has no unit.
                        x-parser-schema-id: <anonymous-schema-17>
                    x-parser-schema-id: <anonymous-schema-14>
                  x-parser-schema-id: <anonymous-schema-13>
                media:
                  type: array
                  maxItems: 12
                  description: Exactly one medium has the role PRIMARY.
                  items:
                    type: object
                    required:
                      - mediaId
                      - url
                      - altText
                      - role
                    properties:
                      mediaId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-20>
                      url:
                        type: string
                        format: uri
                        x-parser-schema-id: <anonymous-schema-21>
                      altText:
                        type: string
                        x-parser-schema-id: <anonymous-schema-22>
                      role:
                        type: string
                        enum:
                          - PRIMARY
                          - GALLERY
                        x-parser-schema-id: <anonymous-schema-23>
                    x-parser-schema-id: <anonymous-schema-19>
                  x-parser-schema-id: <anonymous-schema-18>
                primaryCategoryId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-24>
              x-parser-schema-id: ProductContentPublishedData
          x-parser-schema-id: ProductContentPublishedEvent
        examples:
          - name: productContentPublished
            summary: Revision 2 of an item's content was published.
            payload:
              specversion: '1.0'
              id: 7d2e9c41-5f6b-4a3e-9c2d-1e8f0a5b6c7d
              source: /retailnetwork/product-content
              type: >-
                com.retailnetwork.storefront.product-content.productcontent.ProductContentPublished
              subject: cat-100234
              time: '2026-10-22T14:03:11Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:product-content:events:ProductContentPublished:v1
              data:
                catalogItemId: cat-100234
                revision: 2
                description: >-
                  A 2-litre insulated steel bottle that keeps drinks cold for a
                  day.
                bullets:
                  - Double-wall vacuum insulation
                  - Fits a standard bottle cage
                attributes:
                  - name: capacity
                    value: '2'
                    unit: l
                  - name: material
                    value: stainless steel
                media:
                  - mediaId: med-01
                    url: https://static.example.invalid/cat-100234/main.jpg
                    altText: Steel bottle, side view
                    role: PRIMARY
                  - mediaId: med-02
                    url: https://static.example.invalid/cat-100234/cap.jpg
                    altText: Cap detail
                    role: GALLERY
                primaryCategoryId: cat-bottles
        x-parser-unique-object-id: ProductContentPublished
      ProductContentRetired:
        name: ProductContentRetired
        title: ProductContentRetired
        summary: An item's published content was retired.
        description: >-
          `type` =
          `com.retailnetwork.storefront.product-content.productcontent.ProductContentRetired`;
          subject and key = the catalogItemId. Raised by RetireContent (content
          manager) and by the RetireOnDiscontinue policy for PUBLISHED content.
          Discarding a DRAFT and retiring a DRAFT on discontinuation raise
          nothing: nothing was published. `revision` is the content revision at
          retirement.
        contentType: application/cloudevents+json
        tags:
          - name: productcontent
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-25>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-26>
            source:
              type: string
              const: /retailnetwork/product-content
              x-parser-schema-id: <anonymous-schema-27>
            type:
              type: string
              const: >-
                com.retailnetwork.storefront.product-content.productcontent.ProductContentRetired
              x-parser-schema-id: <anonymous-schema-28>
            subject:
              type: string
              description: The catalogItemId; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-29>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-30>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:product-content:events:ProductContentRetired:v1
              x-parser-schema-id: <anonymous-schema-31>
            data:
              type: object
              required:
                - catalogItemId
                - revision
              properties:
                catalogItemId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-32>
                revision:
                  type: integer
                  minimum: 1
                  description: >-
                    The content revision at retirement; the consumer's monotonic
                    guard still applies.
                  x-parser-schema-id: <anonymous-schema-33>
              x-parser-schema-id: ProductContentRetiredData
          x-parser-schema-id: ProductContentRetiredEvent
        examples:
          - name: productContentRetired
            summary: The published content of an item was retired.
            payload:
              specversion: '1.0'
              id: 1b6f0f6e-2c43-4e0b-8a10-6f6d3a9c5e21
              source: /retailnetwork/product-content
              type: >-
                com.retailnetwork.storefront.product-content.productcontent.ProductContentRetired
              subject: cat-100234
              time: '2026-10-22T16:30:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:product-content:events:ProductContentRetired:v1
              data:
                catalogItemId: cat-100234
                revision: 2
        x-parser-unique-object-id: ProductContentRetired
      CategoryTreePublished:
        name: CategoryTreePublished
        title: CategoryTreePublished
        summary: The category tree was published under a new version.
        description: >-
          `type` =
          `com.retailnetwork.storefront.product-content.categorytree.CategoryTreePublished`;
          subject and key = the categoryTreeId (`main`). Raised by every
          CreateCategory, MoveCategory, RenameCategory and PublishCategoryTree,
          in the same transaction as the tree row: the tree is one live
          aggregate with no draft state, so every command publishes a new
          version. Carries the WHOLE tree ordered by path, so a consumer
          replaces its tree when `version` is above the last applied one.
        contentType: application/cloudevents+json
        tags:
          - name: categorytree
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-34>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-35>
            source:
              type: string
              const: /retailnetwork/product-content
              x-parser-schema-id: <anonymous-schema-36>
            type:
              type: string
              const: >-
                com.retailnetwork.storefront.product-content.categorytree.CategoryTreePublished
              x-parser-schema-id: <anonymous-schema-37>
            subject:
              type: string
              description: The categoryTreeId (`main`); also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-38>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-39>
            dataschema:
              type: string
              const: >-
                urn:retailnetwork:product-content:events:CategoryTreePublished:v1
              x-parser-schema-id: <anonymous-schema-40>
            data:
              type: object
              required:
                - version
                - categories
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: >-
                    The tree version; a consumer applies it only above the last
                    applied version.
                  x-parser-schema-id: <anonymous-schema-41>
                categories:
                  type: array
                  description: The whole tree ordered by path (parents before children).
                  items:
                    type: object
                    required:
                      - categoryId
                      - name
                      - path
                    properties:
                      categoryId:
                        type: string
                        x-parser-schema-id: <anonymous-schema-44>
                      parentId:
                        type: string
                        description: Omitted for a root category.
                        x-parser-schema-id: <anonymous-schema-45>
                      name:
                        type: string
                        x-parser-schema-id: <anonymous-schema-46>
                      path:
                        type: string
                        description: The names from the root joined with "/".
                        x-parser-schema-id: <anonymous-schema-47>
                    x-parser-schema-id: <anonymous-schema-43>
                  x-parser-schema-id: <anonymous-schema-42>
              x-parser-schema-id: CategoryTreePublishedData
          x-parser-schema-id: CategoryTreePublishedEvent
        examples:
          - name: categoryTreePublished
            summary: Version 3 of the category tree.
            payload:
              specversion: '1.0'
              id: 4a8c2d90-7e15-4b3c-b6f2-0c9d8e7a1b35
              source: /retailnetwork/product-content
              type: >-
                com.retailnetwork.storefront.product-content.categorytree.CategoryTreePublished
              subject: main
              time: '2026-10-22T09:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:product-content:events:CategoryTreePublished:v1
              data:
                version: 3
                categories:
                  - categoryId: cat-home
                    name: Home
                    path: Home
                  - categoryId: cat-bottles
                    parentId: cat-home
                    name: Bottles
                    path: Home/Bottles
        x-parser-unique-object-id: CategoryTreePublished
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: productContentEvents
  offerAvailabilityEvents:
    address: retailnetwork.offer-availability.events
    title: offer-availability integration topic (consumed)
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (catalogItemId, listingId or feedId). Every message carries the
      CloudEvents content-type header. Dispatch on the full `type`, ignore
      unknown types, dedupe on `id`.
    messages:
      CatalogItemCreated:
        name: CatalogItemCreated
        title: CatalogItemCreated (consumed)
        summary: A catalogue item was created in the item master.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated`
          produced by offer-availability on
          `retailnetwork.offer-availability.events`. Projected into
          CatalogItemView (ACTIVE) so content can be created for the item. Only
          `catalogItemId` is used; the title, dimensions and flags belong to the
          item master. Dispatch on the full type; unknown fields are ignored.
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          type: object
          description: >-
            What the consumer relies on. It validates the CloudEvents 1.0
            required attributes (specversion, id, source, type) and dispatches
            on the full type; subject, time (used as the CatalogItemView
            instant, the consumer clock when absent), datacontenttype and
            dataschema are not required or checked.
          required:
            - specversion
            - id
            - source
            - type
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-48>
            id:
              type: string
              x-parser-schema-id: <anonymous-schema-49>
            source:
              type: string
              description: As produced, /retailnetwork/offer-availability; not checked.
              x-parser-schema-id: <anonymous-schema-50>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated
              x-parser-schema-id: <anonymous-schema-51>
            subject:
              type: string
              x-parser-schema-id: <anonymous-schema-52>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              description: As produced, application/json; not checked.
              x-parser-schema-id: <anonymous-schema-53>
            dataschema:
              type: string
              description: >-
                As produced,
                urn:retailnetwork:offer-availability:events:CatalogItemCreated:v1;
                not checked.
              x-parser-schema-id: <anonymous-schema-54>
            data:
              type: object
              required:
                - catalogItemId
              properties:
                catalogItemId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  x-parser-schema-id: <anonymous-schema-56>
              x-parser-schema-id: <anonymous-schema-55>
          x-parser-schema-id: CatalogItemCreatedEvent
        examples:
          - name: catalogItemCreated
            summary: A catalogue item was created.
            payload:
              specversion: '1.0'
              id: 7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a10
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated
              subject: cat-100234
              time: '2026-10-22T08:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemCreated:v1
              data:
                catalogItemId: cat-100234
                title: Stainless steel water bottle 2 l
        x-parser-unique-object-id: CatalogItemCreated
      CatalogItemDiscontinued:
        name: CatalogItemDiscontinued
        title: CatalogItemDiscontinued (consumed)
        summary: A catalogue item was discontinued.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued`
          produced by offer-availability on
          `retailnetwork.offer-availability.events`. Marks the item DISCONTINUED
          in CatalogItemView (terminal; a late or replayed CatalogItemCreated
          never revives it) and runs RetireOnDiscontinue: PUBLISHED content
          retires with ProductContentRetired, a DRAFT retires silently (reason
          DISCONTINUED). Dispatch on the full type; unknown fields are ignored.
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          type: object
          description: >-
            What the consumer relies on. It validates the CloudEvents 1.0
            required attributes (specversion, id, source, type) and dispatches
            on the full type; subject, time (used as the CatalogItemView
            instant, the consumer clock when absent), datacontenttype and
            dataschema are not required or checked.
          required:
            - specversion
            - id
            - source
            - type
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-57>
            id:
              type: string
              x-parser-schema-id: <anonymous-schema-58>
            source:
              type: string
              description: As produced, /retailnetwork/offer-availability; not checked.
              x-parser-schema-id: <anonymous-schema-59>
            type:
              type: string
              const: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued
              x-parser-schema-id: <anonymous-schema-60>
            subject:
              type: string
              x-parser-schema-id: <anonymous-schema-61>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              description: As produced, application/json; not checked.
              x-parser-schema-id: <anonymous-schema-62>
            dataschema:
              type: string
              description: >-
                As produced,
                urn:retailnetwork:offer-availability:events:CatalogItemDiscontinued:v1;
                not checked.
              x-parser-schema-id: <anonymous-schema-63>
            data:
              type: object
              required:
                - catalogItemId
              properties:
                catalogItemId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  x-parser-schema-id: <anonymous-schema-65>
              x-parser-schema-id: <anonymous-schema-64>
          x-parser-schema-id: CatalogItemDiscontinuedEvent
        examples:
          - name: catalogItemDiscontinued
            summary: A catalogue item was discontinued.
            payload:
              specversion: '1.0'
              id: 9e3b7f10-2d64-4c8a-a1b5-3f7e6d5c4b20
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued
              subject: cat-100234
              time: '2026-10-22T15:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemDiscontinued:v1
              data:
                catalogItemId: cat-100234
        x-parser-unique-object-id: CatalogItemDiscontinued
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: offerAvailabilityEvents
operations:
  publishProductContentEvents:
    action: send
    title: Publish product-content events
    summary: >-
      Publish ProductContentPublished, ProductContentRetired and
      CategoryTreePublished through the transactional outbox.
    description: >-
      The service sends the events of the ProductContent and CategoryTree
      aggregates to `retailnetwork.product-content.events`. Consumers route on
      the full `type`.
    tags:
      - name: product-content
    channel:
      address: retailnetwork.product-content.events
      title: product-content integration topic
      description: >-
        This service's integration topic. Written by the outbox relay; key =
        subject (the catalogItemId or the categoryTreeId; Hash balancer, so one
        aggregate stays on one partition). Every message carries the Kafka
        header `content-type: application/cloudevents+json; charset=UTF-8` and,
        when the writing request or consumer span is sampled, the W3C
        `traceparent`/`tracestate` headers stored with the outbox row.
      messages:
