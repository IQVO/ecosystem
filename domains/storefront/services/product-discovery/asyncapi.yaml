asyncapi: 3.0.0
info:
  title: product-discovery consumed events
  version: 1.0.0
  contact:
    name: product-discovery maintainers
    url: https://github.com/IQVO/product-discovery
    email: product-discovery@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: product-discovery
      description: The product-discovery bounded context (retail network, storefront tier).
    - name: consumed
      description: >-
        Events produced by other contexts that this service folds into its read
        models.
  description: >-
    Consumed-event notes for the **product-discovery** bounded context (read
    side, no aggregate, ADR 0001, ADR 0003). The service **publishes nothing**:
    `publishes: []` in the model, so there is no outbox, no relay and no
    `retailnetwork.product-discovery.events` topic. This file records the shape
    of the eleven events it consumes; each producer's own AsyncAPI is
    authoritative, unknown fields are ignored (tolerant decoding), and only the
    fields this service reads are listed.


    **Consumed.** From offer-availability
    (`com.retailnetwork.commerce.offer-availability.<entity>.<Event>`):
    CatalogItemCreated, CatalogItemDiscontinued, ListingCreated,
    ListingAvailabilityChanged, ListingSuppressed, ListingRestored. From
    product-content
    (`com.retailnetwork.storefront.product-content.<entity>.<Event>`):
    ProductContentPublished, ProductContentRetired, CategoryTreePublished. From
    pricing (`com.retailnetwork.storefront.pricing.itemprice.<Event>`):
    ItemPriceChanged, ItemPriceWithdrawn. Three consumer groups, one per topic,
    each named by a mandatory environment variable.


    **Processing.** CloudEvents 1.0 structured mode. Idempotent on the
    CloudEvents `id` (inbox table written in the same transaction as the
    projection), dispatch on the full `type` string, unknown types and messages
    that are not valid CloudEvents are skipped (committed past and counted in
    `discovery.kafka.poison_messages`), an event of a handled type whose `data`
    cannot be decoded or folded (`shared.ErrInvalidFact`) is dead-lettered at
    once without retry, and a transient failure is retried with capped
    exponential backoff and dead-lettered after 5 handler attempts. The
    dead-letter topic is `<topic>.dlq` (same key and value, headers
    `x-dlq-source-topic`, `x-dlq-error`, `x-dlq-failed-at`). Per-key monotonic
    guards on top of the inbox: listing `asOf`, content `revision`, price
    `version`, category tree `version`. A fact for an item the item master has
    not announced yet creates an invisible stub row that CatalogItemCreated
    completes (ADR 0002).
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  offerAvailabilityEvents:
    address: retailnetwork.offer-availability.events
    title: offer-availability integration topic (consumed)
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (catalogItemId, listingId or feedId). Every message carries the
      CloudEvents content-type header. Dispatch on the full `type`, ignore
      unknown types, dedupe on `id`.
    messages:
      CatalogItemCreated:
        name: CatalogItemCreated
        title: CatalogItemCreated
        summary: The item master announced a catalogue item.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated`;
          subject and key = catalogItemId. Completes the ProductView row (title,
          hazmat, fragile, item ACTIVE); a row created earlier by an
          out-of-order fact is a stub until this arrives. The product type is
          taken from here, there is no detection.
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-2>
                id:
                  type: string
                  description: The idempotency key of the inbox.
                  x-parser-schema-id: <anonymous-schema-3>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-5>
                subject:
                  type: string
                  x-parser-schema-id: <anonymous-schema-6>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: Instant
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                data:
                  type: object
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: Envelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - catalogItemId
                    - title
                  properties:
                    catalogItemId:
                      type: string
                      x-parser-schema-id: <anonymous-schema-11>
                    title:
                      type: string
                      x-parser-schema-id: <anonymous-schema-12>
                    hazmat:
                      type: boolean
                      x-parser-schema-id: <anonymous-schema-13>
                    fragile:
                      type: boolean
                      x-parser-schema-id: <anonymous-schema-14>
                  x-parser-schema-id: CatalogItemCreatedData
              x-parser-schema-id: <anonymous-schema-10>
          x-parser-schema-id: <anonymous-schema-1>
        examples:
          - name: catalogItemCreated
            summary: A kettle was created in the item master.
            payload:
              specversion: '1.0'
              id: 0c1a4e2b-6d3f-4a8e-9b71-2f5d8c9e0a11
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated
              subject: CI-004512
              time: '2026-10-22T09:00:00Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:CatalogItemCreated:v1
              data:
                catalogItemId: CI-004512
                title: Steel kettle 1.7 l
                hazmat: false
                fragile: false
        x-parser-unique-object-id: CatalogItemCreated
      CatalogItemDiscontinued:
        name: CatalogItemDiscontinued
        title: CatalogItemDiscontinued
        summary: The item master discontinued a catalogue item.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued`;
          subject and key = catalogItemId. The item becomes DISCONTINUED: never
