              id: 5b0f8a52-3c1e-4d7a-9f4e-2a6d1c9e7b31
              source: /retailnetwork/offer-availability
              type: >-
                com.retailnetwork.commerce.offer-availability.listing.ListingAvailabilityChanged
              subject: LST-000184
              time: '2026-10-22T14:05:12Z'
              datacontenttype: application/json
              dataschema: >-
                urn:retailnetwork:offer-availability:events:ListingAvailabilityChanged:v1
              data:
                listingId: LST-000184
                catalogItemId: CI-004512
                nodeId: NODE-VWS-FC01
                availableQty: 120
                asOf: '2026-10-22T14:00:00Z'
        x-parser-unique-object-id: ListingAvailabilityChanged
      ListingSuppressed:
        name: ListingSuppressed
        title: ListingSuppressed
        summary: A listing was suppressed.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.listing.ListingSuppressed`;
          subject and key = listingId. Carries only the listingId: the item
          comes from the ListingItemMap. A suppressed listing never counts
          towards inStock. A suppress for a listing never seen is acknowledged
          and counted, not retried (ADR 0002).
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          allOf:
            - type: object
              required:
                - specversion
