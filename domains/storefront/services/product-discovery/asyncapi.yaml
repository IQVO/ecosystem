      ListingCreated:
        name: ListingCreated
        title: ListingCreated
        summary: A node offers a catalogue item.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.listing.ListingCreated`;
          subject and key = listingId. Adds a LIVE listing row without quantity
          and teaches the ListingItemMap (listingId to catalogItemId) that
          ListingSuppressed and ListingRestored need.
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
