              time: '2026-10-22T09:05:00Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:offer-availability:events:ListingCreated:v1
              data:
                listingId: LST-000184
                catalogItemId: CI-004512
                nodeId: NODE-VWS-FC01
        x-parser-unique-object-id: ListingCreated
      ListingAvailabilityChanged:
        name: ListingAvailabilityChanged
        title: ListingAvailabilityChanged
        summary: A node's claimed quantity of an item changed.
        description: >-
          `type` =
          `com.retailnetwork.commerce.offer-availability.listing.ListingAvailabilityChanged`;
          subject and key = listingId. Sets the listing quantity when `asOf` is
          strictly newer than the listing's last `asOf` (per-listing monotonic
          guard); inStock and purchasable are recomputed. A listing not yet
          known is added LIVE.
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-2>
                id:
                  type: string
                  description: The idempotency key of the inbox.
                  x-parser-schema-id: <anonymous-schema-3>
                source:
