              x-parser-schema-id: <anonymous-schema-22>
            source:
              type: string
              const: /retailnetwork/shopping-cart
              x-parser-schema-id: <anonymous-schema-23>
            type:
              type: string
              const: com.retailnetwork.storefront.shopping-cart.cart.CartAbandoned
              x-parser-schema-id: <anonymous-schema-24>
            subject:
              type: string
