asyncapi: 3.0.0
info:
  title: shopping-cart Domain Events
  version: 1.0.0
  contact:
    name: shopping-cart maintainers
    url: https://github.com/IQVO/shopping-cart
    email: shopping-cart@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: shopping-cart
      description: The shopping-cart bounded context (retail network, storefront tier).
    - name: cart
      description: Events raised by the Cart aggregate.
    - name: consumed
      description: Events produced by other contexts that this service consumes (ADR 0003).
  description: >-
    Event catalog for the **shopping-cart** bounded context of the storefront
    (Supporting subdomain): a shopper's held intent, the delivery quote and
    selections, and the labelled non-binding estimate (ADR 0001, ADR 0002).


    **Published.** Four events on `retailnetwork.shopping-cart.analytics`, all
    analytics-only (decision H1: removal, quantity changes and merge raise
    none): `CartLineAdded`, `CartDeliveryQuoted`, `CartAbandoned`,
    `CartCheckedOut`. They go through a **transactional outbox**; an always-on
    relay drains them to Kafka, at-least-once. The types are catalogued in ADR
    0004.


    **Consumed.** `CatalogItemCreated`, `CatalogItemDiscontinued`
    (offer-availability); `ItemPriceChanged`, `ItemPriceWithdrawn`,
    `DeliveryChargeScheduleChanged`, `TaxTableChanged` (pricing);
    `CheckoutCompleted` (checkout). They feed the local read models
    PurchasabilityView and EstimateView and run the policy
    CloseOnCheckoutCompleted. The messages list only the fields this service
    relies on; the producer's own AsyncAPI file is authoritative and unknown
    fields are ignored. Consumer group names come from mandatory environment
    variables.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/shopping-cart`), `type`,
    `subject` (the cartId), `time`, `datacontenttype` (`application/json`) and
    `dataschema` (`urn:retailnetwork:shopping-cart:analytics:<EventName>:v1`)
    are all required. Kafka key = the subject. Type =
    `com.retailnetwork.storefront.shopping-cart.cart.<EventName>`. A breaking
    payload change is a new `.v2` type, never a mutation. Dispatch on the full
    `type`, ignore unknown types, dedupe on `id`.


    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; enums are
    UPPER_SNAKE.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: >-
      Retail-network Kafka broker (host supplied by the deployment environment
      via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  cartAnalytics:
    address: retailnetwork.shopping-cart.analytics
    title: shopping-cart analytics topic
    description: >-
      This service's ONLY topic: all four published events are analytics-only.
      Written by the outbox relay; key = the cartId. Every message carries the
      CloudEvents content-type header.
    messages:
      CartLineAdded:
        name: CartLineAdded
        title: A line was added to a cart.
        summary: A line was added to a cart.
        description: >-
          `type` =
          `com.retailnetwork.storefront.shopping-cart.cart.CartLineAdded`;
          subject and key = the cartId. Raised by AddLine in the same
          transaction as the outbox row; `quantity` is the MERGED line quantity
          (adding an item already in the cart merges quantities, there is no
          duplicate error). Removal, quantity changes, destination, selection
          and merge raise nothing, by design (decision H1). Analytics only.
        contentType: application/cloudevents+json
        tags:
          - name: cart
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
            - subject
            - time
            - datacontenttype
            - dataschema
            - data
          properties:
            specversion:
              type: string
              const: '1.0'
              x-parser-schema-id: <anonymous-schema-1>
            id:
              type: string
              description: >-
                CloudEvents id (UUID); stable across relay retries. Consumers
                dedupe on it (inbox).
              x-parser-schema-id: <anonymous-schema-2>
            source:
              type: string
              const: /retailnetwork/shopping-cart
              x-parser-schema-id: <anonymous-schema-3>
            type:
              type: string
              const: com.retailnetwork.storefront.shopping-cart.cart.CartLineAdded
              x-parser-schema-id: <anonymous-schema-4>
            subject:
              type: string
              description: The cartId; also the Kafka message key.
              x-parser-schema-id: <anonymous-schema-5>
            time:
              type: string
              format: date-time
              description: RFC 3339 instant in UTC.
              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-6>
            dataschema:
              type: string
              const: urn:retailnetwork:shopping-cart:analytics:CartLineAdded:v1
              x-parser-schema-id: <anonymous-schema-7>
            data:
              type: object
              required:
                - cartId
                - catalogItemId
                - quantity
                - at
              properties:
                cartId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                catalogItemId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-9>
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: The merged line quantity.
                  x-parser-schema-id: <anonymous-schema-10>
                at:
                  type: string
                  format: date-time
                  description: RFC 3339 instant in UTC.
                  x-parser-schema-id: Instant
              x-parser-schema-id: CartLineAddedData
          x-parser-schema-id: CartLineAddedEvent
        examples:
          - name: cartLineAdded
            summary: Two more bottles were added; the line now holds 3.
            payload:
              specversion: '1.0'
              id: 7d2e9c41-5f6b-4a3e-9c2d-1e8f0a5b6c7d
              source: /retailnetwork/shopping-cart
              type: com.retailnetwork.storefront.shopping-cart.cart.CartLineAdded
              subject: cart-100234
              time: '2026-10-25T14:03:11Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:shopping-cart:analytics:CartLineAdded:v1
              data:
                cartId: cart-100234
                catalogItemId: cat-100234
                quantity: 3
                at: '2026-10-25T14:03:11Z'
        x-parser-unique-object-id: CartLineAdded
      CartDeliveryQuoted:
        name: CartDeliveryQuoted
        title: Delivery offers were quoted for a cart.
        summary: Delivery offers were quoted for a cart.
        description: >-
          `type` =
          `com.retailnetwork.storefront.shopping-cart.cart.CartDeliveryQuoted`;
