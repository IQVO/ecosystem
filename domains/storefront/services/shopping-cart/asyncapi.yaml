              time: '2026-10-25T14:03:11Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:shopping-cart:analytics:CartDeliveryQuoted:v1
              data:
                cartId: cart-100234
                destinationPostalPrefix: '787'
                groupCount: 2
                at: '2026-10-25T14:04:00Z'
        x-parser-unique-object-id: CartDeliveryQuoted
      CartAbandoned:
        name: CartAbandoned
        title: An idle cart was abandoned.
        summary: An idle cart was abandoned.
        description: >-
          `type` =
          `com.retailnetwork.storefront.shopping-cart.cart.CartAbandoned`;
          subject and key = the cartId. Raised by the policy AbandonInactive for
          an OPEN cart with no change for 30 days. The abandoned cart is deleted
