              x-parser-schema-id: Instant
            datacontenttype:
              type: string
              const: application/json
              x-parser-schema-id: <anonymous-schema-26>
            dataschema:
              type: string
              const: urn:retailnetwork:shopping-cart:analytics:CartAbandoned:v1
              x-parser-schema-id: <anonymous-schema-27>
            data:
              type: object
              required:
                - cartId
                - lastChangedAt
              properties:
                cartId:
                  type: string
                  x-parser-schema-id: <anonymous-schema-28>
                lastChangedAt:
                  type: string
                  format: date-time
                  description: RFC 3339 instant in UTC.
                  x-parser-schema-id: Instant
              x-parser-schema-id: CartAbandonedData
          x-parser-schema-id: CartAbandonedEvent
        examples:
          - name: cartAbandoned
            summary: A cart idle since 24 September.
            payload:
              specversion: '1.0'
              id: 7d2e9c41-5f6b-4a3e-9c2d-1e8f0a5b6c7d
              source: /retailnetwork/shopping-cart
              type: com.retailnetwork.storefront.shopping-cart.cart.CartAbandoned
              subject: cart-100234
              time: '2026-10-25T14:03:11Z'
              datacontenttype: application/json
              dataschema: urn:retailnetwork:shopping-cart:analytics:CartAbandoned:v1
              data:
                cartId: cart-100234
                lastChangedAt: '2026-09-24T09:00:00Z'
        x-parser-unique-object-id: CartAbandoned
      CartCheckedOut:
        name: CartCheckedOut
        title: A cart was checked out.
        summary: A cart was checked out.
        description: >-
          `type` =
          `com.retailnetwork.storefront.shopping-cart.cart.CartCheckedOut`;
          subject and key = the cartId. Raised by the policy
          CloseOnCheckoutCompleted when checkout reports CheckoutCompleted.
          Analytics only.
        contentType: application/cloudevents+json
        tags:
          - name: cart
        payload:
          type: object
          required:
            - specversion
            - id
            - source
            - type
