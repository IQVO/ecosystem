                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      description: >-
                        urn:warehouse:amr-fleet-control:<events|analytics>:<EventName>:v1.
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      description: The fact's payload; each message's schema pins it.
                      x-parser-schema-id: <anonymous-schema-9>
