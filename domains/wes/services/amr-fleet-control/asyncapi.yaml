asyncapi: 2.6.0
info:
  title: amr-fleet-control Domain Events
  version: 1.0.0
  contact:
    name: amr-fleet-control maintainers
    url: https://github.com/IQVO/amr-fleet-control
    email: amr-fleet-control@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event contract of the **amr-fleet-control** bounded context (WCS tier,
    Generic, segment `wes`; ADR 0001, ADR 0003).

    Seven facts. material-flow-control (WCS plan 04) consumes five:
    `LegAssigned`, `ContainerPickedUp`, `LegCompleted`

    and `LegFailed` for its subsystem-controller interface (WCS context map
    relationship 4), and `FleetCapacityChanged`

    for its capacity view. `RobotStateChanged` and `DeadlockDetected` have no
    consumer yet: material-flow-control skips

    `RobotStateChanged`, and `DeadlockDetected` (like `LegFailed` with reason
    `ROBOT_BLOCKED`) is designed for

    exception-management (WCS plan 05).


    **Published** through a transactional outbox to
    `warehouse.amr-fleet-control.events`, and the same occurrence

    (same CloudEvents `id`, `type` and `data`) to
    `warehouse.amr-fleet-control.analytics` with the `analytics`

    `dataschema` segment. Kafka key = `subject`.


    **Envelope (mandatory).** CloudEvents 1.0 structured mode, header

    `content-type: application/cloudevents+json; charset=UTF-8`,

    `type` = `com.warehouse.wes.amr-fleet-control.<entity>.<EventName>`.
    Dispatch on the full `type`, ignore unknown

    types, dedupe on `id`.


    **Time.** `time` and every `*_at` field are amr-fleet-control's clock.
    `robot_timestamp` is the VDA 5050 header

    timestamp of the robot state the fact came from (the emulator's simulated
    time), present only on such facts.


    No VDA 5050 order, base, horizon or edge is ever published; node ids appear
    only in `DeadlockDetected`.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
tags:
  - name: amr-fleet-control
    description: The amr-fleet-control bounded context (WCS tier).
  - name: mission
    description: Events raised by the Mission aggregate (one leg executed by one robot).
  - name: robot
    description: Events raised by the Robot aggregate.
  - name: fleet
    description: Capacity facts of the whole fleet.
  - name: fleetmap
    description: Events raised by the FleetMap aggregate (traffic control).
defaultContentType: application/cloudevents+json
