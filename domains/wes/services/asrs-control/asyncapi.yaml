asyncapi: 2.6.0
info:
  title: asrs-control Domain Events
  version: 1.0.0
  contact:
    name: asrs-control maintainers
    url: https://github.com/IQVO/asrs-control
    email: asrs-control@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event contract of the **asrs-control** bounded context (WCS tier, Generic,
    segment `wes`; ADR 0001, ADR 0003).

    Five facts for material-flow-control's subsystem-controller interface (WCS
    context map relationship 5) and,

    for `StorageJobFailed` with reason `EQUIPMENT_FAULT`, exception-management.


    **Published** through a transactional outbox to
    `warehouse.asrs-control.events`, and the same occurrence

    (same CloudEvents `id`, `type` and `data`) to
    `warehouse.asrs-control.analytics` with the `analytics`

    `dataschema` segment. Kafka key = `subject`.


    **Envelope (mandatory).** CloudEvents 1.0 structured mode, header

    `content-type: application/cloudevents+json; charset=UTF-8`,

    `type` = `com.warehouse.wes.asrs-control.<entity>.<EventName>`. Dispatch on
    the full `type`, ignore unknown

    types, dedupe on `id`.


    **Time.** `time` and every `*_at` field are asrs-control's clock.
    `plc_timestamp` is the PLC telegram's

    timestamp (the emulator's simulated time), present only on facts that came
    from a telegram.


    No rack position, reshuffle or internal move is ever published (invariant
    6).


    **PLC link (MQTT).** The second half of this contract is the AS/RS telegram
    protocol v1 link to the PLC

    (emulated by IQVO/equipment-emulator, `docs/telegram-protocol.md`; ADR
    0002): channels `asrs/v1/{asrsId}/down`

    and `asrs/v1/{asrsId}/up` on the `plc-link` MQTT server, flat JSON
    (`application/json`, not CloudEvents),

    QoS 1, not retained. asrs-control is the protocol's WCS side, so the
    operations are written from asrs-control's

    point of view: `subscribe` = asrs-control publishes (the down topic),
    `publish` = asrs-control receives (the up

    topic). equipment-emulator's `apis/asyncapi.yaml` describes the same two
    channels from the PLC side. The

    telegrams carry rack positions; they never leave the link (invariant 6).
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
tags:
  - name: asrs-control
    description: The asrs-control bounded context (WCS tier).
  - name: storagejob
    description: Events raised by the StorageJob aggregate.
  - name: equipmentunit
    description: Events raised by the EquipmentUnit aggregate.
  - name: asrs
    description: Capacity facts of a whole AS/RS.
  - name: telegram
    description: >-
      AS/RS telegram protocol v1, the MQTT link between asrs-control and the PLC
      (ADR 0002).
defaultContentType: application/cloudevents+json
channels:
  warehouse.asrs-control.events:
    description: The integration topic. Written by the outbox relay; key = subject.
    servers:
      - production
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveAsrsControlEvents
      summary: Receive asrs-control's facts.
      description: >-
        Route on the full `type`. material-flow-control consumes every type (its
        asyncapi declares all five); exception-management (plan WCS-05b, not
        built yet) is the intended second consumer of StorageJobFailed with
        reason EQUIPMENT_FAULT.
