            tags:
              - name: storagejob
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      description: UUID minted once per occurrence; consumers dedupe on it.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      const: /warehouse/asrs-control
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      description: com.warehouse.wes.asrs-control.<entity>.<EventName>.
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      description: >-
                        urn:warehouse:asrs-control:<events|analytics>:<EventName>:v1.
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    type:
                      type: string
                      const: >-
                        com.warehouse.wes.asrs-control.storagejob.ContainerStored
                      x-parser-schema-id: <anonymous-schema-10>
                    data:
                      type: object
                      required:
                        - storage_job_id
                        - asrs_id
                        - container_id
                        - port_id
                        - stored_at
                      properties:
                        storage_job_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-12>
                        asrs_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-13>
                        container_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-14>
                        port_id:
                          type: string
                          description: The input port.
                          x-parser-schema-id: <anonymous-schema-15>
                        reference:
                          type: string
                          description: The caller's reference from the request
                          when given.: null
                          x-parser-schema-id: <anonymous-schema-16>
                        stored_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-17>
                        plc_timestamp:
                          type: string
                          format: date-time
                          description: >-
                            The PLC telegram's timestamp (simulated time in the
                            emulator). Absent when the fact did not come from a
