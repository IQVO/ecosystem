asyncapi: 2.6.0
info:
  title: exception-management Domain Events
  version: 1.0.0
  contact:
    name: exception-management maintainers
    url: https://github.com/IQVO/exception-management
    email: exception-management@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event catalog for the **exception-management** bounded context (WES

    subdomain): the Problem Solve lifecycle (ADR 0001, ADR 0002). Every case

    is opened by a fact another context published; this service owns the

    triage, assignment, SLA and resolution of that case, never the producer's

    own state.


    **Published.** The `ExceptionCase` aggregate raises six events and the

    `ExceptionPolicy` aggregate one, all published to

    `warehouse.exception-management.events` through a **transactional

    outbox**: the aggregate row and its already-encoded events are written in

    ONE database transaction and a relay drains them to Kafka (at-least-once;

    the CloudEvents `id` is stored with the outbox row, so a retry republishes

    the same `id`). Kafka key = case id (source type for the policy event), so

    one case's history stays ordered on one partition.


    **Consumed (ADR 0003, 0006).** Exception facts from seven sibling contexts:

    fulfillment-execution (`TaskCPTMissed`, `PackageDiverted`,

    `WeightDiscrepancyDetected`), wes-work-planning

    (`BacklogThresholdBreached`), network-fulfillment

    (`AcknowledgementDeadlineAtRisk`, `OrphanedHoldCancelled`),

    order-management (`OrderRepromised`, correlation for auto-resolve only),

    returns-processing (`UnexpectedReturnReceived`), inbound-receiving

    (`CartonDiscrepancyRaised`, routed by `kind`, ADR 0006) and
    inventory-storage

    (`DiscrepancyDetected`, `ItemUnlocated`). Each consumed message opens or

    touches exactly one open case per dedup key (source type, source subject,

    site); the source payload is frozen on the case, never re-fetched. The

    consumed messages below are the producers' own contracts, restated here

    and never imported.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `specversion`, `id`, `source` (`/warehouse/exception-management`), `type`,

    `subject` (the case id; the source type for the policy event), `time`,

    `datacontenttype` (`application/json`) and `dataschema`

    (`urn:warehouse:exception-management:events:<EventName>:v1`) are all

    required. Kafka key = the subject. Type =

    `com.warehouse.wes.exception-management.<entity>.<EventName>`. A breaking

    payload change is a new `.v2` type, never a mutation.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: exception-management
    description: The exception-management bounded context (WES subdomain).
  - name: exceptioncase
    description: Events raised by the ExceptionCase aggregate.
  - name: exceptionpolicy
    description: Events raised by the ExceptionPolicy aggregate.
  - name: analytics
    description: >-
      The analytics read side of this context (ADR 0006): the analytics topic,
      its projector and the reports binary.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).
channels:
  warehouse.exception-management.events:
    description: |
      This service's integration topic. Written by the outbox relay; key = case
      id (source type for the policy event); every message carries the
      CloudEvents content-type header (plus the optional W3C `traceparent` of
      the writing request). Dispatch on the full `type`, ignore unknown types,
      dedupe on `id`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveExceptionEvents
      summary: Receive ExceptionCase and ExceptionPolicy events.
      description: |
        Subscribe to the case lifecycle. Route on the full `type`
        (`com.warehouse.wes.exception-management.exceptioncase.<EventName>`).
        `ExceptionOpened` announces a case (with its frozen source payload);
        `ExceptionTriaged`, `ExceptionAssigned` and `ExceptionEscalated` are
        operator/sweeper facts; `ExceptionResolved` and
        `ExceptionAutoResolved` are terminal. `ExceptionPolicyDeclared` (key
        and subject = the source type) announces a policy version.
      tags:
        - name: exceptioncase
      message:
        oneOf:
          - name: ExceptionOpened
            title: Exception opened
            summary: A source fact created a case (first occurrence of the dedup key).
            description: >
              `type` =
              `com.warehouse.wes.exception-management.exceptioncase.ExceptionOpened`;

              subject and key = the case id. `sla_due_at` is `opened_at` plus
              the

              policy's `sla_minutes` for the source type. `source_payload` is
              the

              frozen copy of the producer's `data` exactly as consumed: it never

              changes after open and is never re-fetched. `site_id` is null when
              the

              source event carries no site.
            contentType: application/cloudevents+json
            tags:
              - name: exceptioncase
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the case id for case events;
                        the source type for the policy event).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - case_id
                        - source_type
                        - source_subject
                        - site_id
                        - severity
                        - queue
                        - opened_at
                        - sla_due_at
                        - source_event_id
                        - source_payload
                      properties:
                        case_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-11>
                        source_type:
                          type: string
                          description: >-
                            The full CloudEvents type of the consumed source
                            fact.
                          x-parser-schema-id: <anonymous-schema-12>
                        source_subject:
                          type: string
                          description: >-
                            The subject of the consumed source fact (its
                            aggregate id).
                          x-parser-schema-id: <anonymous-schema-13>
                        site_id:
                          type: string
                          nullable: true
                          description: >-
                            The site carried by the source fact; null when it
                            has none.
                          x-parser-schema-id: <anonymous-schema-14>
                        severity:
                          type: string
                          enum:
                            - LOW
                            - MEDIUM
                            - HIGH
                            - CRITICAL
                          description: The policy default at open.
                          x-parser-schema-id: <anonymous-schema-15>
                        queue:
                          type: string
                          description: >-
                            The problem-solve queue the policy routes the case
                            to.
                          x-parser-schema-id: <anonymous-schema-16>
                        opened_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-17>
                        sla_due_at:
                          type: string
                          format: date-time
                          description: opened_at + the policy's sla_minutes.
                          x-parser-schema-id: <anonymous-schema-18>
                        source_event_id:
                          type: string
                          description: >-
                            The CloudEvents id of the source fact that opened
                            the case.
                          x-parser-schema-id: <anonymous-schema-19>
                        source_payload:
                          type: object
                          description: >-
                            Frozen copy of the source fact's data; never changes
                            after open.
                          x-parser-schema-id: <anonymous-schema-20>
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: ExceptionOpenedEvent
            examples:
              - name: opened
                summary: A TaskCPTMissed fact opened the case for task task-8a1f.
                payload:
                  specversion: '1.0'
                  id: 3f2a9c1e-6b48-4d17-9a0f-8e5d2c7b4a11
                  source: /warehouse/exception-management
                  type: >-
                    com.warehouse.wes.exception-management.exceptioncase.ExceptionOpened
                  subject: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                  time: '2026-10-21T09:00:05Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:exception-management:events:ExceptionOpened:v1
                  data:
                    case_id: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                    source_type: com.warehouse.wes.fulfillment-execution.task.TaskCPTMissed
                    source_subject: task-8a1f
                    site_id: null
                    severity: HIGH
                    queue: cps-front
                    opened_at: '2026-10-21T09:00:05Z'
                    sla_due_at: '2026-10-21T09:30:05Z'
                    source_event_id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    source_payload:
                      task_id: task-8a1f
                      order_ref: wu-8a1f
                      task_type: PICK
                      cpt: '2026-09-30T14:55:00Z'
            messageId: ExceptionOpened
          - name: ExceptionTriaged
            title: Exception triaged
            summary: Severity and queue were set (policy default or operator).
            description: >
              `type` =
              `com.warehouse.wes.exception-management.exceptioncase.ExceptionTriaged`;

              subject and key = the case id. `actor` is the operator id or
              `system`.
            contentType: application/cloudevents+json
            tags:
              - name: exceptioncase
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the case id for case events;
                        the source type for the policy event).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - case_id
                        - severity
                        - queue
                        - actor
                        - at
                      properties:
                        case_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-23>
                        severity:
                          type: string
                          enum:
                            - LOW
                            - MEDIUM
                            - HIGH
                            - CRITICAL
                          x-parser-schema-id: <anonymous-schema-24>
                        queue:
                          type: string
                          x-parser-schema-id: <anonymous-schema-25>
                        actor:
                          type: string
                          description: The operator id or `system`.
                          x-parser-schema-id: <anonymous-schema-26>
                        at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-27>
                      x-parser-schema-id: <anonymous-schema-22>
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: ExceptionTriagedEvent
            examples:
              - name: triaged
                summary: >-
                  An operator moved the case to the inbound queue at high
                  severity.
                payload:
                  specversion: '1.0'
                  id: 5c4b2d8f-1a39-4e60-8b2d-7f6e5a4b3c22
                  source: /warehouse/exception-management
                  type: >-
                    com.warehouse.wes.exception-management.exceptioncase.ExceptionTriaged
                  subject: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                  time: '2026-10-21T09:05:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:exception-management:events:ExceptionTriaged:v1
                  data:
                    case_id: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                    severity: CRITICAL
                    queue: cps-inbound
                    actor: op-jane
                    at: '2026-10-21T09:05:00Z'
            messageId: ExceptionTriaged
          - name: ExceptionAssigned
            title: Exception assigned
            summary: An owner took the case.
            description: >
              `type` =
              `com.warehouse.wes.exception-management.exceptioncase.ExceptionAssigned`;

              subject and key = the case id. `assignee` is the operator id now

              owning the case; `actor` is who performed the assignment.
            contentType: application/cloudevents+json
            tags:
              - name: exceptioncase
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the case id for case events;
                        the source type for the policy event).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - case_id
                        - assignee
                        - actor
                        - at
                      properties:
                        case_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-30>
                        assignee:
                          type: string
                          description: The operator id now owning the case.
                          x-parser-schema-id: <anonymous-schema-31>
                        actor:
                          type: string
                          description: >-
                            The operator id or `system` that performed the
                            assignment.
                          x-parser-schema-id: <anonymous-schema-32>
                        at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-33>
                      x-parser-schema-id: <anonymous-schema-29>
                  x-parser-schema-id: <anonymous-schema-28>
              x-parser-schema-id: ExceptionAssignedEvent
            examples:
              - name: assigned
                summary: op-marc took the case.
                payload:
                  specversion: '1.0'
                  id: 7e8f9a0b-2c4d-4e5f-8a9b-0c1d2e3f4a33
                  source: /warehouse/exception-management
                  type: >-
                    com.warehouse.wes.exception-management.exceptioncase.ExceptionAssigned
                  subject: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                  time: '2026-10-21T09:10:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:exception-management:events:ExceptionAssigned:v1
                  data:
                    case_id: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                    assignee: op-marc
                    actor: op-jane
                    at: '2026-10-21T09:10:00Z'
            messageId: ExceptionAssigned
          - name: ExceptionEscalated
            title: Exception escalated
            summary: >-
              The SLA clock breached; the ESCALATED flag was set (work
              continues).
            description: >
              `type` =
              `com.warehouse.wes.exception-management.exceptioncase.ExceptionEscalated`;

              subject and key = the case id. Raised once by the bounded SLA
              sweeper

              when `now` passes `sla_due_at` while the case is not resolved. The

              flag never blocks a transition and is not a state (ADR 0002).
            contentType: application/cloudevents+json
            tags:
              - name: exceptioncase
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the case id for case events;
                        the source type for the policy event).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - case_id
                        - sla_due_at
                        - at
                      properties:
                        case_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-36>
                        sla_due_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-37>
                        at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-38>
                      x-parser-schema-id: <anonymous-schema-35>
                  x-parser-schema-id: <anonymous-schema-34>
              x-parser-schema-id: ExceptionEscalatedEvent
            examples:
              - name: escalated
                summary: The case breached its 30-minute SLA.
                payload:
                  specversion: '1.0'
                  id: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c44
                  source: /warehouse/exception-management
                  type: >-
                    com.warehouse.wes.exception-management.exceptioncase.ExceptionEscalated
                  subject: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                  time: '2026-10-21T09:30:06Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:exception-management:events:ExceptionEscalated:v1
                  data:
                    case_id: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                    sla_due_at: '2026-10-21T09:30:05Z'
                    at: '2026-10-21T09:30:06Z'
            messageId: ExceptionEscalated
          - name: ExceptionResolved
            title: Exception resolved
            summary: >-
              A resolution code and root cause were recorded; the case is
              terminal.
            description: >
              `type` =
              `com.warehouse.wes.exception-management.exceptioncase.ExceptionResolved`;

              subject and key = the case id. `resolution_code` and `root_cause`
              are

              mandatory; `note` is a free-form nullable remark. `actor` is the

              operator id. After this the case accepts no command (409-class
              error).
            contentType: application/cloudevents+json
            tags:
              - name: exceptioncase
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the case id for case events;
                        the source type for the policy event).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - case_id
                        - resolution_code
                        - root_cause
                        - note
                        - actor
                        - at
                      properties:
                        case_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-41>
                        resolution_code:
                          type: string
                          description: What was done about the case (a code
                          not prose).: null
                          x-parser-schema-id: <anonymous-schema-42>
                        root_cause:
                          type: string
                          description: Why it happened (a code
                          not prose).: null
                          x-parser-schema-id: <anonymous-schema-43>
                        note:
                          type: string
                          nullable: true
                          description: Free-form remark; null when none.
                          x-parser-schema-id: <anonymous-schema-44>
                        actor:
                          type: string
                          description: The operator id that resolved the case.
                          x-parser-schema-id: <anonymous-schema-45>
                        at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-46>
                      x-parser-schema-id: <anonymous-schema-40>
                  x-parser-schema-id: <anonymous-schema-39>
              x-parser-schema-id: ExceptionResolvedEvent
            examples:
              - name: resolved
                summary: The task was re-run and the promise restored.
                payload:
                  specversion: '1.0'
                  id: 1f2e3d4c-5b6a-4789-9abc-def012345678
                  source: /warehouse/exception-management
                  type: >-
                    com.warehouse.wes.exception-management.exceptioncase.ExceptionResolved
                  subject: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                  time: '2026-10-21T09:25:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:exception-management:events:ExceptionResolved:v1
                  data:
                    case_id: case-1d2e3f4a-5b6c-4789-9abc-def012345678
                    resolution_code: WORK_COMPLETED
                    root_cause: OPERATOR_UNAVAILABLE
                    note: null
                    actor: op-marc
                    at: '2026-10-21T09:25:00Z'
            messageId: ExceptionResolved
          - name: ExceptionAutoResolved
            title: Exception auto-resolved
            summary: A declarative policy rule closed the case on a correlated fact.
            description: >
              `type` =
              `com.warehouse.wes.exception-management.exceptioncase.ExceptionAutoResolved`;

              subject and key = the case id. `rule_id` names the policy's

              auto-resolve rule that fired; `correlated_type` and

              `correlated_event_id` are the full CloudEvents type and id of the

              correlated fact that satisfied the rule (for example an

              `OrderRepromised` for the same work unit within the window).
            contentType: application/cloudevents+json
            tags:
              - name: exceptioncase
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
