  warehouse.fulfillment.events:
    description: >-
      Integration events published by Fulfillment Execution, keyed by aggregate
      id. Consumers dispatch on the full CloudEvents `type`.
    x-eventcatalog-channel-version: 2.0.0
    subscribe:
      operationId: consumeFulfillmentEvents
      summary: Consume fulfillment-execution exception facts.
      description: >
        `TaskCPTMissed` is re-fired on every sweep tick by design: a repeat

        does not open a second case, it touches the open one (occurrence + 1,

        `lastSeenAt`). `order_ref` is WES's per-line work unit id

        `{order_id}-line-{line_no}` (order-management ADR 0018); an

        `OrderRepromised` for that order line closes the case through the

        policy's auto-resolve rule. The CloudEvents `id` claim and the effect

        commit in one transaction; the offset is committed afterwards (ADR
        0003).
