  warehouse.exception-management.analytics:
    description: >
      This service's own analytics stream (ADR 0006), written by the SAME

      transactional outbox relay as the integration topic: every published

      fact appears here too, under the SAME CloudEvents id and `type`, with

      only the `dataschema` stream segment different

      (urn:warehouse:exception-management:analytics:&lt;EventName>:v1). It is
      NOT

      an integration contract: the only consumer is this service's

      cmd/exceptions-projector (fixed group from `ANALYTICS_CONSUMER_GROUP`,

      starting at the earliest retained offset), which folds the events into

      the analytical database; its deterministic poison goes to

      warehouse.exception-management.analytics.dlq. Other contexts keep

      reading warehouse.exception-management.events.
    subscribe:
      operationId: receiveExceptionAnalytics
      summary: Receive the analytics twin of every published fact.
      description: |
        Payloads are byte-for-byte the integration payloads (ADR 0006); only
        the dataschema names the analytics stream. The projector answers the
        root-cause-frequency, mean-time-to-resolve, sla-breach-rate and
        freshness reports from the folded facts.
      tags:
        - name: analytics
      message:
        oneOf:
          - name: ExceptionOpened
            title: Exception opened (analytics twin)
            summary: The analytics-stream twin of ExceptionOpened (ADR 0006).
            description: >-
              Same `type`, `id`, `subject`, key and payload as the integration
              message; `dataschema` =
              `urn:warehouse:exception-management:analytics:ExceptionOpened:v1`.
              Consumed only by cmd/exceptions-projector.
