              source `/warehouse/fulfillment-execution`, dataschema

              `urn:warehouse:fulfillment-execution:events:TaskCPTMissed:v1`.
              Subject

              and Kafka key = the task id. Re-fired on every sweep pass while
              the

              task stays open: every repeat after the first touches the open
              case

              (occurrence + 1, `lastSeenAt`), never opens a second one.

              `order_ref` is WES's work unit id `{order_id}-line-{line_no}`;

              `task_type` is omitted when unknown.
