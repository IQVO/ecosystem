        transactional outbox (ADR-0020), whenever a task ENTERS the pool
        (released from WorkReleased, or created through the API) or RE-ENTERS it
        (the lease-expiry sweep returned a claimed task to Pending, with a new
        `available_at`). Never raised on an idempotent replay or a rejected
        command. Published on `warehouse.fulfillment.events`, keyed by task id.
        Consumed by task-interleaving (its local copy of the open-task pool). A
        task whose location this service cannot determine is NOT announced (the
        consumer rejects an event without `site_id` and `from_location`):
        RELOCATE and REPLENISH tasks carry bins, so they are announced
        (ADR-0049, ADR-0050), and a PICK task whose plan carries both the site
        and the pick face (`WorkReleased.data.pick.site_id` + `from_bin`, the
        producer's additive omit-when-unknown contract) is announced too
        (ADR-0062): a pick missing either is NOT announced, exactly like a move
        whose bins carry no site. A REPLENISH task knows both bins, so it is
        announced with the source bin first and the destination (pick face) bin
        last. A PICK task is announced with the pick face as both ends of the
        trip (the station it ends at is not known at announce time). A PACK /
        SLAM / REBIN / transfer task has no location in this service.
