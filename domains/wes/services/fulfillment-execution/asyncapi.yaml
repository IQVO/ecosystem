asyncapi: 2.6.0
info:
  title: Fulfillment Execution Events API
  version: 2.0.0
  description: >-
    Kafka events produced and consumed by the **Fulfillment Execution** bounded
    context (WES subdomain).


    Every message — integration topic and analytics topic alike — is a
    **CloudEvents 1.0** event in the Kafka protocol binding's *structured*
    content mode (ADR-0032): the Kafka message value is the JSON event, and
    every message carries the Kafka header `content-type:
    application/cloudevents+json; charset=UTF-8` plus W3C
    `traceparent`/`tracestate`. There is no other envelope.


    Required attributes: `specversion` (`1.0`), `id` (UUID v4, stable across
    outbox redelivery; the consumer idempotency key), `source`
    (`/warehouse/fulfillment-execution` for this service), `type`
    (`com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`),
    `subject` (aggregate id, equal to the Kafka key), `time` (occurred-at, UTC),
    `datacontenttype` (`application/json`) and `dataschema`
    (`urn:warehouse:<repo>:<events|analytics>:<EventName>:v<N>`). `data` uses
    snake_case keys.


    The same `type` names an occurrence on both the integration and analytics
    topics; `dataschema` names the payload shape. A breaking payload change
    ships as a new `.v2` type with a new dataschema version.
  contact:
    name: Fulfillment Execution Team
    url: https://github.com/claudioed/fulfillment-execution
    email: fulfillment-execution@warehouse-systems.internal
  license:
    name: Proprietary
    url: https://github.com/claudioed/fulfillment-execution
tags:
  - name: fulfillment-execution
    description: The Fulfillment Execution bounded context (WES subdomain core).
  - name: task
    description: Events raised by the Task aggregate.
  - name: package
    description: Events raised by the Package aggregate.
  - name: promise-feedback
    description: Events closing the promise feedback loop with order-management (ADR-0025).
  - name: analytics
    description: Internal analytics stream for the throughput data product (ADR-0012).
  - name: consumed
    description: Events published by sibling contexts and consumed by this service.
servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >-
      Shared Kafka broker for warehouse-systems. Configured per service via
      KAFKA_BROKERS.
defaultContentType: application/cloudevents+json
channels:
  warehouse.fulfillment.events:
    description: >-
      Integration events published by Fulfillment Execution, keyed by aggregate
      id. Consumers dispatch on the full CloudEvents `type`.
    x-eventcatalog-channel-version: 2.0.0
    publish:
      operationId: consumeFulfillmentIntegrationEvents
      summary: Consume Fulfillment Execution integration events.
      description: >-
        Receive the TaskAvailable, TaskClaimed, TaskCompleted, TaskCPTMissed,
        PackageManifested, PackageDiverted, WeightDiscrepancyDetected,
        TransferPicked, TransferDispatched and TransferArrived CloudEvents this
        bounded context publishes — plus the pick-batching WorkBatchFormed,
        WorkBatchCompleted and WorkBatchAbandoned (ADR 0063, published only with
        PICK_BATCH_MODE on).
      tags:
        - name: fulfillment-execution
      message:
        oneOf:
          - name: TaskAvailable
            title: TaskAvailable
            summary: A task entered or re-entered the open-task pool and is claimable.
            description: >-
              Raised in the same transaction as the state change, through the
              transactional outbox (ADR-0020), whenever a task ENTERS the pool
              (released from WorkReleased, or created through the API) or
              RE-ENTERS it (the lease-expiry sweep returned a claimed task to
              Pending, with a new `available_at`). Never raised on an idempotent
              replay or a rejected command. Published on
              `warehouse.fulfillment.events`, keyed by task id. Consumed by
              task-interleaving (its local copy of the open-task pool). A task
              whose location this service cannot determine is NOT announced (the
              consumer rejects an event without `site_id` and `from_location`):
              RELOCATE and REPLENISH tasks carry bins, so they are announced
              (ADR-0049, ADR-0050), and a PICK task whose plan carries both the
              site and the pick face (`WorkReleased.data.pick.site_id` +
              `from_bin`, the producer's additive omit-when-unknown contract) is
              announced too (ADR-0062): a pick missing either is NOT announced,
              exactly like a move whose bins carry no site. A REPLENISH task
              knows both bins, so it is announced with the source bin first and
              the destination (pick face) bin last. A PICK task is announced
              with the pick face as both ends of the trip (the station it ends
              at is not known at announce time). A PACK / SLAM / REBIN /
              transfer task has no location in this service.
            contentType: application/cloudevents+json
            tags:
              - name: task
            headers:
              type: object
              description: Kafka message headers carried by every message.
              required:
                - content-type
              properties:
                content-type:
                  type: string
                  const: application/cloudevents+json; charset=UTF-8
                  description: CloudEvents structured-mode media type.
                  x-parser-schema-id: <anonymous-schema-1>
                traceparent:
                  type: string
                  description: W3C traceparent of the publishing span.
                  x-parser-schema-id: <anonymous-schema-2>
                tracestate:
                  type: string
                  description: W3C tracestate, present only when a vendor added entries.
                  x-parser-schema-id: <anonymous-schema-3>
              x-parser-schema-id: KafkaHeaders
            payload:
              allOf:
                - type: object
                  description: >-
                    CloudEvents 1.0 context attributes; every attribute is
                    required in this fleet.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      description: CloudEvents spec version.
                      x-parser-schema-id: <anonymous-schema-5>
                    id:
                      type: string
                      format: uuid
                      description: >-
                        UUID v4, minted once per occurrence and stable across
                        outbox redelivery.
                      x-parser-schema-id: <anonymous-schema-6>
                    source:
                      type: string
                      format: uri-reference
                      description: Producing service, `/warehouse/<repo>`.
                      x-parser-schema-id: <anonymous-schema-7>
                    type:
                      type: string
                      description: >-
                        `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`.
                      x-parser-schema-id: <anonymous-schema-8>
                    subject:
                      type: string
                      minLength: 1
                      description: Aggregate instance id; equal to the Kafka message key.
                      x-parser-schema-id: <anonymous-schema-9>
                    time:
                      type: string
                      format: date-time
                      description: Domain occurred-at, UTC, RFC 3339.
                      x-parser-schema-id: <anonymous-schema-10>
                    datacontenttype:
                      type: string
                      const: application/json
                      description: Content type of `data`.
                      x-parser-schema-id: <anonymous-schema-11>
                    dataschema:
                      type: string
                      format: uri
                      description: >-
                        `urn:warehouse:<repo>:<events|analytics>:<EventName>:v<N>`.
                      x-parser-schema-id: <anonymous-schema-12>
                    data:
                      type: object
                      description: Event payload (snake_case keys).
                      x-parser-schema-id: <anonymous-schema-13>
                  x-parser-schema-id: CloudEvent
                - type: object
                  required:
                    - type
                    - source
                    - dataschema
                    - data
                  properties:
                    type:
                      type: string
                      const: >-
                        com.warehouse.wes.fulfillment-execution.task.TaskAvailable
                      x-parser-schema-id: <anonymous-schema-15>
                    source:
                      type: string
                      const: /warehouse/fulfillment-execution
                      x-parser-schema-id: <anonymous-schema-16>
                    dataschema:
                      type: string
                      const: >-
                        urn:warehouse:fulfillment-execution:events:TaskAvailable:v1
                      x-parser-schema-id: <anonymous-schema-17>
                    data:
                      type: object
                      required:
                        - task_id
                        - task_type
                        - site_id
                        - from_location
                        - to_location
                        - required_capabilities
                        - priority_band
                        - available_at
                      properties:
                        task_id:
                          type: string
                          description: >-
                            The pooled task; also the Kafka key and CloudEvents
                            subject.
                          x-parser-schema-id: <anonymous-schema-19>
                        task_type:
                          type: string
                          enum:
                            - PICK
                            - PACK
                            - SLAM
                            - REBIN
                            - DISPATCH
                            - ARRIVAL
                            - RELOCATE
                            - REPLENISH
                          description: The task's type (the process path claimNext scans).
                          x-parser-schema-id: <anonymous-schema-20>
                        site_id:
                          type: string
                          description: >-
                            The site the task is worked at - the first segment
                            of the bin's facility-layout LocationCode
                            (`site-area-zone-aisle-bay-level-position`), derived
                            from the task's own bins, never looked up in another
                            context. For a PICK (ADR-0062) it is the site of the
                            release's pick plan
                            (`WorkReleased.data.pick.site_id`), never derived
                            from the bin.
                          x-parser-schema-id: <anonymous-schema-21>
                        from_location:
                          type: string
                          description: >-
                            Where the operator must go first. RELOCATE - the
                            source bin (for an Assign move, whose source the
                            operator scans at completion, the destination bin).
                            REPLENISH - the source (reserve) bin. PICK - the
                            planned pick face (the plan's `from_bin`, ADR-0062).
                          x-parser-schema-id: <anonymous-schema-22>
                        to_location:
                          type: string
                          description: >-
                            Where the operator ends. RELOCATE - the destination
                            bin (for a Vacate move, whose destination the
                            operator scans at completion, the source bin).
                            REPLENISH - the destination (pick face) bin. PICK -
                            the pick face again (the station the operator ends
                            at is not known at announce time, so the one known
                            point stands for both ends of the trip, exactly like
                            the one known bin of a RELOCATE Assign or Vacate,
                            ADR-0062).
                          x-parser-schema-id: <anonymous-schema-23>
                        required_capabilities:
                          type: array
                          description: >-
                            The capabilities claimNext matches a station
                            against, sorted; an empty array (never null) when
                            the task requires none.
                          items:
                            type: string
                            x-parser-schema-id: <anonymous-schema-25>
                          x-parser-schema-id: <anonymous-schema-24>
                        cpt:
                          type: string
                          format: date-time
                          description: >-
                            The task's committed promise time (UTC). Omitted
                            when the task has none.
                          x-parser-schema-id: <anonymous-schema-26>
                        priority_band:
                          type: string
                          description: >-
                            OPAQUE. Equal across exactly the tasks claimNext
                            orders as peers (same task type and same CPT
                            instant), different for any two it orders strictly.
                            Today `<task_type>:<cpt UTC RFC 3339>`; consumers
                            compare for equality only and must not parse it
                            (ADR-0049). claimNext orders by CPT only, so the
                            NORMAL or URGENT priority of a REPLENISH task does
                            not enter the band (ADR-0050).
                          x-parser-schema-id: <anonymous-schema-27>
                        available_at:
                          type: string
                          format: date-time
                          description: >-
                            The instant the task became claimable (UTC) - the
                            creation instant, or the sweep instant on re-entry
                            after a lease expiry.
                          x-parser-schema-id: <anonymous-schema-28>
                      x-parser-schema-id: <anonymous-schema-18>
                  x-parser-schema-id: <anonymous-schema-14>
              x-parser-schema-id: <anonymous-schema-4>
            examples:
              - name: taskAvailable
                summary: >-
                  A RELOCATE task released with a CPT and two required
                  capabilities.
                headers:
                  content-type: application/cloudevents+json; charset=UTF-8
                  traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
                payload:
                  specversion: '1.0'
                  id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                  source: /warehouse/fulfillment-execution
                  type: com.warehouse.wes.fulfillment-execution.task.TaskAvailable
                  subject: task-rel-1
                  time: '2026-09-30T15:00:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:fulfillment-execution:events:TaskAvailable:v1
                  data:
                    task_id: task-rel-1
                    task_type: RELOCATE
                    site_id: WH1
                    from_location: WH1-RSV-AMB-B02-03-02-C
                    to_location: WH1-FWD-AMB-A01-01-01-A
                    required_capabilities:
                      - forklift
                      - relocate
                    cpt: '2026-09-30T16:00:00Z'
                    priority_band: RELOCATE:2026-09-30T16:00:00Z
                    available_at: '2026-09-30T15:00:00Z'
              - name: taskAvailableReplenish
                summary: >-
                  A REPLENISH task (ADR-0050) - both bins are known, so source
                  bin first and pick face last.
                headers:
                  content-type: application/cloudevents+json; charset=UTF-8
                  traceparent: 00-8812c36621d214139a08949823716b93-14ddf02dbd8913ba-01
                payload:
                  specversion: '1.0'
                  id: 6f1c2a3b-4d5e-4f60-8a7b-9c0d1e2f3a4b
                  source: /warehouse/fulfillment-execution
                  type: com.warehouse.wes.fulfillment-execution.task.TaskAvailable
                  subject: task-rep-1
                  time: '2026-09-30T15:00:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:fulfillment-execution:events:TaskAvailable:v1
                  data:
                    task_id: task-rep-1
                    task_type: REPLENISH
                    site_id: WH1
                    from_location: WH1-RSV-AMB-B02-03-02-C
                    to_location: WH1-FWD-AMB-A01-01-01-A
                    required_capabilities:
                      - forklift
                      - replenish
                    cpt: '2026-09-30T16:00:00Z'
                    priority_band: REPLENISH:2026-09-30T16:00:00Z
                    available_at: '2026-09-30T15:00:00Z'
            messageId: TaskAvailable
          - name: TaskClaimed
            title: TaskClaimed
            summary: A station claimed a task; it left the open-task pool.
            description: >-
              Raised in the same transaction as the claim, through the
              transactional outbox (ADR-0020), for every task type. Never raised
              when the claim is rejected or loses the at-most-once race.
              Published on `warehouse.fulfillment.events` (the richer
              integration row), keyed by task id; the analytics-topic
              TaskClaimed `{task_id, task_type, station_id}` is unchanged.
              Consumed by task-interleaving (removes the task from its pool copy
              and learns the station's next position).
            contentType: application/cloudevents+json
            tags:
              - name: task
            headers:
              type: object
              description: Kafka message headers carried by every message.
              required:
                - content-type
              properties:
                content-type:
                  type: string
                  const: application/cloudevents+json; charset=UTF-8
                  description: CloudEvents structured-mode media type.
                  x-parser-schema-id: <anonymous-schema-1>
                traceparent:
                  type: string
                  description: W3C traceparent of the publishing span.
                  x-parser-schema-id: <anonymous-schema-2>
                tracestate:
                  type: string
