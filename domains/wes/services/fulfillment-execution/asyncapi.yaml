      summary: A station finished a claimed task.
      description: >-
        Raised when the station holding the active claim completes the task.
        Published on `warehouse.fulfillment.events`, keyed (and `subject`-ed) by
        task id, enriched at publish time with `work_unit_id` (the task's order
        reference, so Work Planning can call RecordCompletion), and
        `associate_id`, `duration_seconds`, `task_type` for labor-performance
        (ADR-0014, ADR-0023), and the optional `order_ref` (the order key
        inventory-storage uses to confirm picks, ADR-0040) and `line_no` (the
        order line, so it can confirm that line's reservation, ADR-0041). A
        RELOCATE task's TaskCompleted also carries the executed slot-plan move
        in the additive fields `sku`, `from_bin`, `to_bin`, `quantity` and
        `relocation_ref` (ADR-0047), which inventory-storage applies to its
        ledger as a RelocateStock (its ADR 0039); they are omitted on every
        other task type. A REPLENISH task's TaskCompleted (ADR-0050) carries the
        same `sku`, `from_bin`, `to_bin` and `quantity` plus the additive
        `request_ref` (the replenishment request id) instead of
        `relocation_ref`; inventory-storage applies it as a RelocateStock with
        reason REPLENISHMENT (its ADR 0041), `source_ref` = `request_ref`.
        Consumed by wes-work-planning, labor-performance and inventory-storage.
