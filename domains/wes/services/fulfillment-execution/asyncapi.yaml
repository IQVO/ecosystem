          - name: TaskCompleted
            title: TaskCompleted
            summary: A station finished a claimed task.
            description: >-
              Raised when the station holding the active claim completes the
              task. Published on `warehouse.fulfillment.events`, keyed (and
              `subject`-ed) by task id, enriched at publish time with
              `work_unit_id` (the task's order reference, so Work Planning can
              call RecordCompletion), and `associate_id`, `duration_seconds`,
              `task_type` for labor-performance (ADR-0014, ADR-0023), and the
              optional `order_ref` (the order key inventory-storage uses to
              confirm picks, ADR-0040) and `line_no` (the order line, so it can
              confirm that line's reservation, ADR-0041). A RELOCATE task's
              TaskCompleted also carries the executed slot-plan move in the
              additive fields `sku`, `from_bin`, `to_bin`, `quantity` and
