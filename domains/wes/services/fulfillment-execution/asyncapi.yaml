        task whose location this service cannot determine is NOT announced (the
        consumer rejects an event without `site_id` and `from_location`): today
        only RELOCATE and REPLENISH tasks carry bins, so only they are announced
        (ADR-0049, ADR-0050). A REPLENISH task knows both bins, so it is
        announced with the source bin first and the destination (pick face) bin
        last. A PICK / PACK / SLAM / REBIN / transfer task has no location in
        this service.
