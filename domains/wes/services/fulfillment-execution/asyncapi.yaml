              the additive `request_ref` (the replenishment request id) instead
              of `relocation_ref`; inventory-storage applies it as a
              RelocateStock with reason REPLENISHMENT (its ADR 0041),
              `source_ref` = `request_ref`. Consumed by wes-work-planning,
              labor-performance and inventory-storage.
