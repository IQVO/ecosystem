    material-flow-control-SubsystemCapacityChanged:
      title: Subsystem capacity changed
      summary: The aggregated capacity of the AMR fleet, an AS/RS or a station changed.
      description: >-
        `type` =
        `com.warehouse.wes.material-flow-control.subsystemcapacity.SubsystemCapacityChanged`;
        subject and key = `<subsystem_kind>/<subsystem_id>`. Published when any
        field other than `measured_at` changed, never periodically (ADR 0006). A
        consumer must branch on `subsystem_kind`: `buffer_limit`, `occupied` and
        `queue_depth` are meaningful only for `STATION` (0 for `AMR_FLEET` and
        `ASRS`), and the units mean different things per kind, so never sum
        `units_available` or `open_work` across kinds (`AMR_FLEET` available =
        idle and assignable robots and above the charge threshold; `ASRS`
        available = units not HELD, which may be busy).
      contentType: application/cloudevents+json
      x-no-consumer-reason: 'pending: wes-work-planning capacity consumer (plan 05b)'
      payload:
        allOf:
          - type: object
            required:
              - specversion
              - id
              - source
              - type
              - subject
              - time
              - datacontenttype
              - dataschema
              - data
            properties:
              specversion:
                type: string
                const: '1.0'
                x-parser-schema-id: <anonymous-schema-1>
              id:
                type: string
                format: uuid
                x-parser-schema-id: <anonymous-schema-2>
              source:
                type: string
                const: /warehouse/material-flow-control
                x-parser-schema-id: <anonymous-schema-3>
              type:
                type: string
                x-parser-schema-id: <anonymous-schema-4>
              subject:
                type: string
                x-parser-schema-id: <anonymous-schema-5>
              time:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-6>
              datacontenttype:
                type: string
                const: application/json
                x-parser-schema-id: <anonymous-schema-7>
              dataschema:
                type: string
                x-parser-schema-id: <anonymous-schema-8>
              data:
                type: object
                x-parser-schema-id: <anonymous-schema-9>
            x-parser-schema-id: CloudEventEnvelope
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                description: >
                  D17 mapping (ADR 0006), copied from the subsystem facts, never
                  recomputed:


                  | Published field | AMR_FLEET (FleetCapacityChanged) | ASRS
                  (AsrsCapacityChanged) | STATION (its queue) |

                  | --- | --- | --- | --- |

                  | `subsystem_id` (subject `<kind>/<id>`) | `fleet_id` |
                  `asrs_id` | station id |

                  | `units_total` | `robots_total` (0 accepted) | `units_total`
                  (0 accepted, never sent) | `buffer_limit` |

                  | `units_available` = idle-and-dispatchable |
                  `robots_available` (idle, assignable and above the charge
                  threshold; a robot runs one leg at a time) | `units_available`
                  (an aisle unit queues jobs, so a not-HELD unit is
                  dispatchable) | `buffer_limit - occupied` (min 0) |

                  | `open_work` = queued + active | `legs_queued + legs_active`
                  | `open_jobs` (queued and executing) | `occupied + waiting` |

                  | `status` UNAVAILABLE | `robots_online` = 0 (includes
                  `robots_total` 0) | `units_available` = 0 | never |

                  | `status` DEGRADED | available < total | available < total |
                  arrivals wait upstream |

                  | `capacity_per_hour` | available x `legsPerRobotHour` (30) |
                  available x `retrievalsPerUnitHour` (60) | 0 |

                  | `buffer_limit`, `occupied`, `queue_depth` | 0 | 0 | the
                  queue's |

                  | not published | `robots_online` (status only),
                  `robots_charging`, `robots_held` | `positions_total`,
                  `positions_free` | — |

                  | `measured_at` | this context's clock when the fact was
                  applied; `changed_at` is never copied | this context's clock;
                  asrs-control's `measured_at` is never copied | this context's
                  clock |


                  Negative counts clamp to 0.
                required:
                  - subsystem_kind
                  - subsystem_id
                  - status
                  - units_total
                  - units_available
                  - open_work
                  - capacity_per_hour
                  - buffer_limit
                  - occupied
                  - queue_depth
                  - measured_at
                properties:
                  subsystem_kind:
                    type: string
                    enum:
                      - AMR_FLEET
                      - ASRS
                      - STATION
                    x-parser-schema-id: <anonymous-schema-73>
                  subsystem_id:
                    type: string
                    x-parser-schema-id: <anonymous-schema-74>
                  status:
                    type: string
                    enum:
                      - AVAILABLE
                      - DEGRADED
                      - UNAVAILABLE
                    x-parser-schema-id: <anonymous-schema-75>
                  units_total:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-76>
                  units_available:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-77>
                  open_work:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-78>
                  capacity_per_hour:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-79>
                  buffer_limit:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-80>
                  occupied:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-81>
                  queue_depth:
                    type: integer
                    minimum: 0
                    x-parser-schema-id: <anonymous-schema-82>
                  measured_at:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-83>
                x-parser-schema-id: <anonymous-schema-72>
            x-parser-schema-id: <anonymous-schema-71>
        x-parser-schema-id: SubsystemCapacityChangedEvent
      examples:
