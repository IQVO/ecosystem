                    | Published field | AMR_FLEET (FleetCapacityChanged) | ASRS
                    (AsrsCapacityChanged) | STATION (its queue) |

                    | --- | --- | --- | --- |

                    | `subsystem_id` (subject `<kind>/<id>`) | `fleet_id` |
                    `asrs_id` | station id |

                    | `units_total` | `robots_total` (0 accepted) |
                    `units_total` (0 accepted, never sent) | `buffer_limit` |

                    | `units_available` = idle-and-dispatchable |
                    `robots_available` (idle, assignable and above the charge
                    threshold; a robot runs one leg at a time) |
                    `units_available` (an aisle unit queues jobs, so a not-HELD
                    unit is dispatchable) | `buffer_limit - occupied` (min 0) |

                    | `open_work` = queued + active | `legs_queued +
                    legs_active` | `open_jobs` (queued and executing) |
                    `occupied + waiting` |

                    | `status` UNAVAILABLE | `robots_online` = 0 (includes
                    `robots_total` 0) | `units_available` = 0 | never |

                    | `status` DEGRADED | available < total | available < total
                    | arrivals wait upstream |

                    | `capacity_per_hour` | available x `legsPerRobotHour` (30)
                    | available x `retrievalsPerUnitHour` (60) | 0 |

                    | `buffer_limit`, `occupied`, `queue_depth` | 0 | 0 | the
                    queue's |

                    | not published | `robots_online` (status only),
                    `robots_charging`, `robots_held` | `positions_total`,
                    `positions_free` | — |

                    | `measured_at` | this context's clock when the fact was
                    applied; `changed_at` is never copied | this context's
                    clock; asrs-control's `measured_at` is never copied | this
                    context's clock |


