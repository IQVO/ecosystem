                type: >-
                  com.warehouse.wes.material-flow-control.subsystemcapacity.SubsystemCapacityChanged
                subject: AMR_FLEET/AMR1
                time: '2026-11-20T08:00:00Z'
                datacontenttype: application/json
                dataschema: >-
                  urn:warehouse:material-flow-control:events:SubsystemCapacityChanged:v1
                data:
                  subsystem_kind: AMR_FLEET
                  subsystem_id: AMR1
                  status: UNAVAILABLE
                  units_total: 0
                  units_available: 0
                  open_work: 3
                  capacity_per_hour: 0
                  buffer_limit: 0
                  occupied: 0
                  queue_depth: 0
