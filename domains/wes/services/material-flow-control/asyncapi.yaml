asyncapi: 3.0.0
info:
  title: material-flow-control events
  version: 0.1.0
  description: >-
    The facts of material-flow-control, the WCS material flow controller and the
    one door from the WES to the automation: transport requests accepted or
    rejected, containers arriving at goods-to-person stations, transports
    completed or failed, containers sent to clarification, and the aggregated
    capacity of the AMR fleet, the AS/RS and the stations. CloudEvents 1.0
    structured mode; every event is written to
    warehouse.material-flow-control.events and
    warehouse.material-flow-control.analytics under the same id; the Kafka key
    is the subject; every *_at is material-flow-control's own clock. No payload
    names a robot, leg, node, shuttle, aisle, rack position, port or storage job
    (seam decision 3). It consumes ten facts of the two subsystem controllers
    (asrsControlEvents, amrFleetControlEvents; WCS context map relationships 4
    and 5) and commits every other type on those topics past.
  x-classification: Supporting
  contact:
    name: material-flow-control maintainers
    url: https://github.com/IQVO/material-flow-control
    email: material-flow-control@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: material-flow-control
      description: The material-flow-control bounded context (WCS tier, Supporting).
    - name: transportrequest
      description: Facts of the TransportRequest record (a refusal at once).
    - name: transportorder
      description: Facts raised by the TransportOrder aggregate.
    - name: containertrack
      description: Facts raised by the ContainerTrack aggregate.
    - name: subsystemcapacity
      description: Aggregated capacity of the AMR fleet, the AS/RS and the stations.
servers:
  cluster:
    host: kafka.warehouse-systems.svc.cluster.local:9092
    protocol: kafka
channels:
  materialFlowControlEvents:
    address: warehouse.material-flow-control.events
    description: >-
      The integration stream (fulfillment-execution, wes-work-planning,
      exception-management consume it).
    messages:
      material-flow-control-TransportRejected:
        title: Transport rejected
        summary: A transport request was refused at once; no transport order exists.
        description: >-
          `type` =
          `com.warehouse.wes.material-flow-control.transportrequest.TransportRejected`;
          subject and key = the transport_request_id. The same id stays
          rejected: send a new id to try again.
        contentType: application/cloudevents+json
        x-no-consumer-reason: >-
          pending: fulfillment-execution EquipmentCommandPort adapter (plan 05b)
          reads the 422 answer and this fact
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  const: /warehouse/material-flow-control
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                data:
                  type: object
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required:
                    - transport_request_id
                    - container_id
                    - source
                    - destination
                    - purpose
                    - reason
                    - detail
                    - rejected_at
                  properties:
                    transport_request_id:
                      type: string
                      minLength: 1
                      maxLength: 128
                      x-parser-schema-id: <anonymous-schema-12>
                    container_id:
                      type: string
                      pattern: ^[A-Za-z0-9._-]{1,64}$
                      x-parser-schema-id: <anonymous-schema-13>
                    source:
                      type: string
                      description: A LocationCode
                      the AS/RS logical location or a station id: null
                      x-parser-schema-id: <anonymous-schema-14>
                    destination:
                      type: string
                      x-parser-schema-id: <anonymous-schema-15>
                    purpose:
                      type: string
                      enum:
                        - PICK
                        - PUTAWAY
                        - REPLENISH
                        - OUTBOUND
                        - RETURN
                      x-parser-schema-id: <anonymous-schema-16>
                    reason:
                      type: string
