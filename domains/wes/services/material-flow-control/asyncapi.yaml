                    x-parser-schema-id: <anonymous-schema-3>
                  type:
                    type: string
                    x-parser-schema-id: <anonymous-schema-4>
                  subject:
                    type: string
                    x-parser-schema-id: <anonymous-schema-5>
                  time:
                    type: string
                    format: date-time
                    x-parser-schema-id: <anonymous-schema-6>
                  datacontenttype:
                    type: string
                    const: application/json
                    x-parser-schema-id: <anonymous-schema-7>
                  dataschema:
                    type: string
                    x-parser-schema-id: <anonymous-schema-8>
                  data:
                    type: object
                    x-parser-schema-id: <anonymous-schema-9>
                x-parser-schema-id: CloudEventEnvelope
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    description: >
                      D17 mapping (ADR 0006), copied from the subsystem facts,
                      never recomputed:


                      | Published field | AMR_FLEET (FleetCapacityChanged) |
                      ASRS (AsrsCapacityChanged) | STATION (its queue) |

                      | --- | --- | --- | --- |

                      | `subsystem_id` (subject `<kind>/<id>`) | `fleet_id` |
                      `asrs_id` | station id |

                      | `units_total` | `robots_total` (0 accepted) |
                      `units_total` (0 accepted, never sent) | `buffer_limit` |

                      | `units_available` = idle-and-dispatchable |
                      `robots_available` (idle, assignable and above the charge
                      threshold; a robot runs one leg at a time) |
                      `units_available` (an aisle unit queues jobs, so a
                      not-HELD unit is dispatchable) | `buffer_limit - occupied`
                      (min 0) |

                      | `open_work` = queued + active | `legs_queued +
                      legs_active` | `open_jobs` (queued and executing) |
                      `occupied + waiting` |

                      | `status` UNAVAILABLE | `robots_online` = 0 (includes
                      `robots_total` 0) | `units_available` = 0 | never |

                      | `status` DEGRADED | available < total | available <
                      total | arrivals wait upstream |

                      | `capacity_per_hour` | available x `legsPerRobotHour`
                      (30) | available x `retrievalsPerUnitHour` (60) | 0 |

                      | `buffer_limit`, `occupied`, `queue_depth` | 0 | 0 | the
                      queue's |

                      | not published | `robots_online` (status only),
                      `robots_charging`, `robots_held` | `positions_total`,
                      `positions_free` | — |

                      | `measured_at` | this context's clock when the fact was
                      applied; `changed_at` is never copied | this context's
                      clock; asrs-control's `measured_at` is never copied | this
                      context's clock |


                      Negative counts clamp to 0.
                    required:
                      - subsystem_kind
                      - subsystem_id
                      - status
                      - units_total
                      - units_available
                      - open_work
                      - capacity_per_hour
                      - buffer_limit
                      - occupied
                      - queue_depth
                      - measured_at
                    properties:
                      subsystem_kind:
                        type: string
                        enum:
                          - AMR_FLEET
                          - ASRS
                          - STATION
                        x-parser-schema-id: <anonymous-schema-73>
                      subsystem_id:
                        type: string
                        x-parser-schema-id: <anonymous-schema-74>
                      status:
                        type: string
                        enum:
                          - AVAILABLE
                          - DEGRADED
                          - UNAVAILABLE
                        x-parser-schema-id: <anonymous-schema-75>
                      units_total:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-76>
                      units_available:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-77>
                      open_work:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-78>
                      capacity_per_hour:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-79>
                      buffer_limit:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-80>
                      occupied:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-81>
                      queue_depth:
                        type: integer
                        minimum: 0
                        x-parser-schema-id: <anonymous-schema-82>
                      measured_at:
                        type: string
                        format: date-time
                        x-parser-schema-id: <anonymous-schema-83>
                    x-parser-schema-id: <anonymous-schema-72>
                x-parser-schema-id: <anonymous-schema-71>
            x-parser-schema-id: SubsystemCapacityChangedEvent
          examples:
            - payload:
                specversion: '1.0'
                id: 6a3f2c1e-0000-4000-8000-000000000007
                source: /warehouse/material-flow-control
                type: >-
                  com.warehouse.wes.material-flow-control.subsystemcapacity.SubsystemCapacityChanged
                subject: AMR_FLEET/AMR1
                time: '2026-11-20T08:00:00Z'
