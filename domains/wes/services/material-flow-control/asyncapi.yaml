        material-flow-control-SubsystemCapacityChanged:
          title: Subsystem capacity changed
          summary: >-
            The aggregated capacity of the AMR fleet, an AS/RS or a station
            changed.
          description: >-
            `type` =
            `com.warehouse.wes.material-flow-control.subsystemcapacity.SubsystemCapacityChanged`;
            subject and key = `<subsystem_kind>/<subsystem_id>`. Published when
            any field other than `measured_at` changed, never periodically (ADR
            0006). A consumer must branch on `subsystem_kind`: `buffer_limit`,
            `occupied` and `queue_depth` are meaningful only for `STATION` (0
            for `AMR_FLEET` and `ASRS`), and the units mean different things per
            kind, so never sum `units_available` or `open_work` across kinds
            (`AMR_FLEET` available = idle and assignable robots and above the
            charge threshold; `ASRS` available = units not HELD, which may be
            busy).
          contentType: application/cloudevents+json
          x-no-consumer-reason: 'pending: wes-work-planning capacity consumer (plan 05b)'
          payload:
            allOf:
