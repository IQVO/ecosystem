              commitment. `receivedAt` is carried so consumers can compute
              acknowledgement latency (`at - receivedAt`) without a second
              lookup — the analytics projection does exactly that. A pending
              submission raises nothing; a failed one raises
              `NetworkOrderRejected` with `reason=SUBMISSION_FAILED` and never
              this event.


