              published when the order moved to `SUBMITTED`. Because its meaning
              changed, it is published as a NEW `.v2` type and `:v2` dataschema
              (fleet CloudEvents standard §4); the v1 type
              `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderAcknowledged`
              is no longer published. The payload field set is unchanged. The
              earlier fact is now `NetworkOrderSubmitted`.


              `type`:
