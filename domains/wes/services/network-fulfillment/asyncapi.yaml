                      format: uri-reference
                      enum:
                        - /warehouse/network-fulfillment
                      description: The producing service.
                      x-parser-schema-id: <anonymous-schema-7>
                    type:
                      type: string
                      pattern: >-
                        ^com\.warehouse\.wes\.network-fulfillment\.networkorder\.[A-Z][A-Za-z]+(\.v[0-9]+)?$
                      description: >-
                        `com.warehouse.wes.network-fulfillment.networkorder.<EventName>`,
                        with a `.v<N>` suffix for a breaking version (e.g.
                        `NetworkOrderAcknowledged.v2`, ADR 0016).
                      x-parser-schema-id: <anonymous-schema-8>
                    subject:
                      type: string
