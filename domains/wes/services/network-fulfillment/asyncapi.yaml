asyncapi: 2.6.0
info:
  title: Network Fulfillment Events
  version: 2.0.0
  description: |
    Domain-event catalog for **Network Fulfillment**, a Supporting bounded
    context in the WES (Warehouse Execution Systems) subdomain: the
    anti-corruption layer between the warehouse-systems fleet and an
    external retail fulfillment network. One aggregate raises every event
    documented here:

    - `NetworkOrder` (package `internal/domain/networkorder`) — one network
      purchase order and its acknowledgement lifecycle. Raises
      `NetworkOrderReceived`, `NetworkOrderSubmitted`,
      `NetworkOrderAcknowledged` (v2: raised when the order settles
      `ACKNOWLEDGED`, ADR 0016), `NetworkOrderRejected`,
      `NetworkOrderShipmentConfirmed` and (from the
      acknowledgement sweep, without a state transition)
      `AcknowledgementDeadlineAtRisk`; and (from the orphaned-hold sweep,
      ADR 0024, also without a state transition) `OrphanedHoldCancelled`.

    **Envelope (mandatory, ADR 0008).** Every message on every channel of
    this service is a CloudEvents 1.0 event in *structured content mode*
    (Kafka protocol binding): the Kafka message value is the JSON event
    format, content type `application/cloudevents+json`, and every message
    carries the Kafka header
    `content-type: application/cloudevents+json; charset=UTF-8`. There is no
    other envelope. All of `specversion`, `id`, `source`, `type`, `subject`,
    `time`, `datacontenttype` and `dataschema` are REQUIRED. W3C trace
    context, when present, travels in Kafka headers, never as extension
    attributes: an event written through the transactional outbox inside a
    span carries that span's `traceparent` (and `tracestate` / `baggage`
    when present), stored with the outbox row and sent by the relay
    (ADR 0022). Consumers may extract these headers and must not require
    them. The Kafka message key is the network order reference
    (`networkRef`, identical to `subject`), so every event for one order
    lands on the same partition.

    **Type naming.** `type` is
    `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`. For
    this context the subdomain is `wes`, the bounded context is
    `network-fulfillment` and the entity is `networkorder`, e.g.
    `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived`.
    The SAME `type` is used for the occurrence on the integration and on
    the analytics channel; `dataschema`
    (`urn:warehouse:network-fulfillment:<events|analytics>:<EventName>:v<N>`)
    names the payload shape. A breaking change gets a new `.v2`
    type and a new dataschema version, never a mutation of these:
    `NetworkOrderAcknowledged` changed meaning in ADR 0016 and is published
    as `...networkorder.NetworkOrderAcknowledged.v2` /
    `...:NetworkOrderAcknowledged:v2`.

    **Consumers** must dispatch on the full `type`, ignore unknown types,
    dedupe on `id` (stable across outbox redelivery), and dead-letter or
    skip — never parse as a legacy shape — anything that fails CloudEvents
    validation.
  contact:
    name: Network Fulfillment — IQVO
    url: https://github.com/IQVO/network-fulfillment
    email: claudioed.oliveira@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
tags:
  - name: network-fulfillment
    description: |
      The Network Fulfillment bounded context (WES subdomain) — the ACL
      between the fleet and the external retail fulfillment network.
  - name: networkorder
    description: Events raised by the `NetworkOrder` aggregate.
  - name: analytics
    description: |
      The internal analytics stream consumed by this service's own
      acknowledgement-report projector.
servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: Shared warehouse-systems Kafka cluster.
defaultContentType: application/cloudevents+json
channels:
  warehouse.network-fulfillment.events:
    description: |
      The integration topic (the `Topic` constant in
      `internal/adapters/outbound/kafka/publisher.go`). Every domain event
      the `NetworkOrder` aggregate raises is published here, via the
      transactional outbox when `DATABASE_URL` is configured (ADR 0003).
      dataschema: `urn:warehouse:network-fulfillment:events:<EventName>:v<N>`
      (v1, except `NetworkOrderAcknowledged` which is v2 — ADR 0016).
    x-eventcatalog-channel-version: 2.0.0
    publish:
      operationId: consumeNetworkFulfillmentEvents
      summary: Consume Network Fulfillment integration events.
      description: |
        Every message is a CloudEvents 1.0 structured-mode event; route on
        the full `type` attribute.
      tags:
        - name: network-fulfillment
      message:
        oneOf:
          - name: NetworkOrderReceived
            title: Network order received
            summary: >-
              Demand from the external retail network was turned into a
              NetworkOrder; the 24h acknowledgement clock is running.
            description: >
              Raised by the `NetworkOrder` aggregate the moment network demand
              is received — whether or not every line could be translated into
              our SKU vocabulary. `lineCount` is the number of successfully
              translated lines (0 for demand rejected as untranslatable).


              `type`:
              `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived`
              — `dataschema`:
              `urn:warehouse:network-fulfillment:events:NetworkOrderReceived:v1`.
            contentType: application/cloudevents+json
            headers:
              type: object
              required:
                - content-type
              properties:
                content-type:
                  type: string
                  description: Structured content mode media type.
                  enum:
                    - application/cloudevents+json; charset=UTF-8
                  x-parser-schema-id: <anonymous-schema-1>
                traceparent:
                  type: string
                  description: |
                    W3C trace context of the span that wrote the event (outbox
                    mode, ADR 0022), when there was one. Optional.
                  x-parser-schema-id: <anonymous-schema-2>
                tracestate:
                  type: string
                  description: W3C trace state, when present. Optional.
                  x-parser-schema-id: <anonymous-schema-3>
                baggage:
                  type: string
                  description: W3C baggage, when the writing request carried any. Optional.
                  x-parser-schema-id: <anonymous-schema-4>
              x-parser-schema-id: KafkaHeaders
            bindings:
              kafka:
                key:
                  type: string
                  description: >-
                    Network order reference (networkRef), identical to
                    `subject`.
            tags:
              - name: networkorder
              - name: network-fulfillment
            payload:
              title: NetworkOrderReceived CloudEvent (events)
              allOf:
                - type: object
                  title: CloudEvents 1.0 envelope (structured mode)
                  description: >
                    The single envelope every message of this service uses. Each
                    event

                    schema below composes it with `allOf` and pins `type`,

                    `dataschema` and the `data` shape. No other envelope exists.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      enum:
                        - '1.0'
                      description: CloudEvents specification version.
                      x-parser-schema-id: <anonymous-schema-5>
                    id:
                      type: string
                      format: uuid
                      description: >
                        UUID v4 minted once per occurrence and persisted with
                        the outbox

                        row, so a redelivery carries the same id. `(source, id)`
                        is the

                        consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-6>
                    source:
                      type: string
                      format: uri-reference
                      enum:
                        - /warehouse/network-fulfillment
                      description: The producing service.
                      x-parser-schema-id: <anonymous-schema-7>
                    type:
                      type: string
                      pattern: >-
                        ^com\.warehouse\.wes\.network-fulfillment\.networkorder\.[A-Z][A-Za-z]+(\.v[0-9]+)?$
                      description: >-
                        `com.warehouse.wes.network-fulfillment.networkorder.<EventName>`,
                        with a `.v<N>` suffix for a breaking version (e.g.
                        `NetworkOrderAcknowledged.v2`, ADR 0016).
                      x-parser-schema-id: <anonymous-schema-8>
                    subject:
                      type: string
                      minLength: 1
                      description: >-
                        The network order reference (networkRef) the event is
                        about.
                      x-parser-schema-id: <anonymous-schema-9>
                    time:
                      type: string
                      format: date-time
                      description: The domain event's occurred-at instant, UTC, RFC 3339.
                      x-parser-schema-id: <anonymous-schema-10>
                    datacontenttype:
                      type: string
                      enum:
                        - application/json
                      x-parser-schema-id: <anonymous-schema-11>
                    dataschema:
                      type: string
                      format: uri
                      pattern: >-
                        ^urn:warehouse:network-fulfillment:(events|analytics):[A-Z][A-Za-z]+:v[0-9]+$
                      description: Names the payload shape and stream.
                      x-parser-schema-id: <anonymous-schema-12>
                    data:
                      type: object
                      description: The domain event payload.
                      x-parser-schema-id: <anonymous-schema-13>
                  x-parser-schema-id: CloudEvent
                - type: object
                  properties:
                    type:
                      type: string
                      const: >-
                        com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived
                      x-parser-schema-id: <anonymous-schema-15>
                    dataschema:
                      type: string
                      const: >-
                        urn:warehouse:network-fulfillment:events:NetworkOrderReceived:v1
                      x-parser-schema-id: <anonymous-schema-16>
                    data:
                      type: object
                      title: NetworkOrderReceived payload
                      required:
                        - networkRef
                        - siteId
                        - requiredShipBy
                        - acknowledgeBy
                        - lineCount
                        - at
                      properties:
                        networkRef:
                          type: string
                          description: >-
                            Network order reference (this context's NetworkRef).
                            Also the CloudEvents `subject` and the Kafka key.
                          x-parser-schema-id: <anonymous-schema-17>
                        siteId:
                          type: string
                          description: Fulfilling site.
                          x-parser-schema-id: <anonymous-schema-18>
                        requiredShipBy:
                          type: string
                          format: date-time
                          description: Ship-by deadline the network demands.
                          x-parser-schema-id: <anonymous-schema-19>
                        acknowledgeBy:
                          type: string
                          format: date-time
                          description: End of the acknowledgement window.
                          x-parser-schema-id: <anonymous-schema-20>
                        lineCount:
                          type: integer
                          description: Number of lines translated into our vocabulary.
                          x-parser-schema-id: <anonymous-schema-21>
                        at:
                          type: string
                          format: date-time
                          description: >-
                            Domain occurred-at (same instant as the CloudEvents
                            `time`).
                          x-parser-schema-id: <anonymous-schema-22>
                      x-parser-schema-id: NetworkOrderReceivedData
                  x-parser-schema-id: <anonymous-schema-14>
              x-parser-schema-id: NetworkOrderReceivedEvent
            examples:
              - name: networkOrderReceived
                summary: Network order received for network order po-1.
                headers:
                  content-type: application/cloudevents+json; charset=UTF-8
                payload:
                  specversion: '1.0'
                  id: 9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33
                  source: /warehouse/network-fulfillment
                  type: >-
                    com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderReceived
                  subject: po-1
                  time: '2026-09-23T08:00:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:network-fulfillment:events:NetworkOrderReceived:v1
                  data:
                    networkRef: po-1
                    siteId: site-1
                    requiredShipBy: '2026-09-25T08:00:00Z'
                    acknowledgeBy: '2026-09-24T08:00:00Z'
                    lineCount: 2
                    at: '2026-09-23T08:00:00Z'
            messageId: NetworkOrderReceived
          - name: NetworkOrderSubmitted
            title: Network order submitted
            summary: >-
              We told the network yes (the order is SUBMITTED) and a held order
              exists in order-management; the submission is not yet reconciled.
            description: >
              Raised by the `NetworkOrder` aggregate in the same atomic scope
              that moves the order to `SUBMITTED` (ADR 0016): the decision to
              accept in full has been taken, the network has been told yes and a
              held order exists in order-management (`localOrderId`), but the
              submission is only accepted-for-processing and NOT yet reconciled
              against the network's transaction-status record (ADR 0001 §5). It
              is exactly what `NetworkOrderAcknowledged` v1 used to announce. A
              consumer must not treat it as a settled commitment: the settle is
              `NetworkOrderAcknowledged` (v2); a refused submission is
              `NetworkOrderRejected` with `reason=SUBMISSION_FAILED`.


              `type`:
              `com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderSubmitted`
              — `dataschema`:
              `urn:warehouse:network-fulfillment:events:NetworkOrderSubmitted:v1`.
            contentType: application/cloudevents+json
            headers:
              type: object
              required:
                - content-type
              properties:
                content-type:
                  type: string
                  description: Structured content mode media type.
                  enum:
                    - application/cloudevents+json; charset=UTF-8
                  x-parser-schema-id: <anonymous-schema-1>
                traceparent:
                  type: string
                  description: |
                    W3C trace context of the span that wrote the event (outbox
                    mode, ADR 0022), when there was one. Optional.
                  x-parser-schema-id: <anonymous-schema-2>
                tracestate:
                  type: string
                  description: W3C trace state, when present. Optional.
                  x-parser-schema-id: <anonymous-schema-3>
                baggage:
                  type: string
                  description: W3C baggage, when the writing request carried any. Optional.
                  x-parser-schema-id: <anonymous-schema-4>
              x-parser-schema-id: KafkaHeaders
            bindings:
              kafka:
                key:
                  type: string
                  description: >-
                    Network order reference (networkRef), identical to
                    `subject`.
            tags:
              - name: networkorder
              - name: network-fulfillment
            payload:
              title: NetworkOrderSubmitted CloudEvent (events)
              allOf:
                - type: object
                  title: CloudEvents 1.0 envelope (structured mode)
                  description: >
                    The single envelope every message of this service uses. Each
                    event

                    schema below composes it with `allOf` and pins `type`,

                    `dataschema` and the `data` shape. No other envelope exists.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      enum:
                        - '1.0'
                      description: CloudEvents specification version.
                      x-parser-schema-id: <anonymous-schema-5>
                    id:
                      type: string
                      format: uuid
                      description: >
                        UUID v4 minted once per occurrence and persisted with
                        the outbox

                        row, so a redelivery carries the same id. `(source, id)`
                        is the

                        consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-6>
                    source:
                      type: string
                      format: uri-reference
                      enum:
                        - /warehouse/network-fulfillment
                      description: The producing service.
                      x-parser-schema-id: <anonymous-schema-7>
                    type:
                      type: string
                      pattern: >-
                        ^com\.warehouse\.wes\.network-fulfillment\.networkorder\.[A-Z][A-Za-z]+(\.v[0-9]+)?$
                      description: >-
                        `com.warehouse.wes.network-fulfillment.networkorder.<EventName>`,
                        with a `.v<N>` suffix for a breaking version (e.g.
                        `NetworkOrderAcknowledged.v2`, ADR 0016).
                      x-parser-schema-id: <anonymous-schema-8>
                    subject:
                      type: string
                      minLength: 1
                      description: >-
                        The network order reference (networkRef) the event is
                        about.
                      x-parser-schema-id: <anonymous-schema-9>
                    time:
