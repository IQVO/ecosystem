              (2xx) or `NOT_FOUND` (404, the hold no longer existed — still
              done). `localOrderId` is the order-management order that was held;
              it is published here and nowhere else for an order that was never
              submitted, because `GET /network-orders/{networkRef}` exposes
              `localOrderId` only from `SUBMITTED` on.


