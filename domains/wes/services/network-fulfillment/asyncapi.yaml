              was never committed to (still `NEW`, or `REJECTED` with the cancel
              never confirmed), and order-management confirmed the hold is gone.
              The sweep NEVER changes the order's state — `RejectOverdueOrders`
              owns that and publishes `NetworkOrderRejected` — and it raises
              this event only when the hold was actually freed: a hold
              order-management reports as already released (409/422) was not an
              orphan and raises nothing. The outcome is recorded in the same
              transaction as the event, so it fires once per hold and is not
              re-raised on later passes.


