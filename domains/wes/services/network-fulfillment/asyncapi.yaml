                - type: object
                  properties:
                    type:
                      type: string
                      const: >-
                        com.warehouse.wes.network-fulfillment.networkorder.NetworkOrderSubmitted
                      x-parser-schema-id: <anonymous-schema-24>
                    dataschema:
                      type: string
                      const: >-
                        urn:warehouse:network-fulfillment:events:NetworkOrderSubmitted:v1
                      x-parser-schema-id: <anonymous-schema-25>
                    data:
                      type: object
                      title: NetworkOrderSubmitted payload
                      required:
                        - networkRef
                        - siteId
                        - localOrderId
                        - receivedAt
                        - at
                      properties:
                        networkRef:
                          type: string
                          description: Network order reference; also the `subject`.
                          x-parser-schema-id: <anonymous-schema-26>
                        siteId:
                          type: string
                          description: Fulfilling site.
                          x-parser-schema-id: <anonymous-schema-27>
                        localOrderId:
                          type: string
                          description: >-
