asyncapi: 3.0.0
info:
  title: network-inventory-planning events
  version: 1.0.0
  contact:
    name: warehouse-systems
    url: https://github.com/IQVO/network-inventory-planning
    email: warehouse-systems@warehouse-systems.internal
  license:
    name: MIT
  tags:
    - name: consumed-facts
      description: Sibling-context facts projected into local read models.
    - name: consumed-replies
      description: inventory-storage's transfer-allocation replies driving the saga.
    - name: published
      description: This context's published transfer saga events and commands.
    - name: published-analytics
      description: >-
        This context's saga-health analytics occurrences (ADR 0007,
        observe-only).
  description: >
    Event contract of the network-inventory-planning bounded context.


    **Phase 1** declares the three CONSUMED facts (projected into local

    read models):


    - `com.warehouse.wms.facility-layout.site.SiteCapabilityChanged`
      (facility-layout, `warehouse.facility.events`) → local
      `site_capability` read model (keyed site_id, LWW on
      capability_revision).
    - `com.warehouse.wes.order-management.siteskudemand.SiteSkuDemandChanged`
      (order-management, `warehouse.order-management.events`) → local
      `site_sku_demand` read model (keyed source_order_id+line_no, state
      ACTIVE/REMOVED).
    - `com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished`
      (warehouse-planning, `warehouse.warehouse-planning.events`) → local
      `published_capacity_plan` read model (keyed plan_id, LWW on the
      CloudEvents time. The payload is warehouse-planning's existing v1
      payload plus the additive `site_id`; a legacy event WITHOUT `site_id`
      is EXCLUDED (the site is never inferred from warehouse_id).

    **Phase 2 (ADR 0003, the transfer saga)** adds the PUBLISHED stream on

    `warehouse.network-inventory-planning.events` — emitted through the

    transactional outbox in the same transaction as the saga state change —

    and the two CONSUMED inventory-storage replies on

    `warehouse.inventory.events`:


    -
    `com.warehouse.wes.network-inventory-planning.transfer.TransferPlanApproved`
      (published, subject/key transfer_id): an operator approved an
      advisory proposal into a transfer plan.
    -
    `com.warehouse.wes.network-inventory-planning.transfer.TransferAllocationRequested`
      (published COMMAND, subject/key `transfer_line_id` = `<transfer_id>:1`
      for the v1 single-line saga): inventory-storage allocates origin
      stock against `transfer_line_id` and replies on
      `warehouse.inventory.events`.
    - `com.warehouse.wms.inventory-storage.reservation.TransferStockAllocated`
      (consumed reply, subject/key reservation_id): the saga moves
      ALLOCATING → ALLOCATED, persisting reservation_id, allocations[] and
      expires_at.
    -
    `com.warehouse.wms.inventory-storage.reservation.TransferStockAllocationRejected`
      (consumed reply, subject/key transfer_line_id): the saga moves
      ALLOCATING → UNFULFILLABLE with the closed reason
      ORIGIN_SITE_UNKNOWN|INSUFFICIENT_USABLE|IDEMPOTENCY_CONFLICT.

    **Phase 4 (ADR 0007, observability + scheduled runs)** adds this

    context's analytics stream on

    `warehouse.network-inventory-planning.analytics`: the saga-health

    occurrences `TransferStateAdvanced` (every state transition, same

    outbox transaction), `TransferStuckDetected` (a bounded observe-only

    ticker; NIP_HEALTH_CHECK_INTERVAL / NIP_STUCK_THRESHOLDS) and

    `RebalanceRunCompleted` (each scheduled rebalance pass; observe-only

    — no approval, no allocation command). W3C trace context

    (`traceparent`) propagates on every produced and consumed message.


    **Phase 3 (ADR 0005, work-demand release + fact-driven transitions)**

    adds the released work demands on the PUBLISHED stream, the three

    CONSUMED fulfillment-execution transfer facts on

    `warehouse.fulfillment.events`, and the two CONSUMED

    inventory-storage destination facts on `warehouse.inventory.events`:


    -
    `com.warehouse.wes.network-inventory-planning.workdemand.WorkDemandReleased`
      (published COMMAND, subject/key `demand_id`): one leg of an approved
      transfer released for warehouse work. WES (wes-work-planning) is the
      consumer; the payload below mirrors ITS consumed contract exactly.
    - `com.warehouse.wes.fulfillment-execution.transfer.TransferPicked`
      (consumed fact, subject/key task_id): ALLOCATED → PICKED, the
      picked quantity recorded (a short pick is recorded, not refused),
      and the dispatch WorkDemandReleased released with the PICKED
      quantity.
    - `com.warehouse.wes.fulfillment-execution.transfer.TransferDispatched`
      (consumed fact, subject/key task_id): PICKED → IN_TRANSIT.
    - `com.warehouse.wes.fulfillment-execution.transfer.TransferArrived`
      (consumed fact, RESERVED — scan-driven receiving may bypass it):
      IN_TRANSIT → ARRIVED; inventory-storage's TransferReceiptStaged
      drives the same transition.
    - `com.warehouse.wms.inventory-storage.stock.TransferReceiptStaged`
      (consumed fact, subject/key transfer_line_id): IN_TRANSIT → ARRIVED
      (the scan-driven receiving path).
    - `com.warehouse.wms.inventory-storage.stock.TransferStockStowed`
      (consumed fact, subject/key transfer_line_id): ARRIVED → RECEIVED
      (terminal), the destination stow allocations persisted.

    Consumers decode CloudEvents 1.0 structured mode only, dispatch on the

    FULL `type`, ignore unknown types, dedupe on `id` in-transaction

    (processed_events), and commit offsets only after the read-model

    transaction commits. Consumer group ids are environment-configured

    (SITE_CAPABILITY_CONSUMER_GROUP, SITE_SKU_DEMAND_CONSUMER_GROUP,

    CAPACITY_PLAN_CONSUMER_GROUP, TRANSFER_REPLY_CONSUMER_GROUP,

    TRANSFER_FACT_CONSUMER_GROUP, PACK_LEVEL_CONSUMER_GROUP); an empty

    value means the consumer does not exist. A message that can never be

    applied (not a valid CloudEvent, an undecodable payload) is published

    raw, with x-dlq-* headers, to `<source topic>.dlq` and committed past;

    only infrastructure failures are retried. A fact whose transfer_ref

    names no known transfer is WARN-logged and committed past, never

    retried.


    Every produced message uses `source`
    `/warehouse/network-inventory-planning`,

    the Kafka header `content-type: application/cloudevents+json;

    charset=UTF-8`, the W3C trace headers when a span is active, and the

    Kafka key shown per event (hash-partitioned).


    The analytics stream is also CONSUMED by this context's own

    `nip-projector` binary (group ANALYTICS_CONSUMER_GROUP, default

    `network-inventory-planning-analytics`; dead letters go to

    `warehouse.network-inventory-planning.analytics.dlq`), which builds the

    analytical database behind the nip-reports API.


    The consumed payload schemas below are the producers' own contract

    shapes mirrored read-only (each producer's apis/asyncapi.yaml on

    origin/develop is authoritative).
servers:
  production:
    host: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: Fleet-shared Kafka broker.
defaultContentType: application/cloudevents+json
channels:
  warehouse.facility.events:
    address: warehouse.facility.events
    title: facility-layout integration topic
    description: >
      The single outbound integration topic for this bounded context, named
      after the `Topic` constant in
      `internal/adapters/outbound/kafka/publisher.go`
      (`warehouse.facility.events`). Every domain event this context raises is
      published here when `EVENT_PUBLISHER=kafka` — the whole Published
      Language, not a subset. The one live consumer today is inventory-storage's
      location-classification cache (ZoneRegistered, LocationSlotRegistered,
      LocationSlotDecommissioned); everything else is available, unconsumed
      Published Language.
    messages:
      SiteCapabilityChanged:
        name: SiteCapabilityChanged
        title: Site capability changed
        summary: A site's transfer capability state changed (consumed).
        contentType: application/cloudevents+json
        payload:
          description: CloudEvents 1.0 envelope of facility-layout's SiteCapabilityChanged.
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: UUID; the consumer's dedupe key.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                data:
                  type: object
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: cloudEvent
            - type: object
              properties:
                type:
                  const: com.warehouse.wms.facility-layout.site.SiteCapabilityChanged
                  x-parser-schema-id: <anonymous-schema-11>
                dataschema:
                  const: >-
                    urn:warehouse:facility-layout:events:SiteCapabilityChanged:v1
                  x-parser-schema-id: <anonymous-schema-12>
                data:
                  type: object
                  required:
                    - site_code
                    - transfer_origin_enabled
                    - transfer_destination_enabled
                    - capability_revision
                  properties:
                    site_code:
                      type: string
                      description: The site identity; also the Kafka key and subject.
                      x-parser-schema-id: <anonymous-schema-14>
                    transfer_origin_enabled:
                      type: boolean
                      x-parser-schema-id: <anonymous-schema-15>
                    transfer_destination_enabled:
                      type: boolean
                      x-parser-schema-id: <anonymous-schema-16>
                    capability_revision:
                      type: integer
                      format: int64
                      description: Monotonically increasing; LWW tiebreaker.
                      x-parser-schema-id: <anonymous-schema-17>
                  x-parser-schema-id: <anonymous-schema-13>
              x-parser-schema-id: <anonymous-schema-10>
          x-parser-schema-id: SiteCapabilityChangedEvent
        x-parser-unique-object-id: SiteCapabilityChanged
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: warehouse.facility.events
  warehouse.order-management.events:
    address: warehouse.order-management.events
    title: order-management integration topic
    description: >-
      The outbound integration topic owned by the Order Management bounded
      context (`kafka.Topic` in the code). `OrderAllocated`/
      `OrderPartiallyAllocated` and — since ADR 0018 — `OrderRepromised` are
      forwarded here; since ADR 0035 the additive, PII-free
      `SiteSkuDemandChanged` projection is too (keyed by the line-scoped
      `<order_id>/line/<line_no>`, not the bare order id). Every other domain
      event is a local concern. wes-work-planning's Kafka consumer derives each
      line's work unit id from the frozen formula `{orderID}-line-{lineNo}`.
    messages:
      SiteSkuDemandChanged:
        name: SiteSkuDemandChanged
        title: Site/SKU demand changed
        summary: One source order line's site demand changed (consumed).
        contentType: application/cloudevents+json
        payload:
          description: CloudEvents 1.0 envelope of order-management's SiteSkuDemandChanged.
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: UUID; the consumer's dedupe key.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                data:
                  type: object
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: cloudEvent
            - type: object
              properties:
                type:
                  const: >-
                    com.warehouse.wes.order-management.siteskudemand.SiteSkuDemandChanged
                  x-parser-schema-id: <anonymous-schema-19>
                dataschema:
                  const: >-
                    urn:warehouse:order-management:events:SiteSkuDemandChanged:v1
                  x-parser-schema-id: <anonymous-schema-20>
                data:
                  type: object
                  required:
                    - source_order_id
                    - line_no
                    - site_id
                    - sku
                    - demanded_units
                    - due_at
                    - state
                    - assignment_version
                  properties:
                    source_order_id:
                      type: string
                      x-parser-schema-id: <anonymous-schema-22>
                    line_no:
                      type: integer
                      x-parser-schema-id: <anonymous-schema-23>
                    site_id:
                      type: string
                      x-parser-schema-id: <anonymous-schema-24>
                    sku:
                      type: string
                      x-parser-schema-id: <anonymous-schema-25>
                    demanded_units:
                      type: integer
                      x-parser-schema-id: <anonymous-schema-26>
                    due_at:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-27>
                    state:
                      type: string
                      enum:
                        - ACTIVE
                        - REMOVED
                      x-parser-schema-id: <anonymous-schema-28>
                    assignment_version:
                      type: string
                      description: >-
                        order-management's site-assignment policy version
                        ("static-site-v1").
                      x-parser-schema-id: <anonymous-schema-29>
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: <anonymous-schema-18>
          x-parser-schema-id: SiteSkuDemandChangedEvent
        x-parser-unique-object-id: SiteSkuDemandChanged
    x-eventcatalog-channel-version: 1.0.0
    x-parser-unique-object-id: warehouse.order-management.events
  warehouse.warehouse-planning.events:
    address: warehouse.warehouse-planning.events
    title: warehouse-planning integration topic
    description: |
      This service's integration topic (`Topic` in
      `internal/adapters/outbound/kafka/encoder.go`). Written by the outbox
      relay; key = the raising aggregate's id (plan id, or
      processType/location/window for a ProcessCapacity); every message
      carries the `content-type: application/cloudevents+json; charset=UTF-8`
      header (plus the optional W3C `traceparent` of the writing request,
      ADR 0014). Dispatch on the full `type`, ignore unknown types, dedupe
      on `id`.
    messages:
      CapacityPlanPublished:
        name: CapacityPlanPublished
        title: Capacity plan published
        summary: A capacity plan was published (consumed).
        contentType: application/cloudevents+json
        payload:
          description: >-
            CloudEvents 1.0 envelope of warehouse-planning's
            CapacityPlanPublished (v1 payload + additive site_id).
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: UUID; the consumer's dedupe key.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                data:
                  type: object
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: cloudEvent
            - type: object
              properties:
                type:
                  const: >-
                    com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished
                  x-parser-schema-id: <anonymous-schema-31>
                dataschema:
                  const: >-
                    urn:warehouse:warehouse-planning:events:CapacityPlanPublished:v1
                  x-parser-schema-id: <anonymous-schema-32>
                data:
                  type: object
                  required:
                    - plan_id
                    - site_id
                    - location
                    - path_id
                    - window_start
                    - window_end
                    - assigned_demand
                    - path_capacity
                    - capacity_over_window
                    - shortage
                    - bottleneck_step
                    - published_at
                  properties:
                    plan_id:
                      type: string
                      x-parser-schema-id: <anonymous-schema-34>
                    site_id:
                      type: string
                      description: >-
                        Additive Phase-1 field. A legacy event without it is
                        EXCLUDED by this consumer, never defaulted or inferred.
                      x-parser-schema-id: <anonymous-schema-35>
                    warehouse_id:
                      type: string
                      description: >-
                        Legacy warehouse-planning field; read by this consumer
                        but never used to infer the site.
                      x-parser-schema-id: <anonymous-schema-36>
                    location:
                      type: string
                      x-parser-schema-id: <anonymous-schema-37>
                    path_id:
                      type: string
                      x-parser-schema-id: <anonymous-schema-38>
                    window_start:
                      type: string
                      format: date-time
                      description: >-
                        Planning window start (RFC 3339, UTC). The window is
                        [window_start, window_end).
                      x-parser-schema-id: <anonymous-schema-39>
                    window_end:
                      type: string
                      format: date-time
                      description: Planning window end, EXCLUSIVE.
                      x-parser-schema-id: <anonymous-schema-40>
                    assigned_demand:
                      type: number
                      format: double
                      x-parser-schema-id: <anonymous-schema-41>
                    path_capacity:
                      type: number
                      format: double
                      x-parser-schema-id: <anonymous-schema-42>
                    capacity_over_window:
                      type: number
                      format: double
                      x-parser-schema-id: <anonymous-schema-43>
                    shortage:
                      type: number
                      format: double
                      x-parser-schema-id: <anonymous-schema-44>
                    bottleneck_step:
                      type: string
                      x-parser-schema-id: <anonymous-schema-45>
                    published_at:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-46>
                  x-parser-schema-id: <anonymous-schema-33>
              x-parser-schema-id: <anonymous-schema-30>
          x-parser-schema-id: CapacityPlanPublishedEvent
        x-parser-unique-object-id: CapacityPlanPublished
    x-eventcatalog-channel-version: 0.7.0
    x-parser-unique-object-id: warehouse.warehouse-planning.events
  warehouse.network-inventory-planning.events:
    address: warehouse.network-inventory-planning.events
    title: network-inventory-planning integration topic
    description: |
      This context's OWN integration stream (Phase 2). Everything on it is
      emitted through the transactional outbox: the saga state change and
      the outbox row commit in one transaction, and a background relay
      publishes afterwards — a request handler never sends directly.
    messages:
      TransferPlanApproved:
        x-no-consumer-reason: operator approval record of the transfer saga; consumed on demand
        name: TransferPlanApproved
        title: Transfer plan approved
        summary: >-
          An operator approved an advisory proposal into a transfer plan
          (published).
        contentType: application/cloudevents+json
        payload:
          description: >-
            CloudEvents 1.0 envelope of this context's TransferPlanApproved
            (published via the transactional outbox).
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  description: UUID; the consumer's dedupe key.
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
                data:
                  type: object
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: cloudEvent
            - type: object
              properties:
                source:
                  const: /warehouse/network-inventory-planning
                  x-parser-schema-id: <anonymous-schema-48>
                type:
                  const: >-
                    com.warehouse.wes.network-inventory-planning.transfer.TransferPlanApproved
                  x-parser-schema-id: <anonymous-schema-49>
                dataschema:
                  const: >-
                    urn:warehouse:network-inventory-planning:events:TransferPlanApproved:v1
                  x-parser-schema-id: <anonymous-schema-50>
                data:
                  type: object
                  required:
                    - transfer_id
                    - origin_site_id
                    - destination_site_id
                    - sku
                    - quantity
                    - policy_version
                    - operator_reason
                    - proposal_as_of
                  properties:
                    transfer_id:
                      type: string
                      description: The saga aggregate id; also the Kafka key and subject.
                      x-parser-schema-id: <anonymous-schema-52>
                    origin_site_id:
                      type: string
                      x-parser-schema-id: <anonymous-schema-53>
                    destination_site_id:
                      type: string
                      x-parser-schema-id: <anonymous-schema-54>
                    sku:
                      type: string
                      x-parser-schema-id: <anonymous-schema-55>
                    quantity:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-56>
                    case_multiple:
                      type: integer
                      minimum: 2
                      description: >-
                        Additive (ADR 0017). Units per pack of the SKU's active
                        CASE level; the case rounding fields are present only
                        for such a SKU, and quantity is then the rounded
                        whole-case quantity.
                      x-parser-schema-id: <anonymous-schema-57>
                    cases:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-58>
                    requested_qty_eaches:
                      type: integer
                      minimum: 1
                      description: The quantity before rounding (the demand).
                      x-parser-schema-id: <anonymous-schema-59>
                    rounded_qty_eaches:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-60>
                    remainder_eaches:
                      type: integer
                      description: requested_qty_eaches minus rounded_qty_eaches (signed).
                      x-parser-schema-id: <anonymous-schema-61>
                    policy_version:
                      type: string
                      x-parser-schema-id: <anonymous-schema-62>
                    operator_reason:
                      type: string
                      description: >-
                        The operator's captured approval reason; always present,
                        may be the empty string.
                      x-parser-schema-id: <anonymous-schema-63>
                    proposal_as_of:
                      type: string
                      format: date-time
                      description: >-
                        The advisory proposal snapshot's as-of watermark (RFC
                        3339, UTC).
                      x-parser-schema-id: <anonymous-schema-64>
                  x-parser-schema-id: <anonymous-schema-51>
              x-parser-schema-id: <anonymous-schema-47>
          x-parser-schema-id: TransferPlanApprovedEvent
        x-parser-unique-object-id: TransferPlanApproved
      TransferAllocationRequested:
        name: TransferAllocationRequested
        title: Transfer allocation requested
        summary: >-
          Command inventory-storage to allocate origin stock for a transfer line
          (published).
        contentType: application/cloudevents+json
        payload:
          description: >
            CloudEvents 1.0 envelope of this context's
            TransferAllocationRequested

            COMMAND (published via the transactional outbox). The data payload
            is

            EXACTLY inventory-storage's consumed contract — five fields, no
            more.
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
