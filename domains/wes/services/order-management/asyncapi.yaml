    OrderReleaseUnconfirmedAnalytics:
      name: OrderReleaseUnconfirmed
      title: Order Release Unconfirmed (analytics)
      summary: >-
        A released line was never confirmed by wes-work-planning within the
        timeout.
      description: >-
        ADR 0043. Raised ONCE per line, by the housekeeping sweep, when a
        PENDING release confirmation is older than
        `RELEASE_CONFIRMATION_TIMEOUT` (default 15m) without a WorkUnitCreated
        naming it. A FACT, never an action: nothing is cancelled, re-released or
        retried because of it, and it is not retracted if a late confirmation
        arrives. Analytics-only — the integration topic
        `warehouse.order-management.events` keeps its three-event contract — and
        the in-repo projector ignores the type. `subject` and the Kafka key are
        the order id; `time` is when the line was flagged, `released_at` when it
        was released.
