asyncapi: 2.6.0
info:
  title: Order Management — Domain & Analytics Events
  version: 1.0.0
  description: |
    Asynchronous event contract for the **Order Management** bounded context,
    the generic/supporting context that owns the Order and OrderLine
    aggregates: order intake, per-line stock allocation (via
    inventory-storage's reservation API), promise-date calculation, and
    choreographed release of allocated work (announced to
    wes-work-planning as facts on Kafka — see ADR 0005).

    ## Message format: CloudEvents 1.0 (mandatory)

    Every message on every channel below — produced AND consumed,
    integration AND analytics — is a **CloudEvents 1.0** event in Kafka
    structured content mode (ADR 0030, the fleet-wide standard). There is
    no flat envelope, no dual-write/dual-read, and no envelope toggle.

    * Kafka message value: the CloudEvents JSON event format
      (`application/cloudevents+json`); Kafka header
      `content-type: application/cloudevents+json; charset=UTF-8`.
    * Required attributes: `specversion` (`1.0`), `id` (UUID, minted once
      and persisted with the outbox row), `source`
      (`/warehouse/order-management` for everything this service
      publishes), `type`
      (`com.warehouse.wes.order-management.order.<EventName>`), `subject`
      (the order id), `time` (occurred-at, UTC), `datacontenttype`
      (`application/json`), `dataschema`
      (`urn:warehouse:order-management:<events|analytics>:<EventName>:v1`).
    * The same `type` names an occurrence on both topics; `dataschema`
      distinguishes the integration payload from the analytics payload.
    * `data` is the event payload, unchanged by the envelope migration.
    * Messages on both topics are keyed by the `OrderId` (Hash balancer),
      preserving per-order ordering. W3C trace context stays in the
      `traceparent`/`tracestate` headers.

    Delivery is at-least-once: consumers dispatch on the FULL `type`,
    ignore unknown types, and de-duplicate on `id` (the projector does
    exactly that via its `analytics_processed_events` table). A message
    that is not a valid CloudEvent is dead-lettered (repromise consumer)
    or logged at WARN and skipped (local-cache consumers, projector).

    ## Integration contract (frozen for OrderAllocated/OrderPartiallyAllocated;
    additive for OrderRepromised)

    `OrderAllocated`, `OrderPartiallyAllocated`, and — since ADR 0014 §5 /
    ADR 0018 — `OrderRepromised` are published to
    `warehouse.order-management.events` — mirroring
    inventory-storage's precedent of forwarding a minimal subset of domain
    events cross-context. The `data.lines[]` entry shape on the first two
    is shared verbatim with wes-work-planning's Kafka consumer and MUST
    NOT change without coordinating both sides. `fulfillment_class` is
    additive (ADR 0008). `OrderRepromised` is the fleet's "your delivery
    is delayed" trigger, raised by the new `RepromiseOrder` consumer
    (ADR 0018) reacting to fulfillment-execution's `TaskCPTMissed`/
    `PackageManifested` on `warehouse.fulfillment.events`.
  contact:
    name: Order Management Team
    url: https://warehouse-systems.internal/teams/order-management
    email: order-management@warehouse-systems.internal
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
tags:
  - name: order-management
    description: >-
      The Order Management bounded context — order intake, allocation via
      inventory-storage, promise-date calculation, and choreographed release to
      wes-work-planning.
  - name: analytics
    description: >-
      The analytics data product's event stream (ADR 0006) — every domain event
      fanned out to the projector-driven analytical read side.
  - name: order
    description: Events raised by the Order aggregate.
  - name: order-line
    description: Events raised about a single OrderLine.
servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >-
      Production Kafka cluster shared by every warehouse-systems bounded
      context. Locally, the fleet's single broker runs inside the kind cluster
      and is reachable from the host at localhost:9092 (the repo-local
      docker-compose broker was retired).
defaultContentType: application/cloudevents+json
channels:
  warehouse.order-management.events:
    description: >-
      The outbound integration topic owned by the Order Management bounded
      context (`kafka.Topic` in the code). `OrderAllocated`/
      `OrderPartiallyAllocated` and — since ADR 0018 — `OrderRepromised` are
      forwarded here; since ADR 0035 the additive, PII-free
      `SiteSkuDemandChanged` projection is too (keyed by the line-scoped
      `<order_id>/line/<line_no>`, not the bare order id). Every other domain
      event is a local concern. wes-work-planning's Kafka consumer derives each
      line's work unit id from the frozen formula `{orderID}-line-{lineNo}`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: consumeOrderManagementEvents
      summary: >-
        Consume order allocation-outcome, re-promise, and site/SKU demand
        integration events.
      description: >-
        Subscribe to this channel to learn that an order's
        allocation-then-release pass concluded, that its promise moved, or that
        one source order line's site/SKU demand changed. `OrderAllocated` means
        every line was allocated (and every eligible line released in the same
        pass); `OrderPartiallyAllocated` means some lines allocated and some
        backordered on a partial-shipment order. `OrderRepromised` (ADR 0018)
        means the promise for a shipment group moved, discovered by reacting to
        a fulfillment-execution fact (a missed CPT or a SLAM pass) — the fleet's
        "your delivery is delayed" trigger. `data.lines[]` on the first two
        carries exactly the lines released in this pass. `SiteSkuDemandChanged`
        (ADR 0035) is keyed by `<source_order_id>/line/<line_no>` so one line's
        demand stream is ordered on its own partition; it is emitted only while
        `DEMAND_PROJECTION_SITE_ID` is configured, and `state` is `ACTIVE` (line
        demand exists at the site) or `REMOVED` (cancellation removed it).
        Consumers must be idempotent (dedupe on `id`) and should ignore
        CloudEvents `type` values they do not recognise.
      tags:
        - name: order-management
      message:
        oneOf:
          - name: OrderAllocated
            title: Order Allocated (integration)
            summary: >-
              Every line allocated — and eligible lines released in the same
              pass.
            description: >-
              The whole order is allocated and, per the choreographed-release
              redesign (ADR 0005), every eligible line was released as part of
              this same fact. `data.lines[]` carries the released lines; each
              line's work unit id is derived, never transmitted, as
              `{order_id}-line-{line_no}`.
            tags:
              - name: order
            traits:
              - contentType: application/cloudevents+json
                headers:
                  type: object
                  required:
                    - content-type
                  properties:
                    content-type:
                      type: string
                      const: application/cloudevents+json; charset=UTF-8
                      x-parser-schema-id: <anonymous-schema-384>
                    traceparent:
                      type: string
                      description: W3C trace context of the producing span.
                      x-parser-schema-id: <anonymous-schema-385>
                    tracestate:
                      type: string
                      x-parser-schema-id: <anonymous-schema-386>
                  x-parser-schema-id: <anonymous-schema-383>
                bindings:
                  kafka:
                    key:
                      type: string
                      description: >-
                        The aggregate id (also the CloudEvents subject);
                        Hash-partitioned.
            payload:
              allOf:
                - type: object
                  description: >-
                    CloudEvents 1.0 structured-mode event (JSON event format),
                    the ONLY envelope on every channel this service produces or
                    consumes (ADR 0030, fleet standard). Every attribute below
                    is REQUIRED in this fleet. Kafka header `content-type` is
                    `application/cloudevents+json; charset=UTF-8`; W3C trace
                    context stays in the `traceparent`/`tracestate` headers.
                    Consumers dispatch on the FULL `type`, ignore unknown types,
                    and dedupe on `id`.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-6>
                    id:
                      type: string
                      format: uuid
                      description: >-
                        Minted once per domain event and persisted with the
                        outbox row, so a redelivery carries the same id.
                        `(source, id)` is the consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-7>
                    source:
                      type: string
                      format: uri-reference
                      description: >-
                        /warehouse/<repo-name>, e.g.
                        /warehouse/order-management.
                      x-parser-schema-id: <anonymous-schema-8>
                    type:
                      type: string
                      pattern: >-
                        ^com\.warehouse\.[a-z]+\.[a-z-]+\.[a-z]+\.[A-Z][A-Za-z]+(\.v[0-9]+)?$
                      description: >-
                        com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>
                      x-parser-schema-id: <anonymous-schema-9>
                    subject:
                      type: string
                      minLength: 1
                      description: >-
                        Id of the aggregate instance the event is about (order
                        id for every event this service publishes).
                      x-parser-schema-id: <anonymous-schema-10>
                    time:
                      type: string
                      format: date-time
                      description: The domain event's occurred-at instant, UTC, RFC 3339.
                      x-parser-schema-id: <anonymous-schema-11>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-12>
                    dataschema:
                      type: string
                      format: uri
                      description: >-
                        urn:warehouse:<repo-name>:<events|analytics>:<EventName>:v<N>
                      x-parser-schema-id: <anonymous-schema-13>
                    data:
                      type: object
                      description: The event payload — see each message's own data schema.
                      x-parser-schema-id: <anonymous-schema-14>
                  x-parser-schema-id: CloudEvent
                - type: object
                  properties:
                    source:
                      const: /warehouse/order-management
                      x-parser-schema-id: <anonymous-schema-16>
                    type:
                      const: com.warehouse.wes.order-management.order.OrderAllocated
                      x-parser-schema-id: <anonymous-schema-17>
                    dataschema:
                      const: urn:warehouse:order-management:events:OrderAllocated:v1
                      x-parser-schema-id: <anonymous-schema-18>
                    data:
                      type: object
                      description: >-
                        Frozen wire shape shared verbatim with
                        wes-work-planning's Kafka consumer (see CLAUDE.md's
                        Kafka integration section). promise_cpt_id/promise_basis
                        are ADR 0014's additive fields (the CPT identity a
                        Capability-basis promise targets, and which policy
                        produced the promise) -- optional, since a
                        LeadTime-basis promise has no CPT identity and older
                        consumers may ignore both.
                      additionalProperties: false
                      required:
                        - order_id
                        - promise_date
                        - lines
                      properties:
                        order_id:
                          type: string
                          pattern: ^ord-[0-9a-f-]{36}$
                          description: The OrderId this context owns and mints.
                          x-parser-schema-id: <anonymous-schema-19>
                        promise_date:
                          type: string
                          format: date-time
                          description: >-
                            The promise's cutoff instant. Computed by
                            order.PromisePolicy (ADR 0014): a real CPT window's
                            cutoff when promise_basis is "Capability", or the
                            per-path lead-time policy's computed instant when
                            promise_basis is "LeadTime" (or absent, for events
                            predating ADR 0014).
                          x-parser-schema-id: <anonymous-schema-20>
                        promise_cpt_id:
                          type: string
                          description: >-
                            The CPT identity (e.g. "sp1-1800") this promise
                            targets. Present only when promise_basis is
                            "Capability" -- a LeadTime-basis promise has no
                            departure identity.
                          x-parser-schema-id: <anonymous-schema-21>
                        promise_basis:
                          type: string
                          enum:
                            - Capability
                            - LeadTime
                            - Network
                          description: >-
                            Which policy produced promise_date (ADR 0014).
                            "Network" (ADR 0020) means the date was DICTATED by
                            an external party's deadline (requiredShipBy) rather
                            than chosen by this service, and is a separate
                            bucket in the analytics promise- basis distribution
                            (ADR 0019). Absent on events published before this
                            ADR.
                          x-parser-schema-id: <anonymous-schema-22>
                        lines:
                          type: array
                          description: >-
                            Exactly the lines released in this pass (may be
                            empty).
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - line_no
                              - sku
                              - path_id
                              - gift_wrap
                              - fulfillment_class
                            properties:
                              line_no:
                                type: integer
                                minimum: 1
                                x-parser-schema-id: <anonymous-schema-24>
                              sku:
                                type: string
                                x-parser-schema-id: <anonymous-schema-25>
                              path_id:
                                type: string
                                description: >-
                                  The process path the line was released onto
                                  (default "pick").
                                x-parser-schema-id: <anonymous-schema-26>
                              gift_wrap:
                                type: boolean
                                x-parser-schema-id: <anonymous-schema-27>
                              fulfillment_class:
                                type: string
                                enum:
                                  - SINGLE
                                  - SAME_SKU_MULTI
                                  - MULTI_LINE_MULTI
                                description: >-
                                  Classifies the whole order (ADR 0008);
                                  additive field.
                                x-parser-schema-id: <anonymous-schema-28>
                              promise_cpt_id:
                                type: string
                                description: >-
                                  ADR 0017's additive per-line promise field:
                                  the CPT identity (e.g. "sp1-1200") the
                                  PromiseGroup this line belongs to targets.
                                  Present only when that group's basis is
                                  "Capability" and the group has a CPT identity.
                                  Absent when the order's promise has no
                                  per-group breakdown to attribute this line to
                                  (a promise set via the legacy, pre-ADR-0017
                                  single-Promise path). Older consumers can
                                  safely ignore it.
                                x-parser-schema-id: <anonymous-schema-29>
                              promise_basis:
                                type: string
                                enum:
                                  - Capability
                                  - LeadTime
                                  - Network
                                description: >-
                                  ADR 0017's additive per-line promise field:
                                  which policy produced the PromiseGroup this
                                  line belongs to. Absent under the same
                                  condition as promise_cpt_id.
                                x-parser-schema-id: <anonymous-schema-30>
                              promise_cutoff_at:
                                type: string
                                format: date-time
                                description: >-
                                  ADR 0017's additive per-line promise field:
                                  the cutoff instant of the PromiseGroup this
                                  line belongs to -- may differ from the
                                  order-level promise_date on a partial-shipment
                                  order whose lines split across multiple groups
                                  (promise_date is always the LATEST group's
                                  cutoff; an individual line's own group may cut
                                  off earlier). Absent under the same condition
                                  as promise_cpt_id.
                                x-parser-schema-id: <anonymous-schema-31>
                            x-parser-schema-id: ReleasedLine
                          x-parser-schema-id: <anonymous-schema-23>
                      x-parser-schema-id: AllocationData
                  x-parser-schema-id: <anonymous-schema-15>
              x-parser-schema-id: <anonymous-schema-5>
            examples:
              - name: orderAllocated
                summary: A two-line ship-complete order allocated and released.
                payload:
                  specversion: '1.0'
                  id: 4f1c2a7e-9d31-4a6b-8f0e-6b2c1d5e7a90
                  source: /warehouse/order-management
                  type: com.warehouse.wes.order-management.order.OrderAllocated
                  subject: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
                  time: '2026-09-07T10:01:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:order-management:events:OrderAllocated:v1
                  data:
                    order_id: ord-7c9e6679-7d5a-4b37-b2f1-93b0c4a1d8f2
                    promise_date: '2026-09-09T10:01:00Z'
                    lines:
                      - line_no: 1
                        sku: SKU-BOOK-0001
                        path_id: pick
                        gift_wrap: false
                        fulfillment_class: SAME_SKU_MULTI
                      - line_no: 2
                        sku: SKU-BOOK-0002
                        path_id: pick
                        gift_wrap: true
                        fulfillment_class: SAME_SKU_MULTI
            messageId: OrderAllocatedIntegration
            contentType: application/cloudevents+json
            headers:
              type: object
              required:
                - content-type
              properties:
                content-type:
                  type: string
                  const: application/cloudevents+json; charset=UTF-8
                  x-parser-schema-id: <anonymous-schema-2>
                traceparent:
                  type: string
                  description: W3C trace context of the producing span.
                  x-parser-schema-id: <anonymous-schema-3>
                tracestate:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
              x-parser-schema-id: <anonymous-schema-1>
            bindings:
              kafka:
                key:
                  type: string
                  description: >-
                    The aggregate id (also the CloudEvents subject);
                    Hash-partitioned.
          - name: OrderPartiallyAllocated
            title: Order Partially Allocated (integration)
            summary: >-
              Some lines allocated, some backordered, on a partial-shipment
              order.
            description: >-
              An order with AllowPartialShipment=true concluded its pass with
              some lines allocated (and released in this same pass —
              `data.lines[]` carries exactly those) and some lines Backordered.
              A ship-complete order NEVER emits this event: under BR3 its whole
