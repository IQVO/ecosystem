    SiteSkuDemandChangedIntegration:
      name: SiteSkuDemandChanged
      title: Site SKU Demand Changed (integration)
      summary: >-
        One source order line's site/SKU demand became ACTIVE or REMOVED — the
        PII-free demand projection for site-level planning (ADR 0035).
      description: >-
        Raised inside the same order-save/outbox transaction as the allocation,
        re-allocation, re-promise, or cancellation that produced the line state,
        derived purely from the Order aggregate's line (SKU, quantity) plus the
        explicitly versioned static demand-site scope configured for the
        deployment (`DEMAND_PROJECTION_SITE_ID`, assignment_version
        `static-site-v1`). The site is application configuration, never an Order
        field, and Phase-1 performs no dynamic assignment. subject and the Kafka
        key are `<source_order_id>/line/<line_no>` — the LINE is the stream
        identity here, so one line's demand history is totally ordered on its
        own partition (deliberately not the bare order id every Order* event
        uses). `due_at` is the line's own promise-group cutoff (ADR 0017) where
        one is recorded, else the order-level promise date. `demanded_units` is
        the line quantity; `state` is `ACTIVE` (create / allocate / re-promise)
        or `REMOVED` (cancellation). No customer PII ever appears on this event.
      tags:
