asyncapi: 2.6.0
info:
  title: warehouse-planning Domain Events
  version: 0.5.0
  contact:
    name: warehouse-planning maintainers
    url: https://github.com/IQVO/warehouse-planning
    email: warehouse-planning@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **warehouse-planning** bounded context (WES
    subdomain): *can this warehouse process the demand assigned to it?*

    **Published (Phase 4).** The `CapacityPlan` aggregate raises four events,
    published to `warehouse.warehouse-planning.events` through a
    **transactional outbox**: the plan and its already-encoded events are
    written in ONE database transaction, and a relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is persisted with the outbox row, so
    a retry republishes the same `id` -- consumers dedupe on it). Per plan:
    `CapacityPlanCreated` on creation; on publication
    `CapacityPlanPublished`, plus `CapacityShortageDetected` and
    `BottleneckDetected` only when the plan has a shortage.
    `ProcessCapacityRegistered`/`ProcessCapacityChanged` are NOT published yet.

    **Consumed (Phase 3).** `ShiftPlanCommitted` (workforce-management) and
    `LocationSlotRegistered`/`LocationSlotDecommissioned` (facility-layout) keep
    local ProcessCapacity read models current; this context never makes a
    live cross-context call.

    **Consumed (ADR 0004, opt-in).** `OrderAllocated` and
    `OrderPartiallyAllocated` (order-management, topic
    `warehouse.order-management.events`) keep a local expected-demand read
    model current when `DEMAND_CONSUMER_GROUP` is set (unset = no consumer).
    Each order is counted once, at its latest promise cutoff, and attributed to
    the ONE configured site (`DEMAND_SITE_ID`): order-management's events carry
    no fulfillment site. `OrderRepromised` and every other type are ignored.

    **Analytics stream (ADR 0005).** The same four events are ALSO written to
    `warehouse.warehouse-planning.analytics` in the SAME outbox transaction
    (two outbox rows per event, one per topic), as CloudEvents 1.0 with the
    SAME `type` and the SAME `id` per occurrence but
    `dataschema=urn:warehouse:warehouse-planning:analytics:<EventName>:v1`.
    The integration messages are byte-identical to what they were before the
    stream existed. The analytics payloads are the integration payloads plus
    additive, analytics-only fields: today `binding_constraint` on
    `CapacityPlanPublished` (the constraint type -- LABOR, STATION, ... --
    binding the bottleneck step; `""` for a plan created before it was
    recorded). Only this service's own `planning-projector` consumes it (fixed
    consumer group, at-least-once, offsets committed after the projection
    committed), into a SEPARATE analytical database that
    `planning-reports` serves read-only. Poison messages go to
    `warehouse.warehouse-planning.analytics.dlq`.

    **Envelope (mandatory).** Every message is a CloudEvents 1.0 event in
    *structured content mode* (Kafka value = JSON event format) with the Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    Optional W3C trace-context headers (`traceparent`, and `tracestate` /
    `baggage` when present) carry the trace of the request that wrote the
    outbox row (ADR 0014); consumers may extract them, and must not require
    them. All of
    `specversion` (`1.0`), `id`, `source` (`/warehouse/warehouse-planning`),
    `type`, `subject`, `time`, `datacontenttype` (`application/json`) and
    `dataschema` are required; the payload sits under `data`. No flat
    envelope, no toggle.

    **Type naming.** `com.warehouse.wes.warehouse-planning.<entity>.<EventName>`
    where `<entity>` is the aggregate that raised the event, lowercase, no
    separators -- here `capacityplan`. **dataschema** =
    `urn:warehouse:warehouse-planning:events:<EventName>:v1`. **subject** and
    the Kafka message key = the capacity plan id (one plan's events stay
    ordered on one partition). A breaking payload change gets a new `.v2`
    type and dataschema, never a mutation.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: warehouse-planning
    description: The warehouse-planning bounded context (WES subdomain).
  - name: capacity-plan
    description: Events raised by the CapacityPlan aggregate (published, Phase 4).
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (Phase 3).
  - name: analytics
    description: >-
      The analytics stream (ADR 0005): the same capacity-plan events on this
      service's own analytics topic, consumed only by planning-projector.
channels:
  warehouse.warehouse-planning.events:
    description: |
      This service's integration topic (`Topic` in
      `internal/adapters/outbound/kafka/encoder.go`). Written by the outbox
      relay; key = capacity plan id; every message carries the
      `content-type: application/cloudevents+json; charset=UTF-8` header
      (plus the optional W3C `traceparent` of the writing request, ADR 0014).
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    x-eventcatalog-channel-version: 0.5.0
    publish:
      operationId: receiveCapacityPlanEvents
      summary: Receive CapacityPlan events.
      description: |
        Subscribe to the CapacityPlan event stream. Route on the full `type`
        (`com.warehouse.wes.warehouse-planning.capacityplan.<EventName>`).
      tags:
        - name: capacity-plan
      message:
        oneOf:
          - name: CapacityPlanCreated
            title: Capacity plan created
            summary: A DRAFT CapacityPlan was created with its computed shortage.
            description: >
              Raised by the `CapacityPlan` aggregate on `POST /capacity-plans`
              and queued

              in the transactional outbox in the same transaction as the plan.
              `type` =

              `com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated`,
              `subject` and Kafka key = the plan id.
            contentType: application/cloudevents+json
            tags:
              - name: capacity-plan
              - name: warehouse-planning
            payload:
              description: CloudEvents 1.0 envelope of CapacityPlanCreated.
              allOf:
                - type: object
                  description: >
                    CloudEvents 1.0 structured-mode envelope. Every attribute
                    below is required; the context's own payload sits under
                    data.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      description: >-
                        UUID v4, minted once per domain event and persisted with
                        the outbox row, so a redelivery repeats it. Dedupe on
                        it.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      example: /warehouse/warehouse-planning
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      description: Full reverse-DNS type; dispatch on the whole string.
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: Aggregate instance id (never empty).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      description: Domain occurred-at, UTC.
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      description: urn:warehouse:<repo>:events:<EventName>:v<N>.
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      x-parser-schema-id: <anonymous-schema-9>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    type:
                      const: >-
                        com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated
                      x-parser-schema-id: <anonymous-schema-11>
                    dataschema:
                      const: >-
                        urn:warehouse:warehouse-planning:events:CapacityPlanCreated:v1
                      x-parser-schema-id: <anonymous-schema-12>
                    data:
                      type: object
                      description: Payload of CapacityPlanCreated.
                      required:
                        - plan_id
                        - warehouse_id
                        - location
                        - path_id
                        - window_start
                        - window_end
                        - assigned_demand
                        - path_capacity
                        - capacity_over_window
                        - shortage
                        - bottleneck_step
                        - status
                      properties:
                        plan_id:
                          type: string
                          description: >-
                            The CapacityPlan id (UUID); equals the CloudEvents
                            subject.
                          example: 0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10
                          x-parser-schema-id: <anonymous-schema-13>
                        warehouse_id:
                          type: string
                          description: Warehouse the plan is for.
                          example: WH-1
                          x-parser-schema-id: <anonymous-schema-14>
                        location:
                          type: string
                          description: ProcessCapacity location the plan evaluates.
                          example: PATH-ZONE-A
                          x-parser-schema-id: <anonymous-schema-15>
                        path_id:
                          type: string
                          description: ProcessPath evaluated.
                          example: pick-rebin-pack
                          x-parser-schema-id: <anonymous-schema-16>
                        window_start:
                          type: string
                          format: date-time
                          description: Planning window start (RFC 3339, UTC).
                          example: '2026-10-05T08:00:00Z'
                          x-parser-schema-id: <anonymous-schema-17>
                        window_end:
                          type: string
                          format: date-time
                          description: Planning window end, exclusive (RFC 3339, UTC).
                          example: '2026-10-05T16:00:00Z'
                          x-parser-schema-id: <anonymous-schema-18>
                        assigned_demand:
                          type: number
                          format: double
                          description: Orders assigned to the window.
                          example: 12000
                          x-parser-schema-id: <anonymous-schema-19>
                        path_capacity:
                          type: number
                          format: double
                          description: Normalized path capacity, ORDER per HOUR.
                          example: 1000
                          x-parser-schema-id: <anonymous-schema-20>
                        capacity_over_window:
                          type: number
                          format: double
                          description: path_capacity x window hours, in orders.
                          example: 8000
                          x-parser-schema-id: <anonymous-schema-21>
                        shortage:
                          type: number
                          format: double
                          description: >-
                            max(0, assigned_demand - capacity_over_window), in
                            orders. Never negative.
                          example: 4000
                          x-parser-schema-id: <anonymous-schema-22>
                        bottleneck_step:
                          type: string
                          description: The ProcessPath step limiting end-to-end flow.
                          example: REBIN
                          x-parser-schema-id: <anonymous-schema-23>
                        status:
                          type: string
                          enum:
                            - DRAFT
                          description: Always DRAFT at creation.
                          example: DRAFT
                          x-parser-schema-id: <anonymous-schema-24>
                      x-parser-schema-id: CapacityPlanCreatedData
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: CapacityPlanCreatedEvent
            examples:
              - name: draftPlanWithShortage
                summary: >-
                  A plan for 12000 orders over 8h on Pick -> Rebin -> Pack (1000
                  ORDER/h): short by 4000.
                payload:
                  specversion: '1.0'
                  id: 6f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33
                  source: /warehouse/warehouse-planning
                  type: >-
                    com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanCreated
                  subject: 0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10
                  time: '2026-10-04T21:15:30Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:warehouse-planning:events:CapacityPlanCreated:v1
                  data:
                    plan_id: 0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10
                    warehouse_id: WH-1
                    location: PATH-ZONE-A
                    path_id: pick-rebin-pack
                    window_start: '2026-10-05T08:00:00Z'
                    window_end: '2026-10-05T16:00:00Z'
                    assigned_demand: 12000
                    path_capacity: 1000
                    capacity_over_window: 8000
                    shortage: 4000
                    bottleneck_step: REBIN
                    status: DRAFT
            messageId: CapacityPlanCreated
          - name: CapacityPlanPublished
            title: Capacity plan published
            summary: A DRAFT CapacityPlan was published.
            description: >
              Raised by `CapacityPlan.Publish` on `POST
              /capacity-plans/{id}/publish`.

              Always accompanied by `CapacityShortageDetected` and
              `BottleneckDetected`

              when the plan has a shortage. A plan is published at most once.
              `type` =

              `com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished`.
            contentType: application/cloudevents+json
            tags:
              - name: capacity-plan
              - name: warehouse-planning
            payload:
              description: CloudEvents 1.0 envelope of CapacityPlanPublished.
              allOf:
                - type: object
                  description: >
                    CloudEvents 1.0 structured-mode envelope. Every attribute
                    below is required; the context's own payload sits under
                    data.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      description: >-
                        UUID v4, minted once per domain event and persisted with
                        the outbox row, so a redelivery repeats it. Dedupe on
                        it.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      example: /warehouse/warehouse-planning
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      description: Full reverse-DNS type; dispatch on the whole string.
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: Aggregate instance id (never empty).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      description: Domain occurred-at, UTC.
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      description: urn:warehouse:<repo>:events:<EventName>:v<N>.
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      x-parser-schema-id: <anonymous-schema-9>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    type:
                      const: >-
                        com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished
                      x-parser-schema-id: <anonymous-schema-26>
                    dataschema:
                      const: >-
                        urn:warehouse:warehouse-planning:events:CapacityPlanPublished:v1
                      x-parser-schema-id: <anonymous-schema-27>
                    data:
                      type: object
                      description: >-
                        Payload of CapacityPlanPublished. site_id is ADDITIVE on
                        the v1 payload — present for plans created after
                        migration 0008, omitted for older plans — and a consumer
                        must treat its absence as unknown (never derive it from
                        warehouse_id or location).
                      required:
                        - plan_id
                        - warehouse_id
                        - location
                        - path_id
                        - window_start
                        - window_end
                        - assigned_demand
                        - path_capacity
                        - capacity_over_window
                        - shortage
                        - bottleneck_step
                        - published_at
                      properties:
                        plan_id:
                          type: string
                          description: >-
                            The CapacityPlan id (UUID); equals the CloudEvents
                            subject.
                          example: 0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10
                          x-parser-schema-id: <anonymous-schema-28>
                        warehouse_id:
                          type: string
                          description: Warehouse the plan is for.
                          example: WH-1
                          x-parser-schema-id: <anonymous-schema-29>
                        site_id:
                          type: string
                          description: >-
                            Additive, optional. Canonical site the plan is
                            scoped to (a facility-layout Site site_code, the
                            same identifier its SiteCapabilityChanged event
                            publishes). Omitted for plans stored before
                            migration 0008.
                          example: SIM1
                          x-parser-schema-id: <anonymous-schema-30>
                        location:
                          type: string
                          description: ProcessCapacity location the plan evaluates.
                          example: PATH-ZONE-A
                          x-parser-schema-id: <anonymous-schema-31>
                        path_id:
                          type: string
                          description: ProcessPath evaluated.
                          example: pick-rebin-pack
                          x-parser-schema-id: <anonymous-schema-32>
                        window_start:
                          type: string
                          format: date-time
                          description: Planning window start (RFC 3339, UTC).
                          example: '2026-10-05T08:00:00Z'
                          x-parser-schema-id: <anonymous-schema-33>
                        window_end:
                          type: string
                          format: date-time
                          description: Planning window end, exclusive (RFC 3339, UTC).
                          example: '2026-10-05T16:00:00Z'
                          x-parser-schema-id: <anonymous-schema-34>
                        assigned_demand:
                          type: number
                          format: double
                          description: Orders assigned to the window.
                          example: 12000
                          x-parser-schema-id: <anonymous-schema-35>
                        path_capacity:
                          type: number
                          format: double
                          description: Normalized path capacity, ORDER per HOUR.
                          example: 1000
                          x-parser-schema-id: <anonymous-schema-36>
                        capacity_over_window:
                          type: number
                          format: double
                          description: path_capacity x window hours, in orders.
                          example: 8000
                          x-parser-schema-id: <anonymous-schema-37>
                        shortage:
                          type: number
                          format: double
                          description: >-
                            max(0, assigned_demand - capacity_over_window), in
                            orders. Never negative.
                          example: 4000
                          x-parser-schema-id: <anonymous-schema-38>
                        bottleneck_step:
                          type: string
                          description: The ProcessPath step limiting end-to-end flow.
                          example: REBIN
                          x-parser-schema-id: <anonymous-schema-39>
                        published_at:
                          type: string
                          format: date-time
                          description: When the plan was published (RFC 3339, UTC).
                          example: '2026-10-04T21:45:10Z'
                          x-parser-schema-id: <anonymous-schema-40>
                      x-parser-schema-id: CapacityPlanPublishedData
                  x-parser-schema-id: <anonymous-schema-25>
              x-parser-schema-id: CapacityPlanPublishedEvent
            examples:
              - name: publishedPlan
                summary: The section-43 plan, published.
                payload:
                  specversion: '1.0'
                  id: 9a8d7c6b-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                  source: /warehouse/warehouse-planning
                  type: >-
                    com.warehouse.wes.warehouse-planning.capacityplan.CapacityPlanPublished
                  subject: 0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10
                  time: '2026-10-04T21:45:10Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:warehouse-planning:events:CapacityPlanPublished:v1
                  data:
                    plan_id: 0b7a4c1e-5d52-4f0e-9a39-6c1f2f3a8b10
                    warehouse_id: WH-1
                    site_id: SIM1
                    location: PATH-ZONE-A
                    path_id: pick-rebin-pack
                    window_start: '2026-10-05T08:00:00Z'
                    window_end: '2026-10-05T16:00:00Z'
                    assigned_demand: 12000
                    path_capacity: 1000
                    capacity_over_window: 8000
                    shortage: 4000
                    bottleneck_step: REBIN
                    published_at: '2026-10-04T21:45:10Z'
            messageId: CapacityPlanPublished
          - name: CapacityShortageDetected
            title: Capacity shortage detected
            summary: Published demand exceeds the path capacity over the window.
            description: >
              Raised at publish time, ONLY when `shortage > 0` (demand exactly
              equal to

