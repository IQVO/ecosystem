                  type: string
                  description: >-
                    RFC3339 Critical Pull Time of the released unit — the last
                    moment it can be manifested and still make its truck. Empty
                    string if the unit could not be re-read at publish time.
                  x-parser-schema-id: <anonymous-schema-34>
                ref:
                  type: string
                  description: >-
