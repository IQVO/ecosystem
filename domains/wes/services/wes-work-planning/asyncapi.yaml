                    the warehouse to produce a gift package for this work unit,
                    stated at enqueue time. This is a caller-supplied
                    `WorkReleased` characteristic, not a derived
                    product-classification hint — unlike
                    `required_capabilities`/`fragile`, it is read straight off
                    the `WorkUnit` and never looked up from inventory-storage
                    (see ADR-0010). Absent — not `false` — when gift wrap was
                    not requested. Consumers must treat an absent field
                    identically to `false`.
