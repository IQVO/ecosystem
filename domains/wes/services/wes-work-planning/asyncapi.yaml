                    SKU is classified Fragile by product-master. Absent — not
                    `false` — when the SKU is unclassified, unknown, or the
                    lookup is unavailable. Consumers must treat an absent field
                    identically to `false`. See ADR-0009, ADR-0035.
                  example: true
                  x-parser-schema-id: <anonymous-schema-38>
