                    unit was made for (1..2147483647, the 32-bit column limit),
                    stored on the `WorkUnit` from the `OrderAllocated` line that
                    created it (the same number embedded in a work-unit id of
                    the form `<order>-line-<n>`) and read straight off it at
                    publish time, like `ref`. Present only when known: absent —
                    never `0` or `null` — for a unit created before this field
                    existed, a REST-enqueued unit that gave no `lineNo`, and
                    every transfer-referenced unit. Consumers must treat an
                    absent field as "line unknown" and keep working.
                  example: 3
                  x-parser-schema-id: <anonymous-schema-33>
