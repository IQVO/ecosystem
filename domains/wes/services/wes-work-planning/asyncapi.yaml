                  type: array
                  items:
                    type: string
                    x-parser-schema-id: <anonymous-schema-37>
                  description: >-
                    OPTIONAL. Present only when the released unit's SKU is
                    classified Hazmat by product-master, in which case it
                    contains exactly `["hazmat"]`. Absent — not an empty array —
                    when the SKU is unclassified, not yet in the local copy, or
                    the copy is unreadable or a lookup error; the fail-open
                    lookup never blocks a release). Consumers must treat an
                    absent field identically to an empty array. See ADR-0009,
                    ADR-0035.
