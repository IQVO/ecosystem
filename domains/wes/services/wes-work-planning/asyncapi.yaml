                    WorkDemandReleased); names the transfer leg it executes. Its
                    presence is the discriminator for "this is transfer work":
                    every order-driven unit omits all four transfer fields, so
                    its payload is byte-identical to before transfer support
                    existed. Consumers must treat absent as "not transfer work".
