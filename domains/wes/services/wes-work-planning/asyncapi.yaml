        only carries the identifiers. When the released unit carries a known
        SKU, the adapter also reads that SKU's classification from this
        context's local copy of product-master's `ProductClassified` events
        (ADR-0035; previously a synchronous read from inventory-storage,
        ADR-0009) and stamps two OPTIONAL derived fields,
        `required_capabilities` and `fragile`, present only when there is a hint
        to give. It also stamps the OPTIONAL `line_no` — the order line the unit
        was made for, stored on the WorkUnit from the `OrderAllocated` line that
        created it (ADR-0036) — omitted when unknown. The same `line_no` rides
