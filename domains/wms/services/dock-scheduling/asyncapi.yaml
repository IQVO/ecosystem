                          pattern: ^[A-Z0-9]{2}$
                          description: >-
                            Optional (ADR 0013). The ANSI X12 214 status code
                            this fact corresponds to: the appointment restated
                            at its new window, `AB` (Delivery Appointment Date
                            and/or Time) for an INBOUND appointment, `AA`
                            (Pick-up Appointment Date and/or Time) for an
                            OUTBOUND one (X12 element 1652, AT7-03); X12 has no
