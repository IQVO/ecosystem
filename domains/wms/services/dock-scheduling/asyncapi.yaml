asyncapi: 2.6.0
info:
  title: dock-scheduling Domain Events
  version: 1.0.0
  contact:
    name: dock-scheduling maintainers
    url: https://github.com/IQVO/dock-scheduling
    email: dock-scheduling@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event catalog for the **dock-scheduling** bounded context (WMS subdomain):
    the door calendar of every site (ADR 0001, ADR 0002).


    **Published.** The `DockAppointment` aggregate raises eight events and the
    `DockCalendar` aggregate three. Seven of the eleven

    go to `warehouse.dock-scheduling.events` (`DockAppointmentDoorReassigned`
    since ADR 0010); the analytics-only facts

    (`DockAppointmentCheckedIn`, `DockAppointmentCompleted`,
    `DockAppointmentAtRisk`, `DoorOperatingHoursDeclared`) go ONLY to

    `warehouse.dock-scheduling.analytics`, where every published fact also
    appears as its analytics twin.

    Every fact is written to its stream through a **transactional outbox**: the
    aggregate row and its already-encoded events commit in

    ONE database transaction and a relay drains them to Kafka (at-least-once;
    the CloudEvents `id` is stored with the outbox row, so a

    retry republishes the same `id`). Kafka key = appointment id (site id for
    the calendar events), so one appointment's history stays

    ordered on one partition.


    **Consumed (ADR 0003).** facility-layout (`ZoneRegistered`,
    `LocationSlotRegistered`, `LocationSlotDecommissioned`),

    inbound-receiving (`ASNRegistered`, `ASNCancelled`, and the legacy
    `DockAppointment*` for the strangler stage A importer),

    process-path-management (`CPTScheduleChanged`) and yard-management
    (`VisitCheckedIn`, `VisitRejected`, `TrailerDocked`,

    `TrailerUndocked`). The consumed messages below are restated from the
    producers' own contracts and never imported.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json;

    charset=UTF-8`. `specversion`, `id`, `source`
    (`/warehouse/dock-scheduling`), `type`, `subject`, `time`, `datacontenttype`

    (`application/json`) and `dataschema`
    (`urn:warehouse:dock-scheduling:events:<EventName>:v1`) are all required.
    Type =

    `com.warehouse.wms.dock-scheduling.<entity>.<EventName>` with entity
    `dockappointment` or `dockcalendar`. A breaking payload

    change is a new `.v2` type, never a mutation.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: dock-scheduling
    description: The dock-scheduling bounded context (WMS subdomain).
  - name: dockappointment
    description: Events raised by the DockAppointment aggregate.
  - name: dockcalendar
    description: Events raised by the DockCalendar aggregate.
  - name: analytics
    description: >-
      The analytics read side of this context (ADR 0006): the analytics topic,
      its projector and the reports binary.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).
channels:
  warehouse.dock-scheduling.events:
    description: >
      This service's integration topic. Written by the outbox relay; key =
      appointment id (site id for the door calendar events);

      the only Kafka header on every message is the CloudEvents `content-type`.
      Rows the relay can never encode are parked raw on

      `warehouse.dock-scheduling.events.dlq`. Dispatch on the full `type`,
      ignore unknown types, dedupe on `id`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveDockSchedulingEvents
      summary: Receive the appointment lifecycle and door closures.
      description: >
        Route on the full `type`
        (`com.warehouse.wms.dock-scheduling.dockappointment.<EventName>` and

        `com.warehouse.wms.dock-scheduling.dockcalendar.<EventName>`).
        `DockAppointmentBooked` and `DockAppointmentRescheduled` carry the

        site's arrival tolerance; `DockAppointmentCancelled` carries the reason;
        `DockAppointmentNoShow` is terminal;

        `DockAppointmentDoorReassigned` moves the appointment to the door the
        trailer actually docked at, window unchanged (ADR 0010).
      tags:
        - name: dockappointment
      message:
        oneOf:
          - name: DockAppointmentBooked
            title: DockAppointmentBooked
            summary: A door window was booked (or a legacy appointment imported).
            description: >-
