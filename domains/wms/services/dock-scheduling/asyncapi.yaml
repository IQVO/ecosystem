asyncapi: 2.6.0
info:
  title: dock-scheduling Domain Events
  version: 1.0.0
  contact:
    name: dock-scheduling maintainers
    url: https://github.com/IQVO/dock-scheduling
    email: dock-scheduling@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event catalog for the **dock-scheduling** bounded context (WMS subdomain):
    the door calendar of every site (ADR 0001, ADR 0002).


    **Published.** The `DockAppointment` aggregate raises eight events, the
    `DockCalendar` aggregate three and the `Carrier` aggregate

    (the carrier registry, ADR 0012) three. Ten of the fourteen go to
    `warehouse.dock-scheduling.events` (`DockAppointmentDoorReassigned`

    since ADR 0010, `CarrierRegistered`, `CarrierSuspended` and
    `CarrierReinstated` since ADR 0012); the analytics-only facts

    (`DockAppointmentCheckedIn`, `DockAppointmentCompleted`,
    `DockAppointmentAtRisk`, `DoorOperatingHoursDeclared`) go ONLY to

    `warehouse.dock-scheduling.analytics`, where every published fact also
    appears as its analytics twin.

    Every fact is written to its stream through a **transactional outbox**: the
    aggregate row and its already-encoded events commit in

    ONE database transaction and a relay drains them to Kafka (at-least-once;
    the CloudEvents `id` is stored with the outbox row, so a

    retry republishes the same `id`). Kafka key = appointment id (site id for
    the calendar events, SCAC for the carrier events), so one

    appointment's (or carrier's) history stays ordered on one partition.


    **Consumed (ADR 0003).** facility-layout (`ZoneRegistered`,
    `LocationSlotRegistered`, `LocationSlotDecommissioned`),

    inbound-receiving (`ASNRegistered`, `ASNCancelled`),

    process-path-management (`CPTScheduleChanged`) and yard-management
    (`VisitCheckedIn`, `VisitRejected`, `TrailerDocked`,

    `TrailerUndocked`). The consumed messages below are restated from the
    producers' own contracts and never imported.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json;

    charset=UTF-8`. `specversion`, `id`, `source`
    (`/warehouse/dock-scheduling`), `type`, `subject`, `time`, `datacontenttype`

    (`application/json`) and `dataschema`
    (`urn:warehouse:dock-scheduling:events:<EventName>:v1`) are all required.
    Type =

    `com.warehouse.wms.dock-scheduling.<entity>.<EventName>` with entity
    `dockappointment`, `dockcalendar` or `carrier`. A breaking payload

    change is a new `.v2` type, never a mutation.


    **Standard semantics (ADR 0013).** Partners read standard vocabularies, not
    this context's private enums, so every fact about an

    appointment (and every door closure) carries, as ADDITIVE optional `data`
    fields, the standard meaning it corresponds to:

    `x12_status` (the ANSI X12 214 status code, where an honest mapping exists),
    `cbv_biz_step` (the GS1 EPCIS Core Business Vocabulary

    business step, as its `urn:epcglobal:cbv:bizstep:` URN) and `read_point_gln`
    (the GS1 GLN of the door where the fact happened, when

    facility-layout gave the door one, ADR 0045 there). The mapping is one table
    (`internal/domain/standards`, listed in ADR 0013 with the

    official code names and sources); an event with no honest code simply never
    carries the field. A field is omitted, never null, when it

    has no value, so a payload with none of them is byte-for-byte what it was
    before, and a consumer that does not know them keeps

    working. The integration and analytics twins carry identical `data`.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: dock-scheduling
    description: The dock-scheduling bounded context (WMS subdomain).
  - name: dockappointment
    description: Events raised by the DockAppointment aggregate.
  - name: dockcalendar
    description: Events raised by the DockCalendar aggregate.
  - name: analytics
    description: >-
      The analytics read side of this context (ADR 0006): the analytics topic,
      its projector and the reports binary.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).
channels:
  warehouse.dock-scheduling.events:
    description: >
      This service's integration topic. Written by the outbox relay; key =
      appointment id (site id for the door calendar events, SCAC for the carrier
      events);

      the only Kafka header on every message is the CloudEvents `content-type`.
      Rows the relay can never encode are parked raw on

      `warehouse.dock-scheduling.events.dlq`. Dispatch on the full `type`,
      ignore unknown types, dedupe on `id`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveDockSchedulingEvents
      summary: Receive the appointment lifecycle and door closures.
      description: >
        Route on the full `type`
        (`com.warehouse.wms.dock-scheduling.dockappointment.<EventName>`,

        `com.warehouse.wms.dock-scheduling.dockcalendar.<EventName>` and
        `com.warehouse.wms.dock-scheduling.carrier.<EventName>`).
        `DockAppointmentBooked` and `DockAppointmentRescheduled` carry the

        site's arrival tolerance; `DockAppointmentCancelled` carries the reason;
        `DockAppointmentNoShow` is terminal;

        `DockAppointmentDoorReassigned` moves the appointment to the door the
        trailer actually docked at, window unchanged (ADR 0010).

        `CarrierRegistered` is the whole carrier snapshot after a registration
        or an update (the latest `version` wins, an older one is

        stale); `CarrierSuspended` and `CarrierReinstated` change the carrier's
        status (ADR 0012). Suspending a carrier cancels nothing:

        the appointments it holds stay and a person decides.
      tags:
        - name: dockappointment
      message:
        oneOf:
          - name: DockAppointmentBooked
            title: DockAppointmentBooked
            summary: A door window was booked.
            description: >-
              `type` =
              `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked`;
              subject and Kafka key = appointment id. Integration stream.
              Consumers: yard-management, warehouse-planning, inbound-receiving.
              Optional standard fields (ADR 0013): `x12_status`, `cbv_biz_step`,
              `read_point_gln`; each is omitted when it has no honest value.
            contentType: application/cloudevents+json
            tags:
              - name: dockappointment
            payload:
              title: CloudEvent + DockAppointmentBooked data (events stream)
              allOf:
                - type: object
                  description: >-
                    CloudEvents 1.0 structured-mode envelope. Every attribute
                    below is REQUIRED in this fleet.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      enum:
                        - '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      description: >-
                        Minted once per domain event and persisted with the
                        outbox row; `(source, id)` is the consumer idempotency
                        key.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      minLength: 1
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      enum:
                        - application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      x-parser-schema-id: <anonymous-schema-9>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    source:
                      enum:
                        - /warehouse/dock-scheduling
                      x-parser-schema-id: <anonymous-schema-11>
                    type:
                      enum:
                        - >-
                          com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked
                      x-parser-schema-id: <anonymous-schema-12>
                    dataschema:
                      enum:
                        - >-
                          urn:warehouse:dock-scheduling:events:DockAppointmentBooked:v1
                      x-parser-schema-id: <anonymous-schema-13>
                    data:
                      type: object
                      required:
                        - appointment_id
                        - site_id
                        - direction
                        - door_code
                        - carrier
                        - carrier_scac
                        - window_start
                        - window_end
                        - asn_numbers
                        - cpt_id
                        - shipment_refs
                        - expected_seal_number
                        - arrival_tolerance_minutes
                        - provenance
                        - version
                      properties:
                        appointment_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-14>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-15>
                        direction:
                          type: string
                          enum:
                            - INBOUND
                            - OUTBOUND
                          x-parser-schema-id: <anonymous-schema-16>
                        door_code:
                          type: string
                          x-parser-schema-id: <anonymous-schema-17>
                        carrier:
                          type: string
                          x-parser-schema-id: <anonymous-schema-18>
                        carrier_scac:
                          type: string
                          nullable: true
                          x-parser-schema-id: <anonymous-schema-19>
                        window_start:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-20>
                        window_end:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-21>
                        asn_numbers:
                          type: array
                          items:
                            type: string
                            x-parser-schema-id: <anonymous-schema-23>
                          x-parser-schema-id: <anonymous-schema-22>
                        cpt_id:
                          type: string
                          nullable: true
                          x-parser-schema-id: <anonymous-schema-24>
                        shipment_refs:
                          type: array
                          items:
                            type: string
                            x-parser-schema-id: <anonymous-schema-26>
                          x-parser-schema-id: <anonymous-schema-25>
                        expected_seal_number:
                          type: string
                          nullable: true
                          x-parser-schema-id: <anonymous-schema-27>
                        arrival_tolerance_minutes:
                          type: integer
                          x-parser-schema-id: <anonymous-schema-28>
                        provenance:
                          type: string
                          enum:
                            - native
                            - legacy-import
                          description: >-
                            `legacy-import` is historical: nothing sets it since
                            the legacy importer was removed (ADR 0011); the
                            value stays a published enum value.
                          x-parser-schema-id: <anonymous-schema-29>
                        version:
                          type: integer
                          x-parser-schema-id: <anonymous-schema-30>
                        x12_status:
                          type: string
                          nullable: true
                          pattern: ^[A-Z0-9]{2}$
                          description: >-
                            Optional (ADR 0013). The ANSI X12 214 status code
                            this fact corresponds to: `AB` (Delivery Appointment
                            Date and/or Time) for an INBOUND appointment, `AA`
                            (Pick-up Appointment Date and/or Time) for an
                            OUTBOUND one; both are Shipment Appointment Status
                            Codes (X12 element 1652, AT7-03) and the date and
                            time they state is `window_start`. Omitted when
                            absent; never sent as null.
                          x-parser-schema-id: <anonymous-schema-31>
                        cbv_biz_step:
                          type: string
                          nullable: true
                          pattern: ^urn:epcglobal:cbv:bizstep:[a-z_]+$
                          description: >-
                            Optional (ADR 0013). The GS1 EPCIS Core Business
                            Vocabulary 2.0 business step of this fact, as a
                            `urn:epcglobal:cbv:bizstep:` URN. NOT MAPPED for
                            this event: the CBV has no business step that says
                            what this fact says, so the field is never present
                            today (ADR 0013 gives the reason). It is declared so
                            every appointment fact has the same shape. Omitted
                            when absent; never sent as null.
                          x-parser-schema-id: <anonymous-schema-32>
                        read_point_gln:
                          type: string
                          nullable: true
                          pattern: ^[0-9]{13}$
                          description: >-
                            Optional (ADR 0013). The GS1 Global Location Number
                            (13 digits, mod-10 check digit) of the door where
                            this fact happened, as facility-layout registered it
                            on the dock slot and this service kept in its local
                            door copy. Omitted when the door has no GLN or is
                            unknown. Never sent as null.
                          x-parser-schema-id: <anonymous-schema-33>
                      x-parser-schema-id: DockAppointmentBookedData
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: DockAppointmentBookedCloudEvent
            examples:
              - name: dockAppointmentBooked
                summary: A door window was booked.
                payload:
                  specversion: '1.0'
                  id: 00001000-1111-4222-8333-444455556666
                  source: /warehouse/dock-scheduling
                  type: >-
                    com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked
                  subject: appt-123e4567-e89b-12d3-a456-426614174000
                  time: '2026-11-05T12:00:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:dock-scheduling:events:DockAppointmentBooked:v1
                  data:
                    appointment_id: appt-123e4567-e89b-12d3-a456-426614174000
                    site_id: WH1
                    direction: INBOUND
                    door_code: WH1-DOCK-IN-01
                    carrier: ACME Freight
                    carrier_scac: ACMF
                    window_start: '2026-11-06T08:00:00Z'
                    window_end: '2026-11-06T10:00:00Z'
                    asn_numbers:
                      - ASN-1001
                    cpt_id: null
                    shipment_refs: []
                    expected_seal_number: SEAL-77120
                    arrival_tolerance_minutes: 15
                    provenance: native
                    version: 1
                    x12_status: AB
              - name: dockAppointmentBookedOutbound
                summary: >-
                  An OUTBOUND appointment on a door with a GLN: a pick-up
                  appointment (AA) and its read point.
                payload:
                  specversion: '1.0'
                  id: 00001100-1111-4222-8333-444455556666
                  source: /warehouse/dock-scheduling
                  type: >-
                    com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked
                  subject: appt-223e4567-e89b-12d3-a456-426614174000
                  time: '2026-11-05T12:00:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:dock-scheduling:events:DockAppointmentBooked:v1
                  data:
                    appointment_id: appt-223e4567-e89b-12d3-a456-426614174000
                    site_id: WH1
                    direction: OUTBOUND
                    door_code: WH1-DOCK-OUT-01
                    carrier: ACME Freight
                    carrier_scac: ACMF
                    window_start: '2026-11-06T08:00:00Z'
                    window_end: '2026-11-06T10:00:00Z'
                    asn_numbers: []
                    cpt_id: WH1-1500
                    shipment_refs:
                      - SHP-2001
                    expected_seal_number: SEAL-77120
                    arrival_tolerance_minutes: 15
                    provenance: native
                    version: 1
                    x12_status: AA
                    read_point_gln: '4006381333931'
            messageId: DockAppointmentBooked
          - name: DockAppointmentRescheduled
            title: DockAppointmentRescheduled
            summary: A BOOKED appointment moved to another window and/or door.
            description: >-
              `type` =
              `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentRescheduled`;
              subject and Kafka key = appointment id. Integration stream.
              Consumers: yard-management, warehouse-planning. Optional standard
              fields (ADR 0013): `x12_status`, `cbv_biz_step`, `read_point_gln`;
              each is omitted when it has no honest value.
            contentType: application/cloudevents+json
            tags:
              - name: dockappointment
            payload:
              title: CloudEvent + DockAppointmentRescheduled data (events stream)
              allOf:
                - type: object
                  description: >-
                    CloudEvents 1.0 structured-mode envelope. Every attribute
                    below is REQUIRED in this fleet.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      enum:
                        - '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      description: >-
                        Minted once per domain event and persisted with the
                        outbox row; `(source, id)` is the consumer idempotency
                        key.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      minLength: 1
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      enum:
                        - application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      x-parser-schema-id: <anonymous-schema-9>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    source:
                      enum:
                        - /warehouse/dock-scheduling
                      x-parser-schema-id: <anonymous-schema-35>
                    type:
                      enum:
                        - >-
                          com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentRescheduled
                      x-parser-schema-id: <anonymous-schema-36>
                    dataschema:
                      enum:
                        - >-
                          urn:warehouse:dock-scheduling:events:DockAppointmentRescheduled:v1
                      x-parser-schema-id: <anonymous-schema-37>
                    data:
                      type: object
                      required:
                        - appointment_id
                        - site_id
                        - door_code
                        - previous_door_code
                        - window_start
                        - window_end
                        - previous_window_start
                        - previous_window_end
                        - arrival_tolerance_minutes
                        - version
                      properties:
                        appointment_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-38>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-39>
                        door_code:
                          type: string
                          x-parser-schema-id: <anonymous-schema-40>
                        previous_door_code:
                          type: string
                          x-parser-schema-id: <anonymous-schema-41>
                        window_start:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-42>
                        window_end:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-43>
                        previous_window_start:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-44>
                        previous_window_end:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-45>
