      all three ProcessPath* event types plus CPTScheduleChanged (ADR 0010) as
      CloudEvents 1.0 (ADR 0016), dispatched by consumers on the full `type`.
      Kafka message key = the CloudEvents `subject` (`path_id`, or `site_id` for
      CPTScheduleChanged), hash-balanced. Every message carries the Kafka header
      `content-type: application/cloudevents+json; charset=UTF-8` plus
      `traceparent` / `tracestate` when raised inside a traced operation. Events
      travel through the transactional outbox (Postgres is mandatory, ADR 0037);
      there is no log or in-memory publisher in the shipped binary. The topic is
      auto-created by the broker on first write.
