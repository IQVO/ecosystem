                          x-parser-schema-id: <anonymous-schema-50>
                      x-parser-schema-id: DockAppointmentRescheduledData
                  x-parser-schema-id: <anonymous-schema-34>
              x-parser-schema-id: DockAppointmentRescheduledCloudEvent
            examples:
              - name: dockAppointmentRescheduled
                summary: A BOOKED appointment moved to another window and/or door.
                payload:
                  specversion: '1.0'
                  id: 00001002-1111-4222-8333-444455556666
                  source: /warehouse/dock-scheduling
                  type: >-
                    com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentRescheduled
                  subject: appt-123e4567-e89b-12d3-a456-426614174000
                  time: '2026-11-05T12:00:00Z'
