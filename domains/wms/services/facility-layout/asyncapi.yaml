asyncapi: 2.6.0
info:
  title: Facility Layout Domain Events
  version: 1.0.0
  description: >
    Domain-event catalog for the **facility-layout** bounded context, the system
    of record for where things physically are in the building: the site's
    structural hierarchy (Site, Area, Zone, Aisle) and the coded storage slots
    inside it. This context is a Generic Subdomain and an **Open Host Service**
    — these events ARE its Published Language, and every downstream service is a
    Conformist to them. Unlike a service that forwards a curated subset, this
    context's Kafka publisher (`internal/adapters/outbound/kafka/publisher.go`)
    emits **every** domain event to the integration topic — the whole Published
    Language.


    **Envelope: CloudEvents 1.0 (mandatory, ADR-0024).** Every message on this
    channel is a CloudEvents 1.0 event in **structured content mode**
    (CloudEvents Kafka protocol binding): the Kafka message value is the JSON
    event format and every message carries the Kafka header `content-type:
    application/cloudevents+json; charset=UTF-8`. All of `specversion` (`1.0`),
    `id` (UUID, minted once per domain event and stable across outbox
    redelivery), `source` (`/warehouse/facility-layout`), `type`, `subject` (the
    aggregate instance id), `time` (the domain occurred-at, UTC),
    `datacontenttype` (`application/json`) and `dataschema`
    (`urn:warehouse:facility-layout:events:<EventName>:v1`) are required. `data`
    carries the domain event's own JSON verbatim — note it also carries
    `eventName`, `eventType` and `occurredAt` fields, because the domain event's
    struct tags are the wire shape. There is no other envelope: consumers must
    reject (DLQ/skip) anything that fails CloudEvents validation.


    **The `type` attribute** follows the platform-wide reverse-DNS convention
    `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>` — all
    lowercase except the final PascalCase event name, and the entity segment
    carries no hyphen even for multi-word aggregate names. This service's
    subdomain segment is `wms`: bin-accurate location is WMS-tier in the domain
    reference. Consumers dispatch on the FULL `type` string. Example:
    `com.warehouse.wms.facility-layout.locationslot.LocationSlotRegistered`. A
    breaking payload change is published as a new `.v2` type with a `:v2`
    dataschema, never by mutating an existing one.


    **Partitioning and ordering.** The Kafka message key is the identity of the
    aggregate that raised the event (site code, zone id, aisle id, location
    code, rule id, location type name, structure id, or a cross-aisle's
    composite identity), so all events for one aggregate land on the same
    partition and per-aggregate order is preserved (ADR-0032 extended this to
    the ADR-0017 geometry / structure / cross-aisle events, which were
    previously keyed by their event type and so shared one partition per type).
    The single exception is `FacilityLayoutImported`, a batch outcome with no
    aggregate: it is keyed by its CloudEvents `id` and carries no ordering
    guarantee. The CloudEvents `subject` is the aggregate instance
    (`layout-import` for `FacilityLayoutImported`).


    **Live consumer.** `inventory-storage` maintains a local read model of
    location classifications fed by this topic
    (`internal/adapters/outbound/facilitycache/`, selected with
    `LOCATION_LOOKUP_MODE=kafka`), replacing its per-stow synchronous `GET
    /locations/{locationCode}/classification` call. It consumes
    **ZoneRegistered**, **LocationSlotRegistered** and
    **LocationSlotDecommissioned**, replaying the topic from the first offset on
    every process start under a per-instance-unique consumer group, and gates
    its readiness on that replay completing. `warehouse-planning` also consumes
    this topic (own fixed consumer group, at-least-once):
    **LocationSlotRegistered** and **LocationSlotDecommissioned** feed its
    storage-position / work-center-station tally. Every other event is published
    but has no wired consumer today — they are Published Language available for
    future Conformists, stated so a downstream team cannot mistake an available
    event for a consumed one. See facility-layout ADR-0009 (integration
    publishing) and inventory-storage ADR-0013 (the location-classification
    cache).
  contact:
    name: Warehouse Systems Platform Team
    url: https://github.com/IQVO/facility-layout
    email: claudioed.oliveira@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: facility-layout
    description: >
      The facility-layout bounded context (wms subdomain) — the authoritative
      record of the warehouse's physical structure: sites, zones, aisles and
      coded location slots.
  - name: site
    description: >
      Events raised by the Site aggregate: a physical facility/building added to
      the warehouse map.
  - name: zone
    description: >
      Events raised by the Zone aggregate: a behavioral region inside a site's
      area, carrying temperature class and hazmat attributes.
  - name: aisle
    description: >
      Events raised by the Aisle aggregate: a physical corridor inside a zone,
      with walk-sequence and traversal direction.
  - name: locationtype
    description: >
      Events raised by the LocationType aggregate: a reusable slot shape/kind
      with weight and volume capacity.
  - name: placementrule
    description: >
      Events raised by the PlacementRule aggregate: a rule constraining which
      LocationTypes are legal in which Zones.
  - name: locationslot
    description: >
      Events raised by the LocationSlot aggregate: the coded leaf slots of the
      warehouse map — registration, decommissioning, and bulk import.
  - name: structure
    description: >
      Events raised by the FixedStructure aggregate (ADR-0017): site-scoped
      physical obstacles — walls, columns, offices, conveyors — drawn on the
      warehouse map. Not a location; nothing can be stowed at one.
  - name: crossaisle
    description: >
      Events raised by the CrossAisle aggregate (ADR-0017): zone-scoped
      connections between two aisles at a bay ordinal, the travel graph's
      cross-aisle edges.
servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >
      The shared warehouse-systems Kafka broker (the in-cluster release,
      reachable from the host at `localhost:9092`), addressed via the
      `KAFKA_BROKERS` environment variable. The Kafka publisher is selected with
      `EVENT_PUBLISHER=kafka`; the default (unset) keeps the Postgres outbox /
      log publisher, so tests and local runs never need a broker.
defaultContentType: application/cloudevents+json
channels:
  warehouse.facility.events:
    description: >
      The single outbound integration topic for this bounded context, named
      after the `Topic` constant in
      `internal/adapters/outbound/kafka/publisher.go`
      (`warehouse.facility.events`). Every domain event this context raises is
      published here when `EVENT_PUBLISHER=kafka` — the whole Published
      Language, not a subset. The one live consumer today is inventory-storage's
      location-classification cache (ZoneRegistered, LocationSlotRegistered,
      LocationSlotDecommissioned); everything else is available, unconsumed
      Published Language.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: onFacilityEvent
      summary: Consume facility-layout's Published Language.
      description: >
        Subscribe to every structural fact about the warehouse map. At-least-
        once delivery is the consumer's problem: deduplicate on the CloudEvents
        `id`, and expect to see the full history on a from-first-offset replay.
        A consumer building a local read model should follow the
        inventory-storage precedent: per-process-unique consumer group,
        FirstOffset replay, readiness gated on catching up to the high watermark
        observed at start.
      message:
        oneOf:
          - name: SiteRegistered
            contentType: application/cloudevents+json
            title: Site registered
            tags:
              - name: site
            summary: A physical facility/building was added to the warehouse map.
            description: >
              Raised by `RegisterSite`. Kafka key: `siteCode`. No consumer wired
              today. `siteRole` is additive (ADR-0037): the site's role in the
              fulfilment network, `UNSPECIFIED` when the registration stated
              none (a consumer decoding the older payload simply ignores it).
            payload:
              allOf:
                - type: object
                  description: >
                    CloudEvents 1.0 structured-mode envelope (ADR-0024). Every
                    attribute below is REQUIRED in this fleet. `data` carries
                    the domain event's own JSON verbatim.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  additionalProperties: false
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-2>
                    id:
                      type: string
                      format: uuid
                      description: >
                        Minted once per domain event and persisted with the
                        outbox row, so a redelivery carries the same id.
                        `(source, id)` is the consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-3>
                    source:
                      type: string
                      format: uri-reference
                      const: /warehouse/facility-layout
                      x-parser-schema-id: <anonymous-schema-4>
                    type:
                      type: string
                      description: >
                        `com.warehouse.wms.facility-layout.<entity>.<EventName>`.
                        Consumers dispatch on the full string.
                      x-parser-schema-id: <anonymous-schema-5>
                    subject:
                      type: string
                      minLength: 1
                      description: Id of the aggregate instance the event is about.
                      x-parser-schema-id: <anonymous-schema-6>
                    time:
                      type: string
                      format: date-time
                      description: >-
                        When the domain fact occurred (not when it was
                        published), UTC.
                      x-parser-schema-id: <anonymous-schema-7>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-8>
                    dataschema:
                      type: string
                      format: uri
                      description: >
                        `urn:warehouse:facility-layout:events:<EventName>:v<N>`
                        on this channel (`...:analytics:...` on
                        warehouse.facility.analytics).
                      x-parser-schema-id: <anonymous-schema-9>
                    data:
                      type: object
                      description: The domain event's own JSON payload.
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: cloudEvent
                - type: object
                  properties:
                    type:
                      const: com.warehouse.wms.facility-layout.site.SiteRegistered
                      x-parser-schema-id: <anonymous-schema-12>
                    dataschema:
                      const: urn:warehouse:facility-layout:events:SiteRegistered:v1
                      x-parser-schema-id: <anonymous-schema-13>
                    data:
                      allOf:
                        - type: object
                          description: >
                            Fields present in every event's `data` payload — the
                            domain event base struct's own serialization.
                          required:
                            - eventName
                            - eventType
                            - occurredAt
                          properties:
                            eventName:
                              type: string
                              description: The bare PascalCase event name.
                              x-parser-schema-id: <anonymous-schema-15>
                            eventType:
                              type: string
                              description: >-
                                Same reverse-DNS type as the CloudEvents `type`
                                attribute.
                              x-parser-schema-id: <anonymous-schema-16>
                            occurredAt:
                              type: string
                              format: date-time
                              x-parser-schema-id: <anonymous-schema-17>
                          x-parser-schema-id: eventDataBase
                        - type: object
                          required:
                            - siteCode
                            - siteName
                          properties:
                            siteCode:
                              type: string
                              description: Uppercase alphanumeric, unique. e.g. `WH1`.
                              x-parser-schema-id: <anonymous-schema-19>
                            siteName:
                              type: string
                              x-parser-schema-id: <anonymous-schema-20>
                            siteRole:
                              type: string
                              description: >
                                A site's role in the fulfilment network
                                (ADR-0037). `UNSPECIFIED` means not classified
                                yet.
                              enum:
                                - UNSPECIFIED
                                - ROBOTICS_SORTABLE_FC
                                - NON_SORTABLE_FC
                                - TRADITIONAL_SORTABLE_FC
                                - SUB_SAME_DAY_FC
                                - FRESH_GROCERY_FC
                                - XL_FC
                                - SOFT_LINES_SORTABLE_FC
                                - MICRO_FC
                                - SIMULATED_FC
                                - INBOUND_CROSS_DOCK
                                - NATIONAL_INBOUND_CROSS_DOCK
                                - RETURNS_CENTER
                                - SORTATION_CENTER
                                - DELIVERY_STATION
                                - AIR_HUB_GATEWAY
                              x-parser-schema-id: siteRole
                          x-parser-schema-id: <anonymous-schema-18>
                      x-parser-schema-id: <anonymous-schema-14>
                  x-parser-schema-id: <anonymous-schema-11>
              x-parser-schema-id: <anonymous-schema-1>
            messageId: SiteRegistered
          - name: SiteCapabilityChanged
            contentType: application/cloudevents+json
            title: Site capability changed
            tags:
              - name: site
            summary: A site's transfer capability state changed.
            description: >
              A complete, PII-free last-write-wins snapshot of site transfer
              capability. Kafka key and CloudEvents subject: `site_code`.
              Consumers compare `capability_revision` and retain the latest
              complete snapshot; they must not infer either capability from
              facility topology. Raised by `PUT
              /sites/{siteCode}/transfer-capability` through the transactional
              outbox, once per real change; `capability_revision` starts at 1
              and increases by exactly one per change of the same site
              (ADR-0035). The payload stays snake_case although every other
              facility-layout payload is camelCase: recasing it would be a
              breaking `.v2` for network-inventory-planning (ADR-0035, decision
              D2).
            payload:
              allOf:
                - type: object
                  description: >
                    CloudEvents 1.0 structured-mode envelope (ADR-0024). Every
                    attribute below is REQUIRED in this fleet. `data` carries
                    the domain event's own JSON verbatim.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  additionalProperties: false
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-2>
                    id:
                      type: string
                      format: uuid
                      description: >
                        Minted once per domain event and persisted with the
                        outbox row, so a redelivery carries the same id.
                        `(source, id)` is the consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-3>
                    source:
                      type: string
                      format: uri-reference
                      const: /warehouse/facility-layout
                      x-parser-schema-id: <anonymous-schema-4>
                    type:
                      type: string
                      description: >
                        `com.warehouse.wms.facility-layout.<entity>.<EventName>`.
                        Consumers dispatch on the full string.
                      x-parser-schema-id: <anonymous-schema-5>
                    subject:
                      type: string
                      minLength: 1
                      description: Id of the aggregate instance the event is about.
                      x-parser-schema-id: <anonymous-schema-6>
                    time:
                      type: string
                      format: date-time
                      description: >-
                        When the domain fact occurred (not when it was
                        published), UTC.
                      x-parser-schema-id: <anonymous-schema-7>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-8>
                    dataschema:
                      type: string
                      format: uri
                      description: >
                        `urn:warehouse:facility-layout:events:<EventName>:v<N>`
                        on this channel (`...:analytics:...` on
                        warehouse.facility.analytics).
                      x-parser-schema-id: <anonymous-schema-9>
                    data:
                      type: object
                      description: The domain event's own JSON payload.
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: cloudEvent
                - type: object
                  properties:
                    type:
                      const: >-
                        com.warehouse.wms.facility-layout.site.SiteCapabilityChanged
                      x-parser-schema-id: <anonymous-schema-23>
                    dataschema:
                      const: >-
                        urn:warehouse:facility-layout:events:SiteCapabilityChanged:v1
                      x-parser-schema-id: <anonymous-schema-24>
                    data:
                      allOf:
                        - type: object
                          description: >
                            Fields present in every event's `data` payload — the
                            domain event base struct's own serialization.
                          required:
                            - eventName
                            - eventType
                            - occurredAt
                          properties:
                            eventName:
                              type: string
                              description: The bare PascalCase event name.
                              x-parser-schema-id: <anonymous-schema-15>
                            eventType:
                              type: string
                              description: >-
                                Same reverse-DNS type as the CloudEvents `type`
                                attribute.
                              x-parser-schema-id: <anonymous-schema-16>
                            occurredAt:
                              type: string
                              format: date-time
                              x-parser-schema-id: <anonymous-schema-17>
                          x-parser-schema-id: eventDataBase
                        - type: object
                          required:
                            - site_code
                            - transfer_origin_enabled
                            - transfer_destination_enabled
                            - capability_revision
                          properties:
                            site_code:
                              type: string
                              description: >-
                                Uppercase alphanumeric site identity; also the
                                Kafka key and CloudEvents subject.
                              x-parser-schema-id: <anonymous-schema-27>
                            transfer_origin_enabled:
                              type: boolean
                              x-parser-schema-id: <anonymous-schema-28>
                            transfer_destination_enabled:
                              type: boolean
                              x-parser-schema-id: <anonymous-schema-29>
                            capability_revision:
                              type: integer
                              format: int64
                              description: >-
                                Monotonically increasing revision for
                                last-write-wins consumers.
                              x-parser-schema-id: <anonymous-schema-30>
                          x-parser-schema-id: <anonymous-schema-26>
                      x-parser-schema-id: <anonymous-schema-25>
                  x-parser-schema-id: <anonymous-schema-22>
              x-parser-schema-id: <anonymous-schema-21>
            messageId: SiteCapabilityChanged
          - name: SiteRoleChanged
            contentType: application/cloudevents+json
            title: Site role changed
            tags:
              - name: site
            summary: An operator changed a site's role in the fulfilment network.
            description: >
              Raised by `PUT /sites/{siteCode}/role` through the transactional
              outbox, once per real change (repeating the current role publishes
              nothing) (ADR-0037). Kafka key and CloudEvents subject:
              `siteCode`, so the changes of one site stay ordered. Carries the
              new and the replaced role. It never implies a transfer-capability
              change: that is only ever `SiteCapabilityChanged` (ADR-0035). The
              one-time backfill of migration 0009 publishes no SiteRoleChanged;
              read the role of existing sites on `GET /sites`.
            payload:
              allOf:
                - type: object
                  description: >
                    CloudEvents 1.0 structured-mode envelope (ADR-0024). Every
                    attribute below is REQUIRED in this fleet. `data` carries
                    the domain event's own JSON verbatim.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  additionalProperties: false
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-2>
                    id:
                      type: string
                      format: uuid
                      description: >
                        Minted once per domain event and persisted with the
                        outbox row, so a redelivery carries the same id.
                        `(source, id)` is the consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-3>
                    source:
                      type: string
                      format: uri-reference
                      const: /warehouse/facility-layout
                      x-parser-schema-id: <anonymous-schema-4>
                    type:
                      type: string
                      description: >
                        `com.warehouse.wms.facility-layout.<entity>.<EventName>`.
                        Consumers dispatch on the full string.
                      x-parser-schema-id: <anonymous-schema-5>
                    subject:
                      type: string
                      minLength: 1
                      description: Id of the aggregate instance the event is about.
                      x-parser-schema-id: <anonymous-schema-6>
                    time:
                      type: string
                      format: date-time
                      description: >-
                        When the domain fact occurred (not when it was
                        published), UTC.
                      x-parser-schema-id: <anonymous-schema-7>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-8>
                    dataschema:
                      type: string
                      format: uri
                      description: >
                        `urn:warehouse:facility-layout:events:<EventName>:v<N>`
                        on this channel (`...:analytics:...` on
                        warehouse.facility.analytics).
                      x-parser-schema-id: <anonymous-schema-9>
                    data:
                      type: object
                      description: The domain event's own JSON payload.
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: cloudEvent
                - type: object
                  properties:
                    type:
                      const: com.warehouse.wms.facility-layout.site.SiteRoleChanged
                      x-parser-schema-id: <anonymous-schema-33>
                    dataschema:
                      const: urn:warehouse:facility-layout:events:SiteRoleChanged:v1
                      x-parser-schema-id: <anonymous-schema-34>
                    data:
                      allOf:
                        - type: object
                          description: >
                            Fields present in every event's `data` payload — the
                            domain event base struct's own serialization.
                          required:
                            - eventName
                            - eventType
                            - occurredAt
                          properties:
                            eventName:
                              type: string
                              description: The bare PascalCase event name.
                              x-parser-schema-id: <anonymous-schema-15>
                            eventType:
                              type: string
                              description: >-
                                Same reverse-DNS type as the CloudEvents `type`
                                attribute.
                              x-parser-schema-id: <anonymous-schema-16>
                            occurredAt:
                              type: string
                              format: date-time
                              x-parser-schema-id: <anonymous-schema-17>
                          x-parser-schema-id: eventDataBase
                        - type: object
                          required:
                            - siteCode
                            - siteRole
                            - previousSiteRole
                          properties:
                            siteCode:
                              type: string
                              description: >-
                                Uppercase alphanumeric site identity; also the
                                Kafka key and CloudEvents subject.
                              x-parser-schema-id: <anonymous-schema-37>
                            siteRole:
                              type: string
                              description: >
                                A site's role in the fulfilment network
                                (ADR-0037). `UNSPECIFIED` means not classified
                                yet.
                              enum:
                                - UNSPECIFIED
                                - ROBOTICS_SORTABLE_FC
                                - NON_SORTABLE_FC
                                - TRADITIONAL_SORTABLE_FC
                                - SUB_SAME_DAY_FC
                                - FRESH_GROCERY_FC
                                - XL_FC
                                - SOFT_LINES_SORTABLE_FC
                                - MICRO_FC
                                - SIMULATED_FC
                                - INBOUND_CROSS_DOCK
                                - NATIONAL_INBOUND_CROSS_DOCK
                                - RETURNS_CENTER
                                - SORTATION_CENTER
                                - DELIVERY_STATION
                                - AIR_HUB_GATEWAY
                              x-parser-schema-id: siteRole
                            previousSiteRole:
                              type: string
                              description: >
                                A site's role in the fulfilment network
                                (ADR-0037). `UNSPECIFIED` means not classified
                                yet.
                              enum:
                                - UNSPECIFIED
                                - ROBOTICS_SORTABLE_FC
                                - NON_SORTABLE_FC
                                - TRADITIONAL_SORTABLE_FC
                                - SUB_SAME_DAY_FC
                                - FRESH_GROCERY_FC
                                - XL_FC
                                - SOFT_LINES_SORTABLE_FC
                                - MICRO_FC
                                - SIMULATED_FC
                                - INBOUND_CROSS_DOCK
                                - NATIONAL_INBOUND_CROSS_DOCK
                                - RETURNS_CENTER
                                - SORTATION_CENTER
                                - DELIVERY_STATION
                                - AIR_HUB_GATEWAY
                              x-parser-schema-id: siteRole
                          x-parser-schema-id: <anonymous-schema-36>
                      x-parser-schema-id: <anonymous-schema-35>
                  x-parser-schema-id: <anonymous-schema-32>
              x-parser-schema-id: <anonymous-schema-31>
            messageId: SiteRoleChanged
          - name: ZoneRegistered
            contentType: application/cloudevents+json
            title: Zone registered
            tags:
              - name: zone
            summary: A behavioral zone was added inside a Site's area.
            description: >
              Raised by `RegisterZone`. Kafka key: `zoneId`. **Consumed live**
              by inventory-storage's location-classification cache — the zone's
              `hazmat` and `temperatureClass` attributes are exactly what its
              StowStock placement check reads.
            payload:
              allOf:
                - type: object
                  description: >
                    CloudEvents 1.0 structured-mode envelope (ADR-0024). Every
                    attribute below is REQUIRED in this fleet. `data` carries
                    the domain event's own JSON verbatim.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  additionalProperties: false
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-2>
                    id:
                      type: string
                      format: uuid
                      description: >
                        Minted once per domain event and persisted with the
                        outbox row, so a redelivery carries the same id.
                        `(source, id)` is the consumer idempotency key.
                      x-parser-schema-id: <anonymous-schema-3>
                    source:
                      type: string
                      format: uri-reference
                      const: /warehouse/facility-layout
                      x-parser-schema-id: <anonymous-schema-4>
                    type:
