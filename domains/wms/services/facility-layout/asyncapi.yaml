  warehouse.facility.analytics:
    description: >
      The analytics topic of this bounded context (ADR-0010), named after the
      `AnalyticsTopic` constant in
      `internal/adapters/outbound/kafka/analytics_publisher.go`
      (`warehouse.facility.analytics`). The composition root fans EVERY domain
      event out to it alongside the integration topic when
      `EVENT_PUBLISHER=kafka` and `analytics.enabled` — same CloudEvent `type`
      and `id` per occurrence, with
      `dataschema=urn:warehouse:facility-layout:analytics:<EventName>:v1`. It is
      NOT part of the cross-context integration contract: it exists so this
      service's own analytical read model (the "Layout Catalog Growth & Change"
      data product) can evolve independently of the OLTP Published Language.
      Cross-context consumers should subscribe to `warehouse.facility.events`,
      not here.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: onFacilityAnalyticsEvent
      summary: Consume facility-layout's analytics stream (internal data product).
      description: >
        The only supported consumer is this service's own
        `cmd/facility-projector` (single writer of the analytical database,
        ADR-0010). It follows the same at-least-once discipline:
        per-process-unique consumer group, FirstOffset replay, idempotent
        projection keyed on the CloudEvent `id`, readiness gated on catching up
        to the high watermark observed at start. The topic carries every event
        type; the projector derives its report from SiteRegistered,
        ZoneRegistered, AisleRegistered, LocationTypeRegistered,
        PlacementRuleDefined, LocationSlotRegistered, LocationSlotDecommissioned
        and FacilityLayoutImported, and ignores the other types. A message that
        fails CloudEvents validation goes to the `.dlq` topic
        (`warehouse.facility.analytics.dlq`).
