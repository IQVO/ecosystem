  warehouse.fulfillment.events:
    description: >-
      Integration events published by Fulfillment Execution, keyed by aggregate
      id. Consumers dispatch on the full CloudEvents `type`.
    x-eventcatalog-channel-version: 2.0.0
    subscribe:
      operationId: confirmPicksFromTaskCompleted
      summary: >-
        Confirm the picked line's reservation (line_no), or fall back to
        confirming the order on its last TaskCompleted; apply a completed
        RELOCATE task as an intra-site stock move.
      description: >
        At-least-once, fixed group: FetchMessage, then CommitMessages only after
        the message settles. For `task_type = PICK` with a non-empty `order_ref`
        (the OrderId order-management reserved against, stored here as
        `demand_ref`) there are two paths.


        PER-LINE (ADR 0036, audit decision 18): when the event carries the
        additive `line_no`, exactly the ACTIVE reservation(s) with `demand_ref =
        order_ref` and `line_no` equal to the event's are confirmed through the
        existing ConfirmPick logic (stock decremented, bin capacity released,
        `StockPicked` raised); normally exactly one, since earlier attempts of
        the line are REVOKED. CONFIRMED and REVOKED ones are skipped; an EXPIRED
        one (ADR 0003) is skipped, logged and counted
        (`inventory.pick_confirmations{outcome=expired}`), never an error. Other
        lines of the order are never touched, so a line whose pick has not
        arrived stays ACTIVE and reserved. Nothing is counted on this path (no
        `order_pick_progress` row).


        COUNTING FALLBACK (ADR 0035, kept for backward compatibility): when the
        event has no `line_no`, or names a line that no reservation of the order
        carries but the order has reservations created before `line_no` existed
        (NULL), the pick is COUNTED for the order (table `order_pick_progress`)
        against those reservations only; when the count reaches their ACTIVE +
        CONFIRMED number (REVOKED and EXPIRED are not awaited), i.e. on the LAST
        pick, every ACTIVE one is confirmed. Earlier picks only record progress
        and settle as successful no-ops. Counter rows older than
        `ORDER_PICK_PROGRESS_RETENTION` (default 720h) are swept. The "one pick
        early" edge of that counting does not exist on the per-line path.


        The CloudEvents `id` claim in `processed_events`, the counter increment
        (fallback only) and all confirmations commit in ONE transaction, so a
        failure rolls everything back and the redelivery is applied in full; a
        redelivered id is a no-op, and a further PICK event for an already
        confirmed line confirms nothing new. No reservations for the order (a
        transfer or non-inventory order), a line with no reservation and no
        line-less ones to fall back to, a non-PICK task, a missing `order_ref`
        (a producer that predates the field) and every other event type are
        successful no-ops. A Task carries no SKU or quantity, so SHORT PICKS ARE
        NOT MODELLED. A `line_no` that is not an integer between 1 and
        2147483647 is a malformed payload: dead-lettered at once.


        RELOCATE (ADR 0039, decision E1): a `task_type = RELOCATE` completion
        carries the additive `sku`, `from_bin`, `to_bin`, `quantity` and
        `relocation_ref` and is applied by ApplyRelocationTask, never by
        confirm-pick: the same RelocateStock as POST /relocations (reason
        SLOTTING, site = the source bin's site, source_ref = `relocation_ref` or
        the task id) moves the stock and enqueues `StockRelocated`, with the
        CloudEvents `id` claimed in `processed_events` under consumer
        `task-completed-relocate` in the SAME transaction, so a redelivery is a
        no-op and a failure un-claims the id. A completion that can never apply
        (a missing or invalid field, an unknown bin, bins of different sites,
        the same bin, too little usable stock, a full destination) is
        dead-lettered at once; a transient failure (database, concurrent
        modification) is retried; a shutdown mid-move commits nothing and
        dead-letters nothing.


        REPLENISH (ADR 0041): a `task_type = REPLENISH` completion carries the
        same additive `sku`, `from_bin`, `to_bin`, `quantity` plus the REQUIRED
        `request_ref` (the pick-face-replenishment request id, mirroring
        `relocation_ref`) and is applied by ApplyReplenishTask: the same
        RelocateStock with reason `REPLENISHMENT`, site = the source bin's site
        and source_ref = `request_ref` (no task-id fallback: the replenishment
        context closes a request by `source_ref == request_id`). It enqueues
        `StockRelocated` plus the two `BinStockLevelChanged` events (reason
        `REPLENISHMENT`, source bin then destination bin). The CloudEvents `id`
        is claimed in `processed_events` under consumer
        `task-completed-replenish` in the SAME transaction; classification of
        deterministic versus transient failures is that of RELOCATE, and a
        REPLENISH completion without `request_ref` is dead-lettered at once.


        A transient failure retries the same message with capped backoff (5
        attempts), then dead-letters it; an undecodable payload is dead-lettered
        at once; a message that is not a CloudEvent is skipped with a sampled
        WARN.
      tags:
        - name: fulfillment-execution
          description: Consumed from the fulfillment-execution bounded context.
