        transfer-allocatable), INSUFFICIENT_USABLE (the origin holds the SKU but
        not enough usable quantity), IDEMPOTENCY_CONFLICT (the transfer_line_id
        was replayed with a DIFFERENT command payload; the original ledger
        decision stands and this reply tells the planner so).


