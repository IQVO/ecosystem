    InboundReceivingReceiptCartonReceived:
      name: InboundReceivingReceiptCartonReceived
      title: Receipt Carton Received (from inbound-receiving, consumed)
      summary: >-
        A sealed carton was received on a receipt line; it becomes a Container
        once the line is booked.
      description: >-
        CONSUMED, not produced (ADR 0045, 0046; contract section 2 with R6/R7
        applied): type
        `com.warehouse.wms.inbound-receiving.receipt.ReceiptCartonReceived`,
        `source=/warehouse/inbound-receiving`. `data` is snake_case:
        `{receipt_id, asn_number, sscc, parent_sscc, sealed, lpn, owner_ref,
        contents[{line_no, sku, gtin, qty, lot, expiry, condition}],
        received_at}`. It carries NO site (R6): the container's site is derived
        at StowContainer from the bin. Unknown fields are ignored.


        Only a sealed, single-content, `Good` carton whose `qty` equals the
        case's units per pack in the PackagingView gets a Container (mixed,
        unsealed and damaged cartons keep their eaches as ordinary staged stock
        and get none). The carton is recorded keyed by (`receipt_id`, `line_no`,
        `lpn`) and settles idempotently in either arrival order relative to
        `ReceiptLineReceived`: the container exists only when the sum of
        container quantities of the line stays within the eaches
        `ReceiptLineReceived` booked, and when `gtin` is known to the
        PackagingView (otherwise it waits in the pending table). This message
        books NO quantity. The CloudEvents `id` is claimed in `processed_events`
        (consumer `inbound-carton`) in the same transaction.
      contentType: application/cloudevents+json
      tags:
        - name: inbound-receiving
          description: Consumed from inbound-receiving.
      payload:
        type: object
        description: >
          CloudEvents 1.0 envelope of ReceiptCartonReceived as consumed here
          (not composed from CloudEventBase, whose `source` is this service's
          own).
        required:
          - specversion
          - id
          - source
          - type
          - subject
          - time
          - datacontenttype
          - data
        properties:
          specversion:
            type: string
            enum:
              - '1.0'
            x-parser-schema-id: <anonymous-schema-344>
          id:
            type: string
            description: CloudEvents id; the dedupe key (claimed in processed_events).
            x-parser-schema-id: <anonymous-schema-345>
          source:
            type: string
            enum:
              - /warehouse/inbound-receiving
            x-parser-schema-id: <anonymous-schema-346>
          type:
            type: string
            const: com.warehouse.wms.inbound-receiving.receipt.ReceiptCartonReceived
            x-parser-schema-id: <anonymous-schema-347>
          subject:
            type: string
            description: The receipt id.
            x-parser-schema-id: <anonymous-schema-348>
          time:
            type: string
            format: date-time
            x-parser-schema-id: <anonymous-schema-349>
          datacontenttype:
            type: string
            enum:
              - application/json
            x-parser-schema-id: <anonymous-schema-350>
          dataschema:
            type: string
            description: urn:warehouse:inbound-receiving:events:ReceiptCartonReceived:v1
            x-parser-schema-id: <anonymous-schema-351>
          data:
            type: object
            description: >-
              Unknown fields are ignored (forward compatible). NO site (contract
              R6).
            required:
              - receipt_id
              - sscc
              - sealed
              - contents
            properties:
              receipt_id:
                type: string
                x-parser-schema-id: <anonymous-schema-353>
              asn_number:
                type: string
                x-parser-schema-id: <anonymous-schema-354>
              sscc:
                type: string
                description: SSCC-18 of the carton.
                x-parser-schema-id: <anonymous-schema-355>
              parent_sscc:
                type: string
                description: SSCC of the pallet it arrived on, when palletised.
                x-parser-schema-id: <anonymous-schema-356>
              sealed:
                type: boolean
                description: Only a sealed carton gets a Container.
                x-parser-schema-id: <anonymous-schema-357>
              lpn:
                type: string
                description: >-
                  The license plate - the SSCC, or an internal `LPN-<site>-<id>`
                  for an unlabelled carton. Absent falls back to `sscc`.
                x-parser-schema-id: <anonymous-schema-358>
              owner_ref:
                type: string
                maxLength: 64
                description: Owner of the stock; absent means fleet-owned.
                x-parser-schema-id: <anonymous-schema-359>
              contents:
                type: array
                minItems: 1
                description: >-
                  More than one content line is a mixed carton and gets no
                  Container.
                items:
                  type: object
                  required:
                    - line_no
                    - sku
                    - gtin
                    - qty
                  properties:
                    line_no:
                      type: integer
                      minimum: 1
                      x-parser-schema-id: <anonymous-schema-362>
                    sku:
                      type: string
                      x-parser-schema-id: <anonymous-schema-363>
                    gtin:
                      type: string
                      description: >-
                        GTIN-14 of the case; must be known to the PackagingView
                        and belong to `sku`.
                      x-parser-schema-id: <anonymous-schema-364>
                    qty:
                      type: integer
                      minimum: 1
                      description: >-
                        Eaches in the carton; must equal the case's units per
                        pack.
                      x-parser-schema-id: <anonymous-schema-365>
                    lot:
                      type: string
                      x-parser-schema-id: <anonymous-schema-366>
                    expiry:
                      type: string
                      description: YYYY-MM-DD.
                      x-parser-schema-id: <anonymous-schema-367>
                    condition:
                      type: string
                      enum:
                        - Good
                        - Damaged
                      description: Only Good gets a Container.
                      x-parser-schema-id: <anonymous-schema-368>
                  x-parser-schema-id: <anonymous-schema-361>
                x-parser-schema-id: <anonymous-schema-360>
              received_at:
                type: string
                format: date-time
                x-parser-schema-id: <anonymous-schema-369>
            x-parser-schema-id: <anonymous-schema-352>
        x-parser-schema-id: InboundReceivingReceiptCartonReceivedEvent
      examples:
        - name: sealedCase
          summary: One sealed case of 12 eaches of SKU-1.
          payload:
            specversion: '1.0'
            id: 8e2f4a6b-1c3d-4e5f-9a7b-0c1d2e3f4a5b
            source: /warehouse/inbound-receiving
            type: com.warehouse.wms.inbound-receiving.receipt.ReceiptCartonReceived
            subject: rcpt-223e4567-e89b-12d3-a456-426614174000
            time: '2026-10-24T11:50:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:inbound-receiving:events:ReceiptCartonReceived:v1
            data:
              receipt_id: rcpt-223e4567-e89b-12d3-a456-426614174000
              asn_number: ASN-1001
              sscc: '003400000000000017'
              parent_sscc: '003400000000000999'
              sealed: true
              lpn: '003400000000000017'
              owner_ref: seller-a
              contents:
                - line_no: 1
                  sku: SKU-1
                  gtin: '24006381333935'
                  qty: 12
                  lot: L1
                  expiry: '2027-03-01'
                  condition: Good
              received_at: '2026-10-24T11:50:00Z'
      messageId: InboundReceivingReceiptCartonReceived
