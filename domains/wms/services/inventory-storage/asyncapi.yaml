    BinStockLevelChanged:
      name: BinStockLevelChanged
      title: Bin Stock Level Changed
      summary: >-
        The absolute stock level of one SKU in one bin after a ledger change —
        on hand, reserved, and a per-(bin, sku) version.
      description: >-
        Raised from the SAME transaction as every ledger change that moves the
        level of a SKU in a bin (ADR 0040), through the transactional outbox:
        stow and transfer stow (`STOW`), a confirmed pick (`PICK`), a relocation
        or RELOCATE task (`RELOCATE`: two events, the source bin then the
        destination bin), a cycle-count shortfall (`COUNT`), a reservation or
        transfer allocation (`RESERVE`), and a revoked or expired reservation
        (`REVOKE`). One event per distinct (bin, sku) per transaction, carrying
        the FINAL level after the whole transaction: an order whose lines pick
        the same (bin, sku) raises it once. Nothing is raised when the level did
        not change (idempotent replays, rejected commands).


        `on_hand` and `reserved` are ABSOLUTE levels after the change, never
        deltas. `on_hand` is the quantity physically in the bin as the ledger
        sees it (located, still-present units: units a cycle count marked
        unlocated, and fully picked-out units, are not counted); `reserved` is
        the part of it bound to active reservations, so `on_hand - reserved` is
        what a new reservation could still draw from the bin. `version` is the
        persisted per-(bin, sku) counter, strictly increasing and gapless across
        restarts and concurrent changes: a consumer keeps the highest version it
        has seen for a (bin, sku) and ignores any lower one.


        `reason` is `STOW`, `PICK`, `RELOCATE`, `REPLENISHMENT`, `COUNT`,
        `RESERVE`, `REVOKE` or `UNLOCATED`; consumers ignore values they do not
        know. `REPLENISHMENT` is the reason of a relocation made by a completed
        REPLENISH task (ADR 0041: two events, the source bin then the
        destination bin, like RELOCATE), and `UNLOCATED` is reserved for an
        unlocated receive with a bin: it is not emitted today (a receive names
        no bin). A bin whose site cannot be determined (not registered, or
        neither a recorded site custody nor a facility-layout location code)
        raises no event. Stock owned by a seller (ADR 0045) has its own level
        per owner: the optional `owner_ref` names it and the `version` counter
        is per (bin, sku, owner); a consumer that ignores `owner_ref` sees
        interleaved levels, so it should key on (bin, sku, owner_ref).


        **Integration topic only** (no analytics variant). Kafka key and
        CloudEvents `subject` are `<bin>:<sku>`, so every level of one pair
        lands on one partition in version order (ADR 0021).
        pick-face-replenishment consumes it to detect a forward pick slot below
        its minimum.
