        record — the mirror of `inbound-receipt-line`) in the SAME transaction
        as the existing ReceiveStock use case — the SAME staged-receipt seam an
        inbound receipt line and `POST /stock/receive` drive — which raises
        `StockReceived` through the outbox (analytics topic): the units are
        staged and not yet usable, and stow stays the RF action (item scan plus
        location scan). Return context (`receipt_id`, `rma_id`,
        `disposition_id`, `site_id`, `received_at`) is logged, never stored on
        the stock event. A redelivered `id` is a no-op. A transient failure
        retries the same message with capped backoff; a message that is not a
        valid CloudEvent, has an undecodable payload, an empty `sku`, a
        non-positive `quantity`, an empty `disposition_id` or a `condition`
        other than the constant `Good` is logged (WARN) and committed past.
      tags:
        - name: returns-processing
          description: Consumed from the returns-processing bounded context.
      message:
        name: ReturnsProcessingReturnLineStaged
        title: Return Line Staged (from returns-processing, consumed)
