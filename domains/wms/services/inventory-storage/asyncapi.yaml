          - name: DiscrepancyDetected
            title: Discrepancy Detected
            summary: A cycle count found system records did not match physical reality.
            description: >
              Raised by the RunCycleCount use case when the counted quantity
              differs from the system quantity for a bin, before reconciliation
              is applied. A shortfall additionally produces ItemUnlocated events
              for the quantity that could not be found.


              **Published to both topics** (promoted to the integration topic
              2026-10-21, ADR 0043, for exception-management). Subject = Kafka
