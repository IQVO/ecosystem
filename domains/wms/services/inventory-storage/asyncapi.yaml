          `apis/asyncapi.yaml`: type
          `com.warehouse.wms.returns-processing.disposition.ReturnLineStaged`,
          `source=/warehouse/returns-processing`, subject and Kafka key = the
          disposition id. `data` is inbound-receiving's ReceiptLineReceived
          fields plus `rma_id`, `disposition_id` and `site_id`: `{receipt_id,
          line_no, sku, quantity, condition, received_at, rma_id,
