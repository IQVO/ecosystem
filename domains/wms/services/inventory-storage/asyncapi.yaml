        oneOf:
          - name: InboundReceivingReceiptLineReceived
            title: Receipt Line Received (from inbound-receiving, consumed)
            summary: >-
              A quantity was received against an ASN line at the dock; Good
              units are booked as staged stock here.
            description: >
              CONSUMED, not produced (ADR 0037). Pinned by inbound-receiving's
              `apis/asyncapi.yaml` (the handover event of its ADR 0003): type
              `com.warehouse.wms.inbound-receiving.receipt.ReceiptLineReceived`,
              `source=/warehouse/inbound-receiving`, subject = the receipt id,
              Kafka key = the ASN number. `data` is snake_case: `{receipt_id,
              asn_number, line_no, sku, quantity, condition, received_at}` with
