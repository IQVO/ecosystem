              transfer line.
            description: >-
              Raised by the StageTransferReceipt use case (ADR 0033, destination
              receipt custody — POST /transfers/\{transferLineId\}/receipt). The
              transfer_line_id was found in the transfer_allocations ledger with
              outcome ALLOCATED: a transfer_receipts row (state STAGED,
              DB-unique on transfer_line_id) now records expected_quantity from
              the ledger, received_quantity as counted, and the SIGNED variance
              (received - expected; positive = over, negative = short).
              Over/short is explicit on the wire, never silently absorbed.


              NO usable stock moves at this step — the destination site's usable
              rises only when the stow completes (TransferStockStowed). An
              unrecognized scan is NOT this event: it is quarantined as an
              inventory_exceptions row and publishes nothing that raises
              availability.


