    FulfillmentTaskCompleted:
      name: FulfillmentTaskCompleted
      title: Task Completed (from fulfillment-execution, consumed)
      summary: >-
        A station finished a claimed task; a PICK task makes this service
        confirm the picked line's reservation (or, without a line, the order's
        on its last pick).
      description: >
        CONSUMED, not produced (ADR 0035, ADR 0036). Pinned by
        fulfillment-execution's `apis/asyncapi.yaml`: type
        `com.warehouse.wes.fulfillment-execution.task.TaskCompleted`,
        `source=/warehouse/fulfillment-execution`, subject and Kafka key = task
        id. This service reads only `task_id`, `task_type`, `order_ref`,
        `line_no` and, on RELOCATE and REPLENISH tasks, `sku`, `from_bin`,
        `to_bin`, `quantity` and `relocation_ref` (RELOCATE) or `request_ref`
        (REPLENISH); every other field (`station_id`, `work_unit_id`,
        `associate_id`, `duration_seconds`) is ignored. `order_ref` is the
        additive optional field of ADR 0035 (v1, omitted when empty): the task's
        order reference, i.e. the OrderId order-management used as `demand_ref`.
        `line_no` is the additive optional field of ADR 0036 (v1, omitted when
        unknown): the order line the task was for. A message without
        `order_ref`, or with any `task_type` other than `PICK`, `RELOCATE` or
        `REPLENISH`, is a successful no-op; one without `line_no` takes the ADR
        0035 counting path. The RELOCATE fields are the additive fields of ADR
        0039 (decision E1, v1): fulfillment-execution sends them on RELOCATE
        tasks only, and a RELOCATE completion is applied as an intra-site move
        (`StockRelocated`). `request_ref` is the additive field of ADR 0041
        (v1): REPLENISH tasks only, the replenishment request id, required on a
        REPLENISH completion; such a completion is applied as an intra-site move
        with reason `REPLENISHMENT`.
      contentType: application/cloudevents+json
      tags:
        - name: fulfillment-execution
          description: Consumed from fulfillment-execution.
      payload:
        type: object
        description: >
          CloudEvents 1.0 envelope of fulfillment-execution's TaskCompleted v1
          as consumed here (not composed from CloudEventBase, whose `source` is
          this service's own). Only the fields this service reads are listed
          under `data`; the producer sends more.
        required:
          - specversion
          - id
          - source
          - type
          - subject
          - time
          - datacontenttype
          - data
        properties:
          specversion:
            type: string
            enum:
              - '1.0'
            x-parser-schema-id: <anonymous-schema-305>
          id:
            type: string
            description: >-
              CloudEvents id; the dedupe key (claimed in processed_events under
              consumer `task-completed-confirm-pick`, `task-completed-relocate`
              for RELOCATE tasks, or `task-completed-replenish` for REPLENISH
              tasks).
            x-parser-schema-id: <anonymous-schema-306>
          source:
            type: string
            enum:
              - /warehouse/fulfillment-execution
            x-parser-schema-id: <anonymous-schema-307>
          type:
            type: string
            const: com.warehouse.wes.fulfillment-execution.task.TaskCompleted
            x-parser-schema-id: <anonymous-schema-308>
          subject:
            type: string
            description: The task id (also the Kafka key).
            x-parser-schema-id: <anonymous-schema-309>
          time:
            type: string
            format: date-time
            x-parser-schema-id: <anonymous-schema-310>
          datacontenttype:
            type: string
            enum:
              - application/json
            x-parser-schema-id: <anonymous-schema-311>
          dataschema:
            type: string
            description: urn:warehouse:fulfillment-execution:events:TaskCompleted:v1
            x-parser-schema-id: <anonymous-schema-312>
          data:
            type: object
            required:
              - task_id
            properties:
              task_id:
                type: string
                x-parser-schema-id: <anonymous-schema-314>
              task_type:
                type: string
                enum:
                  - PICK
                  - PACK
                  - SLAM
                  - REBIN
                  - DISPATCH
                  - ARRIVAL
                  - RELOCATE
                  - REPLENISH
                description: >-
                  PICK, RELOCATE and REPLENISH are acted on; omitted by the
                  producer when the task could not be found.
                x-parser-schema-id: <anonymous-schema-315>
              order_ref:
                type: string
                description: >
                  The completed task's order reference = the OrderId
                  order-management reserved against (this service's reservation
                  `demand_ref`). Every PICK task of an order (one per order
                  line) carries the same value. Additive and optional (ADR
                  0035): omitted when empty, in which case nothing is counted or
                  confirmed.
                x-parser-schema-id: <anonymous-schema-316>
              line_no:
                type: integer
                minimum: 1
                maximum: 2147483647
                description: >
                  The order line this task was for (the `line_no` the
                  reservation of that line was made with). Additive and optional
                  (ADR 0036): omitted when unknown. When present, exactly the
                  ACTIVE reservation(s) of (`order_ref`, `line_no`) are
                  confirmed and nothing is counted; when absent the ADR 0035
                  last-pick counting applies. A value outside 1..2147483647 (the
                  32-bit line_no column) or a non-integer is a malformed payload
                  (dead-lettered).
                x-parser-schema-id: <anonymous-schema-317>
              sku:
                type: string
                description: >
                  RELOCATE and REPLENISH only (additive, ADR 0039, ADR 0041):
                  the SKU moved. Required on a RELOCATE or REPLENISH completion
                  (missing or invalid = dead-lettered); absent on every other
                  task type.
                x-parser-schema-id: <anonymous-schema-318>
              from_bin:
                type: string
                description: >
                  RELOCATE and REPLENISH only (additive): the source bin's
                  location code; its site is the move's site.
                x-parser-schema-id: <anonymous-schema-319>
              to_bin:
                type: string
                description: >
                  RELOCATE and REPLENISH only (additive): the destination bin's
                  location code; must be a different bin of the same site.
                x-parser-schema-id: <anonymous-schema-320>
              quantity:
                type: integer
                minimum: 1
                description: >
                  RELOCATE and REPLENISH only (additive): the units moved.
                  Missing, zero or negative on a RELOCATE or REPLENISH
                  completion = dead-lettered.
                x-parser-schema-id: <anonymous-schema-321>
              relocation_ref:
                type: string
                maxLength: 200
                description: >
                  RELOCATE only (additive, ADR 0039, optional): the slot-plan
                  move the task executes; stored as the relocation's source_ref
                  (the task id is used when absent).
                x-parser-schema-id: <anonymous-schema-322>
              request_ref:
                type: string
                maxLength: 200
                description: >
                  REPLENISH only (additive, ADR 0041, REQUIRED): the pick-face
                  replenishment request id; stored as the relocation's
                  source_ref (reason REPLENISHMENT) and echoed in
                  StockRelocated. Missing or blank = dead-lettered; there is no
                  task-id fallback.
                x-parser-schema-id: <anonymous-schema-323>
            x-parser-schema-id: <anonymous-schema-313>
        x-parser-schema-id: FulfillmentTaskCompletedEvent
      examples:
        - name: pickTaskCompletedForLine
