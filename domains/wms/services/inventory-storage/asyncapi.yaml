asyncapi: 2.6.0
info:
  title: Inventory & Storage Domain Events
  version: 1.0.0
  description: >
    Domain-event catalog for the **inventory-storage** bounded context, the
    WMS-tier authoritative record of what is held where, and what portion of it
    is usable. This context implements chaotic (random) stow: there is no fixed
    product location — an inbound item may be stowed into any free bin, and this
    service records the exact bin it landed in. It supplies "stock reality" to
    the Work Planning bounded context (wes-work-planning) and makes allocation a
    *revocable* reservation, so a failed physical pick never strands an order.


    **Envelope.** Every message on this channel is a CloudEvents 1.0
    *structured-mode* JSON document with content type
    `application/cloudevents+json`. The CloudEvents context attributes carry
    routing and identity (`specversion`, `id`, `source`, `type`, `subject`,
    `time`, `datacontenttype`); the business payload lives entirely under
    `data`. `source` is always `/warehouse/inventory-storage`, and `subject` is
    the id of the aggregate instance the event is about (a reservation id, a
    stock unit id, or a bin id).


    **The `type` attribute** follows the platform-wide reverse-DNS convention
    `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>` — all
    lowercase except the final PascalCase event name. For this context the
    subdomain is `wms` (Warehouse Management System, a core subdomain) and the
    bounded context is `inventory-storage`, so for example a stow produces
    `com.warehouse.wms.inventory-storage.stock.ItemStowed` and a revoked
    allocation produces
    `com.warehouse.wms.inventory-storage.reservation.ReservationRevoked`.


    **Aggregates and entity groupings.** Three aggregates raise every event
    documented here. The **StockUnit** aggregate (entity segment `stock`) raises
    `StockReceived`, `ItemStowed`, `LocationRecorded` and `ItemUnlocated`. The
    **Reservation** aggregate (entity segment `reservation`) raises
    `StockReserved`, `ReservationExpired`, `ReservationRevoked` and
    `StockPicked` — `StockPicked` is grouped with the reservation because it is
    emitted by ConfirmPick when a reservation is consumed, and reservation id is
    the only identity it carries. The **Bin/Location** aggregate (entity segment
    `bin`) raises `CycleCountCompleted` and `DiscrepancyDetected`.


    **What reaches Kafka.** This document is the complete domain-event catalog
    for the bounded context. Two topics carry a subset of it:
    `warehouse.inventory.events` (the integration contract — `StockReserved`,
    `ReservationRevoked`, the transfer replies, the transfer receipt/stow
    events, `BinStockLevelChanged` (the per-bin absolute level feed, ADR 0040),
    and the promoted exception facts `DiscrepancyDetected`, `ItemUnlocated` and
    `ItemStowed` (ADR 0043 — byte-identical copies of the analytics feed), from
    `internal/adapters/outbound/kafka/publisher.go`) and
    `warehouse.inventory.analytics` (the analytics data product — every message
    below except `LocationRecorded`, from
    `internal/adapters/outbound/kafka/analytics_publisher.go`). Each message
    says which topics it reaches. `LocationRecorded` is in-process only (no
    consumer; decided 2026-10-06). Product-master owns product classification
    (ADR 0034); the legacy `ProductClassified` and the one-shot
    `republish-product-classifications` backfill that re-emitted it were removed
    at product-master ADR 0003 stage E (2026-10-17).


    **Consumed.** This service also consumes product-master's
    `warehouse.product-master.events` (channel below, ADR 0034) into a local
    copy of every SKU's classification that StowStock reads. Applying it raises
    no event here. It also consumes fulfillment-execution's `TaskCompleted` from
    `warehouse.fulfillment.events` (channel below, ADR 0035) to confirm a
    completed order's reservations as picked once the order's LAST PICK task
    completes (one PICK task per order line, counted per order); that raises
    this service's own `StockPicked` (analytics topic) per reservation. And it
    consumes inbound-receiving's `ReceiptLineReceived` from
    `warehouse.inbound-receiving.events` (channel below, ADR 0037): a line with
    `condition=Good` is booked as a staged receipt through the existing
    ReceiveStock use case (the same `StockReceived` as `POST /stock/receive`,
    analytics topic; quantity staged, stow stays the RF action); `Damaged` is
    not booked in v1. And it consumes returns-processing's `ReturnLineStaged`
    from `warehouse.returns-processing.events` (channel below, ADR 0044): the
    RESTOCK disposition's handover is booked through the SAME ReceiveStock seam
    as a receipt line (same `StockReceived`, analytics topic; quantity staged,
    stow stays the RF action).


    **CloudEvents is mandatory (ADR-0024).** Every message on both topics is
    exactly the CloudEvents 1.0 structured-mode event documented here — all of
    `specversion`, `id`, `source`, `type`, `subject`, `time`, `datacontenttype`
    and `dataschema` are required — and every Kafka message carries the header
    `content-type: application/cloudevents+json; charset=UTF-8`. The same `type`
    names an occurrence on both topics; `dataschema`
    (`urn:warehouse:inventory-storage:<events|analytics>:<EventName>:v1`) names
    the payload shape. Each schema's `data` is the exact wire payload;
    `StockReserved` and `ReservationRevoked`, which reach both topics, give one
    `data` shape per `dataschema`. There is no other envelope.
  contact:
    name: Warehouse Systems Platform Team
    url: https://github.com/claudioed/inventory-storage
    email: claudioed.oliveira@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: inventory-storage
    description: >
      The inventory-storage bounded context (wms subdomain) — the authoritative
      record of what stock is held in which bin, and how much of it is usable.
  - name: stock
    description: >
      Events raised by the StockUnit aggregate: a quantity of a SKU at a
      specific bin, its receipt, its stow, and its loss.
  - name: reservation
    description: >
      Events raised by the Reservation aggregate: the revocable binding of a
      quantity to demand, its timeout, its revocation, and its consumption.
  - name: bin
    description: >
      Events raised by the Bin/Location aggregate: cycle counts verifying a
      bin's contents and the discrepancies they reveal.
  - name: product
    description: >
      Events about SKU-level handling master data (hazmat, fragile, temperature,
      ...). Owned by product-master since ADR 0034; this service consumes
      product-master's own events.
  - name: product-master
    description: >
      Events consumed from the product-master bounded context (wms subdomain),
      the owner of SKU master data (ADR 0034).
  - name: fulfillment-execution
    description: >
      Events consumed from the fulfillment-execution bounded context (wes
      subdomain): TaskCompleted, from which picks are confirmed (ADR 0035).
  - name: inbound-receiving
    description: >
      Events consumed from the inbound-receiving bounded context (wms
      subdomain): ReceiptLineReceived, from which Good lines are booked as
      staged stock (ADR 0037).
  - name: returns-processing
    description: >
      Events consumed from the returns-processing bounded context (wms
      subdomain): ReturnLineStaged, from which restocked return lines are booked
      as staged stock (ADR 0044).
servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: >
      The shared warehouse-systems Kafka broker. Locally this is the broker
      started by `~/warehouse-systems/docker-compose.kafka.yml`, addressed via
      the `KAFKA_BROKERS` environment variable (required, no default). Events
      always leave through the transactional outbox and its relay (ADR 0042);
      there is no log publisher.
defaultContentType: application/cloudevents+json
channels:
  warehouse.inventory.events:
    description: >
      The outbound integration topic for this bounded context (the `Topic`
      constant in `internal/adapters/outbound/kafka/publisher.go`). Reaching it:
      `StockReserved` and `ReservationRevoked` (keyed by reservation id), the
      transfer replies and receipt/stow events (keyed by transfer line id),
      `StockRelocated` (keyed by relocation id, ADR 0039),
      `BinStockLevelChanged` (keyed by `<bin>:<sku>`, ADR 0040) and the promoted
      exception facts `DiscrepancyDetected`, `ItemUnlocated` and `ItemStowed`
      (ADR 0043 — byte-identical copies of the analytics feed, consumed by
      exception-management and returns-processing) and the container events
      `ContainerRegistered`, `ContainerStowed`, `CaseBroken` and
      `ContainerEmptied` (keyed by LPN, ADR 0045/0046). The legacy
      `ProductClassified` was retired at product-master ADR 0003 stage E
      (2026-10-17). The primary downstream consumer is wes-work-planning, which
      dispatches on their full `type` strings and projects them into its
      `UsableInventoryObserved` read model, keyed by SKU.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: consumeInventoryStorageEvents
      summary: Consume inventory-storage domain events.
      description: >
        Subscribe to the domain events raised by the inventory-storage bounded
        context. Messages are CloudEvents 1.0 structured-mode JSON; discriminate
        on the FULL `type` context attribute, which is fixed per message via a
        const in the schemas below, and dedupe on `id`. Consumers must ignore
        unknown `type` values (forward compatibility).
      tags:
        - name: inventory-storage
          description: Events emitted by the inventory-storage bounded context.
      message:
        oneOf:
          - name: StockReserved
            title: Stock Reserved
            summary: A quantity was revocably bound to demand.
            description: >
              Raised by the ReserveStock use case when a reservation is
              successfully created against *usable* inventory (on-hand minus
              active reservations minus held/unlocated stock). The binding is
              revocable and carries a timeout, so a physical failure downstream
              never strands the demand.


              **Published to both topics.** On `warehouse.inventory.events`
              (dataschema
              `urn:warehouse:inventory-storage:events:StockReserved:v1`) the
              `data` payload is the adapter's `reservationData` shape — `sku`,
              `quantity`, `demand_ref` — and the reservation id is the
              CloudEvents `subject` and the Kafka key. wes-work-planning
              consumes this exact `type` to update its `UsableInventoryObserved`
              read model by SKU. On `warehouse.inventory.analytics` (dataschema
              `...:analytics:StockReserved:v1`, Kafka key = reservation id — ADR
              0021) `data` is `{sku, reservation_id, quantity}`.
            contentType: application/cloudevents+json
            tags:
              - name: reservation
                description: Raised by the Reservation aggregate.
            payload:
              description: >
                CloudEvents envelope for a StockReserved domain event, on both
                topics; `dataschema` selects the `data` shape.
              allOf:
                - type: object
                  description: >
                    The CloudEvents 1.0 context attributes shared by every
                    message this bounded context emits, in structured-mode JSON.
                    Each concrete event schema composes this with `allOf` and
                    pins `type` to a single value.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      description: CloudEvents specification version. Always "1.0".
                      enum:
                        - '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      description: >
                        Unique identifier for this event occurrence, a UUID v4.
                        Together with `source` it uniquely identifies the event,
                        which is what consumers deduplicate on.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      description: >
                        The context that emitted the event. Always
                        `/warehouse/inventory-storage` for this service.
                      enum:
                        - /warehouse/inventory-storage
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      description: >
                        Reverse-DNS event type, of the form
                        `com.warehouse.wms.inventory-storage.<entity>.<EventName>`.
                        Pinned to a single value by each concrete event schema.
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >
                        The id of the aggregate instance this event is about — a
                        reservation id, a StockUnit id, a bin id, or a SKU,
                        depending on the event. Never empty.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      description: >
                        RFC 3339 timestamp of when the event occurred in the
                        domain, taken from the injected Clock port, not from
                        wall-clock time at publish.
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      description: >-
                        Media type of the `data` member. Always
                        application/json.
                      enum:
                        - application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      format: uri
                      description: >
                        Absolute URI naming the payload shape and version:
                        `urn:warehouse:inventory-storage:<events|analytics>:<EventName>:v<N>`.
                        Pinned per message by each concrete event schema (the
                        `events` variant for StockReserved/ReservationRevoked,
                        `analytics` for the rest; StockReserved and
                        ReservationRevoked also appear on the analytics topic
                        with the `analytics` variant).
                      pattern: >-
                        ^urn:warehouse:inventory-storage:(events|analytics):[A-Za-z]+:v[0-9]+$
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      description: The event payload. Shape is fixed by `dataschema`.
                      x-parser-schema-id: <anonymous-schema-9>
                  x-parser-schema-id: CloudEventBase
                - type: object
                  required:
                    - type
                    - data
                  properties:
                    type:
                      type: string
                      description: Fixed event type for StockReserved.
                      const: >-
                        com.warehouse.wms.inventory-storage.reservation.StockReserved
                      x-parser-schema-id: <anonymous-schema-11>
                    dataschema:
                      type: string
                      description: >-
                        urn:warehouse:inventory-storage:events:StockReserved:v1
                        on the integration topic, ...:analytics:StockReserved:v1
                        on the analytics topic.
                      pattern: >-
                        ^urn:warehouse:inventory-storage:(events|analytics):StockReserved:v1$
                      x-parser-schema-id: <anonymous-schema-12>
                    data:
                      description: >
                        One shape per dataschema: the integration payload on
                        warehouse.inventory.events, the analytics payload on
                        warehouse.inventory.analytics.
                      oneOf:
                        - type: object
                          description: >
                            Business payload for StockReserved, matching the
                            adapter's `reservationData` struct field-for-field.
                          required:
                            - sku
                            - quantity
                            - demand_ref
                          properties:
                            sku:
                              type: string
                              description: >-
                                The stock keeping unit the quantity was reserved
                                against.
                              x-parser-schema-id: <anonymous-schema-15>
                            quantity:
                              type: integer
                              minimum: 1
                              description: >
                                Quantity bound to the demand. Never exceeds
                                usable inventory for the SKU at reserve time.
                              x-parser-schema-id: <anonymous-schema-16>
                            demand_ref:
                              type: string
                              description: >
                                Opaque reference to the demand this reservation
                                serves, supplied by the caller — typically an
                                order or shipment id.
                              x-parser-schema-id: <anonymous-schema-17>
                          x-parser-schema-id: <anonymous-schema-14>
                        - type: object
                          title: analytics
                          description: >-
                            Analytics payload (dataschema
                            ...:analytics:StockReserved:v1).
                          required:
                            - sku
                            - reservation_id
                            - quantity
                          properties:
                            sku:
                              type: string
                              x-parser-schema-id: <anonymous-schema-19>
                            reservation_id:
                              type: string
                              x-parser-schema-id: <anonymous-schema-20>
                            quantity:
                              type: integer
                              minimum: 1
                              x-parser-schema-id: <anonymous-schema-21>
                          x-parser-schema-id: <anonymous-schema-18>
                      x-parser-schema-id: <anonymous-schema-13>
                  x-parser-schema-id: <anonymous-schema-10>
              x-parser-schema-id: StockReservedEvent
            examples:
              - name: reservedForOrder42
                summary: Five units of SKU-1 reserved for demand reference order-42.
                payload:
                  specversion: '1.0'
                  id: 1f7a4c30-9b2d-4e85-a6c1-7d3f0b5e8a94
                  source: /warehouse/inventory-storage
                  type: >-
                    com.warehouse.wms.inventory-storage.reservation.StockReserved
                  subject: res-1
                  time: '2026-08-21T22:00:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:inventory-storage:events:StockReserved:v1
                  data:
                    sku: SKU-1
                    quantity: 5
                    demand_ref: order-42
            messageId: StockReserved
          - name: ReservationRevoked
            title: Reservation Revoked
            summary: A reservation was cancelled and its quantity returned to usable.
            description: >
              Raised by the RevokeReservation use case. Revocation is the
              mechanism that keeps a physical failure — a blocked pod, a lost
              tote, a chute jam, a short pick — from stranding an order: the
              quantity goes back to usable and the demand can be re-allocated
              against a different holding.


              **Published to both topics.** On `warehouse.inventory.events`
              (dataschema
              `urn:warehouse:inventory-storage:events:ReservationRevoked:v1`)
              the domain event carries only the reservation id, so the adapter
              enriches it through `ports.ReservationRepo` and emits the same
              `sku` / `quantity` / `demand_ref` shape as StockReserved; if the
              lookup finds nothing the publish fails rather than emitting a
              partial payload. The reservation id is the `subject` and the Kafka
              key. wes-work-planning consumes this exact `type`. On
              `warehouse.inventory.analytics` `data` is `{reservation_id, sku}`.
            contentType: application/cloudevents+json
            tags:
              - name: reservation
                description: Raised by the Reservation aggregate.
            payload:
              description: >
                CloudEvents envelope for a ReservationRevoked domain event. The
                `data` member is enriched by the outbound Kafka adapter, which
                looks the reservation up through ports.ReservationRepo because
                the domain event carries only the reservation id.
              allOf:
                - type: object
                  description: >
                    The CloudEvents 1.0 context attributes shared by every
                    message this bounded context emits, in structured-mode JSON.
                    Each concrete event schema composes this with `allOf` and
                    pins `type` to a single value.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      description: CloudEvents specification version. Always "1.0".
                      enum:
                        - '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      description: >
                        Unique identifier for this event occurrence, a UUID v4.
                        Together with `source` it uniquely identifies the event,
                        which is what consumers deduplicate on.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      description: >
                        The context that emitted the event. Always
                        `/warehouse/inventory-storage` for this service.
                      enum:
                        - /warehouse/inventory-storage
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      description: >
                        Reverse-DNS event type, of the form
                        `com.warehouse.wms.inventory-storage.<entity>.<EventName>`.
                        Pinned to a single value by each concrete event schema.
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >
                        The id of the aggregate instance this event is about — a
                        reservation id, a StockUnit id, a bin id, or a SKU,
                        depending on the event. Never empty.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      description: >
                        RFC 3339 timestamp of when the event occurred in the
                        domain, taken from the injected Clock port, not from
                        wall-clock time at publish.
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      description: >-
                        Media type of the `data` member. Always
                        application/json.
                      enum:
                        - application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      format: uri
                      description: >
                        Absolute URI naming the payload shape and version:
                        `urn:warehouse:inventory-storage:<events|analytics>:<EventName>:v<N>`.
                        Pinned per message by each concrete event schema (the
                        `events` variant for StockReserved/ReservationRevoked,
                        `analytics` for the rest; StockReserved and
                        ReservationRevoked also appear on the analytics topic
                        with the `analytics` variant).
                      pattern: >-
                        ^urn:warehouse:inventory-storage:(events|analytics):[A-Za-z]+:v[0-9]+$
                      x-parser-schema-id: <anonymous-schema-8>
                    data:
                      type: object
                      description: The event payload. Shape is fixed by `dataschema`.
                      x-parser-schema-id: <anonymous-schema-9>
                  x-parser-schema-id: CloudEventBase
                - type: object
                  required:
                    - type
                    - data
                  properties:
                    type:
                      type: string
                      description: Fixed event type for ReservationRevoked.
                      const: >-
                        com.warehouse.wms.inventory-storage.reservation.ReservationRevoked
                      x-parser-schema-id: <anonymous-schema-23>
                    dataschema:
                      type: string
                      description: >-
                        urn:warehouse:inventory-storage:events:ReservationRevoked:v1
                        on the integration topic,
                        ...:analytics:ReservationRevoked:v1 on the analytics
                        topic.
                      pattern: >-
                        ^urn:warehouse:inventory-storage:(events|analytics):ReservationRevoked:v1$
                      x-parser-schema-id: <anonymous-schema-24>
                    data:
                      description: >
                        One shape per dataschema: the integration payload on
                        warehouse.inventory.events, the analytics payload on
                        warehouse.inventory.analytics.
                      oneOf:
                        - type: object
                          description: >
                            Business payload for ReservationRevoked, identical
                            in shape to StockReserved so downstream projections
                            can apply both with one handler.
                          required:
                            - sku
                            - quantity
                            - demand_ref
                          properties:
                            sku:
                              type: string
                              description: >-
                                The stock keeping unit whose quantity returns to
                                usable.
                              x-parser-schema-id: <anonymous-schema-27>
                            quantity:
                              type: integer
                              minimum: 1
                              description: Quantity released back into usable inventory.
                              x-parser-schema-id: <anonymous-schema-28>
                            demand_ref:
                              type: string
                              description: >
                                The demand reference the revoked reservation was
                                serving, so the consumer can re-allocate it
                                elsewhere.
                              x-parser-schema-id: <anonymous-schema-29>
                          x-parser-schema-id: <anonymous-schema-26>
                        - type: object
                          title: analytics
                          description: >-
                            Analytics payload (dataschema
                            ...:analytics:ReservationRevoked:v1).
                          required:
                            - reservation_id
                            - sku
                          properties:
                            reservation_id:
                              type: string
                              x-parser-schema-id: <anonymous-schema-31>
                            sku:
                              type: string
                              description: >-
                                Enriched via ports.ReservationRepo; empty if not
                                found.
                              x-parser-schema-id: <anonymous-schema-32>
                          x-parser-schema-id: <anonymous-schema-30>
                      x-parser-schema-id: <anonymous-schema-25>
                  x-parser-schema-id: <anonymous-schema-22>
              x-parser-schema-id: ReservationRevokedEvent
            examples:
              - name: revokedAfterShortPick
                summary: >-
                  Reservation res-1 revoked, returning five units of SKU-1 to
                  usable.
                payload:
                  specversion: '1.0'
                  id: 4b9e2f61-7c3a-4d08-85e2-1a6f9c0d3b72
                  source: /warehouse/inventory-storage
                  type: >-
                    com.warehouse.wms.inventory-storage.reservation.ReservationRevoked
                  subject: res-1
                  time: '2026-08-21T22:10:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:inventory-storage:events:ReservationRevoked:v1
                  data:
                    sku: SKU-1
                    quantity: 5
                    demand_ref: order-42
            messageId: ReservationRevoked
          - name: TransferStockAllocated
            title: Transfer Stock Allocated
            summary: Origin-site stock was reserved for a network transfer line.
            description: >
              Raised by the AllocateTransferStock use case when a transfer
              allocation command from network-inventory-planning
              (com.warehouse.wes.network-inventory-planning.transfer.TransferAllocationRequested
              on warehouse.network-inventory-planning.events) was satisfied:
              usable stock in the ORIGIN SITE's custody was drawn and a
              revocable Reservation now holds it, correlated to the transfer
              line via the transfer_allocations ledger (one row per
              transfer_line_id, DB-unique — replays return this same event's
              original outcome without re-deciding).


              **Integration topic only** (no analytics variant: the Inventory
              Flow & Accuracy projection has no transfer dimension). Kafka key
              and CloudEvents `subject` are the reservation id, so a transfer's
              replies stay per-reservation ordered (ADR 0021).
            contentType: application/cloudevents+json
            tags:
              - name: reservation
                description: Raised on the Reservation aggregate's stock-holding path.
            payload:
              description: CloudEvents envelope for a TransferStockAllocated domain event.
              allOf:
                - type: object
                  description: >
                    The CloudEvents 1.0 context attributes shared by every
                    message this bounded context emits, in structured-mode JSON.
                    Each concrete event schema composes this with `allOf` and
                    pins `type` to a single value.
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
