asyncapi: 2.6.0
info:
  title: outbound-shipping Domain Events
  version: 1.0.0
  contact:
    name: outbound-shipping maintainers
    url: https://github.com/IQVO/outbound-shipping
    email: outbound-shipping@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event contract for the **outbound-shipping** bounded context (WMS

    subdomain): staging, the outbound load, ship-confirm on the trailer's

    physical departure, and the bill of lading (ADR 0001, ADR 0002, ADR

    0005).


    **Published.** Three aggregates raise thirteen events, published to

    `warehouse.outbound-shipping.events` through a **transactional outbox**:

    the aggregate row and its already-encoded events are written in ONE

    database transaction and a relay drains them to Kafka (at-least-once; the

    CloudEvents `id` is stored with the outbox row, so a retry republishes

    the same `id`). Every payload carries the aggregate `version` AFTER the

    change, so consumers can reject out-of-order deliveries.


    **Analytics.** Every published event is ALSO written, in the same

    transaction and under the same `id`, to

    `warehouse.outbound-shipping.analytics` with

    `dataschema urn:warehouse:outbound-shipping:analytics:<EventName>:v1`.

    That stream is not an integration contract: only this service's own

    projector consumes it. Other contexts keep reading

    `warehouse.outbound-shipping.events`.


    **Consumed (ADR 0003, ADR 0005).** `PackageManifested` and

    `PackageDiverted` from fulfillment-execution; `CPTScheduleChanged` from

    process-path-management; `ZoneRegistered` and `LocationSlotRegistered`

    from facility-layout; `DockAppointmentBooked` from dock-scheduling

    (pinned from its `origin/feature/service` until that contract merges);

    `TrailerDocked`, `DoorWorkCompleted` and `TrailerDeparted` from

    yard-management (pinned to its merged contract,

    `contracts/yard-management.asyncapi.yaml`, ADR 0010 there). Each feeds a
    durable local copy. The consumed

    messages below are the producers' own contracts, decoded independently

    here and never imported.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    `type` = `com.warehouse.wms.outbound-shipping.<entity>.<EventName>`

    where `<entity>` is the raising aggregate lowercase with no separators:

    `outboundload`, `shippingpackage`, `billoflading`. Kafka key = aggregate

    id. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
tags:
  - name: outbound-shipping
    description: The outbound-shipping bounded context (WMS subdomain).
  - name: outboundload
    description: Events raised by the OutboundLoad aggregate.
  - name: shippingpackage
    description: Events raised by the ShippingPackage aggregate.
  - name: billoflading
    description: Events raised by the BillOfLading aggregate.
  - name: consumed
    description: >-
      Events produced by sibling contexts that this service consumes (ADR 0003,
      ADR 0005).
  - name: analytics
    description: This service's own analytics stream (every published event, same id).
defaultContentType: application/json
channels:
  warehouse.outbound-shipping.events:
    description: |
      This service's integration topic. Written by the outbox relay; key =
      aggregate id, so all events of one load (or package, or BOL) stay
      ordered on one partition. Every message carries the CloudEvents
      content-type header. Dispatch on the full `type`, ignore unknown
      types, dedupe on `id`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveOutboundShippingEvents
      summary: Receive outbound-shipping events.
      description: |
        Subscribe to the outbound shipping facts. Route on the full `type`
        (`com.warehouse.wms.outbound-shipping.<entity>.<EventName>`).
        `ShipmentConfirmed` is the fleet's "this actually shipped" fact
        (ADR 0002, ADR 0004); `PackageMissedLoad` drives exception cases and
        re-promising.
      tags:
        - name: outbound-shipping
      message:
        oneOf:
          - x-no-consumer-reason: >-
              No integration consumer by design: the ADR 0005 type catalogue
              lists this type as analytics only; the service's own projector
              folds it from the analytics stream.
            name: LoadPlanned
            title: Load planned
            summary: A load was planned for one cutoff and ship method.
            description: >
              `type` =
              `com.warehouse.wms.outbound-shipping.outboundload.LoadPlanned`;

              subject and key = the load id. Raised automatically when the first

              package of a (site, cpt, date, ship method) manifests and no open

              load exists for that key (PlanLoadFromCutoff policy).
            contentType: application/cloudevents+json
            tags:
              - name: outboundload
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      description: >-
                        UUID minted once per occurrence and persisted with the
                        outbox row; consumers dedupe on it.
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      const: /warehouse/outbound-shipping
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      description: >-
                        com.warehouse.wms.outbound-shipping.<entity>.<EventName>.
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: Aggregate root id; also the Kafka partition key.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      description: >-
                        urn:warehouse:outbound-shipping:<events|analytics>:<EventName>:v1.
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    type:
                      type: string
                      const: >-
                        com.warehouse.wms.outbound-shipping.outboundload.LoadPlanned
                      x-parser-schema-id: <anonymous-schema-10>
                    dataschema:
                      type: string
                      const: urn:warehouse:outbound-shipping:events:LoadPlanned:v1
                      x-parser-schema-id: <anonymous-schema-11>
                    data:
                      type: object
                      required:
                        - load_id
                        - site_id
                        - cpt_id
                        - operating_date
                        - ship_method
                        - cutoff
                        - version
