  warehouse.process-path-management.events:
    description: >-
      This service's own integration topic (its `kafka.Topic` constant). Carries
      all three ProcessPath* event types plus CPTScheduleChanged (ADR 0010) as
      CloudEvents 1.0 (ADR 0016), dispatched by consumers on the full `type`.
      Kafka message key = the CloudEvents `subject` (`path_id`, or `site_id` for
      CPTScheduleChanged), hash-balanced. Every message carries the Kafka header
      `content-type: application/cloudevents+json; charset=UTF-8` plus
      `traceparent` / `tracestate` when raised inside a traced operation. Events
      travel through the transactional outbox (Postgres is mandatory, ADR 0037);
      there is no log or in-memory publisher in the shipped binary. The topic is
      auto-created by the broker on first write.
    x-eventcatalog-channel-version: 1.0.0
    subscribe:
      operationId: consumeCptSchedule
      summary: Consume the cutoff (CPT) schedule.
      description: |
        Last writer wins per site: the local copy keeps each cutoff's id,
        local time, days of week and ship method — the (site, cpt, date,
        ship method) key a load is planned for. A cutoff that disappears
        from the schedule leaves the local copy stale until the next change;
        that is recorded, not guessed.
      tags:
        - name: consumed
      message:
        name: CPTScheduleChanged
        title: CPTScheduleChanged (consumed)
        summary: process-path-management's cutoff schedule; feeds the local CPT copy.
