asyncapi: 2.6.0
info:
  title: pick-face-replenishment Domain Events
  version: 1.0.0
  contact:
    name: pick-face-replenishment maintainers
    url: https://github.com/IQVO/pick-face-replenishment
    email: pick-face-replenishment@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event catalog for the **pick-face-replenishment** bounded context (WMS

    subdomain): min/max replenishment of forward pick faces from reserve bins

    (ADR 0001, ADR 0002).


    **Published.** The `ReplenishmentRequest` aggregate raises three events,

    published to `warehouse.pick-face-replenishment.events` through a

    **transactional outbox**: the request row and its already-encoded events are

    written in ONE database transaction and a relay drains them to Kafka

    (at-least-once; the CloudEvents `id` is stored with the outbox row, so a
    retry

    republishes the same `id`). `ReplenishmentRequested` is what
    wes-work-planning

    turns into `REPLENISH` work; `ReplenishmentCompleted` and

    `ReplenishmentCancelled` close the request. The same three types are
    mirrored

    on `warehouse.pick-face-replenishment.analytics` (dataschema

    `urn:warehouse:pick-face-replenishment:analytics:<EventName>:v1`), together

    with `ReplenishmentPolicyDeclared`, which is analytics-only.


    **Consumed (ADR 0003).** `BinStockLevelChanged` (pending producer change P1)

    and `StockRelocated` from inventory-storage, `SlotPlanApproved` from

    slotting-optimization, and `ZoneRegistered`, `LocationSlotRegistered` and

    `LocationSlotDecommissioned` from facility-layout. Each feeds a durable
    local

    copy or closes a request (modes `INVENTORY_MODE`, `SLOTTING_MODE`,

    `LAYOUT_MODE`, default `permissive`; consumer groups from

    `INVENTORY_CONSUMER_GROUP`, `SLOTTING_CONSUMER_GROUP`,

    `LAYOUT_CONSUMER_GROUP`). The consumed messages below are the producers' own

    contracts, decoded independently here and never imported.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    Optional W3C trace-context headers (`traceparent`, and `tracestate` /

    `baggage` when present) carry the trace of the request that wrote the outbox

    row; consumers may extract them, and must not require them.

    `specversion`, `id`, `source` (`/warehouse/pick-face-replenishment`),
    `type`,

    `subject` (the request id; `<site_id>/<sku>` for the policy event), `time`,

    `datacontenttype` (`application/json`) and `dataschema`

    (`urn:warehouse:pick-face-replenishment:<events|analytics>:<EventName>:v1`)

    are all required. Kafka key = the subject. Type =

    `com.warehouse.wms.pick-face-replenishment.<entity>.<EventName>`. A breaking

    payload change is a new `.v2` type, never a mutation.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: pick-face-replenishment
    description: The pick-face-replenishment bounded context (WMS subdomain).
  - name: replenishment
    description: Events raised by the ReplenishmentRequest aggregate.
  - name: policy
    description: Events raised by the ReplenishmentPolicy aggregate.
  - name: analytics
    description: This service's own analytics stream and read side (ADR 0008).
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).
channels:
  warehouse.pick-face-replenishment.events:
    description: >
      This service's integration topic. Written by the outbox relay; key =
      request

      id; every message carries the CloudEvents content-type header (plus the

      optional W3C `traceparent` of the writing request). Dispatch on the full

      `type`, ignore unknown types, dedupe on `id`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveReplenishmentEvents
      summary: Receive ReplenishmentRequest events.
      description: >
        Subscribe to replenishment requests and their outcome. Route on the full

        `type`
        (`com.warehouse.wms.pick-face-replenishment.replenishment.<EventName>`).

        `ReplenishmentRequested` is the only one that asks the floor to do

        something; the other two are the request's final states.
      tags:
        - name: replenishment
      message:
        oneOf:
          - name: ReplenishmentRequested
            title: Replenishment requested
            summary: >-
              A forward pick face needs stock; move `quantity` units of the SKU
              from `source_bin` to `forward_bin`.
            description: >
              `type` =
              `com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentRequested`;

              subject and key = the request id. `priority` is `URGENT` when the
              pick face

              had nothing available (`on_hand - reserved <= 0`) at detection,
              else

              `NORMAL`. `policy_min` and `policy_max` are the policy values the
              request

              was sized with.
            contentType: application/cloudevents+json
            tags:
              - name: replenishment
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the request id for request
                        events).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - request_id
                        - site_id
                        - sku
                        - forward_bin
                        - source_bin
                        - quantity
                        - priority
                        - policy_min
                        - policy_max
                        - requested_at
                      properties:
                        request_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-11>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-12>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-13>
                        forward_bin:
                          type: string
                          description: The pick face to fill.
                          x-parser-schema-id: <anonymous-schema-14>
                        source_bin:
                          type: string
                          description: The reserve bin the stock comes from.
                          x-parser-schema-id: <anonymous-schema-15>
                        quantity:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-16>
                        priority:
                          type: string
                          enum:
                            - NORMAL
                            - URGENT
                          x-parser-schema-id: <anonymous-schema-17>
                        policy_min:
                          type: integer
                          minimum: 0
                          x-parser-schema-id: <anonymous-schema-18>
                        policy_max:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-19>
                        requested_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-20>
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: ReplenishmentRequestedEvent
            examples:
              - name: requested
                summary: 24 units of SKU-1 from a reserve bin to its forward bin.
                payload:
                  specversion: '1.0'
                  id: 6f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e5f
                  source: /warehouse/pick-face-replenishment
                  type: >-
                    com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentRequested
                  subject: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                  time: '2026-10-17T09:30:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:pick-face-replenishment:events:ReplenishmentRequested:v1
                  data:
                    request_id: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                    site_id: WH1
                    sku: SKU-1
                    forward_bin: WH1-FWD-A01-01-01-A
                    source_bin: WH1-RSV-A07-03-02-B
                    quantity: 24
                    priority: NORMAL
                    policy_min: 10
                    policy_max: 60
                    requested_at: '2026-10-17T09:30:00Z'
            messageId: ReplenishmentRequested
          - name: ReplenishmentCompleted
            title: Replenishment completed
            summary: The relocation of a request was recorded on the stock ledger.
            description: >
              `type` =
              `com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentCompleted`;

              subject and key = the request id. `quantity` is what
              inventory-storage's

              `StockRelocated` moved, which can be less than the requested
              quantity.
            contentType: application/cloudevents+json
            tags:
              - name: replenishment
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the request id for request
                        events).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - request_id
                        - site_id
                        - sku
                        - forward_bin
                        - source_bin
                        - quantity
                        - completed_at
                      properties:
                        request_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-23>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-24>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-25>
                        forward_bin:
                          type: string
                          x-parser-schema-id: <anonymous-schema-26>
                        source_bin:
                          type: string
                          x-parser-schema-id: <anonymous-schema-27>
                        quantity:
                          type: integer
                          minimum: 1
                          description: What StockRelocated moved.
                          x-parser-schema-id: <anonymous-schema-28>
                        completed_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-29>
                      x-parser-schema-id: <anonymous-schema-22>
                  x-parser-schema-id: <anonymous-schema-21>
              x-parser-schema-id: ReplenishmentCompletedEvent
            examples:
              - name: completed
                summary: The 24 requested units were moved.
                payload:
                  specversion: '1.0'
                  id: 0b9a8c7d-6e5f-4a3b-9c2d-1e0f9a8b7c6d
                  source: /warehouse/pick-face-replenishment
                  type: >-
                    com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentCompleted
                  subject: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                  time: '2026-10-17T10:05:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:pick-face-replenishment:events:ReplenishmentCompleted:v1
                  data:
                    request_id: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                    site_id: WH1
                    sku: SKU-1
                    forward_bin: WH1-FWD-A01-01-01-A
                    source_bin: WH1-RSV-A07-03-02-B
                    quantity: 24
                    completed_at: '2026-10-17T10:05:00Z'
            messageId: ReplenishmentCompleted
          - name: ReplenishmentCancelled
            title: Replenishment cancelled
            summary: An open request was cancelled before its relocation was recorded.
            description: >
              `type` =
              `com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentCancelled`;

              subject and key = the request id. `reason` is `OPERATOR`,

              `ASSIGNMENT_CHANGED` (a newer approved slot plan no longer assigns
              the SKU

              to the forward bin) or `POLICY_REMOVED`. Consumers cancel work
              they have

              not yet released.
            contentType: application/cloudevents+json
            tags:
              - name: replenishment
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the request id for request
                        events).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - request_id
                        - site_id
                        - sku
                        - reason
                        - cancelled_at
                      properties:
                        request_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-32>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-33>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-34>
                        reason:
                          type: string
                          enum:
                            - OPERATOR
                            - ASSIGNMENT_CHANGED
                            - POLICY_REMOVED
                          x-parser-schema-id: <anonymous-schema-35>
                        cancelled_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-36>
                      x-parser-schema-id: <anonymous-schema-31>
                  x-parser-schema-id: <anonymous-schema-30>
              x-parser-schema-id: ReplenishmentCancelledEvent
            examples:
              - name: cancelled
                summary: >-
                  Cancelled because the slot plan moved the SKU to another
                  forward bin.
                payload:
                  specversion: '1.0'
                  id: 4d3c2b1a-0f9e-4d8c-8b7a-6f5e4d3c2b1a
                  source: /warehouse/pick-face-replenishment
                  type: >-
                    com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentCancelled
                  subject: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                  time: '2026-10-17T09:50:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:pick-face-replenishment:events:ReplenishmentCancelled:v1
                  data:
                    request_id: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                    site_id: WH1
                    sku: SKU-1
                    reason: ASSIGNMENT_CHANGED
                    cancelled_at: '2026-10-17T09:50:00Z'
            messageId: ReplenishmentCancelled
  warehouse.pick-face-replenishment.analytics:
    description: |
      This service's own analytics stream (ADR 0008), written by the SAME
      transactional outbox as the integration topic: every request event
      appears here too, under the SAME CloudEvents id and `type`, with only the
      `dataschema` stream segment different
      (urn:warehouse:pick-face-replenishment:analytics:<EventName>:v1), plus the
      analytics-only `ReplenishmentPolicyDeclared` (key and subject
      `<site_id>/<sku>`). It is NOT an integration contract: the only consumer
      is this service's cmd/pfr-projector (fixed group from
      `ANALYTICS_CONSUMER_GROUP`), which folds the events into the analytical
      database; its deterministic poison goes to
      warehouse.pick-face-replenishment.analytics.dlq. Other contexts keep
      reading warehouse.pick-face-replenishment.events.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveReplenishmentAnalytics
      summary: >-
        Receive the analytics twin of every request event and the policy
        declaration.
      description: |
        Request payloads are byte-for-byte the integration payloads (ADR 0008
        section 2); only the dataschema names the analytics stream.
        `ReplenishmentPolicyDeclared` is raised each time a policy is declared
        or changed, with the new version. Removing a policy raises no event of
        its own; its open requests are cancelled with reason `POLICY_REMOVED`.
      tags:
        - name: analytics
      message:
        oneOf:
          - name: ReplenishmentRequested
            title: Replenishment requested (analytics twin)
            summary: The analytics-stream twin of ReplenishmentRequested (ADR 0008).
            description: >-
              Same `type`, `id`, `subject`, key and payload as the integration
              message; `dataschema` =
              `urn:warehouse:pick-face-replenishment:analytics:ReplenishmentRequested:v1`.
              Consumed only by cmd/pfr-projector.
            contentType: application/cloudevents+json
            tags:
              - name: analytics
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the request id for request
                        events).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - request_id
                        - site_id
                        - sku
                        - forward_bin
                        - source_bin
                        - quantity
                        - priority
                        - policy_min
                        - policy_max
                        - requested_at
                      properties:
                        request_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-11>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-12>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-13>
                        forward_bin:
                          type: string
                          description: The pick face to fill.
                          x-parser-schema-id: <anonymous-schema-14>
                        source_bin:
                          type: string
                          description: The reserve bin the stock comes from.
                          x-parser-schema-id: <anonymous-schema-15>
                        quantity:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-16>
                        priority:
                          type: string
                          enum:
                            - NORMAL
                            - URGENT
                          x-parser-schema-id: <anonymous-schema-17>
                        policy_min:
                          type: integer
                          minimum: 0
                          x-parser-schema-id: <anonymous-schema-18>
                        policy_max:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-19>
                        requested_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-20>
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: ReplenishmentRequestedEvent
            examples:
              - name: requested
                summary: The analytics twin of the requested example above.
                payload:
                  specversion: '1.0'
                  id: 6f1d2c3b-4a5e-4b7c-8d9e-0a1b2c3d4e5f
                  source: /warehouse/pick-face-replenishment
                  type: >-
                    com.warehouse.wms.pick-face-replenishment.replenishment.ReplenishmentRequested
                  subject: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                  time: '2026-10-17T09:30:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:pick-face-replenishment:analytics:ReplenishmentRequested:v1
                  data:
                    request_id: repl-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                    site_id: WH1
                    sku: SKU-1
                    forward_bin: WH1-FWD-A01-01-01-A
                    source_bin: WH1-RSV-A07-03-02-B
                    quantity: 24
                    priority: NORMAL
                    policy_min: 10
                    policy_max: 60
                    requested_at: '2026-10-17T09:30:00Z'
            messageId: ReplenishmentRequestedAnalytics
          - name: ReplenishmentCompleted
            title: Replenishment completed (analytics twin)
            summary: The analytics-stream twin of ReplenishmentCompleted (ADR 0008).
            description: >-
              Same `type`, `id`, `subject`, key and payload as the integration
              message; `dataschema` =
              `urn:warehouse:pick-face-replenishment:analytics:ReplenishmentCompleted:v1`.
              Consumed only by cmd/pfr-projector.
            contentType: application/cloudevents+json
            tags:
              - name: analytics
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the request id for request
                        events).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
