              source:
                type: string
                x-parser-schema-id: <anonymous-schema-3>
              type:
                type: string
                x-parser-schema-id: <anonymous-schema-4>
              subject:
                type: string
                description: The aggregate instance id (the request id for request events).
                x-parser-schema-id: <anonymous-schema-5>
