              match it.

              `type` =
              `com.warehouse.wms.inventory-storage.stock.BinStockLevelChanged`,

              source `/warehouse/inventory-storage`, dataschema

              `urn:warehouse:inventory-storage:events:BinStockLevelChanged:v1`.
              Subject

              and Kafka key = `<bin>:<sku>`. `on_hand` and `reserved` are
              ABSOLUTE

