asyncapi: 2.6.0
info:
  title: product-master Domain Events
  version: 1.1.0
  contact:
    name: product-master maintainers
    url: https://github.com/IQVO/product-master
    email: product-master@iqvo.example.com
  license:
    name: UNLICENSED
  description: >
    Event catalog for the **product-master** bounded context (WMS subdomain):

    SKU-level product master data, i.e. handling classification, the

    physical profile and the packaging hierarchy with GS1 GTINs (ADR 0001,

    ADR 0002, ADR 0011).


    **Published.** The `Product` aggregate raises eight events, published to

    `warehouse.product-master.events` through a **transactional outbox**: the

    product row and its already-encoded events are written in ONE database

    transaction and a relay drains them to Kafka (at-least-once; the CloudEvents

    `id` is stored with the outbox row, so a retry republishes the same `id`).

    A change that alters nothing raises no event.


    **Packaging hierarchy (ADR 0011).** Three events carry the pack levels

    (`EACH | INNER | CASE | PALLET`) of a SKU. They are additive and

    integration-only (NOT written to the analytics stream). A GTIN is always

    the 14-digit zero-left-padded string. Eaches are the ledger unit:
    `qty_of_child`

    and `units_per_pack` are the only pack quantities, a bare quantity never

    changes meaning. `units_per_pack` is the direct factor to eaches. Once a

    level is active its quantities never change: a new content quantity is a

    new GTIN at that level (declaring it end-dates the old level with a

    `ProductPackLevelRetired`, reason `superseded`, in the same transaction,

    one `version` apart). An end-dated level is kept: resolve a GTIN of an

    in-flight ASN from your local copy, which must keep retired levels.

    Dates and timestamps are RFC 3339 UTC.


    **Local copies, not lookups.** Sibling contexts (inventory-storage,

    order-management, wes-work-planning, fulfillment-execution) keep a local

    copy keyed by SKU. Every payload carries the aggregate `version` after the

    change; apply a message only when its `version` is greater than the stored

    one. Payloads are full-state per concern (classification, physical profile),

    so a consumer overwrites, it never merges.


    **Analytics (ADR 0006).** The same five events are ALSO written, in the

    same transaction, to `warehouse.product-master.analytics` with the same

    `type` and the same `id` per occurrence, `dataschema`

    `urn:warehouse:product-master:analytics:<EventName>:v1` and payloads equal

    to the integration payloads. Only this service's `product-projector`

    consumes it; it is not an integration contract.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka

    header `content-type: application/cloudevents+json; charset=UTF-8`.

    Optional W3C trace-context headers (`traceparent`, and `tracestate` /

    `baggage` when present) carry the trace of the request that wrote the

    outbox row (ADR 0009); consumers may extract them, and must not require

    them.

    `specversion`, `id`, `source` (`/warehouse/product-master`), `type`,

    `subject` (the SKU), `time`, `datacontenttype` (`application/json`) and

    `dataschema` (`urn:warehouse:product-master:events:<EventName>:v1`) are all

    required. Kafka key = the SKU. Type =

    `com.warehouse.wms.product-master.product.<EventName>`. A breaking payload

    change is a new `.v2` type, never a mutation.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: product-master
    description: The product-master bounded context (WMS subdomain).
  - name: product
    description: Events raised by the Product aggregate.
  - name: analytics
    description: >-
      This service's own analytics stream, consumed only by its projector (ADR
      0006).
channels:
  warehouse.product-master.events:
    description: |
      This service's integration topic. Written by the outbox relay; key = SKU;
      every message carries the CloudEvents content-type header (plus the
      optional W3C `traceparent` of the writing request). Dispatch on the
      full `type`, ignore unknown types, dedupe on `id`, apply by `version`.
    x-eventcatalog-channel-version: 1.1.0
    publish:
      operationId: receiveProductEvents
      summary: Receive Product events.
      description: |
        Subscribe to the product master data stream. Route on the full `type`
        (`com.warehouse.wms.product-master.product.<EventName>`).
      tags:
        - name: product
      message:
        oneOf:
          - name: ProductRegistered
            title: Product registered
            summary: A SKU was registered as a product.
            description: >-
              `type` =
              `com.warehouse.wms.product-master.product.ProductRegistered`;
              subject and key = the SKU.
            contentType: application/cloudevents+json
            tags:
              - name: product
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The SKU.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - sku
                        - description
                        - version
                      properties:
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-11>
                        description:
                          type: string
                          x-parser-schema-id: <anonymous-schema-12>
                        version:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-13>
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: ProductRegisteredEvent
            examples:
              - name: registered
                summary: SKU-1 registered.
                payload:
                  specversion: '1.0'
                  id: 1b0c9a4e-2f7d-4a63-9d1e-5a7c3e2b9f10
                  source: /warehouse/product-master
                  type: com.warehouse.wms.product-master.product.ProductRegistered
                  subject: SKU-1
                  time: '2026-10-06T21:00:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:product-master:events:ProductRegistered:v1
                  data:
                    sku: SKU-1
                    description: Lithium battery pack 12V
                    version: 1
            messageId: ProductRegistered
          - x-no-consumer-reason: Published Language fact (product description); consumed on demand
            name: ProductDescriptionChanged
            title: Product description changed
            summary: A registered product's description changed.
            description: >-
              `type` =
              `com.warehouse.wms.product-master.product.ProductDescriptionChanged`;
              subject and key = the SKU.
            contentType: application/cloudevents+json
            tags:
              - name: product
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The SKU.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - sku
                        - description
                        - version
                      properties:
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-16>
                        description:
                          type: string
                          x-parser-schema-id: <anonymous-schema-17>
                        version:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-18>
                      x-parser-schema-id: <anonymous-schema-15>
                  x-parser-schema-id: <anonymous-schema-14>
              x-parser-schema-id: ProductDescriptionChangedEvent
            examples:
              - name: described
                summary: SKU-1's description changed.
                payload:
                  specversion: '1.0'
