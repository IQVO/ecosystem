                    com.warehouse.wms.product-master.product.ProductDescriptionChanged
                  subject: SKU-1
                  time: '2026-10-06T21:01:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:product-master:events:ProductDescriptionChanged:v1
                  data:
                    sku: SKU-1
                    description: Lithium battery pack 12V, 7Ah
                    version: 2
            messageId: ProductDescriptionChanged
          - name: ProductClassified
            title: Product classified
            summary: A product's handling classification was set or replaced.
            description: >
              `type` =
              `com.warehouse.wms.product-master.product.ProductClassified`;

              subject and key = the SKU. Full-state replacement of the

              classification. `sku`, `handling_tags`, `temperature_class` and

              `dot_hazard_class` keep the field names of inventory-storage's v1

              payload (ADR 0004). Optional fields are omitted when unset.
            contentType: application/cloudevents+json
            tags:
              - name: product
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
