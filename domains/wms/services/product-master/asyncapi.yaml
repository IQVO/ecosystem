                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The SKU.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - sku
                        - handling_tags
                        - classification_source
                        - version
                      properties:
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-21>
                        handling_tags:
                          type: array
                          minItems: 1
                          items:
                            type: string
                            enum:
                              - Hazmat
                              - Fragile
                              - TemperatureSensitive
                              - Oversized
                              - HighValue
                            x-parser-schema-id: HandlingTag
                          x-parser-schema-id: <anonymous-schema-22>
                        temperature_class:
                          type: string
                          enum:
                            - Ambient
                            - Chilled
                            - Frozen
                          x-parser-schema-id: <anonymous-schema-23>
                        dot_hazard_class:
                          type: integer
                          minimum: 1
                          maximum: 9
                          x-parser-schema-id: <anonymous-schema-24>
                        classification_source:
                          type: string
                          enum:
                            - native
                            - legacy-import
                          x-parser-schema-id: <anonymous-schema-25>
                        version:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-26>
                      x-parser-schema-id: <anonymous-schema-20>
                  x-parser-schema-id: <anonymous-schema-19>
              x-parser-schema-id: ProductClassifiedEvent
            examples:
              - name: hazmatFrozen
                summary: >-
                  SKU-1 classified Hazmat + TemperatureSensitive (Frozen), DOT
                  class 3.
                payload:
                  specversion: '1.0'
                  id: 0f6d8a2b-3c4e-4d5f-8a9b-7c6d5e4f3a2b
                  source: /warehouse/product-master
                  type: com.warehouse.wms.product-master.product.ProductClassified
                  subject: SKU-1
                  time: '2026-10-06T21:02:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:product-master:events:ProductClassified:v1
                  data:
                    sku: SKU-1
                    handling_tags:
                      - Hazmat
                      - TemperatureSensitive
                    temperature_class: Frozen
                    dot_hazard_class: 3
                    classification_source: native
                    version: 3
            messageId: ProductClassified
          - name: ProductDimensionsDeclared
            title: Product dimensions declared
            summary: Declared unit dimensions and weight were set or replaced.
            description: >
              `type` =
              `com.warehouse.wms.product-master.product.ProductDimensionsDeclared`;

              subject and key = the SKU. Carries the FULL physical profile after
