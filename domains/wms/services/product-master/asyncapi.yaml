                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The SKU.
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
