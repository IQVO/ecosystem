asyncapi: 2.6.0
info:
  title: returns-processing Domain Events
  version: 1.0.0
  contact:
    name: returns-processing maintainers
    url: https://github.com/IQVO/returns-processing
    email: returns-processing@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **returns-processing** bounded context (WMS
    subdomain): the reverse flow of goods — authorize a return against a
    shipped order line (RMA), receive and grade it (ReturnReceipt), decide
    what happens to it (Disposition) and hand restockable units back to
    inventory-storage as a staged line (ADR 0001, ADR 0002).

    **Published.** Three aggregates raise seven event types, published to
    `warehouse.returns-processing.events` through a **transactional outbox**:
    the aggregate row and its already-encoded events are written in ONE
    database transaction and a relay drains them to Kafka (at-least-once; the
    CloudEvents `id` is stored with the outbox row, so a retry republishes the
    same `id`). `ReturnLineStaged` is the only type that asks a sibling to do
    something: inventory-storage consumes it into its staged-receipt use case
    (same shape as its `ReceiptLineReceived` plus `rma_id`, `disposition_id`,
    `site_id`); `UnexpectedReturnReceived` is what exception-management turns
    into a problem-solve case. Every one of the seven types is ALSO mirrored
    on `warehouse.returns-processing.analytics` (dataschema
    `urn:warehouse:returns-processing:analytics:<EventName>:v1`), the stream
    this service's own projector consumes (ADR 0007).

    **Consumed (ADR 0003).** `ProductClassified` from product-master, the
    allocated order lines (`OrderAllocated` / `OrderPartiallyAllocated`) from
    order-management and `PackageManifested` (the shipped fact per work unit,
    `order_ref` = `{order_id}-line-{line_no}`) from fulfillment-execution.
    Each feeds a durable local copy; no sibling is ever called live. Consumer
    groups come from `PRODUCT_CLASSIFICATION_CONSUMER_GROUP`,
    `ORDER_LINES_CONSUMER_GROUP` and `MANIFEST_CONSUMER_GROUP`. The consumed
    messages below are the producers' own contracts, restated here and never
    imported.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    Optional W3C trace-context headers (`traceparent`, and `tracestate` /
    `baggage` when present) carry the trace of the request that wrote the
    outbox row; consumers may extract them, and must not require them.
    `specversion`, `id`, `source` (`/warehouse/returns-processing`), `type`,
    `subject`, `time`, `datacontenttype` (`application/json`) and `dataschema`
    (`urn:warehouse:returns-processing:<events|analytics>:<EventName>:v1`) are
    all required. Kafka key = the subject. Type =
    `com.warehouse.wms.returns-processing.<entity>.<EventName>`. A breaking
    payload change is a new `.v2` type, never a mutation.
servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092
defaultContentType: application/cloudevents+json
tags:
  - name: returns-processing
    description: The returns-processing bounded context (WMS subdomain).
  - name: returnauthorization
    description: Events raised by the ReturnAuthorization (RMA) aggregate.
  - name: returnreceipt
    description: Events raised by the ReturnReceipt aggregate.
  - name: disposition
    description: Events raised by the Disposition aggregate.
  - name: analytics
    description: This service's own analytics stream and read side (ADR 0007).
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).
channels:
  warehouse.returns-processing.events:
    description: |
      This service's integration topic. Written by the outbox relay; key = the
      event's subject; every message carries the CloudEvents content-type
      header (plus the optional W3C `traceparent` of the writing request).
      Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    x-eventcatalog-channel-version: 1.0.0
    publish:
      operationId: receiveReturnsProcessingEvents
      summary: Receive RMA, receipt and disposition events.
      description: |
        Subscribe to the reverse flow of goods: authorizations and their
        rejections, arrivals and inspection grades, the policy decision per
        inspected line and, only for a RESTOCK outcome, the staged line
        handed to inventory-storage. Route on the full `type`
        (`com.warehouse.wms.returns-processing.<entity>.<EventName>`).
      tags:
        - name: returns-processing
      message:
        oneOf:
          - name: ReturnAuthorized
            title: Return authorized
            summary: >-
              An RMA was opened for a shipped order line inside the return
              window.
            description: >
              `type` =
              `com.warehouse.wms.returns-processing.returnauthorization.ReturnAuthorized`;

              subject and key = the rmaId. `window_ends_at` is the policy
              window's

              end (authorized_at + return window days); the goods must arrive
              before

              it. `quantity` is capped by `DispositionPolicy.max_units_per_line`

              (the shipped-quantity check is planned, ADR 0003).
            contentType: application/cloudevents+json
            tags:
              - name: returnauthorization
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The aggregate instance id (rmaId
                      receiptId or dispositionId for this service's events).: null
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - rma_id
                        - order_id
                        - line_no
                        - sku
                        - quantity
                        - site_id
                        - reason_code
                        - window_ends_at
                        - authorized_at
                      properties:
                        rma_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-11>
                        order_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-12>
                        line_no:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-13>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-14>
                        quantity:
                          type: integer
                          minimum: 1
                          description: >-
                            Capped by the policy's max_units_per_line; the
                            shipped-quantity check is planned.
                          x-parser-schema-id: <anonymous-schema-15>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-16>
                        reason_code:
                          type: string
                          description: >-
                            The operator's return reason, e.g. DAMAGED,
                            WRONG_ITEM, NOT_NEEDED.
                          x-parser-schema-id: <anonymous-schema-17>
                        window_ends_at:
                          type: string
                          format: date-time
                          description: The last instant the goods may arrive.
                          x-parser-schema-id: <anonymous-schema-18>
                        authorized_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-19>
                      x-parser-schema-id: <anonymous-schema-10>
                  x-parser-schema-id: <anonymous-schema-9>
              x-parser-schema-id: ReturnAuthorizedEvent
            examples:
              - name: authorized
                summary: >-
                  2 units of SKU-1 from line 1 of order ord-7c9e may come back
                  to WH1.
                payload:
                  specversion: '1.0'
                  id: 9f2c1d3e-5a4b-4c6d-8e7f-1a2b3c4d5e6f
                  source: /warehouse/returns-processing
                  type: >-
                    com.warehouse.wms.returns-processing.returnauthorization.ReturnAuthorized
                  subject: rma-4d5e6f7a-8b9c-4d0e-a1f2-3b4c5d6e7f80
                  time: '2026-10-21T09:30:00Z'
                  datacontenttype: application/json
                  dataschema: urn:warehouse:returns-processing:events:ReturnAuthorized:v1
                  data:
                    rma_id: rma-4d5e6f7a-8b9c-4d0e-a1f2-3b4c5d6e7f80
                    order_id: ord-7c9e2f1a
                    line_no: 1
                    sku: SKU-1
                    quantity: 2
                    site_id: WH1
                    reason_code: DAMAGED
                    window_ends_at: '2026-11-20T09:30:00Z'
                    authorized_at: '2026-10-21T09:30:00Z'
            messageId: ReturnAuthorized
          - name: ReturnAuthorizationRejected
            title: Return authorization rejected
            summary: >-
              An RMA request was refused: the line never shipped, the window
              closed or another RMA is open.
            description: >
              `type` =
              `com.warehouse.wms.returns-processing.returnauthorization.ReturnAuthorizationRejected`;

              subject and key = the rmaId. `rejection_code` is
              `LINE_NOT_MANIFESTED`,

              `RETURN_WINDOW_EXPIRED`, `OPEN_RMA_EXISTS` or

              `QUANTITY_EXCEEDS_POLICY`.
            contentType: application/cloudevents+json
            tags:
              - name: returnauthorization
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The aggregate instance id (rmaId
                      receiptId or dispositionId for this service's events).: null
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - rma_id
                        - order_id
                        - line_no
                        - sku
                        - quantity
                        - rejection_code
                        - rejected_at
                      properties:
                        rma_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-22>
                        order_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-23>
                        line_no:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-24>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-25>
                        quantity:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-26>
                        rejection_code:
                          type: string
                          enum:
                            - LINE_NOT_MANIFESTED
                            - RETURN_WINDOW_EXPIRED
                            - OPEN_RMA_EXISTS
                            - QUANTITY_EXCEEDS_POLICY
                          x-parser-schema-id: <anonymous-schema-27>
                        rejected_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-28>
                      x-parser-schema-id: <anonymous-schema-21>
                  x-parser-schema-id: <anonymous-schema-20>
              x-parser-schema-id: ReturnAuthorizationRejectedEvent
            examples:
              - name: rejected
                summary: >-
                  The order line has no manifested work unit, so nothing
                  provably shipped.
                payload:
                  specversion: '1.0'
                  id: 1e3f5a7c-9b1d-4f2a-8c3e-5d6f7a8b9c0d
                  source: /warehouse/returns-processing
                  type: >-
                    com.warehouse.wms.returns-processing.returnauthorization.ReturnAuthorizationRejected
                  subject: rma-6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b90
                  time: '2026-10-21T09:31:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:returns-processing:events:ReturnAuthorizationRejected:v1
                  data:
                    rma_id: rma-6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b90
                    order_id: ord-7c9e2f1a
                    line_no: 2
                    sku: SKU-2
                    quantity: 1
                    rejection_code: LINE_NOT_MANIFESTED
                    rejected_at: '2026-10-21T09:31:00Z'
            messageId: ReturnAuthorizationRejected
          - name: ReturnReceiptOpened
            title: Return receipt opened
            summary: >-
              Returned goods arrived; each line matches an RMA line or is
              explicitly unexpected.
            description: >
              `type` =
              `com.warehouse.wms.returns-processing.returnreceipt.ReturnReceiptOpened`;

              subject and key = the receiptId. `rma_id` is null when the whole

              parcel was unexpected. Every line carries its own nullable
              `rma_id`: a

              non-null value is a matched line, null means the line is
              UNEXPECTED

              (there is no silent third state). UNEXPECTED lines additionally
              raise

              `UnexpectedReturnReceived` for exception-management.
            contentType: application/cloudevents+json
            tags:
              - name: returnreceipt
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The aggregate instance id (rmaId
                      receiptId or dispositionId for this service's events).: null
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - receipt_id
                        - rma_id
                        - site_id
                        - opened_at
                        - lines
                      properties:
                        receipt_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-31>
                        rma_id:
                          type: string
                          nullable: true
                          description: >-
                            The RMA the parcel was opened against; null when the
                            whole parcel is unexpected.
                          x-parser-schema-id: <anonymous-schema-32>
                        site_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-33>
                        opened_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-34>
                        lines:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required:
                              - line_no
                              - sku
                              - quantity
                              - rma_id
                            properties:
                              line_no:
                                type: integer
                                minimum: 1
                                x-parser-schema-id: <anonymous-schema-36>
                              sku:
                                type: string
                                x-parser-schema-id: <anonymous-schema-37>
                              quantity:
                                type: integer
                                minimum: 1
                                x-parser-schema-id: <anonymous-schema-38>
                              rma_id:
                                type: string
                                nullable: true
                                description: >-
                                  The RMA this line matches; null means the line
                                  is UNEXPECTED.
                                x-parser-schema-id: <anonymous-schema-39>
                            x-parser-schema-id: ReceiptLineData
                          x-parser-schema-id: <anonymous-schema-35>
                      x-parser-schema-id: <anonymous-schema-30>
                  x-parser-schema-id: <anonymous-schema-29>
              x-parser-schema-id: ReturnReceiptOpenedEvent
            examples:
              - name: opened
                summary: >-
                  A parcel against one RMA with one matched line and one
                  unexpected line.
                payload:
                  specversion: '1.0'
                  id: 2f4a6b8c-0d2e-4a3b-9c4d-6e7f8a9b0c1d
                  source: /warehouse/returns-processing
                  type: >-
                    com.warehouse.wms.returns-processing.returnreceipt.ReturnReceiptOpened
                  subject: rcpt-8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                  time: '2026-10-22T14:05:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:returns-processing:events:ReturnReceiptOpened:v1
                  data:
                    receipt_id: rcpt-8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                    rma_id: rma-4d5e6f7a-8b9c-4d0e-a1f2-3b4c5d6e7f80
                    site_id: WH1
                    opened_at: '2026-10-22T14:05:00Z'
                    lines:
                      - line_no: 1
                        sku: SKU-1
                        quantity: 2
                        rma_id: rma-4d5e6f7a-8b9c-4d0e-a1f2-3b4c5d6e7f80
                      - line_no: 2
                        sku: SKU-9
                        quantity: 1
                        rma_id: null
            messageId: ReturnReceiptOpened
          - name: ReturnLineInspected
            title: Return line inspected
            summary: A receipt line was graded A, B, C or SCRAP with its reason codes.
            description: >
              `type` =
              `com.warehouse.wms.returns-processing.returnreceipt.ReturnLineInspected`;

              subject and key = the receiptId. `quantity` is the inspected
              quantity,

              never more than the received quantity of the line; a line is
              inspected

              exactly once. The disposition is decided in the same transaction
              and

              raises its own `DispositionDecided`.
            contentType: application/cloudevents+json
            tags:
              - name: returnreceipt
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The aggregate instance id (rmaId
                      receiptId or dispositionId for this service's events).: null
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - receipt_id
                        - line_no
                        - sku
                        - quantity
                        - grade
                        - reason_codes
                        - inspected_at
                      properties:
                        receipt_id:
                          type: string
                          x-parser-schema-id: <anonymous-schema-42>
                        line_no:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-43>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-44>
                        quantity:
                          type: integer
                          minimum: 1
                          description: >-
                            The inspected quantity; never more than the received
                            quantity of the line.
                          x-parser-schema-id: <anonymous-schema-45>
                        grade:
                          type: string
                          enum:
                            - A
                            - B
                            - C
                            - SCRAP
                          x-parser-schema-id: <anonymous-schema-46>
                        reason_codes:
                          type: array
                          items:
                            type: string
                            x-parser-schema-id: <anonymous-schema-48>
                          description: >-
                            Why the grade; e.g. CUSTOMER_DAMAGE, OPENED_BOX,
                            MISSING_PARTS.
                          x-parser-schema-id: <anonymous-schema-47>
                        inspected_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-49>
                      x-parser-schema-id: <anonymous-schema-41>
                  x-parser-schema-id: <anonymous-schema-40>
              x-parser-schema-id: ReturnLineInspectedEvent
            examples:
              - name: inspected
                summary: Line 1 graded B for customer damage.
                payload:
                  specversion: '1.0'
                  id: 3a5b7c9d-1e2f-4b3c-8d4e-7f8a9b0c1d2e
                  source: /warehouse/returns-processing
                  type: >-
                    com.warehouse.wms.returns-processing.returnreceipt.ReturnLineInspected
                  subject: rcpt-8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                  time: '2026-10-22T15:10:00Z'
                  datacontenttype: application/json
                  dataschema: >-
                    urn:warehouse:returns-processing:events:ReturnLineInspected:v1
                  data:
                    receipt_id: rcpt-8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
                    line_no: 1
                    sku: SKU-1
                    quantity: 2
                    grade: B
                    reason_codes:
                      - CUSTOMER_DAMAGE
                    inspected_at: '2026-10-22T15:10:00Z'
            messageId: ReturnLineInspected
          - name: UnexpectedReturnReceived
            title: Unexpected return received
            summary: >-
              A received line has no matching RMA; exception-management opens a
              case.
            description: >
              `type` =
              `com.warehouse.wms.returns-processing.returnreceipt.UnexpectedReturnReceived`;

              subject and key = the receiptId. Raised per UNEXPECTED receipt
              line

              (the receipt-level fact is `ReturnReceiptOpened`).
            contentType: application/cloudevents+json
            tags:
              - name: returnreceipt
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: The aggregate instance id (rmaId
                      receiptId or dispositionId for this service's events).: null
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
