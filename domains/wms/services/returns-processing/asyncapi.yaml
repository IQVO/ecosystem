  warehouse.product-master.events:
    description: |
      This service's integration topic. Written by the outbox relay; key = SKU;
      every message carries the CloudEvents content-type header (plus the
      optional W3C `traceparent` of the writing request). Dispatch on the
      full `type`, ignore unknown types, dedupe on `id`, apply by `version`.
    x-eventcatalog-channel-version: 1.1.0
    subscribe:
      operationId: consumeProductMasterEvents
      summary: Consume the product classification of each SKU.
      description: |
        `ProductClassified` feeds the `product_classifications` local copy: the
        hazmat flag, DOT hazard class and temperature class that the
        disposition policy keys on. A message is applied only when its
        `version` is greater than the stored one for the SKU (grades stay
        fail-open; RESTOCK of a hazmat SKU without a DOT rating stays
        fail-closed). The CloudEvents `id` claim and the effect commit in one
        transaction; the offset is committed afterwards (ADR 0003).
      tags:
        - name: consumed
      message:
        name: ProductClassified
        title: ProductClassified (consumed, product-master)
        summary: >-
          The handling classification of a SKU, with a monotonically increasing
          version.
        description: >
          `type` = `com.warehouse.wms.product-master.product.ProductClassified`,

          source `/warehouse/product-master`, dataschema

          `urn:warehouse:product-master:events:ProductClassified:v1`. Subject
          and

          Kafka key = the SKU. `handling_tags` can carry `Hazmat` and

          `TemperatureSensitive`; `dot_hazard_class` is 0 when the SKU carries

          no rating; `classification_source` is `native` or `imported`. Apply

          only when `version` is greater than the stored one for the SKU.

          Restated from product-master's contract, never imported.
        contentType: application/cloudevents+json
        tags:
          - name: consumed
        payload:
          allOf:
            - type: object
              required:
                - specversion
                - id
                - source
                - type
                - subject
                - time
                - datacontenttype
                - dataschema
                - data
              properties:
                specversion:
                  type: string
                  const: '1.0'
                  x-parser-schema-id: <anonymous-schema-1>
                id:
                  type: string
                  format: uuid
                  x-parser-schema-id: <anonymous-schema-2>
                source:
                  type: string
                  x-parser-schema-id: <anonymous-schema-3>
                type:
                  type: string
                  x-parser-schema-id: <anonymous-schema-4>
                subject:
                  type: string
                  description: The aggregate instance id (rmaId
                  receiptId or dispositionId for this service's events).: null
                  x-parser-schema-id: <anonymous-schema-5>
                time:
                  type: string
                  format: date-time
                  x-parser-schema-id: <anonymous-schema-6>
                datacontenttype:
                  type: string
                  const: application/json
                  x-parser-schema-id: <anonymous-schema-7>
                dataschema:
                  type: string
                  x-parser-schema-id: <anonymous-schema-8>
              x-parser-schema-id: CloudEventEnvelope
            - type: object
              properties:
                data:
                  type: object
                  required:
                    - sku
                    - handling_tags
                    - temperature_class
                    - dot_hazard_class
                    - classification_source
                    - version
                  properties:
                    sku:
                      type: string
                      x-parser-schema-id: <anonymous-schema-84>
                    handling_tags:
                      type: array
                      items:
                        type: string
                        x-parser-schema-id: <anonymous-schema-86>
                      description: >-
                        e.g. Hazmat, TemperatureSensitive; empty for an untagged
                        SKU.
                      x-parser-schema-id: <anonymous-schema-85>
                    temperature_class:
