  warehouse.inventory.events:
    description: >
      The outbound integration topic for this bounded context (the `Topic`
      constant in `internal/adapters/outbound/kafka/publisher.go`). Reaching it:
      `StockReserved` and `ReservationRevoked` (keyed by reservation id), the
      transfer replies and receipt/stow events (keyed by transfer line id),
      `StockRelocated` (keyed by relocation id, ADR 0039),
      `BinStockLevelChanged` (keyed by `<bin>:<sku>`, ADR 0040) and the promoted
      exception facts `DiscrepancyDetected`, `ItemUnlocated` and `ItemStowed`
      (ADR 0043 — byte-identical copies of the analytics feed, consumed by
      exception-management and returns-processing) and the container events
      `ContainerRegistered`, `ContainerStowed`, `CaseBroken` and
      `ContainerEmptied` (keyed by LPN, ADR 0045/0046). The legacy
      `ProductClassified` was retired at product-master ADR 0003 stage E
      (2026-10-17). The primary downstream consumer is wes-work-planning, which
      dispatches on their full `type` strings and projects them into its
      `UsableInventoryObserved` read model, keyed by SKU.
    x-eventcatalog-channel-version: 1.0.0
    subscribe:
      operationId: consumeInventoryStorageRelocations
      summary: Consume relocations to record slot-plan execution progress.
      description: |
        A relocation is matched to a plan's move by `source_ref` first: the
        move reference `<plan_id>:<move_seq>` (fulfillment-execution's
        `relocation_ref`, carried by inventory-storage as the relocation's
        source_ref) names the move at that 0-based position of the plan's moves.
        Only when `source_ref` is no move reference is it matched by
        `site_code`, `sku` and the bins on the site's Approved plan. The
        CloudEvents `id` is claimed with the effect in one transaction; a
        relocation is recorded once per `relocation_id`. A relocation of no
        known move is claimed and counted, never dead-lettered. A
        `StockRelocated` whose data cannot be decoded or misses a required
        field is dead-lettered at once to `warehouse.inventory.events.dlq`.
      tags:
        - name: consumed
      message:
        oneOf:
          - name: StockRelocated
            title: StockRelocated (consumed, inventory-storage)
            summary: >-
              A quantity of one SKU moved from one bin to another bin of the
              same site.
            description: >
              `type` =
              `com.warehouse.wms.inventory-storage.stock.StockRelocated`,

              dataschema
              `urn:warehouse:inventory-storage:events:StockRelocated:v1`.

              Subject and Kafka key = `relocation_id`. Restated from

              inventory-storage's contract (its ADR 0039), never imported.
            contentType: application/cloudevents+json
            tags:
              - name: consumed
            payload:
              allOf:
                - type: object
                  required:
                    - specversion
                    - id
                    - source
                    - type
                    - subject
                    - time
                    - datacontenttype
                    - dataschema
                    - data
                  properties:
                    specversion:
                      type: string
                      const: '1.0'
                      x-parser-schema-id: <anonymous-schema-1>
                    id:
                      type: string
                      format: uuid
                      x-parser-schema-id: <anonymous-schema-2>
                    source:
                      type: string
                      x-parser-schema-id: <anonymous-schema-3>
                    type:
                      type: string
                      x-parser-schema-id: <anonymous-schema-4>
                    subject:
                      type: string
                      description: >-
                        The aggregate instance id (the plan id for published
                        events).
                      x-parser-schema-id: <anonymous-schema-5>
                    time:
                      type: string
                      format: date-time
                      x-parser-schema-id: <anonymous-schema-6>
                    datacontenttype:
                      type: string
                      const: application/json
                      x-parser-schema-id: <anonymous-schema-7>
                    dataschema:
                      type: string
                      x-parser-schema-id: <anonymous-schema-8>
                  x-parser-schema-id: CloudEventEnvelope
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - relocation_id
                        - site_code
                        - sku
                        - from_bin
                        - to_bin
                        - quantity
                        - reason
                        - source_ref
                        - occurred_at
                      properties:
                        relocation_id:
                          type: string
                          description: The relocation id; recorded once per id.
                          x-parser-schema-id: <anonymous-schema-94>
                        site_code:
                          type: string
                          description: >-
                            The site both bins belong to (this service's site
                            id).
                          x-parser-schema-id: <anonymous-schema-95>
                        sku:
                          type: string
                          x-parser-schema-id: <anonymous-schema-96>
                        from_bin:
                          type: string
                          x-parser-schema-id: <anonymous-schema-97>
                        to_bin:
                          type: string
                          x-parser-schema-id: <anonymous-schema-98>
                        quantity:
                          type: integer
                          minimum: 1
                          x-parser-schema-id: <anonymous-schema-99>
                        reason:
                          type: string
                          enum:
                            - SLOTTING
                            - CONSOLIDATION
                            - MANUAL
                            - REPLENISHMENT
                          description: >-
                            Only SLOTTING can execute a slot-plan move; every
                            other reason (including REPLENISHMENT, added by
                            pick-face-replenishment's REPLENISH tasks) is
                            recorded as unmatched with
                            reason=reason-not-slotting.
                          x-parser-schema-id: <anonymous-schema-100>
                        source_ref:
                          type: string
                          maxLength: 200
                          description: >-
                            `<plan_id>:<move_seq>` on slot-plan moves (matched
                            first); a task id, a ticket or "" otherwise.
                          x-parser-schema-id: <anonymous-schema-101>
                        occurred_at:
                          type: string
                          format: date-time
                          x-parser-schema-id: <anonymous-schema-102>
                      x-parser-schema-id: <anonymous-schema-93>
                  x-parser-schema-id: <anonymous-schema-92>
              x-parser-schema-id: StockRelocatedEvent
            examples:
              - name: slottingMoveFromATask
                summary: >-
                  Seven units of SKU-R1 moved between two WH1 bins by a
