asyncapi: 3.0.0
info:
  title: yard-management Domain Events
  version: 1.0.0
  contact:
    name: yard-management maintainers
    url: https://github.com/IQVO/yard-management
    email: yard-management@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: yard-management
      description: The yard-management bounded context (WMS subdomain).
  description: >-
    Event catalogue of the **yard-management** bounded context (WMS subdomain):
    everything physically on site outside the four walls - visits through the
    gate, which trailer is where, hostler and visiting-driver moves, door work
    and yard checks (ADR 0001, 0002).


    **Published.** Four aggregates (YardVisit, Trailer, YardMove, YardCheck)
    raise 19 event types through a transactional outbox: the aggregate row and
    its events are written in ONE database transaction and a relay drains them
    to Kafka (at-least-once; the CloudEvents `id` is stored with the outbox
    row). Nine types are integration events on
    `warehouse.yard-management.events` (VisitCheckedIn, VisitRejected,
    TrailerDocked, TrailerUndocked, SealExceptionRaised, TrailerDwellExceeded,
    YardCheckClosed, DoorWorkCompleted, TrailerDeparted) and are mirrored on
    `warehouse.yard-management.analytics` under the same id; the other ten are
    analytics-only and go ONLY to the analytics topic. The key of every message
    is its aggregate root id (`visit_id`, `trailer_id`, `move_id`,
    `yard_check_id`).


    **Consumed (ADR 0003).** dock-scheduling (appointments and door closures),
    facility-layout (locations and zones) and inbound-receiving (ASNs and
    receipts) feed event-fed local copies; no sibling is ever called live. A
    message that is not a valid CloudEvents 1.0 event is skipped; a valid event
    of an unlisted `type` is ignored; a payload that can never be applied is
    dead-lettered to `<topic>.dlq`; any other handler error is retried and
    dead-lettered after 5 attempts. Consumer groups come from
    `DOCK_SCHEDULING_CONSUMER_GROUP`, `FACILITY_CONSUMER_GROUP`,
    `INBOUND_RECEIVING_CONSUMER_GROUP` and `ANALYTICS_CONSUMER_GROUP`.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/warehouse/yard-management`), `type`,
    `subject`, `time`, `datacontenttype` (`application/json`) and `dataschema`
    (`urn:warehouse:yard-management:<events|analytics>:<EventName>:v1`) are all
    required. Type = `com.warehouse.wms.yard-management.<entity>.<EventName>`.
    `data` is snake_case, times are RFC 3339 UTC, `version` is the aggregate
    version. A breaking payload change is a new `.v2` type, never a mutation.
servers:
  production:
    host: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
defaultContentType: application/cloudevents+json
