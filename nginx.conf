# Static EventCatalog site: real files only (SSG output), gzip on, no SPA
# fallback (a missing path is a 404, not index.html). /healthz is a static
# file baked by the Dockerfile for the chart's probes.

# Message ids are namespaced by producing context (`<ctx>-<Event>`, see
# scripts/prepare-specs.mjs step 8). Pre-namespacing event URLs
# (`.../events/<Event>/...`) answer 301 to the page that held that bare id;
# the table is frozen (scripts/migrate-namespaced-message-ids.mjs).
map $legacy_event_id $namespaced_event_id {
    default "";
    include /etc/nginx/legacy-event-ids.map;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # Immutable hashed assets; the HTML documents themselves revalidate.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `/catalog` is the site base (eventcatalog.config.js `base`): the cluster
    # gateway strips it before proxying here, so the Location must carry it back.
    location ~ "^(?<legacy_prefix>/.*)?/events/(?<legacy_event_id>[A-Z][A-Za-z0-9]*)(?<legacy_rest>/.*)?$" {
        absolute_redirect off;
        if ($namespaced_event_id) {
            return 301 /catalog$legacy_prefix/events/$namespaced_event_id$legacy_rest;
        }
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
