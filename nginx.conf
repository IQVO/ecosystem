# Static EventCatalog site: real files only (SSG output), gzip on, no SPA
# fallback (a missing path is a 404, not index.html). /healthz is a static
# file baked by the Dockerfile for the chart's probes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # Immutable hashed assets; the HTML documents themselves revalidate.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
