asyncapi: 2.6.0

info:
  title: amr-fleet-control Domain Events
  version: 1.0.0
  contact:
    name: amr-fleet-control maintainers
    url: https://github.com/IQVO/amr-fleet-control
    email: amr-fleet-control@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event contract of the **amr-fleet-control** bounded context (WCS tier, Generic, segment `wes`; ADR 0001, ADR 0003).
    Seven facts. material-flow-control (WCS plan 04) consumes five: `LegAssigned`, `ContainerPickedUp`, `LegCompleted`
    and `LegFailed` for its subsystem-controller interface (WCS context map relationship 4), and `FleetCapacityChanged`
    for its capacity view. `RobotStateChanged` and `DeadlockDetected` have no consumer yet: material-flow-control skips
    `RobotStateChanged`, and `DeadlockDetected` (like `LegFailed` with reason `ROBOT_BLOCKED`) is designed for
    exception-management (WCS plan 05).

    **Published** through a transactional outbox to `warehouse.amr-fleet-control.events`, and the same occurrence
    (same CloudEvents `id`, `type` and `data`) to `warehouse.amr-fleet-control.analytics` with the `analytics`
    `dataschema` segment. Kafka key = `subject`.

    **Envelope (mandatory).** CloudEvents 1.0 structured mode, header
    `content-type: application/cloudevents+json; charset=UTF-8`,
    `type` = `com.warehouse.wes.amr-fleet-control.<entity>.<EventName>`. Dispatch on the full `type`, ignore unknown
    types, dedupe on `id`.

    **Time.** `time` and every `*_at` field are amr-fleet-control's clock. `robot_timestamp` is the VDA 5050 header
    timestamp of the robot state the fact came from (the emulator's simulated time), present only on such facts.

    No VDA 5050 order, base, horizon or edge is ever published; node ids appear only in `DeadlockDetected`.

servers:
  production:
    url: '{brokers}'
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: kafka.warehouse-systems.internal:9092

tags:
  - name: amr-fleet-control
    description: The amr-fleet-control bounded context (WCS tier).
  - name: mission
    description: Events raised by the Mission aggregate (one leg executed by one robot).
  - name: robot
    description: Events raised by the Robot aggregate.
  - name: fleet
    description: Capacity facts of the whole fleet.
  - name: fleetmap
    description: Events raised by the FleetMap aggregate (traffic control).

defaultContentType: application/cloudevents+json

channels:
  warehouse.amr-fleet-control.events:
    description: The integration topic. Written by the outbox relay; key = subject.
    subscribe:
      operationId: receiveAmrFleetControlEvents
      summary: Receive amr-fleet-control's facts.
      # ruling P3-R12: the consumers stated here, in info.description and in RobotStateChanged's x-no-consumer-reason match ADR 0003's Published types table.
      description: Route on the full `type`. material-flow-control (plan 04) consumes LegAssigned, ContainerPickedUp, LegCompleted, LegFailed and FleetCapacityChanged; RobotStateChanged and DeadlockDetected have no consumer yet.
      tags:
        - name: amr-fleet-control
      message:
        oneOf:
          - $ref: '#/components/messages/LegAssigned'
          - $ref: '#/components/messages/ContainerPickedUp'
          - $ref: '#/components/messages/LegCompleted'
          - $ref: '#/components/messages/LegFailed'
          - $ref: '#/components/messages/RobotStateChanged'
          - $ref: '#/components/messages/FleetCapacityChanged'
          - $ref: '#/components/messages/DeadlockDetected'
  warehouse.amr-fleet-control.analytics:
    description: The analytics twin of every integration event (same id, type and data; analytics dataschema). Not an integration contract.
    subscribe:
      operationId: receiveAmrFleetControlAnalytics
      summary: Receive the analytics twin of every amr-fleet-control event.
      description: Payloads are byte-for-byte the integration payloads; only the `dataschema` stream segment differs.
      tags:
        - name: amr-fleet-control
      message:
        oneOf:
          - $ref: '#/components/messages/LegAssignedAnalytics'
          - $ref: '#/components/messages/ContainerPickedUp'
          - $ref: '#/components/messages/LegCompleted'
          - $ref: '#/components/messages/LegFailed'
          - $ref: '#/components/messages/RobotStateChanged'
          - $ref: '#/components/messages/FleetCapacityChanged'
          - $ref: '#/components/messages/DeadlockDetected'

components:
  messages:
    LegAssigned:
      x-no-consumer-reason: "pending: material-flow-control (WCS plan 04) is the intended consumer; its asyncapi declares this type when it is built, and this reason is deleted in that wave"
      name: LegAssigned
      title: Leg assigned
      summary: A robot was chosen for the leg and its order went out.
      description: '`type` = `com.warehouse.wes.amr-fleet-control.mission.LegAssigned`; subject and key = the leg id.'
      contentType: application/cloudevents+json
      tags: [{name: mission}]
      payload: {$ref: '#/components/schemas/LegAssignedEvent'}
      examples:
        - name: assigned
          summary: Leg leg-7f3a (container C-0001, ST1 to ASRS1-IN1) assigned to EMU/R1.
          payload:
            specversion: '1.0'
            id: 11111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.mission.LegAssigned
            subject: leg-7f3a
            time: '2026-11-20T08:00:01Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:LegAssigned:v1
            data: {leg_id: leg-7f3a, fleet_id: AMR1, container_id: C-0001, from_handoff_point_id: ST1, to_handoff_point_id: ASRS1-IN1, reference: tl-9, robot: {manufacturer: EMU, serial_number: R1}, map_version: v1, assigned_at: '2026-11-20T08:00:01Z'}
    LegAssignedAnalytics:
      name: LegAssigned
      title: Leg assigned (analytics twin)
      summary: A robot was chosen for the leg, on the analytics topic.
      description: 'The analytics twin of `LegAssigned`: same `id`, `type`, `subject` and `data`; only the `dataschema` stream segment is `analytics` (`urn:warehouse:amr-fleet-control:analytics:LegAssigned:v1`). Every other twin differs the same way. Not an integration contract.'
      contentType: application/cloudevents+json
      tags: [{name: mission}]
      payload: {$ref: '#/components/schemas/LegAssignedEvent'}
      examples:
        - name: assigned-analytics
          summary: Leg leg-7f3a assigned to EMU/R1 (analytics twin).
          payload:
            specversion: '1.0'
            id: 11111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.mission.LegAssigned
            subject: leg-7f3a
            time: '2026-11-20T08:00:01Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:analytics:LegAssigned:v1
            data: {leg_id: leg-7f3a, fleet_id: AMR1, container_id: C-0001, from_handoff_point_id: ST1, to_handoff_point_id: ASRS1-IN1, reference: tl-9, robot: {manufacturer: EMU, serial_number: R1}, map_version: v1, assigned_at: '2026-11-20T08:00:01Z'}
    ContainerPickedUp:
      x-no-consumer-reason: "pending: material-flow-control (WCS plan 04) is the intended consumer; its asyncapi declares this type when it is built, and this reason is deleted in that wave"
      name: ContainerPickedUp
      title: Container picked up
      summary: The robot's pick action finished at the leg's from handoff point; the container is on the robot.
      description: '`type` = `com.warehouse.wes.amr-fleet-control.mission.ContainerPickedUp`; subject = the leg id. material-flow-control confirms an AS/RS port pickup to asrs-control with it (decision D15).'
      contentType: application/cloudevents+json
      tags: [{name: mission}]
      payload: {$ref: '#/components/schemas/ContainerPickedUpEvent'}
      examples:
        - name: picked-up
          summary: C-0001 left station ST1 on EMU/R1.
          payload:
            specversion: '1.0'
            id: 21111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.mission.ContainerPickedUp
            subject: leg-7f3a
            time: '2026-11-20T08:01:10Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:ContainerPickedUp:v1
            data: {leg_id: leg-7f3a, fleet_id: AMR1, container_id: C-0001, from_handoff_point_id: ST1, reference: tl-9, robot: {manufacturer: EMU, serial_number: R1}, picked_up_at: '2026-11-20T08:01:10Z', robot_timestamp: '2026-11-20T08:11:40Z'}
    LegCompleted:
      x-no-consumer-reason: "pending: material-flow-control (WCS plan 04) is the intended consumer; its asyncapi declares this type when it is built, and this reason is deleted in that wave"
      name: LegCompleted
      title: Leg completed
      summary: The robot's drop action finished at the leg's to handoff point.
      description: '`type` = `com.warehouse.wes.amr-fleet-control.mission.LegCompleted`; subject = the leg id. One of the two outcomes of every accepted leg (responsibility 6).'
      contentType: application/cloudevents+json
      tags: [{name: mission}]
      payload: {$ref: '#/components/schemas/LegCompletedEvent'}
      examples:
        - name: completed
          summary: C-0001 dropped at ASRS1-IN1.
          payload:
            specversion: '1.0'
            id: 31111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.mission.LegCompleted
            subject: leg-7f3a
            time: '2026-11-20T08:02:30Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:LegCompleted:v1
            data: {leg_id: leg-7f3a, fleet_id: AMR1, container_id: C-0001, to_handoff_point_id: ASRS1-IN1, reference: tl-9, robot: {manufacturer: EMU, serial_number: R1}, completed_at: '2026-11-20T08:02:30Z', robot_timestamp: '2026-11-20T08:25:00Z'}
    LegFailed:
      x-no-consumer-reason: "pending: material-flow-control (WCS plan 04) and exception-management (WCS plan 05, reason ROBOT_BLOCKED) are the intended consumers; deleted when the first of them declares this type"
      name: LegFailed
      title: Leg failed
      summary: The leg ended without its drop, or was cancelled; the other outcome of every accepted leg.
      description: '`type` = `com.warehouse.wes.amr-fleet-control.mission.LegFailed`; subject = the leg id. exception-management opens a case for reason ROBOT_BLOCKED. `container_on_robot` is true when the leg failed after the pickup.'
      contentType: application/cloudevents+json
      tags: [{name: mission}]
      payload: {$ref: '#/components/schemas/LegFailedEvent'}
      examples:
        - name: pick-failed
          summary: The container was not at ST1.
          payload:
            specversion: '1.0'
            id: 41111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.mission.LegFailed
            subject: leg-8b21
            time: '2026-11-20T08:03:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:LegFailed:v1
            data: {leg_id: leg-8b21, fleet_id: AMR1, container_id: C-0002, from_handoff_point_id: ST1, to_handoff_point_id: ASRS1-IN1, robot: {manufacturer: EMU, serial_number: R2}, reason: PICK_FAILED, robot_error: LOAD_NOT_AVAILABLE, container_on_robot: false, failed_at: '2026-11-20T08:03:00Z'}
    RobotStateChanged:
      x-no-consumer-reason: "none yet: material-flow-control (WCS plan 04) skips this type and reads fleet capacity from FleetCapacityChanged; this reason is deleted when a consumer declares this type"
      name: RobotStateChanged
      title: Robot state changed
      summary: A robot's PackML state or connection changed (never a battery tick).
      description: '`type` = `com.warehouse.wes.amr-fleet-control.robot.RobotStateChanged`; subject = `<manufacturer>/<serialNumber>`.'
      contentType: application/cloudevents+json
      tags: [{name: robot}]
      payload: {$ref: '#/components/schemas/RobotStateChangedEvent'}
      examples:
        - name: held
          summary: EMU/R1 is blocked by an obstacle.
          payload:
            specversion: '1.0'
            id: 51111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.robot.RobotStateChanged
            subject: EMU/R1
            time: '2026-11-20T08:04:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:RobotStateChanged:v1
            data: {fleet_id: AMR1, robot: {manufacturer: EMU, serial_number: R1}, state: HELD, previous_state: EXECUTE, connection: ONLINE, battery_percent: 64.5, charging: false, error_types: [ROBOT_BLOCKED], changed_at: '2026-11-20T08:04:00Z', robot_timestamp: '2026-11-20T08:40:00Z'}
    FleetCapacityChanged:
      x-no-consumer-reason: "pending: material-flow-control (WCS plan 04) is the intended consumer; its asyncapi declares this type when it is built, and this reason is deleted in that wave"
      name: FleetCapacityChanged
      title: Fleet capacity changed
      summary: A count of the fleet's capacity snapshot changed (published on change, never periodically).
      description: '`type` = `com.warehouse.wes.amr-fleet-control.fleet.FleetCapacityChanged`; subject = the fleet id. material-flow-control aggregates it into SubsystemCapacityChanged.'
      contentType: application/cloudevents+json
      tags: [{name: fleet}]
      payload: {$ref: '#/components/schemas/FleetCapacityChangedEvent'}
      examples:
        - name: one-offline
          summary: One of three robots went offline.
          payload:
            specversion: '1.0'
            id: 61111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.fleet.FleetCapacityChanged
            subject: AMR1
            time: '2026-11-20T08:05:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:FleetCapacityChanged:v1
            data: {fleet_id: AMR1, robots_total: 3, robots_online: 2, robots_available: 1, robots_charging: 0, robots_held: 0, legs_queued: 2, legs_active: 1, changed_at: '2026-11-20T08:05:00Z'}
    DeadlockDetected:
      x-no-consumer-reason: "pending: exception-management (WCS plan 05) is the intended consumer; its asyncapi declares this type when that change lands, and this reason is deleted then"
      name: DeadlockDetected
      title: Deadlock detected
      summary: Robots wait on each other in a cycle; published once per cycle.
      description: '`type` = `com.warehouse.wes.amr-fleet-control.fleetmap.DeadlockDetected`; subject = the fleet id. For exception-management. `node_ids[i]` is the node `robots[i]` waits for.'
      contentType: application/cloudevents+json
      tags: [{name: fleetmap}]
      payload: {$ref: '#/components/schemas/DeadlockDetectedEvent'}
      examples:
        - name: two-robots
          summary: EMU/R1 and EMU/R2 face each other in one corridor.
          payload:
            specversion: '1.0'
            id: 71111111-2222-4333-8444-555555555555
            source: /warehouse/amr-fleet-control
            type: com.warehouse.wes.amr-fleet-control.fleetmap.DeadlockDetected
            subject: AMR1
            time: '2026-11-20T08:06:00Z'
            datacontenttype: application/json
            dataschema: urn:warehouse:amr-fleet-control:events:DeadlockDetected:v1
            data: {fleet_id: AMR1, deadlock_id: dl-1c2d, robots: [{manufacturer: EMU, serial_number: R1}, {manufacturer: EMU, serial_number: R2}], node_ids: [M2, M1], detected_at: '2026-11-20T08:06:00Z'}
  schemas:
    # carry (Task 13 review): every required id, the robot fields, map_version and node_ids items carry minLength: 1, so the contract is no looser than plan 04's consumer, which dead-letters empty values.
    CloudEventEnvelope:
      type: object
      additionalProperties: false
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: {type: string, const: '1.0'}
        id: {type: string, description: UUID minted once per occurrence; consumers dedupe on it.}
        source: {type: string, const: /warehouse/amr-fleet-control}
        type: {type: string, description: 'com.warehouse.wes.amr-fleet-control.<entity>.<EventName>.'}
        subject: {type: string}
        time: {type: string, format: date-time}
        datacontenttype: {type: string, const: application/json}
        dataschema: {type: string, description: 'urn:warehouse:amr-fleet-control:<events|analytics>:<EventName>:v1.'}
        data: {type: object, description: The fact's payload; each message's schema pins it.}
    Robot:
      type: object
      additionalProperties: false
      required: [manufacturer, serial_number]
      properties:
        manufacturer: {type: string, minLength: 1}
        serial_number: {type: string, minLength: 1}
    LegAssignedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.mission.LegAssigned}
            data: {$ref: '#/components/schemas/LegAssigned'}
    ContainerPickedUpEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.mission.ContainerPickedUp}
            data: {$ref: '#/components/schemas/ContainerPickedUp'}
    LegCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.mission.LegCompleted}
            data: {$ref: '#/components/schemas/LegCompleted'}
    LegFailedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.mission.LegFailed}
            data: {$ref: '#/components/schemas/LegFailed'}
    RobotStateChangedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.robot.RobotStateChanged}
            data: {$ref: '#/components/schemas/RobotStateChanged'}
    FleetCapacityChangedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.fleet.FleetCapacityChanged}
            data: {$ref: '#/components/schemas/FleetCapacityChanged'}
    DeadlockDetectedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            type: {type: string, const: com.warehouse.wes.amr-fleet-control.fleetmap.DeadlockDetected}
            data: {$ref: '#/components/schemas/DeadlockDetected'}
    LegAssigned:
      type: object
      additionalProperties: false
      required: [leg_id, fleet_id, container_id, from_handoff_point_id, to_handoff_point_id, robot, map_version, assigned_at]
      properties:
        leg_id: {type: string, minLength: 1}
        fleet_id: {type: string, minLength: 1}
        container_id: {type: string, minLength: 1}
        from_handoff_point_id: {type: string, minLength: 1}
        to_handoff_point_id: {type: string, minLength: 1}
        reference: {type: string, description: "The caller's reference from the leg request, when given."}
        robot: {$ref: '#/components/schemas/Robot'}
        map_version: {type: string, minLength: 1, description: The map version the leg is pinned to (e.g. v1).}
        assigned_at: {type: string, format: date-time}
    ContainerPickedUp:
      type: object
      additionalProperties: false
      required: [leg_id, fleet_id, container_id, from_handoff_point_id, robot, picked_up_at]
      properties:
        leg_id: {type: string, minLength: 1}
        fleet_id: {type: string, minLength: 1}
        container_id: {type: string, minLength: 1}
        from_handoff_point_id: {type: string, minLength: 1}
        reference: {type: string, description: "The caller's reference from the leg request, when given."}
        robot: {$ref: '#/components/schemas/Robot'}
        picked_up_at: {type: string, format: date-time}
        robot_timestamp: {type: string, format: date-time, description: "The VDA 5050 header timestamp of the robot state the fact came from (the emulator's simulated time); absent when no robot state carried it."}
    LegCompleted:
      type: object
      additionalProperties: false
      required: [leg_id, fleet_id, container_id, to_handoff_point_id, robot, completed_at]
      properties:
        leg_id: {type: string, minLength: 1}
        fleet_id: {type: string, minLength: 1}
        container_id: {type: string, minLength: 1}
        to_handoff_point_id: {type: string, minLength: 1}
        reference: {type: string, description: "The caller's reference from the leg request, when given."}
        robot: {$ref: '#/components/schemas/Robot'}
        completed_at: {type: string, format: date-time}
        robot_timestamp: {type: string, format: date-time, description: "The VDA 5050 header timestamp of the robot state the fact came from (the emulator's simulated time); absent when no robot state carried it."}
    LegFailed:
      type: object
      additionalProperties: false
      required: [leg_id, fleet_id, container_id, from_handoff_point_id, to_handoff_point_id, reason, container_on_robot, failed_at]
      properties:
        leg_id: {type: string, minLength: 1}
        fleet_id: {type: string, minLength: 1}
        container_id: {type: string, minLength: 1}
        from_handoff_point_id: {type: string, minLength: 1}
        to_handoff_point_id: {type: string, minLength: 1}
        reference: {type: string, description: "The caller's reference from the leg request, when given."}
        robot: {$ref: '#/components/schemas/Robot'}
        reason: {type: string, enum: [CANCELLED, ROBOT_BLOCKED, ROBOT_FAULT, ROBOT_OFFLINE, ORDER_REJECTED, PICK_FAILED, DROP_FAILED, MAP_VERSION_RETIRED]}
        robot_error: {type: string, description: "The robot's VDA 5050 errorType (e.g. LOAD_NOT_AVAILABLE), when the failure came from the robot."}
        container_on_robot: {type: boolean, description: True when the leg failed after the pickup.}
        failed_at: {type: string, format: date-time}
    RobotStateChanged:
      type: object
      additionalProperties: false
      required: [fleet_id, robot, state, previous_state, connection, battery_percent, charging, error_types, changed_at]
      properties:
        fleet_id: {type: string, minLength: 1}
        robot: {$ref: '#/components/schemas/Robot'}
        state: {type: string, enum: [IDLE, EXECUTE, SUSPENDED, HELD, STOPPED]}
        previous_state: {type: string, enum: [IDLE, EXECUTE, SUSPENDED, HELD, STOPPED]}
        connection: {type: string, enum: [ONLINE, OFFLINE, CONNECTION_BROKEN]}
        battery_percent: {type: number, minimum: 0, maximum: 100}
        charging: {type: boolean}
        error_types: {type: array, items: {type: string}}
        changed_at: {type: string, format: date-time}
        robot_timestamp: {type: string, format: date-time, description: "The VDA 5050 header timestamp of the robot state the fact came from (the emulator's simulated time); absent when no robot state carried it."}
    FleetCapacityChanged:
      type: object
      additionalProperties: false
      required: [fleet_id, robots_total, robots_online, robots_available, robots_charging, robots_held, legs_queued, legs_active, changed_at]
      properties:
        fleet_id: {type: string, minLength: 1}
        robots_total: {type: integer, minimum: 0}
        robots_online: {type: integer, minimum: 0}
        robots_available: {type: integer, minimum: 0}
        robots_charging: {type: integer, minimum: 0}
        robots_held: {type: integer, minimum: 0}
        legs_queued: {type: integer, minimum: 0}
        legs_active: {type: integer, minimum: 0}
        changed_at: {type: string, format: date-time}
    DeadlockDetected:
      type: object
      additionalProperties: false
      required: [fleet_id, deadlock_id, robots, node_ids, detected_at]
      properties:
        fleet_id: {type: string, minLength: 1}
        deadlock_id: {type: string, minLength: 1}
