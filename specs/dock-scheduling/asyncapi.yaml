    DockAppointmentBookedAnalytics:
      x-no-consumer-reason: "analytics twin: consumed by this service's own projector only"
      name: DockAppointmentBooked
      title: "DockAppointmentBooked"
      summary: "A door window was booked."
      description: "`type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked`; subject and Kafka key = appointment id. Analytics twin (same id and type, dataschema `analytics`). Consumers: yard-management, warehouse-planning, inbound-receiving. Optional standard fields (ADR 0013): `x12_status`, `cbv_biz_step`, `read_point_gln`; each is omitted when it has no honest value."
