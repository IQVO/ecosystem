asyncapi: 2.6.0

info:
  title: dock-scheduling Domain Events
  version: "1.0.0"
  contact:
    name: dock-scheduling maintainers
    url: https://github.com/IQVO/dock-scheduling
    email: dock-scheduling@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **dock-scheduling** bounded context (WMS subdomain): the door calendar of every site (ADR 0001, ADR 0002).

    **Published.** The `DockAppointment` aggregate raises eight events and the `DockCalendar` aggregate three. Seven of the eleven
    go to `warehouse.dock-scheduling.events` (`DockAppointmentDoorReassigned` since ADR 0010); the analytics-only facts
    (`DockAppointmentCheckedIn`, `DockAppointmentCompleted`, `DockAppointmentAtRisk`, `DoorOperatingHoursDeclared`) go ONLY to
    `warehouse.dock-scheduling.analytics`, where every published fact also appears as its analytics twin.
    Every fact is written to its stream through a **transactional outbox**: the aggregate row and its already-encoded events commit in
    ONE database transaction and a relay drains them to Kafka (at-least-once; the CloudEvents `id` is stored with the outbox row, so a
    retry republishes the same `id`). Kafka key = appointment id (site id for the calendar events), so one appointment's history stays
    ordered on one partition.

    **Consumed (ADR 0003).** facility-layout (`ZoneRegistered`, `LocationSlotRegistered`, `LocationSlotDecommissioned`),
    inbound-receiving (`ASNRegistered`, `ASNCancelled`, and the legacy `DockAppointment*` for the strangler stage A importer),
    process-path-management (`CPTScheduleChanged`) and yard-management (`VisitCheckedIn`, `VisitRejected`, `TrailerDocked`,
    `TrailerUndocked`). The consumed messages below are restated from the producers' own contracts and never imported.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json;
    charset=UTF-8`. `specversion`, `id`, `source` (`/warehouse/dock-scheduling`), `type`, `subject`, `time`, `datacontenttype`
    (`application/json`) and `dataschema` (`urn:warehouse:dock-scheduling:events:<EventName>:v1`) are all required. Type =
    `com.warehouse.wms.dock-scheduling.<entity>.<EventName>` with entity `dockappointment` or `dockcalendar`. A breaking payload
    change is a new `.v2` type, never a mutation.

servers:
  production:
    url: "{brokers}"
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: "kafka.warehouse-systems.internal:9092"

defaultContentType: application/cloudevents+json

tags:
  - name: dock-scheduling
    description: The dock-scheduling bounded context (WMS subdomain).
  - name: dockappointment
    description: Events raised by the DockAppointment aggregate.
  - name: dockcalendar
    description: Events raised by the DockCalendar aggregate.
  - name: analytics
    description: "The analytics read side of this context (ADR 0006): the analytics topic, its projector and the reports binary."
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).

channels:
  warehouse.dock-scheduling.events:
    description: |
      This service's integration topic. Written by the outbox relay; key = appointment id (site id for the door calendar events);
      the only Kafka header on every message is the CloudEvents `content-type`. Rows the relay can never encode are parked raw on
      `warehouse.dock-scheduling.events.dlq`. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.
    subscribe:
      operationId: receiveDockSchedulingEvents
      summary: Receive the appointment lifecycle and door closures.
      description: |
        Route on the full `type` (`com.warehouse.wms.dock-scheduling.dockappointment.<EventName>` and
        `com.warehouse.wms.dock-scheduling.dockcalendar.<EventName>`). `DockAppointmentBooked` and `DockAppointmentRescheduled` carry the
        site's arrival tolerance; `DockAppointmentCancelled` carries the reason; `DockAppointmentNoShow` is terminal;
        `DockAppointmentDoorReassigned` moves the appointment to the door the trailer actually docked at, window unchanged (ADR 0010).
      tags:
        - name: dockappointment
      message:
        oneOf:
          - $ref: "#/components/messages/DockAppointmentBooked"
          - $ref: "#/components/messages/DockAppointmentRescheduled"
          - $ref: "#/components/messages/DockAppointmentCancelled"
          - $ref: "#/components/messages/DockAppointmentNoShow"
          - $ref: "#/components/messages/DockAppointmentDoorReassigned"
          - $ref: "#/components/messages/DoorClosureScheduled"
          - $ref: "#/components/messages/DoorClosureLifted"

  warehouse.dock-scheduling.analytics:
    description: |
      This service's own analytics stream (ADR 0006), written by the SAME transactional outbox relay as the integration topic: every
      published fact appears here too, under the SAME CloudEvents id and `type`, with only the `dataschema` stream segment different
      (urn:warehouse:dock-scheduling:analytics:<EventName>:v1); the four analytics-only facts (`DockAppointmentCheckedIn`,
      `DockAppointmentCompleted`, `DockAppointmentAtRisk`, `DoorOperatingHoursDeclared`) appear ONLY here. It is NOT an integration
      contract: the only consumer is this service's `cmd/dock-projector` (fixed group from `ANALYTICS_CONSUMER_GROUP`, starting at the
      earliest retained offset), which folds the events into the analytical database; its deterministic poison goes to
      `warehouse.dock-scheduling.analytics.dlq`.
    subscribe:
      operationId: receiveDockSchedulingAnalytics
      summary: Receive the analytics twin of every published fact.
      description: |
        Payloads are byte-for-byte the integration payloads (ADR 0006); only the dataschema names the analytics stream. The projector
        answers the schedule-adherence report from the folded facts.
      tags:
        - name: analytics
      message:
        oneOf:
          - $ref: "#/components/messages/DockAppointmentBookedAnalytics"
          - $ref: "#/components/messages/DockAppointmentRescheduledAnalytics"
          - $ref: "#/components/messages/DockAppointmentCancelledAnalytics"
          - $ref: "#/components/messages/DockAppointmentNoShowAnalytics"
          - $ref: "#/components/messages/DockAppointmentCheckedInAnalytics"
          - $ref: "#/components/messages/DockAppointmentDoorReassignedAnalytics"
          - $ref: "#/components/messages/DockAppointmentCompletedAnalytics"
          - $ref: "#/components/messages/DockAppointmentAtRiskAnalytics"
          - $ref: "#/components/messages/DoorClosureScheduledAnalytics"
          - $ref: "#/components/messages/DoorClosureLiftedAnalytics"
          - $ref: "#/components/messages/DoorOperatingHoursDeclaredAnalytics"

  warehouse.facility.events:
    description: |
      facility-layout's integration topic. This service consumes `ZoneRegistered`, `LocationSlotRegistered` and `LocationSlotDecommissioned` under a stable consumer group read from env `FACILITY_CONSUMER_GROUP`. Every other type on the topic is ignored. Key = zoneId / locationCode.
    publish:
      operationId: consumeFacilityEvents
      summary: Consume the zone and dock-slot registrations.
      description: |
        A `LocationSlotRegistered` with `role=Dock` upserts a door (`dockFlow` Inbound, Outbound or Both); any other role removes it; a decommission deletes it. A door's site is resolved at use time by joining its zone to `ZoneRegistered.siteCode`. The CloudEvents `id` claim and the effect commit in one transaction; the offset is committed afterwards.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/ZoneRegistered"
          - $ref: "#/components/messages/LocationSlotRegistered"
          - $ref: "#/components/messages/LocationSlotDecommissioned"

  warehouse.inbound-receiving.events:
    description: |
      inbound-receiving's integration topic. Two consumers read it: the ASN consumer (`ASNRegistered`, `ASNCancelled`; group env `ASN_CONSUMER_GROUP`) and the legacy importer of the strangler stage A (`DockAppointmentBooked`, `DockAppointmentCheckedIn`, `DockAppointmentCancelled`, `DockAppointmentCompleted`; group env `DOCK_LEGACY_IMPORT_CONSUMER_GROUP`, off when unset). Every other type is ignored. Key = ASN number / appointment id.
    publish:
      operationId: consumeInboundReceivingEvents
      summary: Consume ASN lifecycle and the legacy appointment events.
      description: |
        ASN events feed the `asns` copy (CANCELLED is sticky) and CancelWhenAllAsnsCancelled. The legacy events import and move appointments with provenance `legacy-import` (ADR 0002 A12). The CloudEvents `id` claim and the effect commit in one transaction.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/ASNRegistered"
          - $ref: "#/components/messages/ASNCancelled"
          - $ref: "#/components/messages/ConsumedDockAppointmentBooked"
          - $ref: "#/components/messages/ConsumedDockAppointmentCheckedIn"
          - $ref: "#/components/messages/ConsumedDockAppointmentCancelled"
          - $ref: "#/components/messages/ConsumedDockAppointmentCompleted"

  warehouse.process-path-management.events:
    description: |
      process-path-management's integration topic. This service consumes ONLY `CPTScheduleChanged` under a stable consumer group read from env `CPT_CONSUMER_GROUP`. Every other type is ignored. Key = site id.
    publish:
      operationId: consumeProcessPathEvents
      summary: Consume the CPT schedule of a site.
      description: |
        The event is the whole schedule of the site: its rows in the `cutoffs` copy are replaced. v1 creates no appointment from it (PickupFromCutoffs is phase 2); an OUTBOUND booking may name a `cpt_id` of the copy.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/CPTScheduleChanged"

  warehouse.yard-management.events:
    description: |
      yard-management's integration topic. This service consumes `VisitCheckedIn`, `VisitRejected`, `TrailerDocked` and `TrailerUndocked` under a stable consumer group read from env `YARD_CONSUMER_GROUP`. Every other type is ignored. Yard events are keyed by visit or trailer, not by appointment, so they can arrive in any order across partitions.
    publish:
      operationId: consumeYardEvents
      summary: Consume the physical yard facts.
      description: |
        ArrivalFromGate, CancelOnVisitRejected, ActualDoorWins, CompleteOnDoorRelease and OutOfOrderYardFacts (ADR 0002, ADR 0003). Facts for unknown or terminal appointments are ignored and counted. The CloudEvents `id` claim and the effect commit in one transaction.
      tags:
        - name: consumed
      message:
        oneOf:
          - $ref: "#/components/messages/VisitCheckedIn"
          - $ref: "#/components/messages/VisitRejected"
          - $ref: "#/components/messages/TrailerDocked"
          - $ref: "#/components/messages/TrailerUndocked"

components:
  messages:
    DockAppointmentBooked:
      name: DockAppointmentBooked
      title: "DockAppointmentBooked"
      summary: "A door window was booked (or a legacy appointment imported)."
      description: "`type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked`; subject and Kafka key = appointment id. Integration stream. Consumers: yard-management, warehouse-planning, inbound-receiving."
      contentType: application/cloudevents+json
      tags:
        - name: dockappointment
      payload:
        $ref: "#/components/schemas/DockAppointmentBookedCloudEvent"
      examples:
        - name: dockAppointmentBooked
          summary: "A door window was booked (or a legacy appointment imported)."
          payload: {"specversion": "1.0", "id": "00001000-1111-4222-8333-444455556666", "source": "/warehouse/dock-scheduling", "type": "com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked", "subject": "appt-123e4567-e89b-12d3-a456-426614174000", "time": "2026-11-05T12:00:00Z", "datacontenttype": "application/json", "dataschema": "urn:warehouse:dock-scheduling:events:DockAppointmentBooked:v1", "data": {"appointment_id": "appt-123e4567-e89b-12d3-a456-426614174000", "site_id": "WH1", "direction": "INBOUND", "door_code": "WH1-DOCK-IN-01", "carrier": "ACME Freight", "carrier_scac": "ACMF", "window_start": "2026-11-06T08:00:00Z", "window_end": "2026-11-06T10:00:00Z", "asn_numbers": ["ASN-1001"], "cpt_id": null, "shipment_refs": [], "expected_seal_number": "SEAL-77120", "arrival_tolerance_minutes": 15, "provenance": "native", "version": 1}}
    DockAppointmentBookedAnalytics:
      x-no-consumer-reason: "analytics twin: consumed by this service's own projector only"
      name: DockAppointmentBooked
      title: "DockAppointmentBooked"
      summary: "A door window was booked (or a legacy appointment imported)."
      description: "`type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentBooked`; subject and Kafka key = appointment id. Analytics twin (same id and type, dataschema `analytics`). Consumers: yard-management, warehouse-planning, inbound-receiving."
      contentType: application/cloudevents+json
      tags:
        - name: analytics
      payload:
        $ref: "#/components/schemas/DockAppointmentBookedAnalyticsCloudEvent"
      examples:
        - name: dockAppointmentBooked
          summary: "A door window was booked (or a legacy appointment imported)."
