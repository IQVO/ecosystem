      examples:
        - name: dockAppointmentCancelled
          summary: "A BOOKED or CHECKED_IN appointment was cancelled."
          payload: {"specversion": "1.0", "id": "00001005-1111-4222-8333-444455556666", "source": "/warehouse/dock-scheduling", "type": "com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentCancelled", "subject": "appt-123e4567-e89b-12d3-a456-426614174000", "time": "2026-11-05T12:00:00Z", "datacontenttype": "application/json", "dataschema": "urn:warehouse:dock-scheduling:analytics:DockAppointmentCancelled:v1", "data": {"appointment_id": "appt-123e4567-e89b-12d3-a456-426614174000", "site_id": "WH1", "door_code": "WH1-DOCK-IN-01", "reason": "CARRIER_REQUEST", "version": 2}}
