      description: "`type` = `com.warehouse.wms.dock-scheduling.dockappointment.DockAppointmentCancelled`; subject and Kafka key = appointment id. Analytics twin (same id and type, dataschema `analytics`). Consumers: yard-management, warehouse-planning, inbound-receiving."
      contentType: application/cloudevents+json
