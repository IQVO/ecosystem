# No-consumer allowlist for scripts/check-orphan-events.mjs (Phase 7.2).
#
# Full CloudEvents type -> one-line reason why the type is published with no
# consumer in the fleet. The sensor prefers a native `x-no-consumer-reason`
# extension on the producer's message (or channel) and falls back to this file;
# entries here are the decided keep-list until the producer repos carry the
# extension natively (rollout planned separately).
#
# Hand-maintained: scripts/sync-specs.sh rewrites specs/<context>/ only and
# never touches this file. An entry that stops matching a real orphan is
# reported as stale by the sensor and should be removed.
#
# Transitional entries carry a reason starting with `pending:` — they excuse a
# type only until the named work lands; the follow-up wave deletes them.
#
