# No-consumer allowlist for scripts/check-orphan-events.mjs (Phase 7.2).
#
# Full CloudEvents type -> one-line reason why the type is published with no
# consumer in the fleet. The sensor prefers a native `x-no-consumer-reason`
# extension on the producer's message (or channel) and falls back to this file.
#
# 2026-10-24 orphan wave: EMPTY BY DESIGN. Every previous entry either
#   - moved NATIVE into the producer contract (x-no-consumer-reason), or
#   - gained a declared consumer:
#       - inventory-storage -> facility-layout (facility cache, ADR 0040/0047)
#       - inbound-receiving, pick-face-replenishment -> product-master
#         pack-level facts (packaging views)
#       - node-performance, seller-inbound -> vendor-connectivity receipts,
#         offer-availability pack levels (incl. the commerce-tier fix in
#         vendor-connectivity #20)
#       - vendor-connectivity -> seller-inbound shipment facts
# If a new orphan appears, prefer the native extension in the producer repo;
# add an entry here only when that contract cannot be edited in the same pass.
#
# Hand-maintained: scripts/sync-specs.sh rewrites specs/<context>/ only and
# never touches this file. An entry that stops matching a real orphan is
# reported as stale by the sensor and should be removed.
#
# Transitional entries carry a reason starting with `pending:` - they excuse a
# type only until the named work lands; the follow-up wave deletes them.
