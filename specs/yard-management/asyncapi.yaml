      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          description: UUID minted once per occurrence; stable across relay retries. Dedupe on it.
        source:
          type: string
        type:
          type: string
        subject:
          type: string
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
        data:
          type: object
    VisitCheckedInData:
      type: object
      required:
      - visit_id
      - site_id
      - carrier
      - carrier_scac
      - purpose
      - appointment_id
      - trailers
      - arrived_at
      - version
      properties:
        visit_id:
          type: string
        site_id:
          type: string
        carrier:
          type: string
        carrier_scac:
          type:
          - string
          - 'null'
        purpose:
          type: string
          enum:
          - DROP
          - LIVE_UNLOAD
          - LIVE_LOAD
          - PICKUP
          - BOBTAIL
        appointment_id:
          type:
          - string
          - 'null'
        trailers:
          type: array
          items:
            type: object
            required:
            - trailer_id
            - unit_number
            - carrier_scac
            - kind
            - load_state
            properties:
              trailer_id:
                type: string
              unit_number:
                type: string
              carrier_scac:
                type:
                - string
                - 'null'
              kind:
                type: string
                enum:
                - DRY_VAN
                - REEFER
                - FLATBED
                - CONTAINER
              load_state:
                type: string
                enum:
                - EMPTY
                - LOADED
                - PARTIAL
              unit_number_scheme:
                type:
                - string
                - 'null'
                enum:
                - ISO6346
                - null
                description: Additive, optional. ISO6346 when the unit number was validated as an ISO 6346 container number
                  (a CONTAINER kind always is, any other kind when the caller declared the scheme); null for a free-form number.
              seal_class:
                type:
                - string
                - 'null'
                enum:
                - I
                - S
                - H
                - null
                description: Additive, optional. The ISO 17712 class declared for the seal (I indicative, S security, H high
                  security); null when none was declared. A seal number is not part of this event.
              hazmat_class:
                type:
                - string
                - 'null'
                enum:
                - '1'
                - '1.1'
                - '1.2'
                - '1.3'
                - '1.4'
                - '1.5'
                - '1.6'
                - '2'
                - '2.1'
                - '2.2'
                - '2.3'
                - '3'
                - '4'
                - '4.1'
                - '4.2'
                - '4.3'
                - '5'
                - '5.1'
                - '5.2'
                - '6'
                - '6.1'
                - '6.2'
                - '7'
                - '8'
                - '9'
                - null
                description: Additive, optional. The US DOT hazard class or division the shipper declared for the trailer (ADR 0014); null when none.
              un_number:
                type:
                - string
                - 'null'
                pattern: ^UN[0-9]{4}$
                description: Additive, optional. The UN number of the material, `UN` and four digits; null when none was declared.
              requires_temperature_control:
                type: boolean
                description: Additive, optional. True for a load that needs a refrigeration plug; false when not declared.
        arrived_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
