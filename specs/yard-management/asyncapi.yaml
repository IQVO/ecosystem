asyncapi: 3.0.0
info:
  title: yard-management Domain Events
  version: 1.0.0
  contact:
    name: yard-management maintainers
    url: https://github.com/IQVO/yard-management
    email: yard-management@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
  - name: yard-management
    description: The yard-management bounded context (WMS subdomain).
  description: 'Event catalogue of the **yard-management** bounded context (WMS subdomain): everything physically on site
    outside the four walls - visits through the gate, which trailer is where, hostler and visiting-driver moves, door work
    and yard checks (ADR 0001, 0002).


    **Published.** Five aggregates (YardVisit, Trailer, YardMove, YardCheck, Inspection) raise 23 event types through a transactional
    outbox: the aggregate row and its events are written in ONE database transaction and a relay drains them to Kafka (at-least-once;
    the CloudEvents `id` is stored with the outbox row). Thirteen types are integration events on `warehouse.yard-management.events`
    (VisitCheckedIn, VisitRejected, TrailerDocked, TrailerUndocked, SealExceptionRaised, TrailerDwellExceeded, YardCheckClosed, DoorWorkCompleted, TrailerDeparted,
    TrailerSecured, TrailerSecuringReleased, InspectionCompleted, InspectionFailed)
    and are mirrored on `warehouse.yard-management.analytics` under the same id; the other ten are analytics-only and go
    ONLY to the analytics topic. The key of every message is its aggregate root id (`visit_id`, `trailer_id`, `move_id`, `yard_check_id`, `inspection_id`).


    **Consumed (ADR 0003).** dock-scheduling (appointments, door closures and the carrier registry), facility-layout (locations and zones) and inbound-receiving
    (ASNs and receipts) feed event-fed local copies; no sibling is ever called live. A message that is not a valid CloudEvents
    1.0 event is skipped; a valid event of an unlisted `type` is ignored; a payload that can never be applied is dead-lettered
    to `<topic>.dlq`; any other handler error is retried and dead-lettered after 5 attempts. Consumer groups come from `DOCK_SCHEDULING_CONSUMER_GROUP`,
    `FACILITY_CONSUMER_GROUP`, `INBOUND_RECEIVING_CONSUMER_GROUP` and `ANALYTICS_CONSUMER_GROUP`.


    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json;
    charset=UTF-8`. `specversion`, `id`, `source` (`/warehouse/yard-management`), `type`, `subject`, `time`, `datacontenttype`
    (`application/json`) and `dataschema` (`urn:warehouse:yard-management:<events|analytics>:<EventName>:v1`) are all required.
    Type = `com.warehouse.wms.yard-management.<entity>.<EventName>`. `data` is snake_case, times are RFC 3339 UTC, `version`
    is the aggregate version. A breaking payload change is a new `.v2` type, never a mutation.'
servers:
  production:
    host: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
defaultContentType: application/cloudevents+json
channels:
  yardManagementEvents:
    address: warehouse.yard-management.events
    description: This service's integration topic. Written by the outbox relay; key = the aggregate root id. A row that can
      never be encoded goes verbatim to `warehouse.yard-management.events.dlq`.
    messages:
      VisitCheckedIn:
        $ref: '#/components/messages/VisitCheckedIn'
      VisitRejected:
        $ref: '#/components/messages/VisitRejected'
      TrailerDocked:
        $ref: '#/components/messages/TrailerDocked'
      TrailerUndocked:
        $ref: '#/components/messages/TrailerUndocked'
      SealExceptionRaised:
        $ref: '#/components/messages/SealExceptionRaised'
      TrailerDwellExceeded:
        $ref: '#/components/messages/TrailerDwellExceeded'
      YardCheckClosed:
        $ref: '#/components/messages/YardCheckClosed'
      InspectionCompleted:
        $ref: '#/components/messages/InspectionCompleted'
      InspectionFailed:
        $ref: '#/components/messages/InspectionFailed'
      DoorWorkCompleted:
        $ref: '#/components/messages/DoorWorkCompleted'
      TrailerDeparted:
        $ref: '#/components/messages/TrailerDeparted'
      TrailerSecured:
        $ref: '#/components/messages/TrailerSecured'
      TrailerSecuringReleased:
        $ref: '#/components/messages/TrailerSecuringReleased'
  yardManagementAnalytics:
    address: warehouse.yard-management.analytics
    description: 'This service''s analytics stream, written by the SAME outbox pass: the thirteen integration types again (same
      id, byte-identical payload, analytics dataschema) plus the ten analytics-only types. Consumed ONLY by this service''s
      own projector.'
    messages:
      VisitCheckedInAnalytics:
        $ref: '#/components/messages/VisitCheckedInAnalytics'
      VisitRejectedAnalytics:
        $ref: '#/components/messages/VisitRejectedAnalytics'
      VisitCheckedOutAnalytics:
        $ref: '#/components/messages/VisitCheckedOutAnalytics'
      TrailerDockedAnalytics:
        $ref: '#/components/messages/TrailerDockedAnalytics'
      TrailerUndockedAnalytics:
        $ref: '#/components/messages/TrailerUndockedAnalytics'
      TrailerParkedAnalytics:
        $ref: '#/components/messages/TrailerParkedAnalytics'
      DoorWorkStartedAnalytics:
        $ref: '#/components/messages/DoorWorkStartedAnalytics'
      DoorWorkCompletedAnalytics:
        $ref: '#/components/messages/DoorWorkCompletedAnalytics'
      TrailerDepartedAnalytics:
        $ref: '#/components/messages/TrailerDepartedAnalytics'
      SealExceptionRaisedAnalytics:
        $ref: '#/components/messages/SealExceptionRaisedAnalytics'
      TrailerDwellExceededAnalytics:
        $ref: '#/components/messages/TrailerDwellExceededAnalytics'
      TrailerHeldAnalytics:
        $ref: '#/components/messages/TrailerHeldAnalytics'
      TrailerHoldReleasedAnalytics:
        $ref: '#/components/messages/TrailerHoldReleasedAnalytics'
      TrailerSecuredAnalytics:
        $ref: '#/components/messages/TrailerSecuredAnalytics'
      TrailerSecuringReleasedAnalytics:
        $ref: '#/components/messages/TrailerSecuringReleasedAnalytics'
      YardMoveRequestedAnalytics:
        $ref: '#/components/messages/YardMoveRequestedAnalytics'
      YardMoveClaimedAnalytics:
        $ref: '#/components/messages/YardMoveClaimedAnalytics'
      YardMoveLeaseExpiredAnalytics:
        $ref: '#/components/messages/YardMoveLeaseExpiredAnalytics'
      YardMoveCompletedAnalytics:
        $ref: '#/components/messages/YardMoveCompletedAnalytics'
      YardMoveCancelledAnalytics:
        $ref: '#/components/messages/YardMoveCancelledAnalytics'
      YardCheckClosedAnalytics:
        $ref: '#/components/messages/YardCheckClosedAnalytics'
      InspectionCompletedAnalytics:
        $ref: '#/components/messages/InspectionCompletedAnalytics'
      InspectionFailedAnalytics:
        $ref: '#/components/messages/InspectionFailedAnalytics'
  dockSchedulingEvents:
    address: warehouse.dock-scheduling.events
    description: dock-scheduling's integration topic (key = appointment_id; closures key = site_id; carrier registry events
      key = scac).
    messages:
      ConsumedDockAppointmentBooked:
        $ref: '#/components/messages/ConsumedDockAppointmentBooked'
      ConsumedDockAppointmentRescheduled:
        $ref: '#/components/messages/ConsumedDockAppointmentRescheduled'
      ConsumedDockAppointmentCancelled:
        $ref: '#/components/messages/ConsumedDockAppointmentCancelled'
      ConsumedDockAppointmentNoShow:
        $ref: '#/components/messages/ConsumedDockAppointmentNoShow'
      ConsumedDoorClosureScheduled:
        $ref: '#/components/messages/ConsumedDoorClosureScheduled'
      ConsumedDoorClosureLifted:
        $ref: '#/components/messages/ConsumedDoorClosureLifted'
      ConsumedCarrierRegistered:
        $ref: '#/components/messages/ConsumedCarrierRegistered'
      ConsumedCarrierSuspended:
        $ref: '#/components/messages/ConsumedCarrierSuspended'
      ConsumedCarrierReinstated:
        $ref: '#/components/messages/ConsumedCarrierReinstated'
  facilityEvents:
    address: warehouse.facility.events
    description: facility-layout's Published Language (camelCase payloads; key = locationCode or zoneId).
    messages:
      ConsumedZoneRegistered:
        $ref: '#/components/messages/ConsumedZoneRegistered'
      ConsumedLocationSlotRegistered:
        $ref: '#/components/messages/ConsumedLocationSlotRegistered'
      ConsumedLocationSlotDecommissioned:
        $ref: '#/components/messages/ConsumedLocationSlotDecommissioned'
  inboundReceivingEvents:
    address: warehouse.inbound-receiving.events
    description: inbound-receiving's integration topic (key = asn_number).
    messages:
      ConsumedASNRegistered:
        $ref: '#/components/messages/ConsumedASNRegistered'
      ConsumedASNCancelled:
        $ref: '#/components/messages/ConsumedASNCancelled'
      ConsumedReceiptOpened:
        $ref: '#/components/messages/ConsumedReceiptOpened'
      ConsumedReceiptClosed:
        $ref: '#/components/messages/ConsumedReceiptClosed'
operations:
  publishYardManagementEvents:
    action: send
    channel:
      $ref: '#/channels/yardManagementEvents'
    summary: Publish the integration events of the yard.
    description: 'Publishes the thirteen integration event types. TrailerSecured and TrailerSecuringReleased (ADR 0013) and InspectionCompleted (ADR 0015) have no consumer yet: they are the safety interlock facts and the inspection audit record of the yard. Consumers: outbound-shipping (TrailerDocked, DoorWorkCompleted, TrailerDeparted), dock-scheduling (VisitCheckedIn, TrailerDocked,
      TrailerUndocked), inbound-receiving (TrailerDocked), dock-scheduling (VisitRejected), exception-management (VisitRejected,
      SealExceptionRaised, TrailerDwellExceeded, YardCheckClosed, InspectionFailed).'
    messages:
    - $ref: '#/channels/yardManagementEvents/messages/VisitCheckedIn'
    - $ref: '#/channels/yardManagementEvents/messages/VisitRejected'
    - $ref: '#/channels/yardManagementEvents/messages/TrailerDocked'
    - $ref: '#/channels/yardManagementEvents/messages/TrailerUndocked'
    - $ref: '#/channels/yardManagementEvents/messages/SealExceptionRaised'
    - $ref: '#/channels/yardManagementEvents/messages/TrailerDwellExceeded'
    - $ref: '#/channels/yardManagementEvents/messages/YardCheckClosed'
    - $ref: '#/channels/yardManagementEvents/messages/DoorWorkCompleted'
    - $ref: '#/channels/yardManagementEvents/messages/TrailerDeparted'
    - $ref: '#/channels/yardManagementEvents/messages/TrailerSecured'
    - $ref: '#/channels/yardManagementEvents/messages/TrailerSecuringReleased'
    - $ref: '#/channels/yardManagementEvents/messages/InspectionCompleted'
    - $ref: '#/channels/yardManagementEvents/messages/InspectionFailed'
  publishYardManagementAnalytics:
    action: send
    channel:
      $ref: '#/channels/yardManagementAnalytics'
    summary: Publish the analytics stream.
    description: Publishes every event type to the analytics topic; consumed only by this service's projector.
    messages:
    - $ref: '#/channels/yardManagementAnalytics/messages/VisitCheckedInAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/VisitRejectedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/VisitCheckedOutAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerDockedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerUndockedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerParkedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/DoorWorkStartedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/DoorWorkCompletedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerDepartedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/SealExceptionRaisedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerDwellExceededAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerHeldAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerHoldReleasedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerSecuredAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/TrailerSecuringReleasedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/YardMoveRequestedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/YardMoveClaimedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/YardMoveLeaseExpiredAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/YardMoveCompletedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/YardMoveCancelledAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/YardCheckClosedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/InspectionCompletedAnalytics'
    - $ref: '#/channels/yardManagementAnalytics/messages/InspectionFailedAnalytics'
    x-no-consumer-reason: Consumed only by this service's own projector (cmd/yard-projector).
  receiveDockSchedulingEvents:
    action: receive
    channel:
      $ref: '#/channels/dockSchedulingEvents'
    summary: Receive appointments, door closures and carrier registry facts.
    description: Feeds the AppointmentView and DoorClosureView (NoShowFreesHolding reacts to DockAppointmentNoShow and
      DockAppointmentCancelled) and the CarrierView, the local copy of the carrier registry keyed by SCAC (ADR 0016).
    messages:
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedDockAppointmentBooked'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedDockAppointmentRescheduled'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedDockAppointmentCancelled'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedDockAppointmentNoShow'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedDoorClosureScheduled'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedDoorClosureLifted'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedCarrierRegistered'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedCarrierSuspended'
    - $ref: '#/channels/dockSchedulingEvents/messages/ConsumedCarrierReinstated'
  receiveFacilityEvents:
    action: receive
    channel:
      $ref: '#/channels/facilityEvents'
    summary: Receive zones and location slots.
    description: 'Feeds the LocationView: role Yard slots are spots, role Dock slots are doors with a dockFlow.'
    messages:
    - $ref: '#/channels/facilityEvents/messages/ConsumedZoneRegistered'
    - $ref: '#/channels/facilityEvents/messages/ConsumedLocationSlotRegistered'
    - $ref: '#/channels/facilityEvents/messages/ConsumedLocationSlotDecommissioned'
  receiveInboundReceivingEvents:
    action: receive
    channel:
      $ref: '#/channels/inboundReceivingEvents'
    summary: Receive ASNs and receipts.
    description: Feeds the AsnContentView and ReceiptAtDoorView; AutoCompleteUnload reacts to ReceiptClosed.
    messages:
    - $ref: '#/channels/inboundReceivingEvents/messages/ConsumedASNRegistered'
    - $ref: '#/channels/inboundReceivingEvents/messages/ConsumedASNCancelled'
    - $ref: '#/channels/inboundReceivingEvents/messages/ConsumedReceiptOpened'
    - $ref: '#/channels/inboundReceivingEvents/messages/ConsumedReceiptClosed'
components:
  messages:
    VisitCheckedIn:
      name: VisitCheckedIn
      title: VisitCheckedIn
      summary: A tractor and driver passed the gate. Consumed by dock-scheduling (ArrivalFromGate).
      description: '`type` = `com.warehouse.wms.yard-management.yardvisit.VisitCheckedIn`; subject and key = `visit_id`; dataschema
        `urn:warehouse:yard-management:events:VisitCheckedIn:v1`.'
      contentType: application/cloudevents+json
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: com.warehouse.wms.yard-management.yardvisit.VisitCheckedIn
            dataschema:
              const: urn:warehouse:yard-management:events:VisitCheckedIn:v1
            data:
              $ref: '#/components/schemas/VisitCheckedInData'
      examples:
      - name: VisitCheckedIn
        payload:
          specversion: '1.0'
          id: 7f3c9a52-1b8d-4e6f-9a07-000000000001
          source: /warehouse/yard-management
          type: com.warehouse.wms.yard-management.yardvisit.VisitCheckedIn
          subject: visit-5b1f0c3e-7a24-4d1e-9c55-0e7d3f2a9b10
          time: '2026-11-05T14:02:11Z'
          datacontenttype: application/json
          dataschema: urn:warehouse:yard-management:events:VisitCheckedIn:v1
          data:
            visit_id: visit-5b1f0c3e-7a24-4d1e-9c55-0e7d3f2a9b10
            site_id: WH1
            carrier: Acme Freight
            carrier_scac: ACME
            purpose: LIVE_UNLOAD
            appointment_id: appt-0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
            trailers:
            - trailer_id: trl-8f7e6d5c-4b3a-4291-8071-6f5e4d3c2b1a
              unit_number: TR-1042
              carrier_scac: ACME
              kind: DRY_VAN
              load_state: LOADED
              unit_number_scheme: null
              seal_class: S
              hazmat_class: null
              un_number: null
              requires_temperature_control: false
            arrived_at: '2026-11-05T14:02:11Z'
            version: 1
      tags:
      - name: yardvisit
