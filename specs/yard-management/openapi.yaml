            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sweep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /move-lease-sweeps:
    post:
      operationId: sweepMoveLeases
      summary: Run the lease-expiry sweep (ExpireLease)
      description: Returns every CLAIMED HOSTLER move whose lease ran out to REQUESTED and the trailer to where it was (ReturnToOrigin). Naturally
        idempotent; run by a CronJob.
      tags:
      - Sweeps
      parameters:
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      responses:
        '200':
          description: The sweep result.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sweep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /reports/yard-dwell:
    get:
      operationId: getYardDwellReport
      summary: Yard dwell report
      description: Read-only analytics over the analytical database (ADR 0006). The API answers the contract shape from the analytics read-side port;
        until the analytics read side is wired the report has no rows. `from` and `to` are required RFC 3339 instants (to after from, at most 92 days).
      tags:
