  /moves:
    post:
      operationId: requestMove
      summary: Request a move (RequestMove)
      description: 'A supervisor asks for a HOSTLER move of a trailer to a spot or door. The destination is validated now (known active slot of
        the site, closure, door flow, hold) and RESERVED: no two open moves share a destination (409 `destination-reserved`), the destination
        must be free (409 `location-occupied`), and a trailer has at most one open move (409 `trailer-has-open-move`). A trailer that is secured at its door (ADR 0013) is not moved away until the securing is released (409 `trailer-still-secured`). A trailer that carries a hazard class or needs temperature control is sent only to a yard spot its kind allows (409 `placement-rule-violated`, ADR 0014); the same rule judges the spot where the hostler completes the move.'
      tags:
      - Moves
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMoveRequest'
      responses:
        '201':
          description: The move.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Move'
              example:
                moveId: mv-2d3e4f50-6172-4839-8a9b-0c1d2e3f4a5b
                siteId: WH1
                trailerId: trl-8f7e6d5c-4b3a-4291-8071-6f5e4d3c2b1a
                appointmentId: appt-0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                performer: HOSTLER
                from:
                  kind: SPOT
                  code: WH1-YARD-P014
                to:
                  kind: DOOR
                  code: WH1-DOCK-D01
                reason: TO_DOOR
                priority:
                  band: 1
                  dueBy: '2026-11-05T14:30:00Z'
                state: CLAIMED
                hostlerRef: hostler-07
                leaseExpiresAt: '2026-11-05T14:07:11Z'
                actualLocation:
                  kind: DOOR
                  code: WH1-DOCK-D01
                claimedAt: '2026-11-05T14:02:11Z'
                completedAt: null
                requestedAt: '2026-11-05T14:02:11Z'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listMoves
      summary: List moves
      description: 'Lists moves oldest first, one keyset page at a time. Filters: `siteId`, `state`, `trailerId`, `hostlerRef` (the moves a hostler holds
        or held).'
      tags:
      - Moves
      parameters:
      - name: siteId
        in: query
        required: false
        description: Only moves of this site.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: REQUESTED, CLAIMED, COMPLETED or CANCELLED.
        schema:
          type: string
          enum:
          - REQUESTED
          - CLAIMED
          - COMPLETED
          - CANCELLED
      - name: trailerId
        in: query
        required: false
        description: Only moves of this trailer.
        schema:
          type: string
      - name: hostlerRef
        in: query
        required: false
        description: Only moves leased to this hostler.
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of moves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /moves/claims:
    post:
      operationId: claimNextMove
      summary: Claim the next move (ClaimNextMove)
      description: 'Pull dispatch: the system, never the caller, picks the REQUESTED HOSTLER move of the site with the lowest priority band, then
        the earliest dueBy, then the oldest request, and leases it to the hostler for the site''s `leaseSeconds`. The trailer leaves its place
        (StartMoving). A hostler holds at most one CLAIMED move (409 `hostler-busy`). 404 `no-claimable-move` when nothing waits.'
      tags:
      - Moves
      parameters:
