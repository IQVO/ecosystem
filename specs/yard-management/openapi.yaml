openapi: 3.0.3
info:
  title: Yard Management API
  version: 1.0.0
  contact:
    name: yard-management maintainers
    url: https://github.com/IQVO/yard-management
  license:
    name: UNLICENSED
  description: 'The WMS-tier owner of everything physically on site outside the four walls (ADR 0001, ADR 0002): visits through the gate (YardVisit),
    the trailers on site and where each is (Trailer), the moves hostlers and visiting drivers make (YardMove), yard checks (YardCheck) and the
    per-site yard rules (YardPolicy). It is the source of dwell, door occupancy and yard truck productivity facts.


    A trailer on site is at exactly one place: one yard spot, one door, or one open move. A spot or a door holds at most one trailer. Moves are
    pulled by hostlers (claim-next with a lease), never pushed. Appointments, door closures, locations and ASN contents come from event-fed local
    copies (ADR 0003); this API never calls a sibling context. Events are published as CloudEvents on `warehouse.yard-management.events` and `.analytics`
    through a transactional outbox (see `apis/asyncapi.yaml`).


    Sites are addressed by siteCode and doors and spots by their facility-layout locationCode (globally unique). Errors are RFC 7807 problem documents
    with `type = https://errors.yard-management.warehouse-systems.dev/<slug>`, the slug being the kebab-case of the domain error name (`ErrLocationOccupied`
    is `location-occupied`). There is no authentication layer (fleet decision 2026-09-11).'
servers:
- url: http://localhost:8080
  description: Local development
- url: http://localhost:8000/api/yard-management
  description: Local kind cluster through Kong
tags:
- name: Visits
  description: Gate check-in, rejection and check-out.
- name: Trailers
  description: Trailers on site, door work, holds and seals.
- name: Inspections
  description: Compliance inspection checklists that gate docking, loading and leaving (ADR 0015).
- name: Moves
  description: 'Yard moves: request, claim-next, complete, cancel.'
- name: Yard checks
  description: Yard audits.
- name: Yard board
  description: The live spot and door map.
- name: Yard policy
  description: Per-site yard rules.
- name: Sweeps
  description: Scheduler-driven sweeps (CronJobs).
- name: Reports
  description: Read-only analytics reports (ADR 0006).
- name: Health
  description: Liveness and readiness probes.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Answers 200 while the process runs.
      tags:
      - Health
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ok
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: 200 `ready` only when the process is not draining and Postgres and Kafka answer; otherwise 503 `dependency-unavailable`.
      tags:
      - Health
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /visits:
    post:
      operationId: checkInVisit
      summary: Check a visit in at the gate (CheckInVisit)
      description: 'Records a tractor and driver passing the gate and the trailers they bring. DirectOnCheckIn creates, per trailer, a move created
        already CLAIMED by the VISITING_DRIVER (no lease): to the appointment door when it is free, open and flow-compatible, otherwise to the
        first free spot of the site''s parking zones, and a walk-in or an arrival earlier than the appointment tolerance goes to a holding spot
        (TO_HOLDING). SealCheckAtGate compares each recorded seal with the appointment''s expected seal; a mismatch raises SealExceptionRaised
        and, under the REJECT policy, records a REJECTED visit instead (reason SEAL_MISMATCH). A refused check-in persists nothing: 409 `appointment-required`,
        `visit-already-open`, `trailer-already-on-site`, `door-closed`, `door-flow-mismatch`, `no-free-spot`, `placement-rule-violated`, `seal-class-too-low` (the site yard policy
        sets `minimumSealClass` and the seal is of a lower class or has none); 422 `invalid-carrier`, `unknown-appointment`
        (also when the visit names an appointment but does not carry exactly one trailer), `invalid-unit-number`, `invalid-seal-class`, `invalid-hazmat-class`, `invalid-un-number`, `validation`.
        The unit number of a `CONTAINER` trailer, and of any trailer whose `unitNumberScheme` is `ISO6346`, must be an ISO 6346 container number
        (4 letters: a 3-letter owner code and the category U, J or Z; 6 digits; the check digit), else 422 `invalid-unit-number` whose detail names
        the expected check digit; a domestic road trailer keeps a free-form number. A matching seal ends `VERIFIED` and a different one `MISMATCH`
        (ADR 0012). A trailer may declare what it carries: `hazmatClass`, `unNumber`, `requiresTemperatureControl` (ADR 0014). A trailer that declares
        a hazard class is placed only on a HAZMAT spot (a site with none refuses it, unless the policy sets `allowHazmatOnUnclassifiedSpots`, then
        only spots whose kind is unknown); a trailer that requires temperature control only on a REEFER_PLUG spot where the site has any. A site
        with no suitable free spot answers 409 `no-free-spot` (all taken) or `placement-rule-violated` (none exists); doors are exempt; a trailer
        that declares nothing, and a spot with no known kind, are judged as before. The gate clerk may then record the refusal with `POST /visit-rejections`.'
      tags:
      - Visits
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInVisitRequest'
            example:
              siteId: WH1
              carrier: Acme Freight
              carrierScac: ACME
              tractorPlate: ABC1D23
              driverRef: drv-77
              purpose: LIVE_UNLOAD
              appointmentId: appt-0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
              trailers:
              - unitNumber: TR-1042
                kind: DRY_VAN
                loadState: LOADED
                sealNumber: SL-778
                sealClass: S
      responses:
        '201':
          description: The visit is checked in (or REJECTED under the REJECT seal policy).
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Location:
              description: Path of the visit, `/visits/{visitId}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listVisits
      summary: List visits
      description: 'Lists visits newest first, one keyset page at a time (`limit` 1-500, default 100; `cursor` is the opaque `nextCursor` of the
        previous page). Filters: `siteId`, `state`, `tractorPlate`.'
      tags:
      - Visits
      parameters:
      - name: siteId
        in: query
        required: false
        description: Only visits of this site.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: CHECKED_IN, CHECKED_OUT or REJECTED.
        schema:
          type: string
          enum:
          - CHECKED_IN
          - CHECKED_OUT
          - REJECTED
      - name: tractorPlate
        in: query
        required: false
        description: Only visits of this plate.
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of visits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /visits/{visitId}:
    get:
      operationId: getVisit
      summary: Get a visit
      description: Returns the visit with an `ETag` of its version.
      tags:
      - Visits
      parameters:
      - name: visitId
        in: path
        required: true
        description: The visit id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: The visit.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
              example:
                visitId: visit-5b1f0c3e-7a24-4d1e-9c55-0e7d3f2a9b10
                siteId: WH1
                carrier: Acme Freight
                carrierScac: ACME
                tractorPlate: ABC1D23
                driverRef: drv-77
                purpose: LIVE_UNLOAD
                appointmentId: appt-0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                state: CHECKED_IN
                rejectionReason: null
                trailersIn:
                - trl-8f7e6d5c-4b3a-4291-8071-6f5e4d3c2b1a
                trailersOut: []
                arrivedAt: '2026-11-05T14:02:11Z'
                departedAt: null
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /visits/{visitId}/check-outs:
    post:
      operationId: checkOutVisit
      summary: Check a visit out (CheckOutVisit)
      description: 'The visit leaves the site with `trailersOut`. Every trailer taken out must be on site and released: no open move and either
        PARKED or DOCKED with door work DONE (`trailer-not-released` 409), and every LOADED trailer of a LIVE_LOAD or PICKUP visit must carry
        a seal (`seal-required` 409). Each trailer departs (TrailerDeparted, and TrailerUndocked when it leaves a door); a trailer the visit brought
        and does not take stays PARKED (a drop). Only a CHECKED_IN visit checks out (409 `illegal-transition`). A DOCKED trailer that is still secured does not depart (409 `trailer-still-secured`, ADR 0013): release the securing first.'
      tags:
      - Visits
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: visitId
        in: path
        required: true
        description: The visit id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '200':
          description: The visit is checked out.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /visit-rejections:
    post:
      operationId: rejectAtGate
      summary: Turn a visit away at the gate (RejectAtGate)
      description: Records a REJECTED visit and raises VisitRejected (consumed by dock-scheduling and exception-management). Nothing is persisted
        for the trailers.
      tags:
      - Visits
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectVisitRequest'
      responses:
        '201':
          description: The rejected visit.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Location:
              description: Path of the visit, `/visits/{visitId}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers:
    get:
      operationId: listTrailers
      summary: List trailers
      description: 'Lists trailers by arrival, one keyset page at a time. Filters: `siteId`, `state` (default: not DEPARTED), `kind`, `locationCode`,
        `unitNumber`, `visitId` (the visit the trailer is attached to: the one that brought it, until a later visit takes it).'
      tags:
      - Trailers
      parameters:
      - name: siteId
        in: query
        required: false
        description: Only trailers of this site.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: PARKED, IN_MOVE, DOCKED or DEPARTED.
        schema:
          type: string
          enum:
          - PARKED
          - IN_MOVE
          - DOCKED
          - DEPARTED
      - name: kind
        in: query
        required: false
        description: Trailer kind.
        schema:
          type: string
          enum:
          - DRY_VAN
          - REEFER
          - FLATBED
          - CONTAINER
      - name: locationCode
        in: query
        required: false
        description: Where it is now.
        schema:
          type: string
      - name: unitNumber
        in: query
        required: false
        description: Unit number.
        schema:
          type: string
      - name: visitId
        in: query
        required: false
        description: Only the trailers attached to this visit.
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of trailers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrailerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}:
    get:
      operationId: getTrailer
      summary: Get a trailer
      description: Returns the trailer with an `ETag` of its version.
      tags:
      - Trailers
      parameters:
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: The trailer.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
              example:
                trailerId: trl-8f7e6d5c-4b3a-4291-8071-6f5e4d3c2b1a
                siteId: WH1
                unitNumber: TR-1042
                unitNumberScheme: null
                carrierScac: ACME
                kind: DRY_VAN
                loadState: LOADED
                state: PARKED
                location:
                  kind: SPOT
                  code: WH1-YARD-P014
                doorWork: null
                securedAt: null
                securedBy: null
                securerRef: null
                hazmatClass: null
                unNumber: null
                requiresTemperatureControl: false
                seal:
                  number: SL-778
                  state: INTACT
                  class: S
                hold: null
                asnNumbers:
                - ASN-1001
                outboundRef: null
                visitId: visit-5b1f0c3e-7a24-4d1e-9c55-0e7d3f2a9b10
                appointmentId: appt-0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                arrivedAt: '2026-11-05T14:02:11Z'
                departedAt: null
                openMoveId: null
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/door-work-starts:
    post:
      operationId: startDoorWork
      summary: Start door work (StartDoorWork)
      description: 'Unloading or loading begins on a DOCKED trailer: WAITING to IN_PROGRESS. Refused while the trailer is held (409 `trailer-on-hold`). Where the site yard policy sets `requireSecuringBeforeDoorWork`, an unsecured trailer is refused with 409 `trailer-not-secured` (ADR 0013); with the policy off (the default) nothing changes.'
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: The trailer.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/door-work-completions:
    post:
      operationId: completeDoorWork
      summary: Complete door work (CompleteDoorWork)
      description: 'Door work ends: IN_PROGRESS to DONE, recording the resulting `loadState` (a completed unload is EMPTY). ClearDoorAfterWork
        then queues a FROM_DOOR move for a DROP trailer; a live trailer stays until its visit checks out.'
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoorWorkCompletionRequest'
      responses:
        '200':
          description: The trailer.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/holds:
    post:
      operationId: placeHold
      summary: Place a hold (PlaceHold)
      description: Puts the trailer on hold; a held trailer cannot be docked and its door work cannot start. A DOCKED trailer may be held.
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '200':
          description: The trailer.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/hold-releases:
    post:
      operationId: releaseHold
      summary: Release the hold (ReleaseHold)
      description: Removes the hold (409 `trailer-not-on-hold` when there is none).
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: The trailer.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/seals:
    post:
      operationId: recordSeal
      summary: Record or break the seal (RecordSeal, BreakSeal)
      description: '`INTACT` records the seal number found on the doors; `APPLIED` records a seal put on at the origin or dock; `BROKEN` marks it broken
        and places a SEAL_BROKEN hold. `sealClass` (I, S or H, ISO 17712) is optional with INTACT and APPLIED: an unknown class is 422 `invalid-seal-class`,
        and when the site yard policy sets `minimumSealClass` a seal of a lower class, or with no class, is 409 `seal-class-too-low`. `VERIFIED` and
        `MISMATCH` are never recorded by a caller: SealCheckAtGate sets them at check-in (ADR 0012).'
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealRequest'
      responses:
        '200':
          description: The trailer.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/classifications:
    post:
      operationId: classifyTrailer
      summary: Set what a trailer carries (ClassifyTrailer)
      description: 'Sets the hazard class, the UN number and the temperature-control need of a trailer that is on site (ADR 0014): a full replacement,
        so a field left out is cleared and `{}` declares nothing. The same facts again change nothing and answer 200. Classifying a parked trailer
        does not move it; the placement rules judge the next placement (`POST /moves`, check-in, and the spot where a move is completed). An unknown
        hazard class is 422 `invalid-hazmat-class`, a malformed UN number 422 `invalid-un-number`, a UN number without a class 422 `validation`; a
        departed trailer is 409 `illegal-transition`.'
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRequest'
            example:
              hazmatClass: '3'
              unNumber: UN1203
              requiresTemperatureControl: false
      responses:
        '200':
          description: The trailer.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trailer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/securings:
    post:
      operationId: secureTrailer
      summary: Secure a docked trailer (SecureTrailer)
      description: 'Records that the DOCKED trailer is secured, by a vehicle restraint (`RESTRAINT`) or wheel chocks (`WHEEL_CHOCKS`): the dock safety
        interlock of OSHA 29 CFR 1910.178(k)(1) and ANSI MH30.3 (ADR 0013). Where the site yard policy sets `requireSecuringBeforeDoorWork`, door
        work does not start until this is recorded. Securing the same way again changes nothing and answers 200. A trailer that is not DOCKED, or is
        already secured another way (release it first), is 409 `illegal-transition`; a trailer with an open move is 409 `trailer-has-open-move`; a
        method other than the two is 422 `validation`. Raises TrailerSecured.'
      tags:
      - Trailers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
