  /moves/{moveId}/completions:
    post:
      operationId: completeMove
      summary: Complete a move (CompleteMove)
      description: 'The trailer arrives at `actualLocation` (default: the destination); a location other than the destination needs a `deviationNote`
        (422 `unexplained-destination`). Only the lease holder completes a HOSTLER move (409 `not-lease-holder`); a gate clerk or dock operator
        completes a VISITING_DRIVER move without `hostlerRef`. The trailer and the move change in one transaction; an occupied destination is
        refused (409 `location-occupied`) and the move stays CLAIMED.'
      tags:
      - Moves
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: moveId
        in: path
        required: true
        description: The move id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMoveRequest'
      responses:
        '200':
          description: The completed move.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
