          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /reports/door-utilisation:
    get:
      operationId: getDoorUtilisationReport
      summary: Door utilisation report
      description: Read-only analytics over the analytical database (ADR 0006). The API answers the contract shape from the analytics read-side port;
        until the analytics read side is wired the report has no rows. `from` and `to` are required RFC 3339 instants (to after from, at most 92 days).
      tags:
