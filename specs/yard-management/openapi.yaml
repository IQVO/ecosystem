  /reports/turn-time:
    get:
      operationId: getTurnTimeReport
      summary: Gate-to-gate turn time report
      description: 'Minutes from VisitCheckedIn.arrived_at to VisitCheckedOut.departed_at (the event''s on_site_minutes) per visit purpose, over the visits that checked OUT in the window, with the average, the median (p50), the 90th percentile (p90) and the maximum. Percentiles are reported because an average hides the long tail. A visit whose check-in the projection never saw has no purpose and is left out. Until the analytics read side is wired the report has no rows. `from` and `to` are required RFC 3339 instants (to after from, at most 92 days). Definitions: ADR 0011.'
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - name: siteId
        in: query
        required: false
        description: Only this site.
        schema:
          type: string
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnTimeReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /reports/detention-exposure:
    get:
      operationId: getDetentionExposureReport
      summary: Detention exposure report
      description: 'Among the trailers that DEPARTED in the window, those whose dwell exceeded `thresholdMinutes` (default 120, the two hour norm), per trailer kind. This is exposure, a proxy: no standard definition of detention exists and charging is out of scope. A dwell equal to the threshold does not exceed it. Until the analytics read side is wired the report has no rows. `from` and `to` are required RFC 3339 instants (to after from, at most 92 days). Definitions: ADR 0011.'
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - name: siteId
        in: query
        required: false
        description: Only this site.
        schema:
          type: string
      - $ref: '#/components/parameters/DetentionThresholdMinutes'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetentionExposureReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /reports/exceptions:
    get:
      operationId: getExceptionsReport
      summary: Exception rates report
      description: 'Per site, for the window: visits checked in and rejected (rejectionRate = rejected / (checkedIn + rejected)), seal exceptions (sealExceptionRate = per check-in; it counts the exceptions raised at the gate of rejected visits too, so it is not capped at 1), trailer holds placed by reason, yard checks closed and the discrepancies they found. Rates are null when their denominator is zero. Until the analytics read side is wired the report has no rows. `from` and `to` are required RFC 3339 instants (to after from, at most 92 days). Definitions: ADR 0011.'
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - name: siteId
        in: query
        required: false
        description: Only this site.
        schema:
          type: string
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionsReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /reports/freshness:
    get:
      operationId: getReportsFreshness
      summary: Report freshness
      description: When the projector last folded an event.
      tags:
      - Reports
      responses:
        '200':
          description: The freshness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastEventAt:
                    type: string
                    format: date-time
                    nullable: true
                  asOf:
                    type: string
                    format: date-time
                required:
                - asOf
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Caller-generated unique key (a UUID per logical submit, 1-128 printable ASCII characters) that makes a retried request safe.
        Required on every POST and PUT (400 `idempotency-key-required`; `idempotency-key-invalid` when malformed). A replay with the same key,
        method, path and body returns the original response with `Idempotency-Replayed: true`; the same key with a different method, path or body
        is 409 `idempotency-key-reused`.'
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional on the sweeps, which are naturally idempotent (a repeat finds nothing new to do). When sent it behaves as on every other
        POST: a replay with the same key, method, path and body returns the stored answer with `Idempotency-Replayed: true`, and the same key with a
        different request is 409 `idempotency-key-reused`.'
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the policy version the caller read.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-500, default 100.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: The opaque `nextCursor` of the previous page.
      schema:
        type: string
    ReportFrom:
      name: from
      in: query
      required: true
      description: Start of the report window (RFC 3339).
      schema:
        type: string
        format: date-time
    ReportTo:
      name: to
      in: query
      required: true
      description: End of the report window (RFC 3339), after `from`, at most 92 days later.
      schema:
        type: string
        format: date-time
    DetentionThresholdMinutes:
      name: thresholdMinutes
      in: query
      required: false
      description: A departed trailer whose dwell exceeds this many minutes counts as detention exposure. Defaults to 120 (the two hour norm). Anything else than an integer from 1 to 10080 is a 400 `invalid-threshold-minutes`.
      schema:
        type: integer
        minimum: 1
        maximum: 10080
        default: 120
  headers:
    IdempotencyReplayed:
      description: Present, with the value `true`, only when the answer is a replay of the stored answer of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum:
        - 'true'
    ETag:
      description: A weak validator of the aggregate version, e.g. `W/"3"`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed JSON body, an unknown field, a NUL byte, a missing or invalid Idempotency-Key, or an invalid path or query parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformedBody:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/malformed-request-body
                title: Malformed request body
                status: 400
                detail: request body is not valid JSON for this operation
                instance: /trailers
            idempotencyKeyRequired:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/idempotency-key-required
                title: Idempotency-Key header is required
                status: 400
                detail: send an Idempotency-Key header
                instance: /trailers
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            trailerNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/trailer-not-found
                title: Trailer not found
                status: 404
                detail: trailer not found
                instance: /trailers
            visitNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/visit-not-found
                title: Visit not found
                status: 404
                detail: visit not found
                instance: /visits
            inspectionNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/inspection-not-found
                title: Inspection not found
                status: 404
                detail: inspection not found
                instance: /inspections/insp-nope
            templateNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/template-not-found
                title: Inspection template not found
                status: 404
                detail: inspection template not found
                instance: /inspection-templates/nope
            moveNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/move-not-found
                title: Move not found
                status: 404
                detail: move not found
                instance: /moves
            yardCheckNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/yard-check-not-found
                title: Yard check not found
                status: 404
                detail: yard check not found
                instance: /yard-checks
            siteNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/site-not-found
                title: Site not found
                status: 404
                detail: site not found
                instance: /sites
            noClaimableMove:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/no-claimable-move
                title: No move waits for a hostler
                status: 404
                detail: no claimable move
                instance: /moves/claims
    Conflict:
      description: The request conflicts with the state of the yard (an occupied place, an open move, an illegal transition) or reuses an Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            locationOccupied:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/location-occupied
                title: The location already holds a trailer
                status: 409
                detail: location is occupied
                instance: /trailers
            sealClassTooLow:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/seal-class-too-low
                title: The seal class is below the minimum of the site
                status: 409
                detail: 'seal class is too low: the site requires class H and the seal is class I'
                instance: /visits
            placementRuleViolated:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/placement-rule-violated
                title: The spot is not allowed for what the trailer carries
                status: 409
                detail: 'placement rule violated: a trailer with hazmat class 3 may only be placed on a HAZMAT spot; spot WH1-YARD-P014 is not classified'
                instance: /moves
            trailerNotSecured:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/trailer-not-secured
                title: The trailer is not secured
                status: 409
                detail: 'trailer is not secured: secure the trailer (restraint or wheel chocks) before door work starts'
                instance: /trailers/trl-8f7e6d5c-4b3a-4291-8071-6f5e4d3c2b1a/door-work-starts
            trailerStillSecured:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/trailer-still-secured
                title: The trailer is still secured
                status: 409
                detail: 'trailer is still secured: secured by WHEEL_CHOCKS at door WH1-D02'
                instance: /moves
            inspectionRequired:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/inspection-required
                title: A passed inspection is required first
                status: 409
                detail: 'inspection required: no passed PRE_DOCK inspection of yard-entry for this visit'
                instance: /moves
            inspectionFailed:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/inspection-failed
                title: The latest inspection failed
                status: 409
                detail: 'inspection failed: the latest PRE_DOCK inspection of yard-entry failed; inspect again'
                instance: /moves
            requiredItemPending:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/required-item-pending
                title: A required item has no result yet
                status: 409
                detail: 'required item pending: lights'
                instance: /inspections/insp-5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293/completions
            idempotencyKeyReused:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/idempotency-key-reused
                title: Idempotency-Key was already used with a different request
                status: 409
                detail: the key was used with another request
                instance: /trailers
    Unprocessable:
      description: A value or reference rule failed (unknown location, appointment or inspection template, unknown inspection item, invalid carrier, invalid unit number, seal class, hazmat class or UN number, unexplained destination, validation).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unknownTemplate:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/unknown-template
                title: Unknown inspection template
                status: 422
                detail: 'unknown inspection template: ghost'
                instance: /trailers/trl-8f7e6d5c-4b3a-4291-8071-6f5e4d3c2b1a/inspections
            unknownLocation:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/unknown-location
                title: Unknown location
                status: 422
                detail: location is not an active slot of the site
                instance: /trailers
            invalidUnitNumber:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/invalid-unit-number
                title: The unit number is invalid
                status: 422
                detail: 'invalid unit number: "CSQU3054380" has check digit 0; the expected check digit is 3'
                instance: /visits
            invalidHazmatClass:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/invalid-hazmat-class
                title: The hazmat class is invalid
                status: 422
                detail: 'invalid hazmat class: "1.7" is not a US DOT hazard class (1 to 9) or division (such as 1.4, 2.1, 4.3, 6.1)'
                instance: /visits
            invalidUnNumber:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/invalid-un-number
                title: The UN number is invalid
                status: 422
                detail: 'invalid UN number: "UN12" is not UN and four digits (for example UN1203)'
                instance: /visits
            invalidSealClass:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/invalid-seal-class
                title: The seal class is invalid
                status: 422
                detail: 'invalid seal class: "X" is not one of I, S or H'
                instance: /visits
    PreconditionFailed:
      description: The If-Match version is not the current version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stale:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/precondition-failed
                title: Precondition failed
                status: 412
                detail: the policy version changed
                instance: /trailers
    InternalError:
      description: Unexpected failure; the detail never leaks internals.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/internal-error
                title: Internal server error
                status: 500
                detail: an unexpected error occurred
                instance: /trailers
    ServiceUnavailable:
      description: A runtime dependency (Postgres or Kafka) is unavailable or the process is draining.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            down:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/dependency-unavailable
                title: A runtime dependency is unavailable
                status: 503
                detail: 'postgres: connection refused'
                instance: /trailers
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - instance
      description: RFC 7807 problem document used for every non-2xx response.
    Status:
      type: object
      properties:
        status:
          type: string
          description: '`ok` (healthz), `ready` or `not_ready` (readyz).'
      required:
      - status
    Location:
      type: object
      properties:
        kind:
          type: string
          enum:
          - SPOT
          - DOOR
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: A facility-layout locationCode.
      required:
      - kind
      - code
    TrailerIn:
      type: object
      properties:
        unitNumber:
          type: string
          minLength: 1
          maxLength: 64
          description: Free-form for a domestic road trailer. For a CONTAINER, or when `unitNumberScheme` is ISO6346, an ISO 6346 container number
            such as CSQU3054383 (422 `invalid-unit-number` otherwise).
        unitNumberScheme:
          type: string
          enum:
          - ISO6346
          description: Optional. Declares that the unit number is an ISO 6346 number and must pass its check digit. A CONTAINER is always checked.
        carrierScac:
          type: string
          pattern: ^[A-Z]{2,4}$
          description: Defaults to the visit's carrierScac.
        kind:
          type: string
          enum:
          - DRY_VAN
          - REEFER
          - FLATBED
          - CONTAINER
        loadState:
          type: string
          enum:
          - EMPTY
          - LOADED
          - PARTIAL
        sealNumber:
          type: string
          maxLength: 64
          description: The seal found at the gate; compared with the appointment's expected seal.
        sealClass:
          type: string
          enum:
          - I
          - S
          - H
          description: Optional ISO 17712 class of the seal (I indicative, S security, H high security); needs a sealNumber. Refused with 409
            `seal-class-too-low` when below the `minimumSealClass` of the site yard policy.
        hazmatClass:
          type: string
          enum:
          - '1'
          - '1.1'
          - '1.2'
          - '1.3'
          - '1.4'
          - '1.5'
          - '1.6'
          - '2'
          - '2.1'
          - '2.2'
          - '2.3'
          - '3'
          - '4'
          - '4.1'
          - '4.2'
          - '4.3'
          - '5'
          - '5.1'
          - '5.2'
          - '6'
          - '6.1'
          - '6.2'
          - '7'
          - '8'
          - '9'
          description: Optional. The US DOT hazard class or division of what the trailer carries (49 CFR 172.101). Any other value is 422 `invalid-hazmat-class`.
            A trailer that declares one is placed only on a HAZMAT spot (ADR 0014).
        unNumber:
          type: string
          pattern: ^UN[0-9]{4}$
          description: Optional. The UN number of the material, `UN` and four digits; needs a `hazmatClass` (422 `validation`), malformed is 422 `invalid-un-number`.
        requiresTemperatureControl:
          type: boolean
          default: false
          description: Optional. True for a load that needs a refrigeration plug; such a trailer is placed only on a REEFER_PLUG spot where the site has any (ADR 0014).
      required:
      - unitNumber
      - kind
      - loadState
    CheckInVisitRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
          maxLength: 64
        carrier:
          type: string
          minLength: 1
          maxLength: 100
        carrierScac:
          type: string
          pattern: ^[A-Z]{2,4}$
        tractorPlate:
          type: string
          minLength: 1
          maxLength: 32
        driverRef:
          type: string
          maxLength: 64
          description: Opaque reference, never a name or licence number.
        purpose:
          type: string
          enum:
          - DROP
          - LIVE_UNLOAD
          - LIVE_LOAD
          - PICKUP
          - BOBTAIL
        appointmentId:
          type: string
          maxLength: 64
        trailers:
          type: array
          items:
            $ref: '#/components/schemas/TrailerIn'
          description: Trailers brought in. BOBTAIL and PICKUP bring none; a visit that names an appointment brings exactly one.
      required:
      - siteId
      - carrier
      - tractorPlate
      - purpose
    RejectVisitRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
          maxLength: 64
        carrier:
          type: string
          minLength: 1
          maxLength: 100
        carrierScac:
          type: string
          pattern: ^[A-Z]{2,4}$
        tractorPlate:
          type: string
          minLength: 1
          maxLength: 32
        appointmentId:
          type: string
          maxLength: 64
        reason:
          type: string
          enum:
          - APPOINTMENT_REQUIRED
          - UNKNOWN_APPOINTMENT
          - SEAL_MISMATCH
          - TRAILER_ALREADY_ON_SITE
          - SITE_REQUEST
      required:
      - siteId
      - carrier
      - tractorPlate
      - reason
    Visit:
      type: object
      properties:
        visitId:
          type: string
        siteId:
          type: string
        carrier:
          type: string
        carrierScac:
          type: string
          nullable: true
        tractorPlate:
          type: string
        driverRef:
          type: string
          nullable: true
        purpose:
          type: string
          enum:
          - DROP
          - LIVE_UNLOAD
          - LIVE_LOAD
          - PICKUP
          - BOBTAIL
        appointmentId:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - CHECKED_IN
          - CHECKED_OUT
          - REJECTED
        rejectionReason:
          type: string
          enum:
          - APPOINTMENT_REQUIRED
          - UNKNOWN_APPOINTMENT
          - SEAL_MISMATCH
          - TRAILER_ALREADY_ON_SITE
          - SITE_REQUEST
          - null
          nullable: true
        trailersIn:
          type: array
          items:
            type: string
        trailersOut:
          type: array
          items:
            type: string
        arrivedAt:
          type: string
          format: date-time
        departedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
      required:
      - visitId
      - siteId
      - carrier
      - tractorPlate
      - purpose
      - state
      - trailersIn
      - trailersOut
      - arrivedAt
      - version
    Seal:
      type: object
      properties:
        number:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - NONE
          - INTACT
          - BROKEN
          - APPLIED
          - VERIFIED
          - MISMATCH
          description: 'INTACT: present and unbroken, not yet verified (what existing flows produce). APPLIED: recorded as applied at the origin or
            dock. VERIFIED: checked at the gate against the expected number and equal. MISMATCH: checked and different (SealExceptionRaised was
            raised). BROKEN: found broken. NONE: no seal.'
        class:
          type: string
          enum:
          - I
          - S
          - H
          - null
          nullable: true
          description: The ISO 17712 class of the seal; null when none was declared.
      required:
      - number
      - state
    Trailer:
      type: object
      properties:
        trailerId:
          type: string
        siteId:
          type: string
        unitNumber:
          type: string
        unitNumberScheme:
          type: string
          enum:
          - ISO6346
          - null
          nullable: true
          description: ISO6346 when the unit number was validated as an ISO 6346 container number; null for a free-form number (and for a trailer
            stored before ADR 0012).
        carrierScac:
          type: string
          nullable: true
        kind:
          type: string
          enum:
          - DRY_VAN
          - REEFER
          - FLATBED
          - CONTAINER
        loadState:
          type: string
          enum:
          - EMPTY
          - LOADED
          - PARTIAL
        state:
          type: string
          enum:
          - PARKED
          - IN_MOVE
          - DOCKED
          - DEPARTED
        location:
          type: object
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        doorWork:
          type: string
          enum:
          - WAITING
          - IN_PROGRESS
          - DONE
          - null
          nullable: true
        securedAt:
          type: string
          format: date-time
          nullable: true
          description: When the DOCKED trailer was secured (ADR 0013); null while it is not secured, and for every trailer stored before the interlock.
        securedBy:
          type: string
          enum:
          - RESTRAINT
          - WHEEL_CHOCKS
          - null
          nullable: true
          description: How the trailer is secured, a vehicle restraint engaged or the wheels chocked (OSHA 29 CFR 1910.178(k)(1), ANSI MH30.3); null while it is not secured.
        securerRef:
          type: string
          nullable: true
          description: The optional reference of the person who secured the trailer.
        hazmatClass:
          type: string
          enum:
          - '1'
          - '1.1'
          - '1.2'
          - '1.3'
          - '1.4'
          - '1.5'
          - '1.6'
          - '2'
          - '2.1'
          - '2.2'
          - '2.3'
          - '3'
          - '4'
          - '4.1'
          - '4.2'
          - '4.3'
          - '5'
          - '5.1'
          - '5.2'
          - '6'
          - '6.1'
          - '6.2'
          - '7'
          - '8'
          - '9'
          - null
          nullable: true
          description: The US DOT hazard class or division the trailer carries (ADR 0014); null when none was declared, and for every trailer stored before it.
        unNumber:
          type: string
          nullable: true
          pattern: ^UN[0-9]{4}$
          description: The UN number of the material; null when none was declared.
        requiresTemperatureControl:
          type: boolean
          description: True for a load that needs a refrigeration plug; false when not declared.
        seal:
          $ref: '#/components/schemas/Seal'
        hold:
          type: string
          enum:
          - DAMAGED
          - SEAL_BROKEN
          - NOT_FOUND
          - QUALITY
          - SECURITY
          - null
          nullable: true
        asnNumbers:
          type: array
          items:
            type: string
        outboundRef:
          type: string
          nullable: true
        visitId:
          type: string
          nullable: true
        appointmentId:
          type: string
          nullable: true
        arrivedAt:
          type: string
          format: date-time
        departedAt:
          type: string
          format: date-time
          nullable: true
        openMoveId:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
      required:
      - trailerId
      - siteId
      - unitNumber
      - kind
      - loadState
      - state
      - seal
      - asnNumbers
      - arrivedAt
      - version
    Priority:
      type: object
      properties:
        band:
          type: integer
          minimum: 1
          maximum: 9
          description: 1 is the most urgent.
        dueBy:
          type: string
          format: date-time
          nullable: true
      required:
      - band
    Move:
      type: object
      properties:
        moveId:
          type: string
        siteId:
          type: string
        trailerId:
          type: string
        appointmentId:
          type: string
          nullable: true
        performer:
          type: string
          enum:
          - HOSTLER
          - VISITING_DRIVER
        from:
          type: object
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        to:
          $ref: '#/components/schemas/Location'
        reason:
          type: string
          enum:
          - TO_DOOR
          - FROM_DOOR
          - TO_SPOT
          - RELOCATE
          - TO_HOLDING
        priority:
          $ref: '#/components/schemas/Priority'
        state:
          type: string
          enum:
          - REQUESTED
          - CLAIMED
          - COMPLETED
          - CANCELLED
        hostlerRef:
          type: string
          nullable: true
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        actualLocation:
          type: object
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        claimedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        requestedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      required:
      - moveId
      - siteId
      - trailerId
      - performer
      - to
      - reason
      - priority
      - state
      - requestedAt
      - version
    CheckIn:
      type: object
      properties:
        visit:
          $ref: '#/components/schemas/Visit'
        trailers:
          type: array
          items:
            $ref: '#/components/schemas/Trailer'
        moves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
      required:
      - visit
      - trailers
      - moves
      description: The visit, the trailers it brought and the moves DirectOnCheckIn created (one per trailer, created CLAIMED by the VISITING_DRIVER).
        A seal mismatch under the REJECT policy answers 201 with a REJECTED visit, no trailers and no moves.
    CheckOutRequest:
      type: object
      properties:
        trailersOut:
          type: array
          items:
            type: object
            properties:
              trailerId:
                type: string
            required:
            - trailerId
          description: Trailers leaving with the tractor. Empty for a drop or a bobtail.
      required:
      - trailersOut
    RequestMoveRequest:
      type: object
      properties:
        trailerId:
          type: string
        to:
          $ref: '#/components/schemas/Location'
        reason:
          type: string
          enum:
          - TO_DOOR
          - FROM_DOOR
          - TO_SPOT
          - RELOCATE
          - TO_HOLDING
        priorityBand:
          type: integer
          minimum: 1
          maximum: 9
          default: 5
        dueBy:
          type: string
          format: date-time
      required:
      - trailerId
      - to
    ClaimMoveRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
        hostlerRef:
          type: string
          minLength: 1
          maxLength: 64
          description: Opaque hostler reference.
      required:
      - siteId
      - hostlerRef
    CompleteMoveRequest:
      type: object
      properties:
        hostlerRef:
          type: string
          description: The lease holder; omitted when a gate clerk or dock operator completes a VISITING_DRIVER move.
        actualLocation:
          $ref: '#/components/schemas/Location'
        deviationNote:
          type: string
          description: Required when actualLocation is not the destination.
    CancelMoveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
    DoorWorkCompletionRequest:
      type: object
      properties:
        loadState:
          type: string
          enum:
          - EMPTY
          - LOADED
          - PARTIAL
    HoldRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
          - DAMAGED
          - SEAL_BROKEN
          - NOT_FOUND
          - QUALITY
          - SECURITY
      required:
      - reason
    ClassificationRequest:
      type: object
      properties:
        hazmatClass:
          type: string
          enum:
          - '1'
          - '1.1'
          - '1.2'
          - '1.3'
          - '1.4'
          - '1.5'
          - '1.6'
          - '2'
          - '2.1'
          - '2.2'
          - '2.3'
          - '3'
          - '4'
          - '4.1'
          - '4.2'
          - '4.3'
          - '5'
          - '5.1'
          - '5.2'
          - '6'
          - '6.1'
          - '6.2'
          - '7'
          - '8'
          - '9'
          description: Optional. The US DOT hazard class or division; left out clears it.
        unNumber:
          type: string
          pattern: ^UN[0-9]{4}$
          description: Optional. `UN` and four digits; needs a `hazmatClass`.
        requiresTemperatureControl:
          type: boolean
          default: false
          description: Optional. True for a load that needs a refrigeration plug.
    SecuringRequest:
      type: object
      properties:
        method:
          type: string
          enum:
          - RESTRAINT
          - WHEEL_CHOCKS
          description: A vehicle restraint engaged, or the wheels chocked.
        securerRef:
          type: string
          maxLength: 64
          description: Optional reference of the person who secured the trailer.
      required:
      - method
    SealRequest:
      type: object
      properties:
        state:
          type: string
          enum:
          - INTACT
          - APPLIED
          - BROKEN
        sealNumber:
          type: string
          maxLength: 64
          description: Required for INTACT and APPLIED; BROKEN keeps the recorded number.
        sealClass:
          type: string
          enum:
          - I
          - S
          - H
          description: Optional ISO 17712 class, for INTACT and APPLIED only.
      required:
      - state
    YardCheck:
      type: object
      properties:
        yardCheckId:
          type: string
        siteId:
          type: string
        state:
          type: string
          enum:
          - OPEN
          - CLOSED
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        observations:
          type: array
          items:
            type: object
            properties:
              locationCode:
                type: string
              unitNumber:
                type: string
                nullable: true
            required:
            - locationCode
        discrepancies:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - MISSING
                - UNEXPECTED
                - WRONG_LOCATION
              locationCode:
                type: string
              trailerId:
                type: string
                nullable: true
              unitNumber:
                type: string
                nullable: true
            required:
            - kind
            - locationCode
        version:
          type: integer
          minimum: 1
      required:
      - yardCheckId
      - siteId
      - state
      - openedAt
      - observations
      - discrepancies
      - version
    OpenYardCheckRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
      required:
      - siteId
    ObservationRequest:
      type: object
      properties:
        locationCode:
          type: string
          minLength: 1
        unitNumber:
          type: string
          description: Absent when the location was found empty.
      required:
      - locationCode
    YardPolicy:
      type: object
      properties:
        siteId:
          type: string
        requireAppointment:
          type: boolean
        holdingSpotCodes:
          type: array
          items:
            type: string
        parkingZoneIds:
          type: array
          items:
            type: string
        dwellThresholdMinutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: Per trailer kind (DRY_VAN, REEFER, FLATBED, CONTAINER); a kind without an entry is never alerted.
        leaseSeconds:
          type: integer
          minimum: 1
        sealMismatchAction:
          type: string
          enum:
          - FLAG
          - REJECT
        freeTimeMinutes:
          type: integer
          minimum: 1
          nullable: true
        minimumSealClass:
          type: string
          enum:
          - I
          - S
          - H
          - null
          nullable: true
          description: The lowest ISO 17712 class a seal may have at check-in and record-seal (I below S below H); null = no minimum, today's behaviour.
        requireSecuringBeforeDoorWork:
          type: boolean
          description: When true, door work starts only on a secured trailer (409 `trailer-not-secured` otherwise; ADR 0013). false (the default) is the
            behaviour before the interlock existed. A regulated site (OSHA 29 CFR 1910.178(k)(1)) sets it true; a later ADR may flip the default.
        allowHazmatOnUnclassifiedSpots:
          type: boolean
          description: When true, a trailer with a hazard class may take a spot whose kind is unknown at a site that has no HAZMAT spot (ADR 0014).
            false (the default) refuses it with 409 `placement-rule-violated`. Never lets a hazmat trailer onto a spot of another kind, nor
            onto an unclassified one where the site has a HAZMAT spot.
        requiredInspections:
          type: array
          items:
            $ref: '#/components/schemas/InspectionRule'
          description: The inspections a trailer needs before it docks, loads or leaves (ADR 0015); empty = none, the behaviour before them.
        version:
          type: integer
          minimum: 1
        declared:
          type: boolean
          description: False while the answer is the default policy of an undeclared site.
      required:
      - siteId
      - requireAppointment
      - holdingSpotCodes
      - parkingZoneIds
      - dwellThresholdMinutes
      - leaseSeconds
      - sealMismatchAction
      - version
      - declared
    DeclareYardPolicyRequest:
      type: object
      properties:
        requireAppointment:
          type: boolean
        holdingSpotCodes:
          type: array
          items:
            type: string
        parkingZoneIds:
          type: array
          items:
            type: string
        dwellThresholdMinutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
        leaseSeconds:
          type: integer
          minimum: 1
        sealMismatchAction:
          type: string
          enum:
          - FLAG
          - REJECT
        freeTimeMinutes:
          type: integer
          minimum: 1
        minimumSealClass:
          type: string
          enum:
          - I
          - S
          - H
          description: Optional. Seals of a lower class, or with no class, are refused with 409 `seal-class-too-low`. Left out = no minimum.
        requireSecuringBeforeDoorWork:
          type: boolean
          default: false
          description: Optional. When true, door work starts only on a secured trailer (409 `trailer-not-secured`; ADR 0013). Left out = false.
        allowHazmatOnUnclassifiedSpots:
          type: boolean
          default: false
          description: Optional. When true, a trailer with a hazard class may take a spot of unknown kind at a site with no HAZMAT spot (ADR 0014). Left out = false.
        requiredInspections:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/InspectionRule'
          description: Optional. The inspections a trailer must have PASSED, for its current visit, before the gated step (ADR 0015). A template nobody published is 422 `unknown-template`. Left out = none.
      required:
      - requireAppointment
      - sealMismatchAction
      - leaseSeconds
    InspectionRule:
      type: object
      properties:
        gate:
          type: string
          enum:
          - PRE_DOCK
          - PRE_LOAD
          - PRE_DEPARTURE
          description: The step that is refused (409 `inspection-required`, or `inspection-failed`) until a PASSED inspection of the template exists for the trailer's current visit. PRE_DOCK gates the move to a door,
            PRE_LOAD the start of door work on a trailer that is being loaded, PRE_DEPARTURE the check-out that takes the trailer. ON_DEMAND is never required.
        templateId:
          type: string
        appliesTo:
          type: object
          properties:
            purposes:
              type: array
              items:
                type: string
                enum:
                - DROP
                - LIVE_UNLOAD
                - LIVE_LOAD
                - PICKUP
                - BOBTAIL
              description: Only visits with one of these purposes; empty = every purpose.
            trailerKinds:
              type: array
              items:
                type: string
                enum:
                - DRY_VAN
                - REEFER
                - FLATBED
                - CONTAINER
              description: Only trailers of one of these kinds; empty = every kind.
      required:
      - gate
      - templateId
    OpenInspectionRequest:
      type: object
      properties:
        templateId:
          type: string
        templateVersion:
          type: integer
          minimum: 1
          description: Optional. The template version; left out = the latest published version.
        gate:
          type: string
          enum:
          - PRE_DOCK
          - PRE_LOAD
          - PRE_DEPARTURE
          - ON_DEMAND
        visitId:
          type: string
          description: Optional. The visit the inspection is made for; left out = the visit the trailer is on.
        performerRef:
          type: string
          maxLength: 64
          description: Optional reference of the inspector (an employee id, never a driver's name).
      required:
      - templateId
      - gate
    RecordInspectionItemRequest:
      type: object
      properties:
        result:
          type: string
          enum:
          - PASS
          - FAIL
          - NOT_APPLICABLE
        note:
          type: string
          maxLength: 500
        evidenceRefs:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 256
          description: Opaque references to photos or documents held elsewhere; strings only.
      required:
      - result
    CompleteInspectionRequest:
      type: object
      properties:
        conditionGrade:
          type: string
          enum:
          - CLEAN
          - DIRTY
          - ODOUR
          - DAMAGED
          description: Optional record of the equipment; never the verdict.
    TemplateItem:
      type: object
      properties:
        itemCode:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9-]*$'
        text:
          type: string
          maxLength: 300
        required:
          type: boolean
        allowNotApplicable:
          type: boolean
          description: Whether NOT_APPLICABLE may be recorded on the item. Left out = false.
        holdReason:
          type: string
          enum:
          - DAMAGED
          - SEAL_BROKEN
          - NOT_FOUND
          - QUALITY
          - SECURITY
          description: The hold a failed REQUIRED item places; left out when publishing = QUALITY.
      required:
      - itemCode
      - text
      - required
    PublishInspectionTemplateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TemplateItem'
      required:
      - title
      - items
    InspectionTemplate:
      type: object
      properties:
        templateId:
          type: string
        version:
          type: integer
          minimum: 1
        latestVersion:
          type: integer
          minimum: 1
          description: The highest published version of the same template id.
        title:
          type: string
        builtIn:
          type: boolean
          description: A built-in template ships with the service, is read-only, and has no `publishedAt`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateItem'
        publishedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - templateId
      - version
      - latestVersion
      - title
      - builtIn
      - items
      - publishedAt
    InspectionTemplatePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InspectionTemplate'
        nextCursor:
          type: string
          nullable: true
          description: Absent on the last page.
      required:
      - items
    InspectionItem:
      type: object
      properties:
        itemCode:
          type: string
        text:
          type: string
        required:
          type: boolean
        allowNotApplicable:
          type: boolean
        holdReason:
          type: string
          enum:
          - DAMAGED
          - SEAL_BROKEN
          - NOT_FOUND
          - QUALITY
          - SECURITY
        result:
          type: string
          enum:
          - PASS
          - FAIL
          - NOT_APPLICABLE
          - null
          nullable: true
          description: null while the item is pending.
        note:
          type: string
          nullable: true
        evidenceRefs:
          type: array
          items:
            type: string
      required:
      - itemCode
      - text
      - required
      - allowNotApplicable
      - holdReason
      - result
      - note
      - evidenceRefs
    Inspection:
      type: object
      properties:
        inspectionId:
          type: string
        siteId:
          type: string
        trailerId:
          type: string
        visitId:
          type: string
          nullable: true
        templateId:
          type: string
        templateVersion:
          type: integer
          minimum: 1
          description: The version the inspection was opened from; the items below are that version's snapshot.
        gate:
          type: string
          enum:
          - PRE_DOCK
          - PRE_LOAD
          - PRE_DEPARTURE
          - ON_DEMAND
        status:
          type: string
          enum:
          - OPEN
          - PASSED
          - FAILED
        items:
          type: array
          items:
            $ref: '#/components/schemas/InspectionItem'
        performerRef:
          type: string
          nullable: true
        conditionGrade:
          type: string
          enum:
          - CLEAN
          - DIRTY
          - ODOUR
          - DAMAGED
          - null
          nullable: true
        openedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
      required:
      - inspectionId
      - siteId
      - trailerId
      - visitId
      - templateId
      - templateVersion
      - gate
      - status
      - items
      - performerRef
      - conditionGrade
      - openedAt
      - completedAt
      - version
    InspectionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Inspection'
        nextCursor:
          type: string
          nullable: true
          description: Absent on the last page.
      required:
      - items
    YardBoard:
      type: object
      properties:
        siteId:
          type: string
        asOf:
          type: string
          format: date-time
        spots:
          type: array
          items:
            $ref: '#/components/schemas/BoardPlace'
        doors:
          type: array
          items:
            $ref: '#/components/schemas/BoardPlace'
        inMove:
          type: array
          items:
            $ref: '#/components/schemas/Trailer'
        openMoves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
      required:
      - siteId
      - asOf
      - spots
      - doors
      - inMove
      - openMoves
    BoardPlace:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
          enum:
          - SPOT
          - DOOR
        dockFlow:
          type: string
          enum:
          - Inbound
          - Outbound
          - Both
          - null
          nullable: true
        closed:
          type: boolean
        trailer:
          type: object
          allOf:
          - $ref: '#/components/schemas/Trailer'
          nullable: true
      required:
      - code
      - kind
      - closed
    Sweep:
      type: object
      properties:
        sweptAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
      required:
      - sweptAt
      - count
      description: How many trailers were alerted (dwell) or moves returned to REQUESTED (lease).
    DwellSweepRequest:
      type: object
      properties:
        siteId:
          type: string
          description: Limit the sweep to one site; absent sweeps every site.
    YardDwellReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - DRY_VAN
                - REEFER
                - FLATBED
                - CONTAINER
              trailers:
                type: integer
              avgDwellMinutes:
                type: number
              maxDwellMinutes:
                type: integer
              avgDriverWaitMinutes:
                type: number
                nullable: true
                description: The wait. Mean of arrival to the first DoorWorkStarted; null when no trailer had door work.
              p50DwellMinutes:
                type: number
                nullable: true
                description: Median dwell, the typical trailer (additive, ADR 0011).
              p90DwellMinutes:
                type: number
                nullable: true
                description: 90th percentile of the dwell, the long tail an average hides (additive, ADR 0011).
              avgProcessingMinutes:
                type: number
                nullable: true
                description: The processing. Mean of DoorWorkStarted to DoorWorkCompleted over the completed door work sessions of these trailers; null when none completed (additive, ADR 0011).
            required:
            - kind
            - trailers
            - avgDwellMinutes
            - maxDwellMinutes
            - avgDriverWaitMinutes
            - p50DwellMinutes
            - p90DwellMinutes
            - avgProcessingMinutes
      required:
      - from
      - to
      - siteId
      - rows
    DoorUtilisationReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              doorCode:
                type: string
              dockings:
                type: integer
              occupiedMinutes:
                type: integer
              utilisation:
                type: number
                description: occupied minutes over the report window, 0..1.
            required:
            - siteId
            - doorCode
            - dockings
            - occupiedMinutes
            - utilisation
      required:
      - from
      - to
      - siteId
      - rows
    HostlerProductivityReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              hostlerRef:
                type: string
              moves:
                type: integer
              avgMoveSeconds:
                type: number
              movesPerHour:
                type: number
                description: moves over the elapsed time between the hostler's first claim and last completion in the window.
            required:
            - siteId
            - hostlerRef
            - moves
            - avgMoveSeconds
            - movesPerHour
      required:
      - from
      - to
      - siteId
      - rows
    TurnTimeReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              purpose:
                type: string
                enum:
                - DROP
                - LIVE_UNLOAD
                - LIVE_LOAD
                - PICKUP
                - BOBTAIL
              visits:
                type: integer
                description: Visits of this purpose that checked out in the window.
              avgMinutes:
                type: number
              p50Minutes:
                type: number
                description: Median gate-to-gate minutes.
              p90Minutes:
                type: number
                description: 90th percentile of the gate-to-gate minutes.
              maxMinutes:
                type: integer
            required:
            - purpose
            - visits
            - avgMinutes
            - p50Minutes
            - p90Minutes
            - maxMinutes
      required:
      - from
      - to
      - siteId
      - rows
    DetentionExposureReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        thresholdMinutes:
          type: integer
          description: The threshold the report was computed with (the request's, or 120).
        rows:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - DRY_VAN
                - REEFER
                - FLATBED
                - CONTAINER
              trailers:
                type: integer
                description: Trailers of this kind that departed in the window.
              exceeding:
                type: integer
                description: Of those, the ones whose dwell exceeded thresholdMinutes.
              share:
                type: number
                nullable: true
                description: exceeding / trailers, 0..1; null when there were no trailers.
              excessMinutes:
                type: integer
                description: Sum of (dwell - thresholdMinutes) over the exceeding trailers. Exposure, not a billed amount.
            required:
            - kind
            - trailers
            - exceeding
            - share
            - excessMinutes
      required:
      - from
      - to
      - siteId
      - thresholdMinutes
      - rows
    ExceptionsReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              visitsCheckedIn:
                type: integer
              visitsRejected:
                type: integer
              rejectionRate:
                type: number
                nullable: true
                description: visitsRejected / (visitsCheckedIn + visitsRejected), 0..1; null when both are zero.
              sealExceptions:
                type: integer
              sealExceptionRate:
                type: number
                nullable: true
                description: sealExceptions per check-in; null when no visit checked in. Not capped at 1.
              holdsByReason:
                type: object
                description: Holds placed in the window; every reason is listed, zero included.
                properties:
                  DAMAGED:
                    type: integer
                  SEAL_BROKEN:
                    type: integer
                  NOT_FOUND:
                    type: integer
                  QUALITY:
                    type: integer
                  SECURITY:
                    type: integer
                required:
                - DAMAGED
                - SEAL_BROKEN
                - NOT_FOUND
                - QUALITY
                - SECURITY
              yardChecksClosed:
                type: integer
              discrepancies:
                type: integer
                description: Total discrepancies (the length of YardCheckClosed.discrepancies) over the yard checks closed.
            required:
            - siteId
            - visitsCheckedIn
            - visitsRejected
            - rejectionRate
            - sealExceptions
            - sealExceptionRate
            - holdsByReason
            - yardChecksClosed
            - discrepancies
      required:
      - from
      - to
      - siteId
      - rows
