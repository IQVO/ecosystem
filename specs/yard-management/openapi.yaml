  /reports/hostler-productivity:
    get:
      operationId: getHostlerProductivityReport
      summary: Hostler productivity report
      description: Read-only analytics over the analytical database (ADR 0006). The API answers the contract shape from the analytics read-side port;
        until the analytics read side is wired the report has no rows. `from` and `to` are required RFC 3339 instants (to after from, at most 92 days).
      tags:
      - Reports
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - name: siteId
        in: query
        required: false
        description: Only this site.
        schema:
          type: string
      responses:
