      description: Records what was found at one location (a unit number, or empty). A location is observed at most once per check (409 `location-already-observed`).
      tags:
      - Yard checks
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: yardCheckId
        in: path
        required: true
        description: The yard check id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationRequest'
      responses:
        '200':
          description: The yard check.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /yard-checks/{yardCheckId}/closures:
    post:
      operationId: closeYardCheck
      summary: Close a yard check (CloseYardCheck)
      description: Reconciles the observations with the model and raises YardCheckClosed with the discrepancies. A location not observed is MISSING
        when the model records a trailer there. Closing only reports; the supervisor corrects with moves.
      tags:
      - Yard checks
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: yardCheckId
        in: path
        required: true
        description: The yard check id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: The closed yard check.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/yard-board:
    get:
      operationId: getYardBoard
      summary: Get the yard board
      description: 'The live spot and door map of one site: every active Yard and Dock slot with the trailer on it, the trailers in motion and
        the open moves. A site with no known locations answers 404.'
      tags:
      - Yard board
      parameters:
      - name: siteId
        in: path
        required: true
        description: The site code.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-pagination-exempt: view
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardBoard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /sites/{siteId}/yard-policy:
    get:
      operationId: getYardPolicy
      summary: Get the yard policy
      description: 'Answers the declared policy, or the default one (`declared` false) for a site that never declared one: appointments not required,
        seal mismatch FLAG, lease 300 s, no detention free time.'
      tags:
      - Yard policy
      parameters:
      - name: siteId
        in: path
        required: true
        description: The site code.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      x-pagination-exempt: view
      responses:
        '200':
          description: The policy.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardPolicy'
              example:
                siteId: WH1
                requireAppointment: false
                holdingSpotCodes:
                - WH1-YARD-H01
                parkingZoneIds:
                - zone-yard
                dwellThresholdMinutes:
                  DRY_VAN: 1440
                  REEFER: 720
                leaseSeconds: 300
                sealMismatchAction: FLAG
                freeTimeMinutes: 120
                minimumSealClass: null
                requireSecuringBeforeDoorWork: false
                allowHazmatOnUnclassifiedSpots: false
                requiredInspections:
                - gate: PRE_DOCK
                  templateId: tractor-trailer-17-point
                  appliesTo:
                    purposes: []
                    trailerKinds:
                    - REEFER
                version: 1
                declared: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: declareYardPolicy
      summary: Declare the yard policy (DeclareYardPolicy)
      description: Replaces the policy of the site. Holding spots must be known Yard slots of the site (422 `unknown-location`); thresholds and
        lease must be positive (422 `validation`). `If-Match` makes the replacement conditional on the policy version (412 `precondition-failed`).
      tags:
      - Yard policy
      parameters:
      - name: siteId
        in: path
        required: true
        description: The site code.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareYardPolicyRequest'
      responses:
        '200':
          description: The declared policy.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YardPolicy'
              example:
                siteId: WH1
                requireAppointment: false
                holdingSpotCodes:
                - WH1-YARD-H01
                parkingZoneIds:
                - zone-yard
                dwellThresholdMinutes:
                  DRY_VAN: 1440
                  REEFER: 720
                leaseSeconds: 300
                sealMismatchAction: FLAG
                freeTimeMinutes: 120
                minimumSealClass: null
                requireSecuringBeforeDoorWork: false
                allowHazmatOnUnclassifiedSpots: false
                requiredInspections:
                - gate: PRE_DOCK
                  templateId: tractor-trailer-17-point
                  appliesTo:
                    purposes: []
                    trailerKinds:
                    - REEFER
                version: 1
                declared: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /dwell-sweeps:
    post:
      operationId: sweepDwell
      summary: Run the dwell sweep (DwellSweep)
      description: Raises TrailerDwellExceeded once per trailer and threshold crossing (the trailer remembers the highest threshold alerted).
        Naturally idempotent; run by a CronJob.
      tags:
