  /inspections/{inspectionId}/items/{itemCode}:
    put:
      operationId: recordInspectionItem
      summary: Record an inspection item (RecordInspectionItem)
      description: 'Records what the inspector found at one item of an OPEN inspection: `PASS`, `FAIL` or `NOT_APPLICABLE` (only where the template item has `allowNotApplicable`, else 422
        `not-applicable-not-allowed`), with an optional note (500 characters) and opaque evidence references (strings that point at photos or documents held elsewhere; at most 20, each at most 256
        characters, no binary). Recording again replaces the earlier result. A completed inspection is final: 409 `inspection-closed`; an item the snapshot does not have is 422 `unknown-item`.
        Raises nothing.'
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: inspectionId
        in: path
        required: true
        description: The inspection id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
