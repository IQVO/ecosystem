                    nullable: true
                  asOf:
                    type: string
                    format: date-time
                required:
                - asOf
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Caller-generated unique key (a UUID per logical submit, 1-128 printable ASCII characters) that makes a retried request safe.
        Required on every POST and PUT (400 `idempotency-key-required`; `idempotency-key-invalid` when malformed). A replay with the same key,
        method, path and body returns the original response with `Idempotency-Replayed: true`; the same key with a different method, path or body
        is 409 `idempotency-key-reused`.'
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional on the sweeps, which are naturally idempotent (a repeat finds nothing new to do). When sent it behaves as on every other
        POST: a replay with the same key, method, path and body returns the stored answer with `Idempotency-Replayed: true`, and the same key with a
        different request is 409 `idempotency-key-reused`.'
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the policy version the caller read.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1-500, default 100.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: The opaque `nextCursor` of the previous page.
      schema:
        type: string
    ReportFrom:
      name: from
      in: query
      required: true
      description: Start of the report window (RFC 3339).
      schema:
        type: string
        format: date-time
    ReportTo:
      name: to
      in: query
      required: true
      description: End of the report window (RFC 3339), after `from`, at most 92 days later.
      schema:
        type: string
        format: date-time
    DetentionThresholdMinutes:
      name: thresholdMinutes
      in: query
      required: false
      description: A departed trailer whose dwell exceeds this many minutes counts as detention exposure. Defaults to 120 (the two hour norm). Anything else than an integer from 1 to 10080 is a 400 `invalid-threshold-minutes`.
      schema:
        type: integer
        minimum: 1
        maximum: 10080
        default: 120
  headers:
    IdempotencyReplayed:
      description: Present, with the value `true`, only when the answer is a replay of the stored answer of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum:
        - 'true'
    ETag:
      description: A weak validator of the aggregate version, e.g. `W/"3"`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed JSON body, an unknown field, a NUL byte, a missing or invalid Idempotency-Key, or an invalid path or query parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformedBody:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/malformed-request-body
                title: Malformed request body
                status: 400
                detail: request body is not valid JSON for this operation
                instance: /trailers
            idempotencyKeyRequired:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/idempotency-key-required
                title: Idempotency-Key header is required
                status: 400
                detail: send an Idempotency-Key header
                instance: /trailers
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            trailerNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/trailer-not-found
                title: Trailer not found
                status: 404
                detail: trailer not found
                instance: /trailers
            visitNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/visit-not-found
                title: Visit not found
                status: 404
                detail: visit not found
                instance: /visits
            moveNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/move-not-found
                title: Move not found
                status: 404
                detail: move not found
                instance: /moves
            yardCheckNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/yard-check-not-found
                title: Yard check not found
                status: 404
                detail: yard check not found
                instance: /yard-checks
            siteNotFound:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/site-not-found
                title: Site not found
                status: 404
                detail: site not found
                instance: /sites
            noClaimableMove:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/no-claimable-move
                title: No move waits for a hostler
                status: 404
                detail: no claimable move
                instance: /moves/claims
    Conflict:
      description: The request conflicts with the state of the yard (an occupied place, an open move, an illegal transition) or reuses an Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            locationOccupied:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/location-occupied
                title: The location already holds a trailer
                status: 409
                detail: location is occupied
                instance: /trailers
            idempotencyKeyReused:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/idempotency-key-reused
                title: Idempotency-Key was already used with a different request
                status: 409
                detail: the key was used with another request
                instance: /trailers
    Unprocessable:
      description: A value or reference rule failed (unknown location or appointment, invalid carrier, unexplained destination, validation).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unknownLocation:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/unknown-location
                title: Unknown location
                status: 422
                detail: location is not an active slot of the site
                instance: /trailers
    PreconditionFailed:
      description: The If-Match version is not the current version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stale:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/precondition-failed
                title: Precondition failed
                status: 412
                detail: the policy version changed
                instance: /trailers
    InternalError:
      description: Unexpected failure; the detail never leaks internals.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/internal-error
                title: Internal server error
                status: 500
                detail: an unexpected error occurred
                instance: /trailers
    ServiceUnavailable:
      description: A runtime dependency (Postgres or Kafka) is unavailable or the process is draining.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            down:
              value:
                type: https://errors.yard-management.warehouse-systems.dev/dependency-unavailable
                title: A runtime dependency is unavailable
                status: 503
                detail: 'postgres: connection refused'
                instance: /trailers
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - instance
      description: RFC 7807 problem document used for every non-2xx response.
    Status:
      type: object
      properties:
        status:
          type: string
          description: '`ok` (healthz), `ready` or `not_ready` (readyz).'
      required:
      - status
    Location:
      type: object
      properties:
        kind:
          type: string
          enum:
          - SPOT
          - DOOR
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: A facility-layout locationCode.
      required:
      - kind
      - code
    TrailerIn:
      type: object
      properties:
        unitNumber:
          type: string
          minLength: 1
          maxLength: 64
        carrierScac:
          type: string
          pattern: ^[A-Z]{2,4}$
          description: Defaults to the visit's carrierScac.
        kind:
          type: string
          enum:
          - DRY_VAN
          - REEFER
          - FLATBED
          - CONTAINER
        loadState:
          type: string
          enum:
          - EMPTY
          - LOADED
          - PARTIAL
        sealNumber:
          type: string
          maxLength: 64
          description: The seal found at the gate; compared with the appointment's expected seal.
      required:
      - unitNumber
      - kind
      - loadState
    CheckInVisitRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
          maxLength: 64
        carrier:
          type: string
          minLength: 1
          maxLength: 100
        carrierScac:
          type: string
          pattern: ^[A-Z]{2,4}$
        tractorPlate:
          type: string
          minLength: 1
          maxLength: 32
        driverRef:
          type: string
          maxLength: 64
          description: Opaque reference, never a name or licence number.
        purpose:
          type: string
          enum:
          - DROP
          - LIVE_UNLOAD
          - LIVE_LOAD
          - PICKUP
          - BOBTAIL
        appointmentId:
          type: string
          maxLength: 64
        trailers:
          type: array
          items:
            $ref: '#/components/schemas/TrailerIn'
          description: Trailers brought in. BOBTAIL and PICKUP bring none; a visit that names an appointment brings exactly one.
      required:
      - siteId
      - carrier
      - tractorPlate
      - purpose
    RejectVisitRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
          maxLength: 64
        carrier:
          type: string
          minLength: 1
          maxLength: 100
        carrierScac:
          type: string
          pattern: ^[A-Z]{2,4}$
        tractorPlate:
          type: string
          minLength: 1
          maxLength: 32
        appointmentId:
          type: string
          maxLength: 64
        reason:
          type: string
          enum:
          - APPOINTMENT_REQUIRED
          - UNKNOWN_APPOINTMENT
          - SEAL_MISMATCH
          - TRAILER_ALREADY_ON_SITE
          - SITE_REQUEST
      required:
      - siteId
      - carrier
      - tractorPlate
      - reason
    Visit:
      type: object
      properties:
        visitId:
          type: string
        siteId:
          type: string
        carrier:
          type: string
        carrierScac:
          type: string
          nullable: true
        tractorPlate:
          type: string
        driverRef:
          type: string
          nullable: true
        purpose:
          type: string
          enum:
          - DROP
          - LIVE_UNLOAD
          - LIVE_LOAD
          - PICKUP
          - BOBTAIL
        appointmentId:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - CHECKED_IN
          - CHECKED_OUT
          - REJECTED
        rejectionReason:
          type: string
          enum:
          - APPOINTMENT_REQUIRED
          - UNKNOWN_APPOINTMENT
          - SEAL_MISMATCH
          - TRAILER_ALREADY_ON_SITE
          - SITE_REQUEST
          - null
          nullable: true
        trailersIn:
          type: array
          items:
            type: string
        trailersOut:
          type: array
          items:
            type: string
        arrivedAt:
          type: string
          format: date-time
        departedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
      required:
      - visitId
      - siteId
      - carrier
      - tractorPlate
      - purpose
      - state
      - trailersIn
      - trailersOut
      - arrivedAt
      - version
    Seal:
      type: object
      properties:
        number:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - NONE
          - INTACT
          - BROKEN
      required:
      - number
      - state
    Trailer:
      type: object
      properties:
        trailerId:
          type: string
        siteId:
          type: string
        unitNumber:
          type: string
        carrierScac:
          type: string
          nullable: true
        kind:
          type: string
          enum:
          - DRY_VAN
          - REEFER
          - FLATBED
          - CONTAINER
        loadState:
          type: string
          enum:
          - EMPTY
          - LOADED
          - PARTIAL
        state:
          type: string
          enum:
          - PARKED
          - IN_MOVE
          - DOCKED
          - DEPARTED
        location:
          type: object
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        doorWork:
          type: string
          enum:
          - WAITING
          - IN_PROGRESS
          - DONE
          - null
          nullable: true
        seal:
          $ref: '#/components/schemas/Seal'
        hold:
          type: string
          enum:
          - DAMAGED
          - SEAL_BROKEN
          - NOT_FOUND
          - QUALITY
          - SECURITY
          - null
          nullable: true
        asnNumbers:
          type: array
          items:
            type: string
        outboundRef:
          type: string
          nullable: true
        visitId:
          type: string
          nullable: true
        appointmentId:
          type: string
          nullable: true
        arrivedAt:
          type: string
          format: date-time
        departedAt:
          type: string
          format: date-time
          nullable: true
        openMoveId:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
      required:
      - trailerId
      - siteId
      - unitNumber
      - kind
      - loadState
      - state
      - seal
      - asnNumbers
      - arrivedAt
      - version
    Priority:
      type: object
      properties:
        band:
          type: integer
          minimum: 1
          maximum: 9
          description: 1 is the most urgent.
        dueBy:
          type: string
          format: date-time
          nullable: true
      required:
      - band
    Move:
      type: object
      properties:
        moveId:
          type: string
        siteId:
          type: string
        trailerId:
          type: string
        appointmentId:
          type: string
          nullable: true
        performer:
          type: string
          enum:
          - HOSTLER
          - VISITING_DRIVER
        from:
          type: object
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        to:
          $ref: '#/components/schemas/Location'
        reason:
          type: string
          enum:
          - TO_DOOR
          - FROM_DOOR
          - TO_SPOT
          - RELOCATE
          - TO_HOLDING
        priority:
          $ref: '#/components/schemas/Priority'
        state:
          type: string
          enum:
          - REQUESTED
          - CLAIMED
          - COMPLETED
          - CANCELLED
        hostlerRef:
          type: string
          nullable: true
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        actualLocation:
          type: object
          allOf:
          - $ref: '#/components/schemas/Location'
          nullable: true
        claimedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        requestedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
      required:
      - moveId
      - siteId
      - trailerId
      - performer
      - to
      - reason
      - priority
      - state
      - requestedAt
      - version
    CheckIn:
      type: object
      properties:
        visit:
          $ref: '#/components/schemas/Visit'
        trailers:
          type: array
          items:
            $ref: '#/components/schemas/Trailer'
        moves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
      required:
      - visit
      - trailers
      - moves
      description: The visit, the trailers it brought and the moves DirectOnCheckIn created (one per trailer, created CLAIMED by the VISITING_DRIVER).
        A seal mismatch under the REJECT policy answers 201 with a REJECTED visit, no trailers and no moves.
    CheckOutRequest:
      type: object
      properties:
        trailersOut:
          type: array
          items:
            type: object
            properties:
              trailerId:
                type: string
            required:
            - trailerId
          description: Trailers leaving with the tractor. Empty for a drop or a bobtail.
      required:
      - trailersOut
    RequestMoveRequest:
      type: object
      properties:
        trailerId:
          type: string
        to:
          $ref: '#/components/schemas/Location'
        reason:
          type: string
          enum:
          - TO_DOOR
          - FROM_DOOR
          - TO_SPOT
          - RELOCATE
          - TO_HOLDING
        priorityBand:
          type: integer
          minimum: 1
          maximum: 9
          default: 5
        dueBy:
          type: string
          format: date-time
      required:
      - trailerId
      - to
    ClaimMoveRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
        hostlerRef:
          type: string
          minLength: 1
          maxLength: 64
          description: Opaque hostler reference.
      required:
      - siteId
      - hostlerRef
    CompleteMoveRequest:
      type: object
      properties:
        hostlerRef:
          type: string
          description: The lease holder; omitted when a gate clerk or dock operator completes a VISITING_DRIVER move.
        actualLocation:
          $ref: '#/components/schemas/Location'
        deviationNote:
          type: string
          description: Required when actualLocation is not the destination.
    CancelMoveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
    DoorWorkCompletionRequest:
      type: object
      properties:
        loadState:
          type: string
          enum:
          - EMPTY
          - LOADED
          - PARTIAL
    HoldRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
          - DAMAGED
          - SEAL_BROKEN
          - NOT_FOUND
          - QUALITY
          - SECURITY
      required:
      - reason
    SealRequest:
      type: object
      properties:
        state:
          type: string
          enum:
          - INTACT
          - BROKEN
        sealNumber:
          type: string
          maxLength: 64
          description: Required for INTACT; BROKEN keeps the recorded number.
      required:
      - state
    YardCheck:
      type: object
      properties:
        yardCheckId:
          type: string
        siteId:
          type: string
        state:
          type: string
          enum:
          - OPEN
          - CLOSED
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        observations:
          type: array
          items:
            type: object
            properties:
              locationCode:
                type: string
              unitNumber:
                type: string
                nullable: true
            required:
            - locationCode
        discrepancies:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - MISSING
                - UNEXPECTED
                - WRONG_LOCATION
              locationCode:
                type: string
              trailerId:
                type: string
                nullable: true
              unitNumber:
                type: string
                nullable: true
            required:
            - kind
            - locationCode
        version:
          type: integer
          minimum: 1
      required:
      - yardCheckId
      - siteId
      - state
      - openedAt
      - observations
      - discrepancies
      - version
    OpenYardCheckRequest:
      type: object
      properties:
        siteId:
          type: string
          minLength: 1
      required:
      - siteId
    ObservationRequest:
      type: object
      properties:
        locationCode:
          type: string
          minLength: 1
        unitNumber:
          type: string
          description: Absent when the location was found empty.
      required:
      - locationCode
    YardPolicy:
      type: object
      properties:
        siteId:
          type: string
        requireAppointment:
          type: boolean
        holdingSpotCodes:
          type: array
          items:
            type: string
        parkingZoneIds:
          type: array
          items:
            type: string
        dwellThresholdMinutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: Per trailer kind (DRY_VAN, REEFER, FLATBED, CONTAINER); a kind without an entry is never alerted.
        leaseSeconds:
          type: integer
          minimum: 1
        sealMismatchAction:
          type: string
          enum:
          - FLAG
          - REJECT
        freeTimeMinutes:
          type: integer
          minimum: 1
          nullable: true
        version:
          type: integer
          minimum: 1
        declared:
          type: boolean
          description: False while the answer is the default policy of an undeclared site.
      required:
      - siteId
      - requireAppointment
      - holdingSpotCodes
      - parkingZoneIds
      - dwellThresholdMinutes
      - leaseSeconds
      - sealMismatchAction
      - version
      - declared
    DeclareYardPolicyRequest:
      type: object
      properties:
        requireAppointment:
          type: boolean
        holdingSpotCodes:
          type: array
          items:
            type: string
        parkingZoneIds:
          type: array
          items:
            type: string
        dwellThresholdMinutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
        leaseSeconds:
          type: integer
          minimum: 1
        sealMismatchAction:
          type: string
          enum:
          - FLAG
          - REJECT
        freeTimeMinutes:
          type: integer
          minimum: 1
      required:
      - requireAppointment
      - sealMismatchAction
      - leaseSeconds
    YardBoard:
      type: object
      properties:
        siteId:
          type: string
        asOf:
          type: string
          format: date-time
        spots:
          type: array
          items:
            $ref: '#/components/schemas/BoardPlace'
        doors:
          type: array
          items:
            $ref: '#/components/schemas/BoardPlace'
        inMove:
          type: array
          items:
            $ref: '#/components/schemas/Trailer'
        openMoves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
      required:
      - siteId
      - asOf
      - spots
      - doors
      - inMove
      - openMoves
    BoardPlace:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
          enum:
          - SPOT
          - DOOR
        dockFlow:
          type: string
          enum:
          - Inbound
          - Outbound
          - Both
          - null
          nullable: true
        closed:
          type: boolean
        trailer:
          type: object
          allOf:
          - $ref: '#/components/schemas/Trailer'
          nullable: true
      required:
      - code
      - kind
      - closed
    Sweep:
      type: object
      properties:
        sweptAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
      required:
      - sweptAt
      - count
      description: How many trailers were alerted (dwell) or moves returned to REQUESTED (lease).
    DwellSweepRequest:
      type: object
      properties:
        siteId:
          type: string
          description: Limit the sweep to one site; absent sweeps every site.
    YardDwellReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - DRY_VAN
                - REEFER
                - FLATBED
                - CONTAINER
              trailers:
                type: integer
              avgDwellMinutes:
                type: number
              maxDwellMinutes:
                type: integer
              avgDriverWaitMinutes:
                type: number
                nullable: true
                description: The wait. Mean of arrival to the first DoorWorkStarted; null when no trailer had door work.
              p50DwellMinutes:
                type: number
                nullable: true
                description: Median dwell, the typical trailer (additive, ADR 0011).
              p90DwellMinutes:
                type: number
                nullable: true
                description: 90th percentile of the dwell, the long tail an average hides (additive, ADR 0011).
              avgProcessingMinutes:
                type: number
                nullable: true
                description: The processing. Mean of DoorWorkStarted to DoorWorkCompleted over the completed door work sessions of these trailers; null when none completed (additive, ADR 0011).
            required:
            - kind
            - trailers
            - avgDwellMinutes
            - maxDwellMinutes
            - avgDriverWaitMinutes
            - p50DwellMinutes
            - p90DwellMinutes
            - avgProcessingMinutes
      required:
      - from
      - to
      - siteId
      - rows
    DoorUtilisationReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              doorCode:
                type: string
              dockings:
                type: integer
              occupiedMinutes:
                type: integer
              utilisation:
                type: number
                description: occupied minutes over the report window, 0..1.
            required:
            - siteId
            - doorCode
            - dockings
            - occupiedMinutes
            - utilisation
      required:
      - from
      - to
      - siteId
      - rows
    HostlerProductivityReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              hostlerRef:
                type: string
              moves:
                type: integer
              avgMoveSeconds:
                type: number
              movesPerHour:
                type: number
                description: moves over the elapsed time between the hostler's first claim and last completion in the window.
            required:
            - siteId
            - hostlerRef
            - moves
            - avgMoveSeconds
            - movesPerHour
      required:
      - from
      - to
      - siteId
      - rows
    TurnTimeReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              purpose:
                type: string
                enum:
                - DROP
                - LIVE_UNLOAD
                - LIVE_LOAD
                - PICKUP
                - BOBTAIL
              visits:
                type: integer
                description: Visits of this purpose that checked out in the window.
              avgMinutes:
                type: number
              p50Minutes:
                type: number
                description: Median gate-to-gate minutes.
              p90Minutes:
                type: number
                description: 90th percentile of the gate-to-gate minutes.
              maxMinutes:
                type: integer
            required:
            - purpose
            - visits
            - avgMinutes
            - p50Minutes
            - p90Minutes
            - maxMinutes
      required:
      - from
      - to
      - siteId
      - rows
    DetentionExposureReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        thresholdMinutes:
          type: integer
          description: The threshold the report was computed with (the request's, or 120).
        rows:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - DRY_VAN
                - REEFER
                - FLATBED
                - CONTAINER
              trailers:
                type: integer
                description: Trailers of this kind that departed in the window.
              exceeding:
                type: integer
                description: Of those, the ones whose dwell exceeded thresholdMinutes.
              share:
                type: number
                nullable: true
                description: exceeding / trailers, 0..1; null when there were no trailers.
              excessMinutes:
                type: integer
                description: Sum of (dwell - thresholdMinutes) over the exceeding trailers. Exposure, not a billed amount.
            required:
            - kind
            - trailers
            - exceeding
            - share
            - excessMinutes
      required:
      - from
      - to
      - siteId
      - thresholdMinutes
      - rows
    ExceptionsReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        siteId:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            properties:
              siteId:
                type: string
              visitsCheckedIn:
                type: integer
              visitsRejected:
                type: integer
              rejectionRate:
                type: number
                nullable: true
                description: visitsRejected / (visitsCheckedIn + visitsRejected), 0..1; null when both are zero.
              sealExceptions:
                type: integer
              sealExceptionRate:
                type: number
                nullable: true
                description: sealExceptions per check-in; null when no visit checked in. Not capped at 1.
              holdsByReason:
                type: object
                description: Holds placed in the window; every reason is listed, zero included.
                properties:
                  DAMAGED:
                    type: integer
                  SEAL_BROKEN:
                    type: integer
                  NOT_FOUND:
                    type: integer
                  QUALITY:
                    type: integer
                  SECURITY:
                    type: integer
                required:
                - DAMAGED
                - SEAL_BROKEN
                - NOT_FOUND
