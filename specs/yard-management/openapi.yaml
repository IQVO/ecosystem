  /reports/freshness:
    get:
      operationId: getReportsFreshness
      summary: Report freshness
      description: When the projector last folded an event.
      tags:
      - Reports
      responses:
        '200':
          description: The freshness.
          content:
            application/json:
              schema:
                type: object
