      description: Cancels a REQUESTED or CLAIMED move. Cancelling a CLAIMED HOSTLER move returns the trailer to where it was (ReturnToOrigin);
        a VISITING_DRIVER move cannot be cancelled once the trailer is at the gate (409 `illegal-transition`).
      tags:
