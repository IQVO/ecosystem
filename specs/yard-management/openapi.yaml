          $ref: '#/components/responses/InternalError'
  /trailers/{trailerId}/inspections:
    post:
      operationId: openInspection
      summary: Open an inspection (OpenInspection)
      description: 'Opens a compliance inspection of a trailer on site (ADR 0015): a SNAPSHOT of the template version (the latest unless `templateVersion` is sent) with every item pending,
        for a `gate` (`PRE_DOCK`, `PRE_LOAD`, `PRE_DEPARTURE`, or `ON_DEMAND`, which opens no gate). `visitId` defaults to the visit the trailer is on. One inspection per trailer,
        template and gate is OPEN at a time (409 `inspection-already-open`); a trailer that left is 409 `illegal-transition`; an unknown template or version is 422 `unknown-template`;
        an unknown visit is 404 `visit-not-found`. Raises nothing: events are raised when the inspection completes.'
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: trailerId
        in: path
        required: true
        description: The trailer id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
