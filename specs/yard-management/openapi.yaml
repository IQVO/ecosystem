    put:
      operationId: publishInspectionTemplate
      summary: Publish an inspection template version (PublishInspectionTemplate)
      description: 'Publishes version N of a custom checklist (ADR 0015). A published version is IMMUTABLE: the same content again answers 200 and changes nothing, other content under a published
        version is 409 `template-version-immutable`; a new version is a new number. An inspection keeps a snapshot of the version it was opened from, so a later version never rewrites history.
        The built-in template ids are read-only (409 `template-is-built-in`). Item codes are lowercase letters, digits and hyphens, unique in the template; at most 100 items; an item without a
        `holdReason` holds a failed trailer for `QUALITY`. A malformed template is 422 `validation`. Raises nothing.'
      tags:
      - Inspections
      parameters:
