      operationId: releaseTrailerSecuring
      summary: Release the securing (ReleaseTrailerSecuring)
      description: 'Records that the restraint was released or the chocks removed. It is required before a trailer is moved away from its door
        (`POST /moves` answers 409 `trailer-still-secured`) and before its visit checks out (409 `trailer-still-secured`). A trailer that is not
        secured is 409 `trailer-not-secured`; the securing stays while door work is IN_PROGRESS (409 `door-work-open`). A DROP trailer whose door
        work is done then gets its FROM_DOOR move. Raises TrailerSecuringReleased.'
